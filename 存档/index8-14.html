      function buildAgentReportSampleData({
        seed = 0,
        count = 6,
        isSub = false,
      } = {}) {
        const baseInstall = isSub ? 2860 : 12860;
        const rows = Array.from({ length: count }, (_, i) => {
          const scale = 1 - i * 0.13 - (seed % 5) * 0.03;
          const installRaw = Math.round((baseInstall + i * 320) * scale);
          const install = Math.round(installRaw * 0.86);
          const bind = Math.round(install * 0.92);
          const dau = Math.round(
            (bind + 380 + i * 90) * (0.96 + (i % 3) * 0.02),
          );
          const oldDau = Math.round(dau * (0.66 + (i % 4) * 0.03));
          const firstPay = Math.round(install * (0.18 + (i % 5) * 0.012));
          const rechargeUsers = Math.round(dau * (0.22 + (i % 4) * 0.015));
          const rechargeAmt = Math.round(rechargeUsers * (268 + i * 18));
          const withdrawAmt = Math.round(rechargeAmt * (0.38 + (i % 5) * 0.02));
          const diff = rechargeAmt - withdrawAmt;
          const surplus =
            rechargeAmt > 0
              ? `${((diff / rechargeAmt) * 100).toFixed(1)}%`
              : "0.0%";
          const validBet = Math.round(rechargeAmt * (1.85 + (i % 3) * 0.12));
          const gameWin = Math.round(rechargeAmt * (0.42 + (i % 4) * 0.03));
          const bonus = Math.round(rechargeAmt * (0.08 + (i % 5) * 0.01));
          const ideal =
            rechargeAmt > 0
              ? `${(((gameWin - bonus) / rechargeAmt) * 100).toFixed(1)}%`
              : "0.0%";
          const agent = {
            id: String(1238712832 + seed * 97 + i * 13579),
          };
          return [
            renderAgentAccountCell(agent),
            AGENT_SUB_LINK,
            `${(48.5 - i * 4.2 + (seed % 4) * 1.1).toFixed(2)}%`,
            `${(21.4 - i * 2.1 + (seed % 3) * 0.8).toFixed(2)}%`,
            Math.max(1, 4 - Math.floor(i / 2) + (seed % 2)),
            installRaw,
            install,
            bind,
            dau,
            oldDau,
            firstPay,
            rechargeUsers,
            rechargeAmt,
            withdrawAmt,
            diff,
            surplus,
            validBet,
            gameWin,
            bonus,
            ideal,
          ];
        });
        const installIdx = AGENT_REPORT_COLS.indexOf("安装人数");
        return rows.sort(

        );

        if (val == null || val === "") return "";
        const raw =
          typeof val === "string" ? val.replace(/%/g, "").trim() : val;
        const n = Number(raw);
        if (!Number.isFinite(n)) return String(val);
        return `${n.toFixed(2)}%`;
      }

      function formatNumber(val) {
        if (typeof val === "string" && val.includes("%")) return formatPercent(val);
        if (typeof val === "number") {
          if (Number.isInteger(val)) return val.toLocaleString("zh-CN");
          return val.toLocaleString("zh-CN", {
            minimumFractionDigits: 1,
            maximumFractionDigits: 2,
          });
        }
        return val;
      }

      function formatDataTableCell(col, cell) {
        const display = formatNumber(cell);
        if (col === "裂变系数K因子") {
          const n = Number(
            String(cell ?? "")
              .replace(/%/g, "")
              .trim(),
          );
          if (Number.isFinite(n) && n < 1) {
            return `<span class="metric-danger">${display}</span>`;
          }
        }
        return display;
      }

      function splitTableRowsForTotal(rows = []) {
        if (!rows.length) return { dataRows: [], existingTotal: null };
        const last = rows[rows.length - 1];
        if (last && isTableTotalLabel(last[0])) {
          return { dataRows: rows.slice(0, -1), existingTotal: last.slice() };

      function parseDurationToSeconds(str) {
        const s = String(str ?? "").trim();
        if (!s || s === "-") return null;
        const m = s.match(/^(?:(\d+)\s*分)?\s*(?:(\d+)\s*秒)?$/);
        if (!m || (m[1] == null && m[2] == null)) return null;
        return (Number(m[1]) || 0) * 60 + (Number(m[2]) || 0);
      }

      function formatDurationFromSeconds(sec) {
        const total = Math.max(0, Math.round(Number(sec) || 0));
        const m = Math.floor(total / 60);
        const s = total % 60;
        return `${m}分${String(s).padStart(2, "0")}秒`;
      }

      function buildTableTotalValues(cols, dataRows, label = "合计") {
        if (!cols?.length || !dataRows?.length) return null;
        const totals = cols.map((col, i) => {
          if (i === 0) return label;
          if (TABLE_TOTAL_DIM_COLS.has(col)) return "-";
          return null;
        });

        cols.forEach((col, i) => {
          if (i === 0 || TABLE_TOTAL_DIM_COLS.has(col)) return;

          let numSum = 0;
          let numCount = 0;
          let allInt = true;
          let pctSum = 0;
          let pctCount = 0;
          let daySum = 0;
          let dayCount = 0;
          let durSum = 0;
          let durCount = 0;

          dataRows.forEach((row) => {
            const val = row[i];
            if (typeof val === "number" && Number.isFinite(val)) {
              numSum += val;
              numCount += 1;
              if (!Number.isInteger(val)) allInt = false;
              return;
            }
            if (typeof val === "string") {
              const trimmed = val.trim();
              if (!trimmed || trimmed === "-") return;
              if (trimmed.includes("%")) {
                const num = parseFloat(trimmed);
                if (!Number.isNaN(num)) {
                  pctSum += num;
                  pctCount += 1;
                }
                return;
              }
              if (trimmed.endsWith("天")) {
                const num = parseFloat(trimmed);
                if (!Number.isNaN(num)) {
                  daySum += num;
                  dayCount += 1;
                }
                return;
              }
              const dur = parseDurationToSeconds(trimmed);
              if (dur != null) {
                durSum += dur;
                durCount += 1;
                return;
              }
              const asNum = Number(trimmed.replace(/,/g, ""));
              if (Number.isFinite(asNum) && /^-?\d+(\.\d+)?$/.test(trimmed.replace(/,/g, ""))) {
                numSum += asNum;
                numCount += 1;
                if (!Number.isInteger(asNum)) allInt = false;
              }
            }
          });

          if (numCount) {
            totals[i] = allInt ? numSum : Number(numSum.toFixed(2));
          } else if (pctCount) {
            totals[i] = `${(pctSum / pctCount).toFixed(1)}%`;
          } else if (dayCount) {
            totals[i] = `${(daySum / dayCount).toFixed(1)}天`;
          } else if (durCount) {
            totals[i] = formatDurationFromSeconds(durSum / durCount);
          } else {
            totals[i] = "-";
          }
        });

        try {
          recalculateDerivedChannelMetrics(totals, cols);
        } catch (e) {
          /* derived helper may not cover all pages */
        }
        totals[0] = label;
        return totals;
      }

      function getChannelAnalysisDimension(filterState = {}) {

        const usesBaseStickyRules = allCols.some(

        if (!usesBaseStickyRules) {
          return allCols.map((_, i) =>
            i < legacyStickyCount ? `sticky-col-${i + 1}` : "",

      function getLeadingStickyCount(groupStart, colCount, stickyClasses) {
        let count = 0;

            groupStart,
            g.cols.length,
            stickyClasses,

          const restCols = g.cols.length - leadingSticky;
          if (leadingSticky > 0 && restCols > 0) {
            html += `<th class="${g.cls} sticky-group-head" colspan="${leadingSticky}" style="min-width:${getStickyLeadingWidth(leadingSticky)}px">${g.name}</th>`;
            html += `<th class="${g.cls}" colspan="${restCols}"></th>`;

            html += `<th class="${g.cls} sticky-group-head" colspan="${g.cols.length}" style="min-width:${getStickyLeadingWidth(leadingSticky)}px">${g.name}</th>`;

      function positionMetricHelpFloat(btn, floatEl) {
        const rect = btn.getBoundingClientRect();
        const tipW = floatEl.offsetWidth;
        const tipH = floatEl.offsetHeight;
        const gap = 8;
        const pad = 8;
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const preferBelow = !!btn.closest("thead, .chart-title, .metric-label");

        let placeBelow = preferBelow;
        if (preferBelow) {
          if (rect.bottom + gap + tipH > vh - pad && rect.top - gap - tipH >= pad) {
            placeBelow = false;
          }
        } else if (rect.top - gap - tipH < pad && rect.bottom + gap + tipH <= vh - pad) {
          placeBelow = true;
        }

        let top = placeBelow ? rect.bottom + gap : rect.top - tipH - gap;
        top = Math.max(pad, Math.min(top, vh - tipH - pad));

        let left = rect.left + rect.width / 2 - tipW / 2;
        left = Math.max(pad, Math.min(left, vw - tipW - pad));

        const arrowLeft = rect.left + rect.width / 2 - left;
        floatEl.style.left = `${Math.round(left)}px`;
        floatEl.style.top = `${Math.round(top)}px`;
        floatEl.style.setProperty(
          "--arrow-left",
          `${Math.max(10, Math.min(arrowLeft, tipW - 10))}px`,
        );
        floatEl.classList.toggle("is-below", placeBelow);
        floatEl.classList.toggle("is-above", !placeBelow);
        floatEl.classList.add("is-visible");
      }

      function initMetricHelpFloat() {
        if (document.body.dataset.metricHelpFloatBound === "1") return;
        document.body.dataset.metricHelpFloatBound = "1";
        document.body.dataset.metricHelpFloat = "1";

        const floatEl = ensureMetricHelpFloatEl();
        let activeBtn = null;

        const hide = () => {
          activeBtn = null;
          floatEl.classList.remove("is-visible", "is-above", "is-below");
          floatEl.style.display = "none";
          floatEl.innerHTML = "";
        };

        const show = (btn) => {
          const tip = btn.querySelector(".ga-metric-help-tip");
          if (!tip) return;
          activeBtn = btn;
          floatEl.innerHTML = tip.innerHTML;
          floatEl.style.display = "block";
          positionMetricHelpFloat(btn, floatEl);
        };

        document.addEventListener(
          "pointerover",
          (e) => {
            const btn = e.target.closest?.(".ga-metric-help");
            if (!btn || activeBtn === btn) return;
            show(btn);
          },
          true,
        );

        document.addEventListener(
          "pointerout",
          (e) => {
            if (!activeBtn) return;
            const btn = e.target.closest?.(".ga-metric-help");
            if (!btn || btn !== activeBtn) return;
            const next = e.relatedTarget;
            if (next && btn.contains(next)) return;
            hide();
          },
          true,
        );

        document.addEventListener(
          "focusin",
          (e) => {
            const btn = e.target.closest?.(".ga-metric-help");
            if (btn) show(btn);
          },
          true,
        );

        document.addEventListener(
          "focusout",
          (e) => {
            if (!activeBtn) return;
            const btn = e.target.closest?.(".ga-metric-help");
            if (btn === activeBtn) hide();
          },
          true,
        );

        document.addEventListener(
          "scroll",
          () => {
            if (activeBtn) hide();
          },
          true,
        );

        window.addEventListener("resize", () => {
          if (activeBtn) hide();
        });

        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && activeBtn) hide();
        });
      }

      function scaleOverviewMetric(val, dayOffset, channelIndex) {
        if (typeof val === "string") return val;
        const factor =
          1 -
          dayOffset * 0.018 -
          ((channelIndex * 3 + dayOffset) % 5) * 0.006;
        return Math.max(0, Math.round(val * factor));
      }

      function buildOverviewChannelReportSample(start, end) {
        const dates = eachDateInclusive(start, end);
        return dates.flatMap((dateStr, dayOffsetFromStart) => {
          const dayOffset = dates.length - 1 - dayOffsetFromStart;
          return OVERVIEW_TABLE_CHANNEL_ROWS.map((ch, ci) => {
            const scale =
              1 - dayOffset * 0.018 - ((ci * 3 + dayOffset) % 5) * 0.006;
            const installRaw = Math.round((2100 + ci * 420) * scale);
            const install = Math.round(installRaw * 0.84);
            const bind = Math.round(install * 0.91);
            const dau = Math.round(
              (bind + 980 + ci * 120) * (0.96 + (ci % 3) * 0.02),
            );
            const oldDau = Math.round(dau * (0.72 + (ci % 4) * 0.02));
            const rechargeUsers = Math.round(dau * (0.21 + (ci % 4) * 0.015));
            const rechargeAmt = Math.round(rechargeUsers * (285 + ci * 16));
            const withdrawAmt = Math.round(rechargeAmt * (0.39 + (ci % 5) * 0.02));
            const diff = rechargeAmt - withdrawAmt;
            const surplus =
              rechargeAmt > 0
                ? `${((diff / rechargeAmt) * 100).toFixed(1)}%`
                : "0.0%";
            const firstPayUsers = Math.round(installRaw * (0.16 + (ci % 5) * 0.01));
            const firstPayAmt = Math.round(firstPayUsers * (220 + ci * 12));
            const firstPayWithdraw = Math.round(firstPayAmt * 0.42);
            const firstSurplus =
              firstPayAmt > 0
                ? `${(((firstPayAmt - firstPayWithdraw) / firstPayAmt) * 100).toFixed(1)}%`
                : "0.0%";
            const newPayUsers = Math.round(
              firstPayUsers * (0.78 + (ci % 3) * 0.04),
            );
            const newRechargeAmt = Math.round(newPayUsers * (198 + ci * 10));
            const newPayRate =
              installRaw > 0
                ? `${((newPayUsers / installRaw) * 100).toFixed(1)}%`
                : "0.0%";
            const newArpu =
              installRaw > 0
                ? Math.round((newRechargeAmt / installRaw) * 10) / 10
                : 0;
            const newArppu =
              newPayUsers > 0
                ? Math.round((newRechargeAmt / newPayUsers) * 10) / 10
                : 0;
            const oldPayUsers = Math.max(0, rechargeUsers - newPayUsers);
            const oldRechargeAmt = Math.max(0, rechargeAmt - newRechargeAmt);
            const oldPayRate =
              oldDau > 0
                ? `${((oldPayUsers / oldDau) * 100).toFixed(1)}%`
                : "0.0%";
            const oldArpu =
              oldDau > 0
                ? Math.round((oldRechargeAmt / oldDau) * 10) / 10
                : 0;
            const oldArppu =
              oldPayUsers > 0
                ? Math.round((oldRechargeAmt / oldPayUsers) * 10) / 10
                : 0;
            const oldWithdrawAmt = Math.round(
              oldRechargeAmt * (0.41 + (ci % 4) * 0.02),
            );
            const oldDiff = oldRechargeAmt - oldWithdrawAmt;
            const oldSurplus =
              oldRechargeAmt > 0
                ? `${((oldDiff / oldRechargeAmt) * 100).toFixed(1)}%`
                : "0.0%";
            const totalPayRate =
              dau > 0 ? `${((rechargeUsers / dau) * 100).toFixed(1)}%` : "0.0%";
            const totalArpu =
              dau > 0 ? Math.round((rechargeAmt / dau) * 10) / 10 : 0;
            const totalArppu =
              rechargeUsers > 0
                ? Math.round((rechargeAmt / rechargeUsers) * 10) / 10
                : 0;
            const d3FirstPay = Math.round(
              firstPayUsers * (1.18 + (ci % 4) * 0.05),
            );
            return [
              dateStr,
              ...ch,
              installRaw,
              install,
              bind,
              dau,
              oldDau,
              rechargeUsers,
              rechargeAmt,
              withdrawAmt,
              diff,
              surplus,
              firstPayUsers,
              firstPayAmt,
              firstSurplus,
              newPayUsers,
              newRechargeAmt,
              newPayRate,
              newArpu,
              newArppu,
              oldPayUsers,
              oldRechargeAmt,
              oldPayRate,
              oldArpu,
              oldArppu,
              oldWithdrawAmt,
              oldDiff,
              oldSurplus,
              totalPayRate,
              totalArpu,
              totalArppu,
              d3FirstPay,
            ];
          });
        });
      }

      function buildOverviewRechargeRetentionSample(start, end) {
        const dates = eachDateInclusive(start, end);
        const baseRates = [38.6, 28.4, 24.8, 21.6, 19.4, 17.2, 12.8, 9.6, 7.4];
        return dates.flatMap((dateStr, dayOffsetFromStart) => {
          const dayOffset = dates.length - 1 - dayOffsetFromStart;
          return OVERVIEW_TABLE_CHANNEL_ROWS.map((ch, ci) => {
            const delta = ((ci % 5) - 2) * 0.55 - dayOffset * 0.22;
            const rates = baseRates.map(
              (r) => `${Math.max(1, r + delta).toFixed(1)}%`,
            );
            return [dateStr, ...ch, ...rates];
          });
        });
      }

          if (startDate) startDate.value = start;
          if (endDate) endDate.value = end;
          setActiveRange(range);
          onApply?.();

        startDate?.addEventListener("change", () => {

          onApply?.();

          clearTabActive();

        return `${start}|${end}|${source}|${name}`;
      }

      function scopeHintEm(text) {
        return `<span class="app-scope-hint-em">${text}</span>`;
      }

      function getAppAnalysisScopeHintHtml(context = "数据") {
        const { start, end } = getOverviewFilterRange();
        const filterState = getPageChannelFilterState();
        const { source, name, account } = filterState;
        const dim = getChannelAnalysisDimension(filterState);
        const channelHtml =
          dim === "account"
            ? `来源渠道「${scopeHintEm(source)}」、渠道名「${scopeHintEm(name)}」、渠道账号「${scopeHintEm(account || "全部")}」`
            : dim === "name"
              ? `来源渠道「${scopeHintEm(source)}」、渠道名「${scopeHintEm(name || "全部")}」`
              : source && source !== "全部"
                ? `来源渠道「${scopeHintEm(source)}」`
                : scopeHintEm("全渠道");
        const timePart =
          start === end ? `${start} 当日` : `${start} 至 ${end}`;
        const activeTab = document.querySelector(
          "#overviewDateBar .range-tab.active",
        );
        const range = activeTab?.dataset.range;
        const timeLabel =
          range === "today"
            ? "今日"
            : range === "yesterday"
              ? "昨日"
              : range === "7d"
                ? "近7天"
                : timePart;
        const timeRangeHtml =
          timeLabel === timePart
            ? scopeHintEm(timePart)
            : `${scopeHintEm(timeLabel)}（${scopeHintEm(timePart)}）`;
        return `以下为 ${timeRangeHtml} 期间，${channelHtml} 获取用户的${scopeHintEm(context)}；当前图表与表格数据均受此时间与渠道筛选约束。`;
      }

      function updateAppAnalysisScopeHint(elementId, context) {
        const el = document.getElementById(elementId);
        if (el) el.innerHTML = getAppAnalysisScopeHintHtml(context);
      }

      function getMsCheckedValues(msWrap) {
        if (!msWrap) return [];
        return [
          ...msWrap.querySelectorAll(
            ".ms-dropdown input[type='checkbox']:checked",
          ),
        ].map((el) => el.value);
      }

      function renderMsFilterOptionsHtml(options, selected = []) {
        const selectedSet = new Set(selected || []);
        return (options || [])
          .map((opt) => {
            const checked = selectedSet.has(opt);
            return `
            <label class="ms-option">
              <input type="checkbox" value="${opt}" ${checked ? "checked" : ""} />
              <span>${opt}</span>
            </label>`;
          })
          .join("");
      }

      function renderMsFilterTriggerHtml(selected, placeholder = "全部") {
        if (!(selected || []).length) {
          return `<span class="ms-placeholder">${placeholder}</span>`;
        }
        return selected
          .map(
            (v) =>
              `<span class="ms-tag" data-value="${v}">${v}<button type="button" aria-label="移除${v}">×</button></span>`,
          )
          .join("");
      }

      function renderMsFilterControl({
        key,
        label,
        options = [],
        selected = [],
        placeholder = "全部",
        disabled = false,
        filterId = "",
      }) {
        return `
          <div class="filter-item filter-item-ms${disabled ? " is-disabled" : ""}" data-ms-filter="${key}" data-filter-id="${filterId}">
            <label>${label}</label>
            <div class="ms-wrap ms-filter-wrap${disabled ? " is-disabled" : ""}">
              <div class="ms-trigger" tabindex="0">${renderMsFilterTriggerHtml(selected, placeholder)}</div>
              <div class="ms-dropdown">${renderMsFilterOptionsHtml(options, selected)}</div>
            </div>
          </div>`;
      }

      function renderVipLevelMsFilter(filterId = "page-filter") {
        const options = Array.from({ length: 12 }, (_, i) => `VIP${12 - i}`);
        return renderMsFilterControl({
          key: "vip-level",
          label: "VIP等级",
          options,
          placeholder: "全部等级",
          filterId,
        });
      }

      function updateMsFilterTrigger(msWrap) {
        if (!msWrap) return;
        const trigger = msWrap.querySelector(".ms-trigger");
        if (!trigger) return;
        const selected = getMsCheckedValues(msWrap);
        const placeholder =
          msWrap
            .closest("[data-ms-filter]")
            ?.querySelector("label")
            ?.textContent?.includes("VIP")
            ? "全部等级"
            : "全部";
        trigger.innerHTML = renderMsFilterTriggerHtml(selected, placeholder);
      }

      function setMsFilterOptions(msWrap, options, keepSelected = true) {
        if (!msWrap) return [];
        const prev = keepSelected ? getMsCheckedValues(msWrap) : [];
        const optSet = new Set(options || []);
        const nextSelected = prev.filter((v) => optSet.has(v));
        const dropdown = msWrap.querySelector(".ms-dropdown");
        if (dropdown) {
          dropdown.innerHTML = renderMsFilterOptionsHtml(options, nextSelected);
        }
        updateMsFilterTrigger(msWrap);
        return nextSelected;
      }

      function setMsFilterDisabled(msItem, disabled) {
        if (!msItem) return;
        msItem.classList.toggle("is-disabled", !!disabled);
        const wrap = msItem.querySelector(".ms-filter-wrap");
        wrap?.classList.toggle("is-disabled", !!disabled);
      }

      function getChannelNamesForSources(sources) {
        const list = normalizeFilterValues(sources);
        if (!list.length) return [];
        const set = new Set();
        list.forEach((s) => {
          (CHANNEL_NAME_MAP[s] || []).forEach((n) => set.add(n));
        });
        return [...set];
      }

      function getChannelAccountsForNames(names) {
        const list = normalizeFilterValues(names);
        if (!list.length) return [];
        const set = new Set();
        list.forEach((n) => {
          (CHANNEL_ACCOUNT_MAP[n] || []).forEach((a) => set.add(a));
        });
        return [...set];
      }

      function renderChannelFilterItems(
        id,
        {
          hideChannelName = false,
          showChannelAccount = true,
          multiSelect = false,
          sourceChannelOptions = null,
        } = {},
      ) {
        const showAccount = showChannelAccount && !hideChannelName;
        const sourceOptions = sourceChannelOptions?.length
          ? sourceChannelOptions
          : SOURCE_CHANNEL_OPTIONS;
        if (multiSelect) {
          return `
          ${renderMsFilterControl({
            key: "source",
            label: "来源渠道",
            options: sourceOptions,
            placeholder: "全部",
            filterId: id,
          })}
          ${
            hideChannelName
              ? ""
              : renderMsFilterControl({
                  key: "name",
                  label: "渠道名",
                  options: [],
                  placeholder: "全部",
                  disabled: true,
                  filterId: id,
                })
          }
          ${
            showAccount
              ? renderMsFilterControl({
                  key: "account",
                  label: "渠道账号",
                  options: [],
                  placeholder: "全部",
                  disabled: true,
                  filterId: id,
                })
              : ""
          }`;
        }
        return `
          <div class="filter-item">
            <label>来源渠道</label>
            <select class="local-source-channel" data-filter-id="${id}">
              ${renderSourceChannelFilter(sourceOptions)}
            </select>
          </div>
          ${
            hideChannelName
              ? ""
              : `
          <div class="filter-item filter-item-channel-name local-channel-name-wrap" data-filter-id="${id}">
            <label>渠道名</label>
            <select class="local-channel-name" data-filter-id="${id}" disabled>
              <option value="">全部</option>
            </select>
          </div>`
          }
          ${
            showAccount
              ? `
          <div class="filter-item filter-item-channel-account local-channel-account-wrap" data-filter-id="${id}">
            <label>渠道账号</label>
            <select class="local-channel-account" data-filter-id="${id}" disabled>
              <option value="">全部</option>
            </select>
          </div>`
              : ""
          }`;
      }

      function renderLocalChannelFilter(id, opts = {}) {
        const multiClass = opts.multiSelect ? " is-multi-filter" : "";
        return `
        <div class="filter-bar filter-bar-local${multiClass}" data-local-filter="${id}">
          ${renderChannelFilterItems(id, opts)}
        </div>`;
      }

      /** 渠道排行榜：来源渠道横向 Tab 筛选 */
      function renderHorizontalChannelFilter(id) {
        const opts = ["全部", ...SOURCE_CHANNEL_OPTIONS];
        return `
        <div class="filter-bar filter-bar-local filter-bar-channel-tabs" data-local-filter="${id}">
          <div class="filter-item">
            <label>来源渠道</label>
            <div class="overview-range-tabs channel-source-tabs" role="tablist" aria-label="来源渠道">
              ${opts
                .map(
                  (name, i) =>
                    `<button type="button" class="range-tab${i === 0 ? " active" : ""}" data-source="${name}" role="tab" aria-selected="${i === 0 ? "true" : "false"}">${name}</button>`,
                )
                .join("")}
            </div>
            <select class="local-source-channel" data-filter-id="${id}" hidden aria-hidden="true">
              ${opts.map((name) => `<option value="${name}">${name}</option>`).join("")}
            </select>
          </div>
        </div>`;
      }

      function isAllSourceChannel(source) {
        if (Array.isArray(source)) return source.length === 0;
        return !source || source === "全部";
      }

      function getLocalChannelFilterState(scope) {
        if (!scope) return { source: "全部", name: "", account: "" };
        const sourceMs = scope.querySelector('[data-ms-filter="source"]');
        if (sourceMs || scope.classList.contains("is-multi-filter")) {
          const nameMs = scope.querySelector('[data-ms-filter="name"]');
          const accountMs = scope.querySelector('[data-ms-filter="account"]');
          const sources = getMsCheckedValues(
            sourceMs?.querySelector(".ms-filter-wrap") || sourceMs,
          );
          const names =
            nameMs && !nameMs.classList.contains("is-disabled")
              ? getMsCheckedValues(nameMs.querySelector(".ms-filter-wrap"))
              : [];
          const accounts =
            accountMs && !accountMs.classList.contains("is-disabled")
              ? getMsCheckedValues(accountMs.querySelector(".ms-filter-wrap"))
              : [];
          return {
            source: sources.length ? sources : "全部",
            sources,
            name: names.length === 1 ? names[0] : names.length ? names : "",
            names,
            account:
              accounts.length === 1
                ? accounts[0]
                : accounts.length
                  ? accounts
                  : "",
            accounts,
            multi: true,
          };
        }
        const sourceSelect = scope.querySelector(".local-source-channel");
        const nameEl = scope.querySelector(".local-channel-name");
        const accountEl = scope.querySelector(".local-channel-account");
        const source = sourceSelect?.value || "全部";
        const name = isAllSourceChannel(source) ? "" : nameEl?.value || "";
        const account =
          isAllSourceChannel(source) || !accountEl ? "" : accountEl.value || "";
        return { source, name, account };
      }

      function getPageVipLevelFilterState() {
        const scope =
          document.querySelector("#overviewDateBar") ||
          document.querySelector("[data-local-filter='page-filter']");
        const vipItem = scope?.querySelector('[data-ms-filter="vip-level"]');
        if (!vipItem) return [];
        return getMsCheckedValues(vipItem.querySelector(".ms-filter-wrap"));
      }

      function getChannelAccountOptions(source, channelName = "") {
        const names = normalizeFilterValues(channelName);
        if (isAllSourceChannel(source) || !names.length) return [];
        return getChannelAccountsForNames(names);
      }

      function filterRowsByChannel(
        rows,
        source,
        name,
        colSource = 1,
        colName = 2,
        account = "",
        colAccount = -1,
      ) {
        const sources = normalizeFilterValues(source);
        const names = normalizeFilterValues(name);
        const accounts = normalizeFilterValues(account);
        return (rows || []).filter((row) => {
          if (sources.length && !sources.includes(row[colSource])) {
            return false;
          }
          if (names.length && !names.includes(row[colName])) return false;
          if (
            accounts.length &&
            colAccount >= 0 &&
            !accounts.includes(row[colAccount])
          ) {
            return false;
          }
          return true;
        });
      }

      function getChannelHierarchyVisibleCols(fullCols, filterState = {}) {
        const dim = getChannelAnalysisDimension(filterState);
        return (fullCols || []).filter((col) => {
          if (col === "渠道名") return dim === "name" || dim === "account";
          if (col === "渠道账号") return dim === "account";
          return true;
        });
      }

      function orderVipPrimaryVisibleCols(visibleCols) {
        if (!(visibleCols || []).includes("VIP等级")) return visibleCols || [];
        const channelCols = ["来源渠道", "渠道名", "渠道账号"].filter((c) =>
          visibleCols.includes(c),
        );
        const rest = visibleCols.filter(
          (c) => c !== "VIP等级" && !channelCols.includes(c),
        );
        return ["VIP等级", ...channelCols, ...rest];
      }

      function getVipChannelDimSortValue(row, fullCols, dim) {
        const sourceVal = row[fullCols.indexOf("来源渠道")];
        const nameVal = String(row[fullCols.indexOf("渠道名")] || "");
        const accountVal = String(row[fullCols.indexOf("渠道账号")] || "");
        const sourceIdx = SOURCE_CHANNEL_OPTIONS.indexOf(sourceVal);
        const sourceKey = String(sourceIdx >= 0 ? sourceIdx : 999).padStart(
          3,
          "0",
        );
        if (dim === "account") return `${sourceKey}|${nameVal}|${accountVal}`;
        if (dim === "name") return `${sourceKey}|${nameVal}`;
        return sourceKey;
      }

      function isVipPrimaryHierarchyPage(page) {
        return !!(
          page?.vipPrimaryTable ||
          (page?.hierarchyExtraGroupCols || []).includes("VIP等级")
        );
      }

      function getChannelHierarchyDateCol(fullCols) {
        if ((fullCols || []).includes("首充日期")) return "首充日期";
        if ((fullCols || []).includes("注册日期")) return "注册日期";
        if ((fullCols || []).includes("提现日期")) return "提现日期";
        return "日期";
      }

      function aggregateChannelHierarchyRows(rows, fullCols, groupCols) {
        const groupIdx = groupCols
          .map((c) => fullCols.indexOf(c))
          .filter((i) => i >= 0);
        const groupSet = new Set(groupIdx);
        const map = new Map();

        rows.forEach((row) => {
          const key = groupIdx.map((i) => row[i]).join("||");
          if (!map.has(key)) {
            map.set(key, {
              base: row.slice(),
              sums: {},
              pctSums: {},
              pctCounts: {},
              daySums: {},
              dayCounts: {},
            });
          }
          const item = map.get(key);
          fullCols.forEach((col, i) => {
            if (groupSet.has(i)) return;
            const val = row[i];
            if (typeof val === "number") {
              item.sums[i] = (item.sums[i] || 0) + val;
              return;
            }
            if (typeof val === "string" && val.includes("%")) {
              const num = parseFloat(val);
              if (!Number.isNaN(num)) {
                item.pctSums[i] = (item.pctSums[i] || 0) + num;
                item.pctCounts[i] = (item.pctCounts[i] || 0) + 1;
              }
              return;
            }
            if (typeof val === "string" && val.endsWith("天")) {
              const num = parseFloat(val);
              if (!Number.isNaN(num)) {
                item.daySums[i] = (item.daySums[i] || 0) + num;
                item.dayCounts[i] = (item.dayCounts[i] || 0) + 1;
              }
            }
          });
        });

        const visitIdx = ["新增访问人数", "安装人数"]
          .map((name) => fullCols.indexOf(name))
          .find((i) => i >= 0);
        const registerIdx = ["新增注册用户", "新增注册人数"]
          .map((name) => fullCols.indexOf(name))
          .find((i) => i >= 0);
        const rateIdx = fullCols.indexOf("注册转化率");

        return [...map.values()].map((item) => {
          const next = item.base.slice();
          Object.keys(item.sums).forEach((i) => {
            next[i] = item.sums[i];
          });
          Object.keys(item.pctSums).forEach((i) => {
            const count = item.pctCounts[i] || 1;
            next[i] = `${(item.pctSums[i] / count).toFixed(1)}%`;
          });
          Object.keys(item.daySums).forEach((i) => {
            const count = item.dayCounts[i] || 1;
            next[i] = `${(item.daySums[i] / count).toFixed(1)}天`;
          });
          if (visitIdx >= 0 && registerIdx >= 0 && rateIdx >= 0) {
            const visit = Number(next[visitIdx]) || 0;
            const register = Number(next[registerIdx]) || 0;
            next[rateIdx] =
              visit > 0 ? `${((register / visit) * 100).toFixed(1)}%` : "0.0%";
          }
          recalculateDerivedChannelMetrics(next, fullCols);
          return next;
        });
      }

      function colNum(row, fullCols, col) {
        const i = fullCols.indexOf(col);
        return i >= 0 ? Number(row[i]) || 0 : 0;
      }

      function setColValue(row, fullCols, col, val) {
        const i = fullCols.indexOf(col);
        if (i >= 0) row[i] = val;
      }

      function recalculateDerivedChannelMetrics(row, fullCols) {
        const rechargeAmt = colNum(row, fullCols, "充值金额");
        const withdrawAmt = colNum(row, fullCols, "提现金额");
        if (fullCols.includes("充提差") && fullCols.includes("充值金额")) {
          setColValue(row, fullCols, "充提差", rechargeAmt - withdrawAmt);
        }
        if (
          fullCols.includes("老用户充提差") &&
          fullCols.includes("老用户充值金额")
        ) {
          setColValue(
            row,
            fullCols,
            "老用户充提差",
            colNum(row, fullCols, "老用户充值金额") -
              colNum(row, fullCols, "老用户提现金额"),
          );
        }
        const arppuPairs = [
          ["ARPPU", "充值金额", "充值人数"],
          ["总ARPPU", "充值金额", "充值人数"],
          ["新增ARPPU", "新增充值金额", "新增付费人数"],
          ["新增ARPPU", "新增充值金额", "新增充值人数"],
          ["老用户ARPPU", "老用户充值金额", "老用户充值人数"],
        ];
        const arpuPairs = [
          ["新增ARPU", "新增充值金额", "安装人数（非去重）"],
          ["新增ARPU", "新增充值金额", "安装人数(非去重)"],
          ["老用户ARPU", "老用户充值金额", "老用户日活"],
          ["总ARPU", "充值金额", "日活跃人数"],
        ];
        arpuPairs.forEach(([col, amtCol, userCol]) => {
          if (!fullCols.includes(col) || !fullCols.includes(amtCol) || !fullCols.includes(userCol)) {
            return;
          }
          const users = colNum(row, fullCols, userCol);
          const amt = colNum(row, fullCols, amtCol);
          setColValue(
            row,
            fullCols,
            col,
            users > 0 ? Math.round((amt / users) * 10) / 10 : 0,
          );
        });
        const payRatePairs = [
          ["新增付费率", "新增付费人数", "安装人数（非去重）"],
          ["新增付费率", "新增付费人数", "安装人数(非去重)"],
          ["老用户付费率", "老用户充值人数", "老用户日活"],
          ["总付费率", "充值人数", "日活跃人数"],
          ["新用户充提比", "新用户提现人数", "新增充值人数"],
          ["老用户充提比", "老用户提现人数", "老用户充值人数"],
        ];
        payRatePairs.forEach(([col, numCol, denCol]) => {
          if (!fullCols.includes(col) || !fullCols.includes(numCol) || !fullCols.includes(denCol)) {
            return;
          }
          const num = colNum(row, fullCols, numCol);
          const den = colNum(row, fullCols, denCol);
          setColValue(
            row,
            fullCols,
            col,
            den > 0 ? `${((num / den) * 100).toFixed(1)}%` : "0.0%",
          );
        });
        arppuPairs.forEach(([col, amtCol, userCol]) => {
          if (!fullCols.includes(col) || !fullCols.includes(amtCol) || !fullCols.includes(userCol)) {
            return;
          }
          const users = colNum(row, fullCols, userCol);
          const amt = colNum(row, fullCols, amtCol);
          setColValue(
            row,
            fullCols,
            col,
            users > 0 ? Math.round((amt / users) * 10) / 10 : 0,
          );
        });
        const surplusPairs = [
          ["盈余率", "充提差", "充值金额"],
          ["新用户盈余率", "新用户充提差", "新增充值金额"],
          ["老用户盈余率", "老用户充提差", "老用户充值金额"],
          ["首充盈余率", "首充盈余率", "首充金额"],
        ];
        surplusPairs.forEach(([col, diffCol, amtCol]) => {
          if (!fullCols.includes(col) || !fullCols.includes(amtCol)) return;
          if (col === "首充盈余率") return;
          const amt = colNum(row, fullCols, amtCol);
          const diff = fullCols.includes(diffCol)
            ? colNum(row, fullCols, diffCol)
            : amt - colNum(row, fullCols, "提现金额");
          setColValue(
            row,
            fullCols,
            col,
            amt > 0 ? `${((diff / amt) * 100).toFixed(1)}%` : "0.0%",
          );
        });
        if (
          fullCols.includes("理想盈余率") &&
          fullCols.includes("游戏输赢") &&
          fullCols.includes("领取奖金") &&
          fullCols.includes("充值金额")
        ) {
          const rechargeAmt = colNum(row, fullCols, "充值金额");
          const gameWin = colNum(row, fullCols, "游戏输赢");
          const bonus = colNum(row, fullCols, "领取奖金");
          setColValue(
            row,
            fullCols,
            "理想盈余率",
            rechargeAmt > 0
              ? `${(((gameWin - bonus) / rechargeAmt) * 100).toFixed(1)}%`
              : "0.0%",
          );
        }
      }

      const CHANNEL_HIERARCHY_KEEP_COLS = new Set(["VIP等级"]);

      function getChannelHierarchyExtraGroupCols(page, fullCols) {
        const extra = page?.hierarchyExtraGroupCols || [];
        const auto = (fullCols || []).filter((c) => CHANNEL_HIERARCHY_KEEP_COLS.has(c));
        return [...new Set([...extra, ...auto])];
      }

      function specHasChannelDimension(spec) {
        if (!spec || spec.channelHierarchyTable === false) return false;
        const cols = spec.hierarchyCols || spec._channelFullCols || spec.cols || [];
        const groupCols = spec.groups ? spec.groups.flatMap((g) => g.cols) : [];
        return [...cols, ...groupCols].includes("来源渠道");
      }

      function rememberChannelHierarchySource(spec) {
        if (!spec || spec.hierarchyCols || spec._channelFullCols) return;
        const cols = spec.cols || (spec.groups ? spec.groups.flatMap((g) => g.cols) : []);
        if (!cols.includes("来源渠道")) return;
        spec._channelFullCols = cols.slice();
        spec._channelFullRows = (spec.sampleData || []).map((row) => row.slice());
      }

      function getChannelHierarchySource(spec) {
        return {
          cols: spec.hierarchyCols || spec._channelFullCols || spec.cols || [],
          rows: spec.hierarchySampleData || spec._channelFullRows || spec.sampleData || [],
        };
      }

      function buildChannelHierarchyTableView(page, filterState) {
        rememberChannelHierarchySource(page);
        const { cols: fullCols, rows: fullRows } = getChannelHierarchySource(page);
        const { source = "全部", name = "", account = "" } = filterState || {};
        const dim = getChannelAnalysisDimension(filterState);
        const dateCol = getChannelHierarchyDateCol(fullCols);
        const extraGroupCols = getChannelHierarchyExtraGroupCols(page, fullCols);
        const colSourceIdx = fullCols.indexOf("来源渠道");
        const colNameIdx = fullCols.indexOf("渠道名");
        const colAccountIdx = fullCols.indexOf("渠道账号");
        let rows = filterRowsByChannel(
          fullRows,
          source,
          name,
          colSourceIdx >= 0 ? colSourceIdx : 1,
          colNameIdx >= 0 ? colNameIdx : 2,
          account,
          colAccountIdx,
        );
        const vipLevelFilter = getPageVipLevelFilterState();
        if (vipLevelFilter.length && fullCols.includes("VIP等级")) {
          const vipFilterIdx = fullCols.indexOf("VIP等级");
          rows = rows.filter((r) => vipLevelFilter.includes(r[vipFilterIdx]));
        }
        const vipPrimaryEarly = isVipPrimaryHierarchyPage(page);
        // VIP 页：来源渠道=全部时仅聚合到 4 个来源；选具体来源后才下钻到渠道名
        if (dim === "source") {
          rows = aggregateChannelHierarchyRows(rows, fullCols, [
            dateCol,
            "来源渠道",
            "所属平台",
            ...extraGroupCols,
          ]);
        } else if (dim === "name") {
          rows = aggregateChannelHierarchyRows(rows, fullCols, [
            dateCol,
            "来源渠道",
            "渠道名",
            "所属平台",
            ...extraGroupCols,
          ]);
        }
        const vipIdx = fullCols.indexOf("VIP等级");
        const vipPrimary = vipPrimaryEarly && vipIdx >= 0;
        if (vipIdx >= 0) {
          rows = rows.slice().sort((a, b) => {
            const vipDiff = vipPrimary
              ? parseVipLevel(a[vipIdx]) - parseVipLevel(b[vipIdx])
              : parseVipLevel(b[vipIdx]) - parseVipLevel(a[vipIdx]);
            if (vipDiff) return vipDiff;
            if (vipPrimary) {
              const ka = getVipChannelDimSortValue(a, fullCols, dim);
              const kb = getVipChannelDimSortValue(b, fullCols, dim);
              return String(ka).localeCompare(String(kb), "zh");
            }
            return String(a[colSourceIdx] || "").localeCompare(
              String(b[colSourceIdx] || ""),
              "zh",
            );
          });
        }
        let visibleCols = getChannelHierarchyVisibleCols(fullCols, filterState);
        if (vipPrimary) {
          visibleCols = orderVipPrimaryVisibleCols(visibleCols);
        }
        const visibleIdx = visibleCols.map((c) => fullCols.indexOf(c));
        const projected = rows.map((row) => visibleIdx.map((i) => row[i]));
        return { cols: visibleCols, rows: projected };
      }

      function syncChannelHierarchyPageTable(page) {
        if (!specHasChannelDimension(page)) return null;
        const view = buildChannelHierarchyTableView(
          page,
          getPageChannelFilterState(),
        );
        page.cols = view.cols;
        page.sampleData = view.rows;
        return view;

      function rebuildChannelHierarchyTableDom(tableEl, page) {
        if (!tableEl || !page) return;
        const view = syncChannelHierarchyPageTable(page);

          getPageChannelFilterState(),
        );

          view.cols,

          page.stickyCols || 0,

        const { tfootHtml, dataRows, dataCount } = renderDataTableTotalFooter(
          view.cols,
          view.rows,
          stickyClasses,
        );

          isVipPrimaryHierarchyPage(page) || view.cols[0] === "VIP等级";

          .closest(".page-table-block")

      function channelFilterScale({
        source,
        name,
        account,
        sources,
        names,
        accounts,
      }) {
        const sourceList = normalizeFilterValues(sources ?? source);
        const nameList = normalizeFilterValues(names ?? name);
        const accountList = normalizeFilterValues(accounts ?? account);
        let factor = 1;
        if (sourceList.length) {
          const key = sourceList.join(",");
          factor *= 0.52 + ((key.length * 17) % 40) / 100;
        }
        if (nameList.length) {
          const key = nameList.join(",");
          factor *= 0.38 + ((key.length * 13) % 35) / 100;
        }
        if (accountList.length) {
          const key = accountList.join(",");
          factor *= 0.42 + ((key.length * 11) % 30) / 100;
        }
        return factor;
      }

      function syncLocalChannelAccountOptions(sourceSelect, nameEl, accountEl) {
        if (!accountEl) return { cleared: false };
        const source = sourceSelect.value;
        const channelName = isAllSourceChannel(source)
          ? ""
          : nameEl?.value || "";
        const prev = accountEl.value || "";
        let cleared = false;
        const accounts = getChannelAccountOptions(source, channelName);
        accountEl.innerHTML =
          `<option value="">全部</option>` +
          accounts.map((n) => `<option value="${n}">${n}</option>`).join("");
        if (isAllSourceChannel(source) || !channelName) {
          if (prev) cleared = true;
          accountEl.value = "";
          accountEl.disabled = true;
        } else {
          accountEl.disabled = false;
          if (prev && accounts.includes(prev)) {
            accountEl.value = prev;
          } else {
            if (prev) cleared = true;
            accountEl.value = "";
          }
        }
        return { cleared };
      }

      function syncLocalChannelNameOptions(sourceSelect, nameEl, nameList) {
        if (!nameEl) return { cleared: false };
        const source = sourceSelect.value;
        const isAll = isAllSourceChannel(source);
        const prev = nameEl.value || "";
        let cleared = false;

        if (nameEl.tagName === "SELECT") {
          const names = isAll ? [] : CHANNEL_NAME_MAP[source] || [];
          nameEl.innerHTML =
            `<option value="">全部</option>` +
            names.map((n) => `<option value="${n}">${n}</option>`).join("");
          if (isAll) {
            if (prev) cleared = true;
            nameEl.value = "";
            nameEl.disabled = true;
          } else {
            nameEl.disabled = false;
            if (prev && names.includes(prev)) {
              nameEl.value = prev;
            } else {
              if (prev) cleared = true;
              nameEl.value = "";
            }
          }
          return { cleared };
        }

        // input + datalist（游戏分析 / 应用分析等）
        if (isAll) {
          if (prev) cleared = true;
          nameEl.value = "";
          nameEl.disabled = true;
          nameEl.placeholder = "请先选择来源渠道";
          if (nameList) nameList.innerHTML = "";
        } else {
          nameEl.disabled = false;
          nameEl.placeholder = `搜索渠道名，如 ${source}01`;
          const names = CHANNEL_NAME_MAP[source] || [];
          if (nameList) {
            nameList.innerHTML = names
              .map((n) => `<option value="${n}"></option>`)
              .join("");
          }
          if (prev && !names.includes(prev)) {
            nameEl.value = "";
            cleared = true;
          }
        }
        return { cleared };
      }

      function refreshTableByChannelFilter(scope) {
        let panel = scope.closest(".page-panel");
        // 页面级筛选在日期栏内，不在 panel 里
        if (!panel) {
          panel =
            document.querySelector(".page-panel.active") ||
            document.querySelector("[id^='panel-']");
        }
        if (!panel) return;
        const pageId = (panel.id || "").replace(/^panel-/, "");

        if (!page) return;

        const tableSpecs = [
          page,
          ...(page.extraTables || []).filter(
            (t) => t.sampleData || t.hierarchySampleData,
          ),
        ];
        const blocks = panel.querySelectorAll(".page-table-block");
        const { source, name, account } = getLocalChannelFilterState(scope);
        const channelFilterActive = hasChannelFilterCondition({
          source,
          name,
          account,
        });

        tableSpecs.forEach((spec, index) => {
          const block = blocks[index];
          const table =
            block?.querySelector(".table-wrap > .data-table") ||
            block?.querySelector(".data-table.vip-primary-table") ||
            block?.querySelector(".data-table");
          if (!table || (!spec.sampleData && !spec.hierarchySampleData)) return;

          if (specHasChannelDimension(spec)) {
            rebuildChannelHierarchyTableDom(table, spec);
            return;
          }
          const tbody = table.querySelector("tbody");
          if (!tbody) return;

          const allCols = spec.groups
            ? spec.groups.flatMap((g) => g.cols)
            : spec.cols || [];
          if (!allCols.includes("来源渠道")) return;
          const stickyClasses = buildStickyClassList(
            allCols,
            channelFilterActive,
            spec.stickyCols || 0,
          );
          const colSourceIdx = allCols.indexOf("来源渠道");
          const colNameIdx = allCols.indexOf("渠道名");
          const colAccount = allCols.indexOf("渠道账号");
          const rows = filterRowsByChannel(
            spec.sampleData,
            source,
            name,
            colSourceIdx >= 0 ? colSourceIdx : 1,
            colNameIdx >= 0 ? colNameIdx : 2,
            account,
            colAccount,
          );
          tbody.innerHTML = rows
            .map((row) => {
              let html = "<tr>";
              row.forEach((cell, i) => {
                html += `<td class="${stickyClasses[i] || ""}">${formatDataTableCell(allCols[i], cell)}</td>`;
              });
              html += "</tr>";
              return html;
            })
            .join("");
          updateDataTableStickyHeaders(table, spec, channelFilterActive);
        });

        if (pageId === "life-ltv" && document.getElementById("userLtvPage")) {
          refreshUserLtvPage();
        }
      }

      function ensureMsFilterDocClose() {
        if (window._msFilterDocBound === "1") return;
        window._msFilterDocBound = "1";
        document.addEventListener("click", (e) => {
          if (e.target.closest(".ms-filter-wrap")) return;
          document
            .querySelectorAll(".ms-filter-wrap .ms-dropdown.open")
            .forEach((dropdown) => {
              dropdown.classList.remove("open");
              dropdown
                .closest(".ms-filter-wrap")
                ?.querySelector(".ms-trigger")
                ?.classList.remove("open");
            });
        });
      }

      function bindMsFilterItem(msItem, { onChange } = {}) {
        if (!msItem || msItem.dataset.msBound === "1") return;
        msItem.dataset.msBound = "1";
        const msWrap = msItem.querySelector(".ms-filter-wrap");
        const trigger = msWrap?.querySelector(".ms-trigger");
        const dropdown = msWrap?.querySelector(".ms-dropdown");
        if (!msWrap || !trigger || !dropdown) return;

        trigger.addEventListener("click", (e) => {
          if (e.target.closest(".ms-tag button")) return;
          e.stopPropagation();
          const willOpen = !dropdown.classList.contains("open");
          document
            .querySelectorAll(".ms-filter-wrap .ms-dropdown.open")
            .forEach((d) => {
              if (d === dropdown) return;
              d.classList.remove("open");
              d.closest(".ms-filter-wrap")
                ?.querySelector(".ms-trigger")
                ?.classList.remove("open");
            });
          dropdown.classList.toggle("open", willOpen);
          trigger.classList.toggle("open", willOpen);
        });

        trigger.addEventListener("click", (e) => {
          const btn = e.target.closest(".ms-tag button");
          if (!btn) return;
          e.stopPropagation();
          const value = btn.closest(".ms-tag")?.dataset.value;
          if (value == null) return;
          const input = [...dropdown.querySelectorAll("input[type='checkbox']")].find(
            (el) => el.value === value,
          );
          if (!input) return;
          input.checked = false;
          updateMsFilterTrigger(msWrap);
          onChange?.();
        });

        dropdown.addEventListener("click", (e) => e.stopPropagation());
        dropdown.addEventListener("change", (e) => {
          if (!e.target.matches("input[type='checkbox']")) return;
          updateMsFilterTrigger(msWrap);
          onChange?.();
        });
      }

      function bindMultiChannelFilter(scope) {
        if (!scope || scope.dataset.channelFilterBound === "1") return;
        scope.dataset.channelFilterBound = "1";
        const sourceItem = scope.querySelector('[data-ms-filter="source"]');
        const nameItem = scope.querySelector('[data-ms-filter="name"]');
        const accountItem = scope.querySelector('[data-ms-filter="account"]');

        const syncCascade = () => {
          const sources = getMsCheckedValues(
            sourceItem?.querySelector(".ms-filter-wrap"),
          );
          const nameWrap = nameItem?.querySelector(".ms-filter-wrap");
          const accountWrap = accountItem?.querySelector(".ms-filter-wrap");
          if (!nameItem) return;
          if (!sources.length) {
            setMsFilterOptions(nameWrap, [], false);
            setMsFilterDisabled(nameItem, true);
            if (accountItem) {
              setMsFilterOptions(accountWrap, [], false);
              setMsFilterDisabled(accountItem, true);
            }
            return;
          }
          setMsFilterDisabled(nameItem, false);
          setMsFilterOptions(nameWrap, getChannelNamesForSources(sources), true);
          const selectedNames = getMsCheckedValues(nameWrap);
          if (!accountItem) return;
          if (!selectedNames.length) {
            setMsFilterOptions(accountWrap, [], false);
            setMsFilterDisabled(accountItem, true);
          } else {
            setMsFilterDisabled(accountItem, false);
            setMsFilterOptions(
              accountWrap,
              getChannelAccountsForNames(selectedNames),
              true,
            );
          }
        };

        const apply = () => {
          syncCascade();
          if (!shouldDeferPageFilterApply(scope)) {
            refreshModuleByChannelFilter(scope);
          }
        };

        bindMsFilterItem(sourceItem, { onChange: apply });
        bindMsFilterItem(nameItem, { onChange: apply });
        bindMsFilterItem(accountItem, {
          onChange: () => {
            if (!shouldDeferPageFilterApply(scope)) {
              refreshModuleByChannelFilter(scope);
            }
          },
        });
        syncCascade();
      }

      function bindVipLevelFilter(root = document) {
        root.querySelectorAll('[data-ms-filter="vip-level"]').forEach((item) => {
          bindMsFilterItem(item, {
            onChange: () => {
              const scope =
                document.querySelector(
                  "[data-local-filter='page-filter']",
                ) || item.closest("#overviewDateBar");
              if (!scope || shouldDeferPageFilterApply(scope)) return;
              refreshModuleByChannelFilter(scope);
            },
          });
        });
      }

      function bindLocalChannelFilter(scope) {
        if (
          scope.classList.contains("is-multi-filter") ||
          scope.querySelector('[data-ms-filter="source"]')
        ) {
          bindMultiChannelFilter(scope);
          return;
        }
        const sourceSelect = scope.querySelector(".local-source-channel");
        if (!sourceSelect) return;
        if (sourceSelect.dataset.channelFilterBound === "1") return;
        sourceSelect.dataset.channelFilterBound = "1";

        const filterId = sourceSelect.dataset.filterId;
        const nameWrap = scope.querySelector(
          `.local-channel-name-wrap[data-filter-id="${filterId}"]`,
        );
        const nameEl = scope.querySelector(
          `.local-channel-name[data-filter-id="${filterId}"]`,
        );
        const nameList = scope.querySelector(`#channelNameList-${filterId}`);
        const accountWrap = scope.querySelector(
          `.local-channel-account-wrap[data-filter-id="${filterId}"]`,
        );
        const accountEl = scope.querySelector(
          `.local-channel-account[data-filter-id="${filterId}"]`,
        );

        if (nameWrap) nameWrap.classList.add("is-visible");
        if (accountWrap) accountWrap.classList.add("is-visible");

        const applySourceChange = () => {
          syncLocalChannelNameOptions(sourceSelect, nameEl, nameList);
          syncLocalChannelAccountOptions(sourceSelect, nameEl, accountEl);
          if (!shouldDeferPageFilterApply(scope)) {
            refreshModuleByChannelFilter(scope);
          }
        };

        const applyNameChange = () => {
          syncLocalChannelAccountOptions(sourceSelect, nameEl, accountEl);
          if (!shouldDeferPageFilterApply(scope)) {
            refreshModuleByChannelFilter(scope);
          }
        };

        const applyAccountChange = () => {
          if (!shouldDeferPageFilterApply(scope)) {
            refreshModuleByChannelFilter(scope);
          }
        };

        // 初始化：全部时置灰渠道名 / 渠道账号
        syncLocalChannelNameOptions(sourceSelect, nameEl, nameList);
        syncLocalChannelAccountOptions(sourceSelect, nameEl, accountEl);

        sourceSelect.addEventListener("change", applySourceChange);
        nameEl?.addEventListener("change", applyNameChange);
        accountEl?.addEventListener("change", applyAccountChange);
        // 文本输入场景：失焦或回车也刷新
        if (nameEl && nameEl.tagName === "INPUT") {
          nameEl.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              applyNameChange();
            }
          });
          nameEl.addEventListener("blur", applyNameChange);
        }

        // 横向 Tab 筛选（渠道排行榜）
        const tabs = scope.querySelectorAll(".channel-source-tabs .range-tab");
        if (tabs.length) {
          tabs.forEach((tab) => {
            tab.addEventListener("click", () => {
              const source = tab.dataset.source || "全部";
              tabs.forEach((t) => {
                const active = t === tab;
                t.classList.toggle("active", active);
                t.setAttribute("aria-selected", active ? "true" : "false");
              });
              sourceSelect.value = source;
              applySourceChange();
            });
          });
        }
      }

      function pageHasKpiCards(page, pageId) {
        if (pageId === "overview") return true;
        return !!(page.insights && page.insights.length);
      }

      function shiftStickyClassesLeft(stickyClasses = []) {
        return (stickyClasses || []).map((cls) => {
          const m = String(cls || "").match(/sticky-col-(\d+)/);
          if (!m) return cls || "";
          const next = Number(m[1]) - 1;
          return next >= 1 ? `sticky-col-${next}` : "";
        });
      }

      function groupTableRowsByCol(cols, rows, colName) {
        const idx = cols.indexOf(colName);
        if (idx < 0) return [{ key: "", rows: rows || [] }];
        const groups = [];
        (rows || []).forEach((row) => {
          const key = String(row[idx] ?? "");
          const last = groups[groups.length - 1];
          if (last && last.key === key) last.rows.push(row);
          else groups.push({ key, rows: [row] });
        });
        return groups;
      }

      function renderVipSectionedWrapInner(
        cols,
        dataRows,
        stickyClasses = [],
        metricDefs = null,
        tfootHtml = "",
        { maxGroupRows = 10 } = {},
      ) {
        const vipIdx = cols.indexOf("VIP等级");
        const bodyCols = cols.filter((_, i) => i !== vipIdx);
        const bodySticky = stickyClasses.filter((_, i) => i !== vipIdx);
        const headCells = bodyCols
          .map((col, i) => {
            const fullIdx = cols.indexOf(col);
            return renderTableHeaderCell(
              col,
              stickyClasses[fullIdx] || bodySticky[i] || "",
              metricDefs,
            );
          })
          .join("");
        const groups = groupTableRowsByCol(cols, dataRows, "VIP等级");
        const panels = groups
          .map(({ key, rows }) => {
            const hasMore = rows.length > maxGroupRows;
            const moreCount = Math.max(0, rows.length - maxGroupRows);
            const tbody = rows
              .map((row, j) => {
                const isExtra = j >= maxGroupRows;
                const cells = row.filter((_, i) => i !== vipIdx);
                let html = `<tr class="${isExtra ? "vip-extra-row" : ""}" data-vip-group="${key}"${isExtra ? " hidden" : ""}>`;
                cells.forEach((cell, ci) => {
                  html += `<td class="${bodySticky[ci] || ""}">${formatDataTableCell(bodyCols[ci], cell)}</td>`;
                });
                html += "</tr>";
                return html;
              })
              .join("");
            const expandBar = hasMore
              ? `<div class="vip-group-expand-bar">
                  <button type="button" class="vip-expand-btn" data-vip-group="${key}" data-expanded="0">展开更多（${moreCount}）</button>
                </div>`
              : "";
            return `<div class="vip-group-panel" data-vip-group="${key}">
              <div class="vip-group-label">${key}</div>
              <div class="vip-group-main">
                <div class="vip-group-scroll">
                  <table class="data-table vip-primary-table vip-group-table">
                    <tbody>${tbody}</tbody>
                  </table>
                </div>
                ${expandBar}
              </div>
            </div>`;
          })
          .join("");

        // 合计行：与表体同结构（左侧标签 + 右侧无 VIP 列），避免列错位
        let footHtml = "";
        if (tfootHtml) {
          const tdRe = /<td\b[^>]*>[\s\S]*?<\/td>/gi;
          const tds = tfootHtml.match(tdRe) || [];
          if (tds.length) {
            const vipTd = vipIdx >= 0 ? tds[vipIdx] : tds[0];
            const vipText = String(vipTd || "")
              .replace(/<[^>]+>/g, "")
              .trim() || "合计";
            const restTds = tds.filter((_, i) => i !== vipIdx).join("");
            footHtml = `<div class="vip-section-foot-row">
              <div class="vip-group-label">${vipText}</div>
              <table class="data-table vip-primary-table vip-section-foot">
                <tfoot><tr class="total-row">${restTds}</tr></tfoot>
              </table>
            </div>`;
          }
        }

        return `
          <div class="vip-section-head-row">
            <div class="vip-group-label">VIP等级</div>
            <table class="data-table vip-primary-table vip-section-head">
              <thead><tr class="col-row">${headCells}</tr></thead>
            </table>
          </div>
          <div class="vip-group-panels">${panels}</div>
          ${footHtml}`;
      }

      function renderDataTableBodyHtml(
        cols,
        rows,
        stickyClasses = [],
        options = {},
      ) {
        const {
          rowSpanCol = "",
          maxGroupRows = 0,
          spanCellClass = "vip-span-cell",
          spanInnerClass = "vip-span-inner",
        } = options;
        const spanIdx = rowSpanCol ? cols.indexOf(rowSpanCol) : -1;
        if (spanIdx < 0) {
          return rows
            .map((row) => {
              let html = "<tr>";
              row.forEach((cell, i) => {
                html += `<td class="${stickyClasses[i] || ""}">${formatDataTableCell(cols[i], cell)}</td>`;
              });
              html += "</tr>";
              return html;
            })
            .join("");
        }

        const limit = maxGroupRows > 0 ? maxGroupRows : Number.POSITIVE_INFINITY;
        let html = "";
        let i = 0;
        while (i < rows.length) {
          const groupVal = rows[i][spanIdx];
          let span = 1;
          while (
            i + span < rows.length &&
            rows[i + span][spanIdx] === groupVal
          ) {
            span += 1;
          }
          const hasMore = span > limit;
          const visibleCount = hasMore ? limit : span;
          const groupKey = String(groupVal ?? "");

          for (let j = 0; j < span; j++) {
            const row = rows[i + j];
            const isExtra = j >= limit;
            html += `<tr class="${isExtra ? "vip-extra-row" : ""}" data-vip-group="${groupKey}"${isExtra ? " hidden" : ""}>`;
            row.forEach((cell, ci) => {
              if (ci === spanIdx) {
                if (j === 0) {
                  html += `<td class="${stickyClasses[ci] || ""} ${spanCellClass}" rowspan="${visibleCount}" data-vip-group="${groupKey}" data-vip-span="${span}" data-vip-visible="${visibleCount}"><div class="${spanInnerClass}">${formatDataTableCell(cols[ci], cell)}</div></td>`;
                }
                return;
              }
              html += `<td class="${stickyClasses[ci] || ""}">${formatDataTableCell(cols[ci], cell)}</td>`;
            });
            html += "</tr>";
          }

          if (hasMore) {
            const moreCount = span - limit;
            html += `<tr class="vip-expand-row" data-vip-group="${groupKey}">
              <td colspan="${cols.length}">
                <button type="button" class="vip-expand-btn" data-vip-group="${groupKey}" data-expanded="0">展开更多（${moreCount}）</button>
              </td>
            </tr>`;
          }
          i += span;
        }
        return html;
      }

      function bindVipGroupExpand(root = document) {
        root.querySelectorAll(".vip-expand-btn").forEach((btn) => {
          if (btn.dataset.bound === "1") return;
          btn.dataset.bound = "1";
          btn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            const panel = btn.closest(".vip-group-panel");
            const table = btn.closest("table");
            const scope = panel || table || root;
            const group = btn.dataset.vipGroup || "";
            const extras = [
              ...scope.querySelectorAll(
                `tr.vip-extra-row[data-vip-group="${group}"]`,
              ),
            ];
            const spanCell = scope.querySelector(
              `td.vip-span-cell[data-vip-group="${group}"]`,
            );
            const expanded = btn.dataset.expanded === "1";
            if (expanded) {
              extras.forEach((tr) => {
                tr.hidden = true;
              });
              if (spanCell) {
                spanCell.rowSpan = Number(spanCell.dataset.vipVisible) || 4;
                spanCell.classList.remove("is-vip-expanded");
              }
              btn.textContent = `展开更多（${extras.length}）`;
              btn.dataset.expanded = "0";
            } else {
              extras.forEach((tr) => {
                tr.hidden = false;
              });
              if (spanCell) {
                spanCell.rowSpan =
                  Number(spanCell.dataset.vipSpan) || extras.length + 4;
                // 展开后启用原生 sticky：左侧保持可见，滚到下一 VIP 才离开
                spanCell.classList.add("is-vip-expanded");
              }
              btn.textContent = "收起";
              btn.dataset.expanded = "1";
            }
          });
        });
      }

      function renderTable(tableSpec, options = {}) {
        const {
          title = "",
          groups = null,
          cols = null,
          sampleData = [],
          stickyCols = 1,
          chartView = false,
          hideChannelNameFilter = false,
          dateBarHtml = "",
          metricDefs = null,
          vipPrimaryTable = false,
          dateRowSpan = false,
          rowSpanCol = "",
        } = tableSpec;
        const tableKey = options.tableKey || "main";
        const allCols = groups ? groups.flatMap((g) => g.cols) : cols || [];
        const channelFilterActive = hasChannelFilterCondition(
          getPageChannelFilterState(),
        );
        const stickyClasses = buildStickyClassList(
          allCols,
          channelFilterActive,
          stickyCols,
        );
        let groupRow = "";
        if (groups) {
          groupRow = buildGroupRowHtml(groups, stickyClasses);
        }

        let colRow = "";
        allCols.forEach((col, i) => {
          const stickyCls = stickyClasses[i] || "";
          colRow += renderTableHeaderCell(col, stickyCls, metricDefs);
        });

        const {
          tfootHtml,
          dataRows: tableDataRows,
          dataCount,
        } = renderDataTableTotalFooter(allCols, sampleData, stickyClasses);
        const isVipPrimary =
          vipPrimaryTable || allCols[0] === "VIP等级";
        const effectiveRowSpanCol = isVipPrimary
          ? "VIP等级"
          : dateRowSpan
            ? "日期"
            : rowSpanCol || "";
        const isDateSpan = effectiveRowSpanCol === "日期";
        const bodyRows = renderDataTableBodyHtml(
          allCols,
          tableDataRows,
          stickyClasses,
          {
            rowSpanCol: effectiveRowSpanCol,
            maxGroupRows: isVipPrimary ? 4 : 0,
            spanCellClass: isVipPrimary
              ? "vip-span-cell"
              : isDateSpan
                ? "date-span-cell"
                : "vip-span-cell",
            spanInnerClass: isVipPrimary
              ? "vip-span-inner"
              : isDateSpan
                ? "date-span-inner"
                : "vip-span-inner",
          },
        );

        const tableViewId =
          tableKey === "main" ? "tableView" : `tableView-${tableKey}`;
        const chartViewId =
          tableKey === "main" ? "chartView" : `chartView-${tableKey}`;

        return `
        <div class="page-table-block" data-table-key="${tableKey}">
        ${dateBarHtml}
        <div class="toolbar">
          <span class="page-title">${title}</span>
          <div class="toolbar-actions">
            ${
              chartView
                ? `<div class="view-toggle" role="group" aria-label="视图切换">
              <button type="button" class="vt-btn active" data-view="table">表格</button>
              <button type="button" class="vt-btn" data-view="chart">图表</button>
            </div>`
                : ""
            }
          </div>
        </div>
        <div class="table-view" id="${tableViewId}">
          <div class="table-wrap">
            <table class="data-table${groups ? " has-group-header" : ""}${isVipPrimary ? " vip-primary-table" : ""}${isDateSpan ? " date-span-table" : ""}">
              <thead>
                ${groups ? `<tr class="group-row">${groupRow}</tr>` : ""}
                <tr class="col-row">${colRow}</tr>
              </thead>
              <tbody>${bodyRows}</tbody>
              ${tfootHtml}
            </table>
          </div>
          <div class="pagination">
            <button disabled>‹</button>
            <button class="active">1</button>
            <button>2</button>
            <button>3</button>
            <button>›</button>
            <span class="pagination-info">共 ${dataCount || sampleData.length || 28} 条</span>
          </div>
        </div>
        ${chartView ? `<div class="chart-view" id="${chartViewId}" hidden>${renderAcquisitionTrendChart({ hideChannelName: !!hideChannelNameFilter })}</div>` : ""}
        </div>`;
      }

      function renderOverviewPageTables(page) {
        const { start, end } = getOverviewFilterRange();
        syncOverviewPageTableSample(start, end);
        rememberChannelHierarchySource(page);
        const view = specHasChannelDimension(page)
          ? buildChannelHierarchyTableView(page, getPageChannelFilterState())
          : { cols: page.cols, rows: page.sampleData };
        page.cols = view.cols;
        page.sampleData = view.rows;
        const mainTable = renderTable(
          {
            title: page.tableTitle || "渠道报表",
            cols: view.cols,
            sampleData: view.rows,
            stickyCols: page.stickyCols,
            metricDefs: page.metricDefs,
          },
          { tableKey: "main" },
        );
        (page.extraTables || []).forEach((spec) => {
          if (specHasChannelDimension(spec)) syncChannelHierarchyPageTable(spec);
        });
        const extraTables = (page.extraTables || [])
          .map((tableSpec, index) =>
            renderTable(tableSpec, { tableKey: `extra-${index + 1}` }),

        return mainTable + extraTables;
      }

      function renderPageTables(page) {
        if (specHasChannelDimension(page)) {
          syncChannelHierarchyPageTable(page);
        }
        (page.extraTables || []).forEach((spec) => {
          if (specHasChannelDimension(spec)) syncChannelHierarchyPageTable(spec);
        });
        const mainTable = renderTable(
          {
            title: page.title,
            groups: page.groups,
            cols: page.cols,
            sampleData: page.sampleData,
            stickyCols: page.stickyCols,
            chartView: page.chartView,
            hideChannelNameFilter: page.hideChannelNameFilter,
            metricDefs: page.metricDefs,
            vipPrimaryTable: page.vipPrimaryTable,
          },
          { tableKey: "main" },
        );
        const extraTables = (page.extraTables || [])
          .map((tableSpec, index) =>
            renderTable(tableSpec, { tableKey: `extra-${index + 1}` }),
          )
          .join("");
        return mainTable + extraTables;
      }

      function renderComboChart() {
        const labels = [
          "2025-07-11",
          "2025-07-12",
          "2025-07-13",
          "2025-07-14",
          "2025-07-15",
          "2025-07-16",
          "2025-07-17",
        ];
        const visitUsers = [8450, 9200, 9680, 10230, 11100, 11890, 12580];
        const registerUsers = [6320, 6800, 7250, 7680, 8300, 8650, 9120];
        const bindUsers = [4980, 5360, 5720, 6050, 6580, 6890, 7240];
        const firstPayUsers = [1260, 1380, 1490, 1580, 1720, 1810, 1920];
        const channelScope = getPageChannelScopeLabel();

        const series = [
          { name: "新增访问人数", color: "#165DFF", data: visitUsers },
          { name: "新增注册用户", color: "#14C9C9", data: registerUsers },
          { name: "新增绑定人数", color: "#F7BA1E", data: bindUsers },
          { name: "新增首充人数", color: "#722ED1", data: firstPayUsers },
        ];

        const W = 760,
          H = 220,
          padL = 52,
          padR = 24,
          padT = 36,
          padB = 40;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;
        const n = labels.length;
        const step = plotW / n;
        const leftMax = 14000;
        const barGap = 2;
        const groupGap = 10;
        const barCount = series.length;
        const groupW = Math.max(24, step - groupGap);
        const barW = Math.max(4, (groupW - barGap * (barCount - 1)) / barCount);
        const yCount = (v) => padT + plotH * (1 - v / leftMax);

        let grid = "",
          leftAxis = "";
        for (let i = 0; i <= 4; i++) {
          const y = padT + (plotH / 4) * i;
          grid += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"></line>`;
          leftAxis += `<text class="axis-label" x="${padL - 8}" y="${y + 3}" text-anchor="end">${(leftMax - (leftMax / 4) * i).toLocaleString("zh-CN")}</text>`;
        }

        const axisTitles = `
          <text class="axis-title" x="${padL}" y="${padT - 10}" text-anchor="start">人数</text>`;

        let bars = "",
          xLabels = "";
        const tipPoints = [];
        labels.forEach((lab, i) => {
          const groupLeft =
            padL + step * i + (step - groupW) / 2;
          const tipRow = [];
          series.forEach((s, si) => {
            const x = groupLeft + si * (barW + barGap);
            const val = s.data[i];
            const y = yCount(val);
            const h = Math.max(1, (plotH * val) / leftMax);
            bars += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="2" fill="${s.color}"></rect>`;
            tipRow.push({
              name: s.name,
              color: s.color,
              x: x + barW / 2,
              y,
              text: val.toLocaleString("zh-CN"),
            });
          });
          tipPoints.push(tipRow);
          const cx = padL + step * i + step / 2;
          xLabels += `<text class="axis-label" x="${cx}" y="${H - padB + 18}" text-anchor="middle">${lab}</text>`;
        });

        const tipLabels = labels.map(
          (lab) => `日期：${lab}<br/>渠道维度：${channelScope}`,
        );

        return `
        ${renderComboChartWithTip(
          `${axisTitles}${grid}${bars}${leftAxis}${xLabels}`,
          {
            labels: tipLabels,
            points: tipPoints,
            layout: { W, H, padL, padR, padT, padB, xMode: "band" },
          },
        )}
        <div class="line-legend">
          ${series
            .map(
              (s) =>
                `<span><i style="background:${s.color}"></i>${channelScope} · ${s.name}</span>`,
            )
            .join("")}
        </div>`;
      }

      function renderPlatformProfitAbilityChart(dayCount, endDate) {

        const winAmounts = genTrendSeries(dayCount, 520000, 740000, 21000);
        const surplusRates = genTrendSeries(dayCount, 53.8, 58.4, 0.28, 1);

          H = 300,
          padL = 58,
          padR = 50,
          padT = 24,
          padB = 42;

        const plotH = H - padT - padB;
        const n = labels.length;
        const step = n > 1 ? plotW / (n - 1) : plotW / 2;
        const leftMax = Math.max(...winAmounts) * 1.08;
        const rightMax = 100;

        const yMoney = (v) => padT + plotH * (1 - v / leftMax);
        const yPct = (v) => padT + plotH * (1 - v / rightMax);

          yLeft = "",

          const leftVal = Math.round(leftMax - (leftMax / 4) * i);
          yLeft += `<text class="axis-label" x="${padL - 8}" y="${y + 4}" text-anchor="end">${fmtMoney(leftVal)}</text>`;
          yRight += `<text class="axis-label" x="${W - padR + 8}" y="${y + 4}" text-anchor="start">${Math.round(rightMax - (rightMax / 4) * i)}%</text>`;
        }

        labels.forEach((lab, i) => {
          const cx = padL + step * i;
          bars += `<rect x="${cx - barW / 2}" y="${yMoney(winAmounts[i])}" width="${barW}" height="${plotH - (yMoney(winAmounts[i]) - padT)}" rx="4" fill="#165DFF"></rect>`;

              text: fmtMoney(winAmounts[i]),
