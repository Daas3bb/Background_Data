      function getRtChartDates() {
        let start = document.getElementById("rtChartStartDate")?.value;
        let end = document.getElementById("rtChartEndDate")?.value;
        if (!start || !end) return [];
        if (parseYMD(end) < parseYMD(start)) {
          [start, end] = [end, start];
        }
        return eachDateInclusive(start, end);
      }

      function getRtTableDate() {
        return document.getElementById("rtTableDate")?.value || "";
      }

      function getRtTableYesterdayDate(dateStr = getRtTableDate()) {
        if (!dateStr) return "";
        const d = parseYMD(dateStr);
        if (!d || Number.isNaN(d.getTime())) return "";
        d.setDate(d.getDate() - 1);
        return formatDateYMD(d);
      }

      function formatRtVsYesterdayDiff(curr, prev) {
        if (
          curr == null ||
          prev == null ||
          !Number.isFinite(curr) ||
          !Number.isFinite(prev)
        ) {
          return "";
        }
        const diff = curr - prev;
        if (diff === 0) return "";
        const cls = diff > 0 ? "is-up" : "is-down";
        const sign = diff > 0 ? "+" : "";
        return `<span class="rt-diff ${cls}">${sign}${diff.toLocaleString("zh-CN")}</span>`;
      }

      function renderRtValueWithDiff(curr, prev) {
        const fmt = (v) =>
          v == null || !Number.isFinite(v) ? "-" : v.toLocaleString("zh-CN");
        const diffHtml = formatRtVsYesterdayDiff(curr, prev);
        return `<td class="rt-cell-with-diff">${fmt(curr)}${diffHtml}</td>`;
      }

      function drawRealtimeTable(metrics) {
        const wrap = document.getElementById("rtTableWrap");
        if (!wrap) return;

        const date = getRtTableDate();
        const yesterday = getRtTableYesterdayDate(date);
        if (!date || !yesterday || !metrics.length) {
          wrap.innerHTML =
            '<div class="rt-table-empty">请选择数据源与日期后查询</div>';
          return;
        }

        const seriesCurr = buildRtSeriesList(metrics, [date]);
        const seriesPrev = buildRtSeriesList(metrics, [yesterday]);
        const mapsCurr = {};
        const mapsPrev = {};
        seriesCurr.forEach((s) => {
          const map = {};
          s.points.forEach((p) => {
            map[p.minute] = p.value;
          });
          mapsCurr[s.metric] = map;
        });
        seriesPrev.forEach((s) => {
          const map = {};
          s.points.forEach((p) => {
            map[p.minute] = p.value;
          });
          mapsPrev[s.metric] = map;
        });

        const endMin = 23 * 60 + 55;
        const step = 5;

        let headRow = `<th class="sticky-col-1">时间</th>`;
        metrics.forEach((metric) => {
          headRow += `<th>${renderMetricHelpBtn(metric, null, "exclaim", { always: true })}${metric}</th>`;
        });

        let bodyRows = "";
        let rowIndex = 0;
        const sumsCurr = metrics.map(() => 0);
        const sumsPrev = metrics.map(() => 0);
        const countsCurr = metrics.map(() => 0);
        const countsPrev = metrics.map(() => 0);

        for (let m = 0; m <= endMin; m += step) {
          const delay = Math.min(rowIndex * 0.008, 0.6);
          bodyRows += `<tr class="rt-row-anim" style="animation-delay:${delay}s">`;
          bodyRows += `<td class="sticky-col-1">${minuteToLabel(m)}</td>`;
          metrics.forEach((metric, mi) => {
            const vc = mapsCurr[metric]?.[m];
            const vp = mapsPrev[metric]?.[m];
            if (vc != null && Number.isFinite(vc)) {
              sumsCurr[mi] += vc;
              countsCurr[mi] += 1;
            }
            if (vp != null && Number.isFinite(vp)) {
              sumsPrev[mi] += vp;
              countsPrev[mi] += 1;
            }
            bodyRows += renderRtValueWithDiff(vc, vp);
          });
          bodyRows += "</tr>";
          rowIndex += 1;
        }

        let totalCells = `<td class="sticky-col-1">合计</td>`;
        metrics.forEach((_, mi) => {
          const totalCurr = countsCurr[mi] ? sumsCurr[mi] : null;
          const totalPrev = countsPrev[mi] ? sumsPrev[mi] : null;
          totalCells += renderRtValueWithDiff(totalCurr, totalPrev);
        });

        wrap.innerHTML = `
          <table class="data-table rt-data-table">
            <thead>
              <tr class="col-row">${headRow}</tr>
            </thead>
            <tbody>${bodyRows}</tbody>
            <tfoot><tr class="total-row">${totalCells}</tr></tfoot>
          </table>`;
      }

      function stopRealtimeFlowAnimations(svg) {
        if (!svg) return;
        if (svg._rtFlowRaf) {
          cancelAnimationFrame(svg._rtFlowRaf);
          svg._rtFlowRaf = null;
        }
        svg.querySelectorAll(".rt-flow-dot").forEach((el) => el.remove());
        svg.querySelectorAll(".rt-series-line").forEach((line) => {
          line.classList.remove("rt-line-flow");
          line.style.strokeDasharray = "";
          line.style.strokeDashoffset = "";
          line.style.transition = "";
        });
      }

      function playRealtimeFlowAnimation(svg, wrap, legend) {
        if (!svg) return;
        stopRealtimeFlowAnimations(svg);

        wrap?.classList.remove("rt-animating");
        legend?.classList.remove("rt-animating");
        void wrap?.offsetWidth;
        wrap?.classList.add("rt-animating");
        legend?.classList.add("rt-animating");

        const lines = [...svg.querySelectorAll("polyline.rt-series-line")];
        if (!lines.length) return;

        const drawDuration = 1100;
        const stagger = 120;
        let pending = lines.length;
        let flowStarted = false;

        const startFlowPhase = () => {
          if (flowStarted) return;
          flowStarted = true;
          lines.forEach((line) => {
            line.style.transition = "";
            line.style.strokeDasharray = "7 11";
            line.classList.add("rt-line-flow");
          });

          const dots = lines.map((line) => {
            const dot = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "circle",
            );
            dot.setAttribute("r", "2.5");
            dot.setAttribute("fill", line.getAttribute("stroke") || "#165DFF");
            dot.classList.add("rt-flow-dot", "is-running");
            svg.appendChild(dot);
            let length = 0;
            try {
              length = line.getTotalLength();
            } catch (e) {
              length = 0;
            }
            return { line, dot, length };
          });

          const start = performance.now();
          const duration = 1600;
          const tick = (now) => {
            const t = Math.min(1, (now - start) / duration);
            const ease = 1 - Math.pow(1 - t, 3);
            dots.forEach(({ line, dot, length }) => {
              if (!length) return;
              const pt = line.getPointAtLength(length * ease);
              dot.setAttribute("cx", pt.x);
              dot.setAttribute("cy", pt.y);
            });
            if (t < 1) {
              svg._rtFlowRaf = requestAnimationFrame(tick);
            } else {
              dots.forEach(({ dot }) => dot.remove());
              setTimeout(() => {
                lines.forEach((l) => {
                  l.classList.remove("rt-line-flow");
                  l.style.strokeDasharray = "";
                  l.style.strokeDashoffset = "";
                });
                wrap?.classList.remove("rt-animating");
                legend?.classList.remove("rt-animating");
              }, 1600);
            }
          };
          svg._rtFlowRaf = requestAnimationFrame(tick);
        };

        lines.forEach((line, idx) => {
          let length = 0;
          try {
            length = line.getTotalLength();
          } catch (e) {
            length = 0;
          }
          if (!length) {
            pending -= 1;
            if (pending <= 0) startFlowPhase();
            return;
          }

          line.style.strokeDasharray = `${length}`;
          line.style.strokeDashoffset = `${length}`;
          void line.getBoundingClientRect();
          line.style.transition = `stroke-dashoffset ${drawDuration}ms cubic-bezier(0.22, 1, 0.36, 1) ${idx * stagger}ms`;
          line.style.strokeDashoffset = "0";

          const onDone = (e) => {
            if (e.propertyName && e.propertyName !== "stroke-dashoffset")
              return;
            line.removeEventListener("transitionend", onDone);
            pending -= 1;
            if (pending <= 0) startFlowPhase();
          };
          line.addEventListener("transitionend", onDone);
        });

        // 兜底：避免个别浏览器不触发 transitionend
        const totalWait = drawDuration + (lines.length - 1) * stagger + 80;
        setTimeout(() => {
          if (pending > 0) {
            pending = 0;
            startFlowPhase();
          }
        }, totalWait);
      }

      function drawRealtimeChart({ refreshTable = true } = {}) {
        const svg = document.getElementById("rtChartSvg");
        const legend = document.getElementById("rtLegend");
        const wrap = document.getElementById("rtChartWrap");
        if (!svg || !legend || !wrap) return;

        const dates = getRtChartDates();
        const metrics = getSelectedRtMetrics();
        const signature = `${dates.join("~")}|${metrics.join(",")}`;
        const shouldAnimate =
          !!dates.length &&
          !!metrics.length &&
          signature !== (wrap._rtSignature || "");

        if (!dates.length || !metrics.length) {
          stopRealtimeFlowAnimations(svg);
          svg.innerHTML = "";
          legend.innerHTML =
            '<span style="color:var(--arco-text-3)">请选择数据源与日期范围后查询</span>';
          if (refreshTable) drawRealtimeTable(metrics);
          wrap._rtSignature = signature;
          return;
        }

        const seriesList = buildRtSeriesList(metrics, dates);
        const { ticks, maxMin } = getXTicks(dates);

        const W = 960,
          H = 300;
        const padL = 52,
          padR = 16,
          padT = 16,
          padB = 36;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;
        const yMax = 2500;
        const yTicks = [0, 500, 1000, 1500, 2000, 2500];
        const xPos = (m) => padL + (m / maxMin) * plotW;
        const yPos = (v) => padT + plotH * (1 - v / yMax);

        stopRealtimeFlowAnimations(svg);

        let html = "";
        yTicks.forEach((v) => {
          const y = yPos(v);
          html += `<line class="rt-grid" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"></line>`;
          html += `<text class="rt-axis" x="${padL - 8}" y="${y + 4}" text-anchor="end">${v.toLocaleString("zh-CN")}</text>`;
        });
        ticks.forEach((m) => {
          html += `<text class="rt-axis" x="${xPos(m)}" y="${H - 10}" text-anchor="middle">${minuteToLabel(m)}</text>`;
        });

        seriesList.forEach((s) => {
          const pts = s.points
            .map((p) => `${xPos(Math.min(p.minute, maxMin))},${yPos(p.value)}`)
            .join(" ");
          html += `<polyline class="rt-series-line" fill="none" stroke="${s.color}" stroke-width="1.5" points="${pts}"></polyline>`;
        });

        html += `<line class="rt-crosshair" id="rtCrosshair" x1="0" y1="${padT}" x2="0" y2="${padT + plotH}" visibility="hidden"></line>`;
        html += `<g id="rtHoverDots"></g>`;
        svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
        svg.innerHTML = html;

        legend.innerHTML = seriesList
          .map((s) => {
            const text = dates.length > 1 ? `${s.date} ${s.metric}` : s.metric;
            return `<span title="${s.label}"><i style="background:${s.color}"></i>${text}</span>`;
          })
          .join("");

        // 缓存供 hover 使用
        wrap._rtState = {
          seriesList,
          maxMin,
          padL,
          padR,
          padT,
          plotW,
          plotH,
          yMax,
          W,
          H,
          isMultiDay: dates.length > 1,
        };

        if (refreshTable) drawRealtimeTable(metrics);
        wrap._rtSignature = signature;

        if (shouldAnimate) {
          requestAnimationFrame(() =>
            playRealtimeFlowAnimation(svg, wrap, legend),
          );
        }
      }

      function initRealtimeChart() {
        const panel = document.getElementById("realtimePanel");
        if (!panel) return;

        if (window._rtAbort) window._rtAbort.abort();
        if (window._rtAutoRefreshTimer) {
          clearInterval(window._rtAutoRefreshTimer);
          window._rtAutoRefreshTimer = null;
        }
        window._rtAbort = new AbortController();
        const { signal } = window._rtAbort;

        const trigger = document.getElementById("rtMetricTrigger");
        const dropdown = document.getElementById("rtMetricDropdown");
        const wrap = document.getElementById("rtChartWrap");
        const tooltip = document.getElementById("rtTooltip");
        const svg = document.getElementById("rtChartSvg");
        const autoRefreshSelect = document.getElementById("rtAutoRefresh");

        const msWrap = document.getElementById("rtMetricSelect");

        const startRtAutoRefresh = () => {
          if (window._rtAutoRefreshTimer) {
            clearInterval(window._rtAutoRefreshTimer);
            window._rtAutoRefreshTimer = null;
          }
          const seconds = Number(autoRefreshSelect?.value);
          if (!seconds) return;
          window._rtAutoRefreshTimer = setInterval(
            () => drawRealtimeChart({ refreshTable: false }),
            seconds * 1000,
          );
        };

        signal.addEventListener("abort", () => {
          if (window._rtAutoRefreshTimer) {
            clearInterval(window._rtAutoRefreshTimer);
            window._rtAutoRefreshTimer = null;
          }
        });

        const closeMetricDropdown = (shouldRefresh = true) => {
          dropdown?.classList.remove("open");
          trigger?.classList.remove("open");
          if (shouldRefresh) drawRealtimeChart();
        };

        const clearRealtimeSelection = () => {
          dropdown?.querySelectorAll('input[type="checkbox"]').forEach((el) => {
            el.checked = false;
          });
          closeMetricDropdown();
          updateRtMetricTags();
          drawRealtimeChart();
        };

        const resetRealtimeFilters = () => {
          const today = formatDateYMD(new Date());

          dropdown?.querySelectorAll('input[type="checkbox"]').forEach((el) => {
            el.checked = el.value === "实时在线人数";
          });
          const startEl = document.getElementById("rtChartStartDate");
          const endEl = document.getElementById("rtChartEndDate");
          if (startEl) startEl.value = today;
          if (endEl) endEl.value = today;
          if (autoRefreshSelect) autoRefreshSelect.value = "5";

          const tableDate = document.getElementById("rtTableDate");
          if (tableDate) tableDate.value = today;

          dropdown?.classList.remove("open");
          trigger?.classList.remove("open");
          updateRtMetricTags();
          startRtAutoRefresh();
          drawRealtimeChart();
        };

        updateRtMetricTags();
        drawRealtimeChart();
        startRtAutoRefresh();

        autoRefreshSelect?.addEventListener(
          "change",
          () => startRtAutoRefresh(),
          { signal },
        );

        trigger?.addEventListener(
          "click",
          (e) => {
            if (e.target.closest(".ms-tag button")) return;
            e.stopPropagation();
            const open = dropdown.classList.toggle("open");
            trigger.classList.toggle("open", open);
            if (!open) drawRealtimeChart();
          },
          { signal },
        );

        trigger?.addEventListener(
          "click",
          (e) => {
            const btn = e.target.closest(".ms-tag button");
            if (!btn) return;
            e.stopPropagation();
            const tag = btn.closest(".ms-tag");
            const val = tag?.dataset.value;
            const input = dropdown.querySelector(`input[value="${val}"]`);
            if (input) input.checked = false;
            updateRtMetricTags();
            drawRealtimeChart();
          },
          { signal },
        );

        dropdown?.addEventListener("click", (e) => e.stopPropagation(), {
          signal,
        });
        dropdown?.addEventListener(
          "change",
          () => {
            updateRtMetricTags();
            drawRealtimeChart();
          },
          { signal },
        );

        // 点击多选框以外的空白区域收起下拉
        document.addEventListener(
          "click",
          (e) => {
            if (!msWrap?.contains(e.target)) closeMetricDropdown();
          },
          { signal },
        );

        document
          .getElementById("rtQueryBtn")
          ?.addEventListener("click", drawRealtimeChart, { signal });
        document
          .getElementById("rtResetBtn")
          ?.addEventListener("click", resetRealtimeFilters, { signal });
        const refreshRtTable = () => {
          drawRealtimeTable(getSelectedRtMetrics());
        };
        document.getElementById("rtTableDate")?.addEventListener(
          "change",
          refreshRtTable,
          { signal },
        );
        document.getElementById("rtRefreshBtn")?.addEventListener(
          "click",
          (e) => {
            e.stopPropagation();
            clearRealtimeSelection();
          },
          { signal },
        );

        wrap?.addEventListener(
          "mousemove",
          (e) => {
            const state = wrap._rtState;
            if (!state || !state.seriesList.length) return;
            const rect = svg.getBoundingClientRect();
            const scaleX = state.W / rect.width;
            const mx = (e.clientX - rect.left) * scaleX;
            if (mx < state.padL || mx > state.W - state.padR) {
              tooltip.style.display = "none";
              document
                .getElementById("rtCrosshair")
                ?.setAttribute("visibility", "hidden");
              document.getElementById("rtHoverDots").innerHTML = "";
              return;
            }
            const minuteRaw = ((mx - state.padL) / state.plotW) * state.maxMin;
            const minute = Math.round(minuteRaw / 5) * 5;
            const clamped = Math.max(0, Math.min(state.maxMin, minute));
            const x = state.padL + (clamped / state.maxMin) * state.plotW;

            const cross = document.getElementById("rtCrosshair");
            if (cross) {
              cross.setAttribute("x1", x);
              cross.setAttribute("x2", x);
              cross.setAttribute("visibility", "visible");
            }

            const yPos = (v) => state.padT + state.plotH * (1 - v / state.yMax);
            let dots = "";
            const rows = state.seriesList
              .map((s) => {
                if (!s.points.length) return null;
                const pt =
                  s.points.find((p) => p.minute === clamped) ||
                  s.points.reduce(
                    (best, p) =>
                      Math.abs(p.minute - clamped) <
                      Math.abs(best.minute - clamped)
                        ? p
                        : best,
                    s.points[0],
                  );
                if (!pt || Math.abs(pt.minute - clamped) > 5) return null;
                dots += `<circle cx="${x}" cy="${yPos(pt.value)}" r="2.5" fill="#fff" stroke="${s.color}" stroke-width="1.5"></circle>`;
                return `<div class="rt-tip-row"><span class="rt-tip-dot" style="background:${s.color}"></span>${state.isMultiDay ? `${s.date} ${s.metric}` : s.metric}: ${pt.value.toLocaleString("zh-CN")}</div>`;
              })
              .filter(Boolean);

            document.getElementById("rtHoverDots").innerHTML = dots;
            if (!rows.length) {
              tooltip.style.display = "none";
              return;
            }
            tooltip.innerHTML = `<div class="rt-tip-time">${minuteToLabel(clamped)}</div>${rows.join("")}`;
            tooltip.style.display = "block";
            tooltip.style.transform = "none";
            const tipW = tooltip.offsetWidth || 160;
            const tipH = tooltip.offsetHeight || 80;
            const anchorX = (x / state.W) * rect.width;
            let tipX = anchorX + 14;
            if (tipX + tipW > rect.width - 8) tipX = anchorX - tipW - 14;
            if (tipX < 8) tipX = 8;
            if (tipX + tipW > rect.width - 8) {
              tipX = Math.max(8, rect.width - tipW - 8);
            }
            let tipY = (state.padT / state.H) * rect.height + 8;
            if (tipY + tipH > rect.height - 8) {
              tipY = Math.max(8, rect.height - tipH - 8);
            }
            tooltip.style.left = `${tipX}px`;
            tooltip.style.top = `${tipY}px`;
          },
          { signal },
        );

        wrap?.addEventListener(
          "mouseleave",
          () => {
            tooltip.style.display = "none";
            document
              .getElementById("rtCrosshair")
              ?.setAttribute("visibility", "hidden");
            const dots = document.getElementById("rtHoverDots");
            if (dots) dots.innerHTML = "";
          },
          { signal },
        );
      }

      function fuzzyMatchGameName(query, name) {
        const q = String(query || "")
          .trim()
          .toLowerCase();
        const n = String(name || "").toLowerCase();
        if (!q) return true;
        if (n.includes(q)) return true;
        let qi = 0;
        for (let i = 0; i < n.length && qi < q.length; i++) {
          if (n[i] === q[qi]) qi++;
        }
        return qi === q.length;
      }

      function highlightGameNameMatch(name, query) {
        const q = String(query || "").trim();
        if (!q) return name;
        const lowerName = name.toLowerCase();
        const lowerQ = q.toLowerCase();
        const idx = lowerName.indexOf(lowerQ);
        if (idx >= 0) {
          return (
            name.slice(0, idx) +
            "<mark>" +
            name.slice(idx, idx + q.length) +
            "</mark>" +
            name.slice(idx + q.length)
          );
        }
        return name;
      }

      function renderGameNameDropdownOptions(query, selected) {
        const q = String(query || "").trim();
        const items = [];
        if (!q || fuzzyMatchGameName(q, "全部")) {
          items.push({
            value: "",
            label: "全部",
            html: "全部",
          });
        }
        GAME_NAME_OPTIONS.filter((name) => fuzzyMatchGameName(q, name)).forEach(
          (name) => {
            items.push({
              value: name,
              label: name,
              html: highlightGameNameMatch(name, q),
            });
          },
        );
        if (!items.length) {
          return `<div class="game-name-option is-empty">无匹配游戏</div>`;
        }
        return items
          .map((item) => {
            const active = (selected || "") === item.value ? " is-active" : "";
            return `<div class="game-name-option${active}" data-value="${item.value}" role="option">${item.html}</div>`;
          })
          .join("");
      }

      function bindGameNameSearchSelect(wrap) {
        if (!wrap || wrap.dataset.bound === "1") return;
        wrap.dataset.bound = "1";
        const input = wrap.querySelector(".game-name-filter");
        const dropdown = wrap.querySelector(".game-name-dropdown");
        if (!input || !dropdown) return;

        const syncSelected = (value) => {
          wrap.dataset.selected = value || "";
          input.value = value || "";
        };

        const openDropdown = () => {
          dropdown.innerHTML = renderGameNameDropdownOptions(
            input.value,
            wrap.dataset.selected || "",
          );
          dropdown.classList.add("open");
        };

        const closeDropdown = () => {
          dropdown.classList.remove("open");
        };

        const commitExactOrFuzzy = () => {
          const raw = input.value.trim();
          if (!raw || raw === "全部") {
            syncSelected("");
            return;
          }
          const exact = GAME_NAME_OPTIONS.find(
            (name) => name.toLowerCase() === raw.toLowerCase(),
          );
          if (exact) {
            syncSelected(exact);
            return;
          }
          const fuzzyHits = GAME_NAME_OPTIONS.filter((name) =>
            fuzzyMatchGameName(raw, name),
          );
          if (fuzzyHits.length === 1) {
            syncSelected(fuzzyHits[0]);
            return;
          }
          // 保留当前输入，允许用户继续搜索后点查询
        };

        input.addEventListener("focus", () => {
          const isExact =
            !input.value.trim() ||
            GAME_NAME_OPTIONS.some(
              (name) => name.toLowerCase() === input.value.trim().toLowerCase(),
            );
          dropdown.innerHTML = renderGameNameDropdownOptions(
            isExact ? "" : input.value,
            wrap.dataset.selected || "",
          );
          dropdown.classList.add("open");
          input.select();
        });
        input.addEventListener("click", () => {
          if (!dropdown.classList.contains("open")) {
            dropdown.innerHTML = renderGameNameDropdownOptions(
              "",
              wrap.dataset.selected || "",
            );
            dropdown.classList.add("open");
          }
        });
        input.addEventListener("input", () => {
          wrap.dataset.selected = input.value.trim();
          openDropdown();
        });
        input.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            closeDropdown();
            input.blur();
            return;
          }
          if (e.key === "Enter") {
            e.preventDefault();
            const first = dropdown.querySelector(
              ".game-name-option:not(.is-empty)",
            );
            if (first) {
              syncSelected(first.getAttribute("data-value") || "");
            } else {
              commitExactOrFuzzy();
            }
            closeDropdown();
          }
        });
        input.addEventListener("blur", () => {
          setTimeout(() => {
            commitExactOrFuzzy();
            closeDropdown();
          }, 120);
        });
        dropdown.addEventListener("mousedown", (e) => {
          const option = e.target.closest(".game-name-option");
          if (!option || option.classList.contains("is-empty")) return;
          e.preventDefault();
          syncSelected(option.getAttribute("data-value") || "");
          closeDropdown();
        });
      }

      function buildFundStatsSampleData() {
        const members = [
          { id: "859084905", source: "投放", platform: "T1-A" },
          { id: "65365366", source: "裂变", platform: "T1-A" },
          { id: "653765354", source: "裂变", platform: "T1-A" },
          { id: "786365436", source: "官网", platform: "T1-B" },
          { id: "654375373", source: "投放", platform: "T1-A" },
          { id: "901284756", source: "特殊流量", platform: "T1-A" },
          { id: "778291034", source: "官网", platform: "T1-B" },
          { id: "612398847", source: "投放", platform: "T1-A" },
        ];
        const rows = members.map((m, i) => {
          const rechargeOkAmt = Math.round(18600 - i * 1680 + (i % 3) * 420);
          const rechargeFailAmt = Math.round(1200 + i * 180);
          const withdrawOkAmt = Math.round(rechargeOkAmt * (0.42 + (i % 4) * 0.03));
          const withdrawFailAmt = Math.round(860 + i * 90);
          const patchAmt = Math.round(320 + i * 40);
          const rechargeOkCnt = Math.round(28 - i * 2 + (i % 2));
          const rechargeFailCnt = Math.round(4 + (i % 3));
          const withdrawOkCnt = Math.round(12 - Math.floor(i / 2));
          const withdrawFailCnt = Math.round(2 + (i % 2));
          const patchCnt = Math.round(1 + (i % 3));
          const diff = rechargeOkAmt - withdrawOkAmt;
          return [
            m.id,
            m.source,
            m.platform,
            diff,
            rechargeOkCnt + rechargeFailCnt,
            rechargeOkCnt,
            rechargeOkAmt,
            rechargeFailCnt,
            rechargeFailAmt,
            withdrawOkCnt + withdrawFailCnt,
            withdrawOkCnt,
            withdrawOkAmt,
            withdrawFailCnt,
            withdrawFailAmt,
            patchCnt,
            patchAmt,
          ];
        });
        const amtIdx = FUND_STATS_COLS.indexOf("充值成功金额");
        rows.sort((a, b) => Number(b[amtIdx]) - Number(a[amtIdx]));
        const totals = Array(FUND_STATS_COLS.length).fill(0);
        totals[0] = "合计";
        totals[1] = "-";
        totals[2] = "-";
        rows.forEach((row) => {
          for (let i = 3; i < row.length; i++) {
            totals[i] += Number(row[i]) || 0;
          }
        });
        return [...rows, totals];
      }

      function getChannelAnalysisFilteredRows(cfg, typeFilter, statusFilter) {
        const type = typeFilter ?? getChannelAnalysisTypeFilter();
        const status = statusFilter ?? getChannelAnalysisStatusFilter();
        const { name: nameKw, id: idKw } = getChannelAnalysisSearchFilters();
        const idIdx = cfg.cols.indexOf("通道ID");
        const nameIdx = cfg.cols.indexOf("通道名");
        const typeIdx = cfg.cols.indexOf("通道类型");
        const statusIdx = cfg.cols.indexOf("通道状态");
        const nameKwLower = nameKw.toLowerCase();
        const idKwLower = idKw.toLowerCase();
        const rows = cfg.sample
          .filter((row) => {
            if (type !== "全部" && row[typeIdx] !== type) return false;
            if (status !== "全部" && row[statusIdx] !== status) return false;
            if (
              nameKwLower &&
              !String(row[nameIdx] ?? "")
                .toLowerCase()
                .includes(nameKwLower)
            ) {
              return false;
            }
            if (
              idKwLower &&
              !String(row[idIdx] ?? "")
                .toLowerCase()
                .includes(idKwLower)
            ) {
              return false;
            }
            return true;
          })
          .slice()
          .sort((a, b) =>
            String(a[nameIdx] ?? "").localeCompare(
              String(b[nameIdx] ?? ""),
              "zh-CN",
              { numeric: true },
            ),

      function genChannelPassageTrendSeries(dayCount, endRate, patternIndex) {
        const n = Math.max(1, dayCount);
        const end = Number(endRate) || 80;
        const clamp = (v) => Math.min(99.5, Math.max(55, +Number(v).toFixed(2)));
        if (n === 1) return [clamp(end)];
        const data = [];
        for (let i = 0; i < n; i++) {
          const t = i / (n - 1);
          let v;
          switch (patternIndex % 4) {
            case 0:
              // 稳步攀升
              v = end - 14 * (1 - t) + Math.sin(t * Math.PI * 2.2) * 1.6;
              break;
            case 1:
              // 高位缓降后企稳
              v = end + 8 * (1 - t) - Math.sin(t * Math.PI) * 2.4;
              break;
            case 2:
              // 中段冲高再回落
              v = end - 5 * (1 - t) + Math.sin(t * Math.PI) * 7.5 - t * 1.2;
              break;
            default:
              // 先降后升（V 型）
              v = end - 3 * (1 - t) - Math.sin(t * Math.PI) * 10 + t * t * 4;
              break;
          }
          if (i === n - 1) v = end;
          data.push(clamp(v));
        }
        return data;
      }

      function renderChannelSuccessRateTrend(cfg, rows, dayCount = 7, endDate) {
        const labels = buildTrendLabelsBeforeEnd(dayCount, endDate || new Date());
        const nameIdx = cfg.cols.indexOf("通道名");
        const typeIdx = cfg.cols.indexOf("通道类型");
        const rateIdx = cfg.cols.indexOf(cfg.rateLabel);
        const series = rows.map((row, i) => {
          const endRate = Number(row[rateIdx]) || 80;
          return {
            name: `[${row[typeIdx]}] ${row[nameIdx]}`,
            data: genChannelPassageTrendSeries(dayCount, endRate, i),
            color: CHANNEL_PASSAGE_COLORS[i % CHANNEL_PASSAGE_COLORS.length],
            suffix: "%",
            formatTip: (v) => `${Number(v).toFixed(2)}%`,
          };
        });
        if (!series.length) {
          return `<div class="user-ltv-empty" style="border:none;padding:28px 12px">当前筛选条件下暂无数据</div>`;
        }
        return renderMultiLineTrendChart({
          labels,
          series,
          minVal: 60,
          maxVal: 100,
          yStep: 10,
          xLabelStep: dayCount <= 7 ? 1 : dayCount <= 30 ? 5 : 10,
          showDots: false,
          height: STANDARD_CHART_HEIGHT,
          formatY: (v) => `${v}%`,
        });
      }

          .join("");

          if (i === statusIdx) return renderChannelStatusTag(cell);
          if (i === rateIdx && typeof cell === "number") {
            return `${cell.toFixed(2)}%`;

          return formatNumber(cell);

        const { tfootHtml, dataRows, dataCount } = renderDataTableTotalFooter(
          cfg.cols,
          rows,
          stickyClasses,

                return `<td class="${stickyCls}">${formatChannelCell(cfg.cols[i], cell, i)}</td>`;

        const seed = parent
          ? [...parent].reduce((sum, ch) => sum + ch.charCodeAt(0), 0) % 20
          : 0;
        const baseCount = parent ? 4 : 6;
        const count =
          statsLevel === "无限级" ? baseCount + (parent ? 3 : 4) : baseCount;
        let rows = buildAgentReportSampleData({
          seed: seed + (statsLevel === "无限级" ? 11 : 0),
          count,
          isSub: !!parent,
        });
        if (keyword) {
          rows = rows.filter((row) =>
            String(row[0]).replace(/<[^>]+>/g, " ").includes(keyword),
          );

        return rows;

      function buildGameStayDailySeries(seedBase, last7) {
        // 用近7日样本向前扩展到30日
        const out = [];
        for (let i = 0; i < 30; i++) {
          const sample = last7[i % last7.length];
          const wave = Math.sin((i + seedBase) * 0.55) * 0.08;
          const drift = ((i % 9) - 4) * 0.015;
          out.push(Math.max(60, Math.round(sample * (1 + wave + drift))));
        }
        // 保证末尾 7 日贴近原样本
        for (let i = 0; i < 7; i++) {
          out[23 + i] = last7[i];
        }
        return out;

        return rs ? `${m}分${String(rs).padStart(2, "0")}秒` : `${m}分`;

      function renderGameMetricTable(config) {
        const stickyCount = 3;
        const baseCols = ["游戏平台", "游戏厂商", "游戏名称"];
        const cols = config.groups
          ? config.groups.flatMap((g) => g.cols)
          : [...baseCols, ...config.metricCols];
        const groups = config.groups || null;

        let groupRow = "";
        if (groups) {
          let colOffset = 0;
          groups.forEach((g) => {
            const groupStart = colOffset;
            const groupEnd = colOffset + g.cols.length;
            const stickyColsInGroup = Math.max(
              0,
              Math.min(groupEnd, stickyCount) - groupStart,
            );
            const stickyCls =
              stickyColsInGroup === g.cols.length && stickyColsInGroup > 0
                ? " sticky-group-head"
                : "";
            groupRow += `<th class="${g.cls || ""}${stickyCls}" colspan="${g.cols.length}">${g.name}</th>`;
            colOffset = groupEnd;
          });
        }

        const head = cols
          .map((c, i) => {
            const stickyCls = i < stickyCount ? `sticky-col-${i + 1}` : "";
            return renderTableHeaderCell(c, stickyCls);
          })
          .join("");
        const stickyClasses = cols.map((_, i) =>
          i < stickyCount ? `sticky-col-${i + 1}` : "",
        );
        const { tfootHtml, dataRows, dataCount } = renderDataTableTotalFooter(
          cols,
          config.rows,
          stickyClasses,
          {
            formatCell: (_col, cell) =>
              typeof cell === "number" ? cell.toLocaleString("zh-CN") : cell,
          },
        );
        const body = dataRows
          .map((row) => {
            const cells = row
              .map((cell, i) => {
                const stickyCls = stickyClasses[i] || "";
                const val =
                  typeof cell === "number"
                    ? cell.toLocaleString("zh-CN")
                    : cell;
                return `<td class="${stickyCls}">${val}</td>`;
              })
              .join("");
            return `<tr>${cells}</tr>`;
          })
          .join("");
        return `
          <div class="table-wrap">
            <table class="data-table${groups ? " has-group-header" : ""}">
              <thead>
                ${groups ? `<tr class="group-row">${groupRow}</tr>` : ""}
                <tr class="col-row">${head}</tr>
              </thead>
              <tbody>${body}</tbody>
              ${tfootHtml}
            </table>
          </div>
          <div class="pagination">
            <button disabled>‹</button>
            <button class="active">1</button>
            <button>2</button>
            <button>3</button>
            <button>›</button>
            <span class="pagination-info">共 ${dataCount} 条</span>
          </div>`;
      }

      function renderGameActivityStructureArea() {
        const dayCount = 30;
        const labels = buildRecentTrendLabels(dayCount);
        const newPlayers = genTrendSeries(dayCount, 2680, 3260, 180);
        const oldPlayers = genTrendSeries(dayCount, 8520, 9320, 260);
        newPlayers[dayCount - 1] = 3260;
        oldPlayers[dayCount - 1] = 9320;
        const total = newPlayers.map((v, i) => v + oldPlayers[i]);

        const W = 620,
          H = 260,
          padL = 52,
          padR = 16,
          padT = 20,
          padB = 32;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;
        const maxVal = 15000;
        const n = labels.length;
        const xPos = (i) =>
          padL + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW);
        const yPos = (v) => padT + plotH * (1 - v / maxVal);
        const zeroLine = new Array(n).fill(0);

        let grid = "",
          yLabels = "",
          xLabels = "";
        for (let i = 0; i <= 5; i++) {
          const val = (maxVal / 5) * i;
          const y = yPos(val);
          grid += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"></line>`;
          yLabels += `<text class="axis-label" x="${padL - 8}" y="${y + 3}" text-anchor="end">${Math.round(val).toLocaleString("zh-CN")}</text>`;
        }
        labels.forEach((lab, i) => {
          if (i % 5 === 0 || i === n - 1) {
            xLabels += `<text class="axis-label" x="${xPos(i)}" y="${H - 8}" text-anchor="middle">${lab}</text>`;
          }
        });

        const oldArea = buildStackedAreaPath(oldPlayers, zeroLine, xPos, yPos);
        const newArea = buildStackedAreaPath(total, oldPlayers, xPos, yPos);
        const tipPoints = labels.map((_, i) => [
          {
            name: "新增投注玩家",
            color: "#14C9C9",
            x: xPos(i),
            y: yPos(total[i]),
            text: formatChartTipNumber(newPlayers[i]),
          },
          {
            name: "老投注玩家",
            color: "#165DFF",
            x: xPos(i),
            y: yPos(oldPlayers[i] / 2),
            text: formatChartTipNumber(oldPlayers[i]),
          },
        ]);

        return `
        ${renderComboChartWithTip(
          `${grid}
            <path d="${oldArea}" fill="#165DFF" fill-opacity="0.55"></path>
            <path d="${newArea}" fill="#14C9C9" fill-opacity="0.55"></path>
            ${yLabels}${xLabels}`,
          {
            labels,
            points: tipPoints,
            layout: { W, H, padL, padR, padT, padB, xMode: "spread" },
          },
        )}
        <div class="line-legend">
          <span><i style="background:#14C9C9"></i>新增投注玩家</span>
          <span><i style="background:#165DFF"></i>老投注玩家</span>
        </div>`;
      }

      function renderGameActivityTop10Chart(
        data,
        valueLabel,
        suffix = "",
        options = {},
      ) {
        const W = 620;
        const H = options.height || 300;
        const padL = 150;
        const padR = suffix === "sec" ? 96 : 72;
        const padT = 16;
        const padB = 14;
        const plotW = W - padL - padR;
        const rowH = (H - padT - padB) / data.length;
        const maxVal = Math.max(...data.map((item) => item.value));
        const rows = data
          .map((item, index) => {
            const y = padT + index * rowH;
            const width = (item.value / maxVal) * plotW;
            let display;
            if (suffix === "%") {
              display = `${item.value.toFixed(1)}%`;
            } else if (suffix === "sec") {
              display = formatStaySec(item.value);
            } else {
              display = item.value.toLocaleString("zh-CN");
            }
            const barH = Math.max(10, rowH - 8);
            const barY = y + (rowH - barH) / 2;
            return `<text class="axis-label" x="${padL - 10}" y="${y + rowH / 2 + 4}" text-anchor="end">${index + 1}. ${item.name}</text><rect x="${padL}" y="${barY}" width="${plotW}" height="${barH}" rx="3" fill="#f2f3f5"></rect><rect x="${padL}" y="${barY}" width="${width}" height="${barH}" rx="3" fill="${index < 3 ? "#165DFF" : "#14C9C9"}"></rect><text class="axis-label" x="${padL + width + 8}" y="${y + rowH / 2 + 4}">${display}</text>`;
          })
          .join("");
        return `<div class="combo-chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${valueLabel} Top10 横向柱状排行榜">${rows}</svg></div>`;

      function renderGameActivityScaleTrend() {
        const dayCount = 30;
        const labels = buildRecentTrendLabels(dayCount);
        const dau = genTrendSeries(dayCount, 3800, 4280, 120);
        const totalBet = genTrendSeries(dayCount, 1600000, 1934960, 80000);
        dau[dayCount - 1] = 4280;
        totalBet[dayCount - 1] = 1934960;

        const W = 620,
          H = 240,
          padL = 58,
          padR = 58,
          padT = 20,
          padB = 32;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;
        const n = labels.length;
        const step = plotW / n;
        const barW = Math.min(10, step * 0.55);
        const leftMax = 2400000;
        const rightMax = 5000;
        const yTotal = (v) => padT + plotH * (1 - v / leftMax);
        const yDau = (v) => padT + plotH * (1 - v / rightMax);
        const fmtMoneyAxis = (v) =>
          v >= 10000 ? (v / 10000).toFixed(0) + "万" : String(v);

        let grid = "",
          leftAxis = "",
          rightAxis = "";
        for (let i = 0; i <= 4; i++) {
          const y = padT + (plotH / 4) * i;
          grid += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"></line>`;
          leftAxis += `<text class="axis-label" x="${padL - 8}" y="${y + 3}" text-anchor="end">${fmtMoneyAxis(leftMax - (leftMax / 4) * i)}</text>`;
          rightAxis += `<text class="axis-label" x="${W - padR + 8}" y="${y + 3}" text-anchor="start">${Math.round(rightMax - (rightMax / 4) * i).toLocaleString("zh-CN")}</text>`;
        }

        let bars = "",
          xLabels = "",
          dauPts = "";
        const tipPoints = [];
        labels.forEach((lab, i) => {
          const cx = padL + step * i + step / 2;
          const barTop = yTotal(totalBet[i]);
          bars += `<rect x="${cx - barW / 2}" y="${barTop}" width="${barW}" height="${padT + plotH - barTop}" rx="2" fill="#165DFF"></rect>`;
          const dy = yDau(dau[i]);
          dauPts += `${i ? " " : ""}${cx},${dy}`;
          tipPoints.push([
            {
              name: "总投注金额",
              color: "#165DFF",
              x: cx,
              y: barTop,
              text: formatGameMoney(totalBet[i]),
            },
            {
              name: "投注用户DAU",
              color: "#14C9C9",
              x: cx,
              y: dy,
              text: dau[i].toLocaleString("zh-CN"),
            },
          ]);
          if (i % 5 === 0 || i === n - 1) {
            xLabels += `<text class="axis-label" x="${cx}" y="${H - 8}" text-anchor="middle">${lab}</text>`;
          }
        });

        return `
        ${renderComboChartWithTip(
          `<text class="axis-title" x="${padL - 8}" y="${padT - 4}" text-anchor="end">总投注金额</text>
            <text class="axis-title" x="${W - padR + 8}" y="${padT - 4}" text-anchor="start">投注用户DAU</text>
            ${grid}${bars}
            <polyline fill="none" stroke="#14C9C9" stroke-width="1.5" points="${dauPts}"></polyline>
            ${leftAxis}${rightAxis}${xLabels}`,
          {
            labels,
            points: tipPoints,
            layout: { W, H, padL, padR, padT, padB, xMode: "band" },
          },
        )}
        <div class="line-legend">
          <span><i style="background:#165DFF"></i>总投注金额</span>
          <span><i style="background:#14C9C9"></i>投注用户DAU</span>
        </div>`;
      }

      function renderGameValueProfitTrend() {
        const dayCount = 30;
        const labels = buildRecentTrendLabels(dayCount);
        const ggr = genTrendSeries(dayCount, 520000, 628500, 18000);
        const winlose = genTrendSeries(dayCount, 470000, 573300, 16000);
        ggr[dayCount - 1] = 628500;
        winlose[dayCount - 1] = 573300;

        const W = 620,
          H = 240,
          padL = 58,
          padR = 58,
          padT = 20,
          padB = 32;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;
        const n = labels.length;
        const step = plotW / n;
        const barW = Math.min(10, step * 0.55);
        const leftMax = 700000;
        const rightMax = 700000;
        const yGgr = (v) => padT + plotH * (1 - v / leftMax);
        const yWin = (v) => padT + plotH * (1 - v / rightMax);
        const fmtAxis = (v) =>
          v >= 10000 ? (v / 10000).toFixed(0) + "万" : String(v);

        let grid = "",
          leftAxis = "",
          rightAxis = "";
        for (let i = 0; i <= 4; i++) {
          const y = padT + (plotH / 4) * i;
          grid += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"></line>`;
          leftAxis += `<text class="axis-label" x="${padL - 8}" y="${y + 3}" text-anchor="end">${fmtAxis(leftMax - (leftMax / 4) * i)}</text>`;
          rightAxis += `<text class="axis-label" x="${W - padR + 8}" y="${y + 3}" text-anchor="start">${fmtAxis(rightMax - (rightMax / 4) * i)}</text>`;
        }

        let bars = "",
          xLabels = "",
          linePts = "";
        const tipPoints = [];
        labels.forEach((lab, i) => {
          const cx = padL + step * i + step / 2;
          const barTop = yGgr(ggr[i]);
          bars += `<rect x="${cx - barW / 2}" y="${barTop}" width="${barW}" height="${padT + plotH - barTop}" rx="2" fill="#165DFF"></rect>`;
          const ly = yWin(winlose[i]);
          linePts += `${i ? " " : ""}${cx},${ly}`;
          tipPoints.push([
            {
              name: "GGR",
              color: "#165DFF",
              x: cx,
              y: barTop,
              text: formatGameMoney(ggr[i]),
            },
            {
              name: "平台游戏输赢",
              color: "#FF7D00",
              x: cx,
              y: ly,
              text: formatGameMoney(winlose[i]),
            },
          ]);
          if (i % 5 === 0 || i === n - 1) {
            xLabels += `<text class="axis-label" x="${cx}" y="${H - 8}" text-anchor="middle">${lab}</text>`;
          }
        });

        return `
        ${renderComboChartWithTip(
          `<text class="axis-title" x="${padL - 8}" y="${padT - 4}" text-anchor="end">GGR</text>
            <text class="axis-title" x="${W - padR + 8}" y="${padT - 4}" text-anchor="start">平台游戏输赢</text>
            ${grid}${bars}
            <polyline fill="none" stroke="#FF7D00" stroke-width="1.5" points="${linePts}"></polyline>
            ${leftAxis}${rightAxis}${xLabels}`,
          {
            labels,
            points: tipPoints,
            layout: { W, H, padL, padR, padT, padB, xMode: "band" },
          },
        )}
        <div class="line-legend">
          <span><i style="background:#165DFF"></i>GGR</span>
          <span><i style="background:#FF7D00"></i>平台游戏输赢</span>
        </div>`;
      }

      function bindGameMetricChartFocus(root = document, wrapId) {
        const wrap = root.querySelector(wrapId);
        if (!wrap || wrap.dataset.focusBound === "1") return;
        wrap.dataset.focusBound = "1";

        const expandableCards = [
          ...wrap.querySelectorAll(".ga-chart-expandable"),
        ];
        // 单图表展示：移除放大提示文案
        if (expandableCards.length <= 1) {
          wrap
            .querySelectorAll(".ga-chart-expand-hint, .chart-expand-hint")
            .forEach((el) => el.remove());
        }

        const setFocus = (key) => {
          if (!key) {
            wrap.classList.remove("is-focus-mode");
            wrap
              .querySelectorAll(".ga-chart-card")
              .forEach((card) => card.classList.remove("is-focused"));
            requestAnimationFrame(() => resizeChartHosts(wrap));
            return;
          }
          wrap.classList.add("is-focus-mode");
          wrap.querySelectorAll(".ga-chart-card").forEach((card) => {
            card.classList.toggle("is-focused", card.dataset.chartKey === key);
          });
          requestAnimationFrame(() => resizeChartHosts(wrap));
        };

        wrap.addEventListener("click", (e) => {
          if (e.target.closest(".ga-metric-help")) {
            e.preventDefault();
            e.stopPropagation();
            return;
          }
          if (e.target.closest(CHART_FOCUS_IGNORE_SEL)) return;
          const card = e.target.closest(
            ".ga-chart-expandable, .ga-chart-static",
          );
          if (!card?.dataset.chartKey) return;
          const key = card.dataset.chartKey;
          if (
            wrap.classList.contains("is-focus-mode") &&
            card.classList.contains("is-focused")
          ) {
            setFocus(null);
          } else {
            setFocus(key);
          }
        });
      }

      const CHART_EXPAND_HINT_HTML =
        '<span class="chart-expand-hint" aria-hidden="true"><span class="ga-expand-tip">点击图表可放大展示</span><span class="ga-collapse-tip">再次点击可缩小</span></span>';
      const CHART_FOCUS_IGNORE_SEL =
        "button, a, input, select, textarea, label, option, .ms-wrap, .ms-dropdown, .ms-trigger, .ms-option, .ms-tag, .filter-bar, .filter-item, .filter-bar-local, .chart-range-toggle, .range-tab, .range-btn, .ga-metric-help, .vt-btn, .view-toggle, .realtime-filters, .realtime-refresh, .realtime-date-range, .overview-date-bar, .overview-component-date-bar, .overview-range-tabs, .toolbar-actions, .btn";

      function resizeChartHosts(root) {
        if (!root || !window.echarts) return;
        root.querySelectorAll("div").forEach((el) => {
          const inst = window.echarts.getInstanceByDom(el);
          if (inst) inst.resize();
        });
      }

      function clearAllChartFocus(root = document) {
        root
          .querySelectorAll(".chart-focus-group.is-focus-mode")
          .forEach((wrap) => {
            wrap.classList.remove("is-focus-mode");
            wrap
              .querySelectorAll(".is-focused")
              .forEach((card) => card.classList.remove("is-focused"));
          });
        root
          .querySelectorAll(".game-metric-charts.is-focus-mode")
          .forEach((wrap) => {
            wrap.classList.remove("is-focus-mode");
            wrap
              .querySelectorAll(".is-focused")
              .forEach((card) => card.classList.remove("is-focused"));
          });
      }

      function ensureChartExpandHint(card) {
        if (card.classList.contains("ga-chart-card")) return;
        if (card.classList.contains("no-chart-zoom")) return;
        // 分时数据对比：不展示放大提示文案
        if (card.classList.contains("realtime-panel") || card.id === "realtimePanel") {
          return;
        }
        // 单图表展示：不展示放大提示文案
        const focusGroup = card.closest(".chart-focus-group, .overview-charts");
        if (
          focusGroup?.classList.contains("chart-focus-solo") ||
          (focusGroup &&
            [...focusGroup.children].filter((el) =>
              el.classList?.contains("chart-expandable"),
            ).length <= 1)
        ) {
          card
            .querySelectorAll(".chart-expand-hint, .ga-chart-expand-hint")
            .forEach((el) => el.remove());
          return;
        }
        if (card.querySelector(".chart-expand-hint, .ga-chart-expand-hint")) {
          return;
        }
        const title =
          card.querySelector(":scope > .chart-title") ||
          card.querySelector(":scope > .realtime-panel-head .chart-title") ||
          card.querySelector(":scope > .realtime-panel-head");
        if (title) {
          title.insertAdjacentHTML("beforeend", CHART_EXPAND_HINT_HTML);
        } else {
          card.insertAdjacentHTML("afterbegin", CHART_EXPAND_HINT_HTML);
        }
      }

      function bindChartFocusGroup(wrap) {
        if (!wrap || wrap.dataset.focusBound === "1") return;
        wrap.dataset.focusBound = "1";

        const cards = () =>
          [...wrap.children].filter(
            (el) =>
              el.classList?.contains("chart-expandable") && el.dataset.chartKey,
          );

        const setFocus = (key) => {
          if (!key) {
            wrap.classList.remove("is-focus-mode");
            cards().forEach((card) => card.classList.remove("is-focused"));
            requestAnimationFrame(() => resizeChartHosts(wrap));
            return;
          }
          wrap.classList.add("is-focus-mode");
          cards().forEach((card) => {
            card.classList.toggle("is-focused", card.dataset.chartKey === key);
          });
          requestAnimationFrame(() => resizeChartHosts(wrap));
        };

        wrap.addEventListener("click", (e) => {
          if (e.target.closest(CHART_FOCUS_IGNORE_SEL)) return;
          const card = e.target.closest(".chart-expandable");
          if (!card || !cards().includes(card)) return;
          const key = card.dataset.chartKey;
          if (
            wrap.classList.contains("is-focus-mode") &&
            card.classList.contains("is-focused")
          ) {
            setFocus(null);
          } else {
            setFocus(key);
          }
        });
      }

      function setupChartFocusGroup(wrap) {
        if (!wrap) return;
        wrap.classList.add("chart-focus-group");

        const cards = [...wrap.children].filter(
          (el) =>
            el.classList?.contains("chart-card") ||
            el.classList?.contains("realtime-panel"),
        );

        cards.forEach((card, index) => {
          if (card.classList.contains("ga-chart-card")) return;
          if (card.classList.contains("no-chart-zoom")) return;
          card.classList.add("chart-expandable");
          if (!card.dataset.chartKey) {
            card.dataset.chartKey = `focus-${index + 1}`;
          }
        });

        const expandableCount = cards.filter((c) =>
          c.classList.contains("chart-expandable"),
        ).length;
        wrap.classList.toggle("chart-focus-solo", expandableCount <= 1);

        // 单图表不展示放大提示；多图才追加提示文案
        cards.forEach((card) => {
          if (card.classList.contains("ga-chart-card")) return;
          if (card.classList.contains("no-chart-zoom")) return;
          if (expandableCount <= 1) {
            card
              .querySelectorAll(".chart-expand-hint, .ga-chart-expand-hint")
              .forEach((el) => el.remove());
            return;
          }
          ensureChartExpandHint(card);
        });

        bindChartFocusGroup(wrap);
      }

      function initChartFocusGroups(root = document) {
        // 经营总览：三图共用一个聚焦组，放大时其余图进入右侧缩略列表
        root.querySelectorAll(".overview-charts").forEach((wrap) => {
          setupChartFocusGroup(wrap);
        });

        root.querySelectorAll(".chart-grid").forEach((grid) => {
          if (grid.closest(".game-metric-charts, .overview-charts")) return;
          setupChartFocusGroup(grid);
        });

        [...root.querySelectorAll(".chart-card")].forEach((card) => {
          if (card.classList.contains("ga-chart-card")) return;
          if (card.classList.contains("no-chart-zoom")) return;
          if (
            card.closest(
              ".chart-grid, .game-metric-charts, .chart-focus-group, .overview-charts",
            )
          ) {
            return;
          }
          const wrap = document.createElement("div");
          wrap.className = "chart-focus-group chart-focus-solo";
          card.parentNode.insertBefore(wrap, card);
          wrap.appendChild(card);
          setupChartFocusGroup(wrap);
        });

        root.querySelectorAll(".realtime-panel").forEach((panel) => {
          if (panel.classList.contains("no-chart-zoom")) return;
          if (panel.closest(".chart-focus-group")) return;
          const wrap = document.createElement("div");
          wrap.className = "chart-focus-group chart-focus-solo";
          panel.parentNode.insertBefore(wrap, panel);
          wrap.appendChild(panel);
          setupChartFocusGroup(wrap);
        });
      }

      // 兼容旧调用名
      function decorateChartZoomHints(root = document) {
        initChartFocusGroups(root);
        bindVipGroupExpand(root);
      }
      function collapseChartZoom() {
        clearAllChartFocus(document);

      function initChartZoom() {
        if (document.documentElement.dataset.chartZoomBound === "1") return;
        document.documentElement.dataset.chartZoomBound = "1";

          if (e.key === "Escape") clearAllChartFocus();
        });

      function hashPathFlow(parent, child) {
        let hash = 0;
        const key = `${parent}->${child}`;
        for (let i = 0; i < key.length; i += 1) {
          hash = (hash << 5) - hash + key.charCodeAt(i);
          hash |= 0;
        }
        return 12000 + (Math.abs(hash) % 88000);
      }

      function getAppPathSankeyData() {
        const nodeMap = new Map();
        const displayMap = {};
        const links = [];

        const ensureNode = (level, display) => {
          const name = `L${level}-${display}`;
          if (!nodeMap.has(name)) {
            nodeMap.set(name, { name, display });
            displayMap[name] = display;
          }
          return name;
        };

        (PATH_PAGE_TREE[""] || []).forEach((l1) => {
          const l1Id = ensureNode(1, l1);
          (PATH_PAGE_TREE[l1] || []).forEach((l2) => {
            const l2Id = ensureNode(2, l2);
            links.push({
              source: l1Id,
              target: l2Id,
              value: hashPathFlow(l1, l2),
            });
            (PATH_PAGE_TREE[l2] || []).forEach((l3) => {
              const l3Id = ensureNode(3, l3);
              links.push({
                source: l2Id,
                target: l3Id,
                value: hashPathFlow(l2, l3),
              });
            });
          });
        });

        const nodes = [...nodeMap.values()].map((n) => ({ name: n.name }));
        return { nodes, links, displayMap };
      }

        const el = document.getElementById("appPathSankey");
        if (!el || typeof echarts === "undefined") return;
        disposeAppPathSankey();
        const { nodes, links, displayMap } = getAppPathSankeyData();
        appPathSankeyChart = echarts.init(el);
        appPathSankeyChart.setOption({
          tooltip: {
            trigger: "item",
            triggerOn: "mousemove",
            formatter(params) {
              if (params.dataType === "edge") {
                const from =
                  displayMap[params.data.source] || params.data.source;
                const to = displayMap[params.data.target] || params.data.target;
                return `${from} → ${to}<br/>会话数：${Number(
                  params.data.value,
                ).toLocaleString("zh-CN")}`;
              }
              const name = displayMap[params.name] || params.name;
              return `${name}<br/>会话数：${Number(params.value).toLocaleString(
                "zh-CN",
              )}`;
            },
          },
          series: [
            {
              type: "sankey",
              emphasis: { focus: "adjacency" },
              nodeAlign: "left",
              nodeGap: 10,
              nodeWidth: 16,
              layoutIterations: 48,
              data: nodes,
              links,

      function hexToRgba(hex, alpha) {
        const h = String(hex || "#165dff").replace("#", "");
        const full =
          h.length === 3
            ? h
                .split("")
                .map((c) => c + c)
                .join("")
            : h;
        const n = parseInt(full, 16);
        const r = (n >> 16) & 255;
        const g = (n >> 8) & 255;
        const b = n & 255;
        return `rgba(${r},${g},${b},${alpha})`;
      }

      /** 同色系按名次降低透明度，区分层次 */
      function getAppExpRankOpacity(index, total) {
        if (total <= 1) return 1;
        const maxA = 1;
        const minA = 0.36;
        return maxA - (index / (total - 1)) * (maxA - minA);
      }

      function formatDurationSec(sec) {
        const s = Math.max(0, Math.round(sec));
        if (s < 60) return `${s}秒`;
        const m = Math.floor(s / 60);
        const rs = s % 60;
        if (m < 60) return rs ? `${m}分${rs}秒` : `${m}分`;
        const h = Math.floor(m / 60);
        const rm = m % 60;
        return rm ? `${h}时${rm}分` : `${h}时`;
      }

      function getAppExpMetricValue(row, metric) {
        switch (metric) {
          case "页面访问次数":
            return row.visits;
          case "页面平均加载时长":
            return row.avgLoadSec;
          case "页面停留时长":
            return row.stayTotalSec;
          case "页面平均停留时长":
            return row.avgStaySec.all;
          case "页面平均访问深度":
            return row.depth;
          case "页面跳出率":
            return row.bounce;
          default:
            return 0;
        }
      }

      function formatAppExpMetricDisplay(value, metric) {
        if (metric === "页面访问次数") return value.toLocaleString("zh-CN");
        if (
          metric === "页面平均加载时长" ||
          metric === "页面停留时长" ||
          metric === "页面平均停留时长"
        ) {
          return formatDurationSec(value);
        }
        return `${Number(value).toFixed(2)}%`;
      }

      function refreshAppExperienceView(options = {}) {
        const panel = document.getElementById("appExperiencePanel");
        if (!panel) return;

        const { preserveScroll = false } = options;
        const scrollY = preserveScroll ? window.scrollY : null;
        const { metric } = appExperienceState;

        const tabsEl = document.getElementById("appExpMetricTabs");
        if (tabsEl) {
          if (!tabsEl.dataset.bound) {
            tabsEl.innerHTML = renderAppMetricTabs(APP_EXP_METRICS, metric);
            tabsEl.querySelectorAll(".tab-btn").forEach((btn) => {
              btn.addEventListener("click", (e) => {
                e.preventDefault();
                appExperienceState.metric = btn.dataset.tab;
                refreshAppExperienceView({ preserveScroll: true });
              });
            });
            tabsEl.dataset.bound = "1";
          } else {
            tabsEl.querySelectorAll(".tab-btn").forEach((btn) => {
              btn.classList.toggle("active", btn.dataset.tab === metric);
            });
          }
        }

        const subtitle = document.getElementById("appExpChartSubtitle");
        const tag = document.getElementById("appExpChartTag");
        const chart = document.getElementById("appExperienceTopChart");
        const tableWrap = document.getElementById("appExpTableWrap");

        if (subtitle) subtitle.textContent = `指标：${metric}`;
        if (tag) tag.textContent = "条形图";
        if (chart) {
          const items = getAppExpTopItems(metric);
          const displayItems = items.map((it) => ({
            name: it.name,
            value: it.value,
            display: formatAppExpMetricDisplay(it.value, metric),
          }));
          const max = Math.max(...displayItems.map((i) => i.value), 1);
          chart.innerHTML = `<div class="app-hbar">${displayItems
            .map(
              (it, i) => `
              <div class="app-hbar-row">
                <span>${it.name}</span>
                <div class="app-hbar-track"><div class="app-hbar-fill" style="--bar-w:${Math.max(6, Math.round((it.value / max) * 100))}%;--bar-i:${i};background:${hexToRgba("#165dff", getAppExpRankOpacity(i, displayItems.length))}"></div></div>
                <strong>${it.display}</strong>
              </div>`,
            )
            .join("")}</div>`;
        }

        if (tableWrap) tableWrap.innerHTML = renderAppExpTable();
        if (preserveScroll && scrollY != null) {
          requestAnimationFrame(() => window.scrollTo(0, scrollY));
        }
      }

      const CHURN_MAX_DRILL_DEPTH = 2;

      function getAppChurnFilterKey() {
        return getAppAnalysisFilterKey();

      function getAllChurnPagesFlat() {
        const pages = [];
        const seen = new Set();
        function walk(path) {
          getChurnPagesAtPath(path).forEach((name) => {
            if (seen.has(name)) return;
            seen.add(name);
            pages.push(name);
            walk([...path, name]);
          });
        }
        walk([]);
        return pages;
      }

      function getChurnPageLevel(pageName) {
        function dfs(path, depth) {
          const children = getChurnPagesAtPath(path);
          for (const child of children) {
            if (child === pageName) return depth;
            const found = dfs([...path, child], depth + 1);
            if (found >= 0) return found;
          }
          return -1;
        }
        return dfs([], 0);
      }

      function getChurnPageLevelLabel(pageName) {
        const level = getChurnPageLevel(pageName);
        return ["一级页面", "二级页面", "三级页面"][level] || "页面";
      }

      function parseChurnStaySeconds(raw) {
        const text = String(raw || "");
        const minMatch = text.match(/(\d+)分/);
        const secMatch = text.match(/(\d+)秒/);
        return (
          (minMatch ? Number(minMatch[1]) * 60 : 0) +
          (secMatch ? Number(secMatch[1]) : 0)
        );
      }

      function parseChurnPercent(raw) {
        return parseFloat(String(raw).replace("%", "")) || 0;
      }

      function getChurnMetricNumeric(pageName, metric, filterKey) {
        const raw = getChurnMetricRaw(pageName, metric, filterKey);
        if (metric === "平均停留时长") return parseChurnStaySeconds(raw);
        return parseChurnPercent(raw);
      }

      function pickChurnExtremePage(metric, mode, filterKey) {
        const pages = getAllChurnPagesFlat();
        if (!pages.length) {
          return { page: "-", value: "-", levelLabel: "-" };
        }
        const higherIsBetter =
          metric === "平均停留时长" ||
          metric === "充值转化率" ||
          metric === "投注转化率";
        const wantMax =
          mode === "best"
            ? metric === "流失率" || higherIsBetter
            : metric === "流失率";
        let bestPage = pages[0];
        let bestVal = getChurnMetricNumeric(bestPage, metric, filterKey);
        pages.forEach((pageName) => {
          const val = getChurnMetricNumeric(pageName, metric, filterKey);
          if (wantMax ? val > bestVal : val < bestVal) {
            bestPage = pageName;
            bestVal = val;
          }
        });
        return {
          page: bestPage,
          value: getChurnMetricRaw(bestPage, metric, filterKey),
          levelLabel: getChurnPageLevelLabel(bestPage),
        };
      }

      const CHURN_KPI_METRIC_CONFIG = {

      function hashPageSeed(name) {
        let hash = 0;
        for (let i = 0; i < name.length; i += 1) {
          hash = (hash << 5) - hash + name.charCodeAt(i);
          hash |= 0;
        }
        return Math.abs(hash);
      }

      function getChurnMetricRaw(pageName, metric, filterKey = getAppChurnFilterKey()) {
        const seed = hashPageSeed(`${pageName}-${metric}-${filterKey}`);
        const r = (seed % 1000) / 1000;
        switch (metric) {
          case "流失率":
            return `${(18 + r * 52).toFixed(1)}%`;
          case "平均停留时长": {
            const sec = Math.round(35 + r * 520);
            if (sec >= 60) {
              const m = Math.floor(sec / 60);
              const s = sec % 60;
              return `${m}分${s}秒`;
            }
            return `${sec}秒`;
          }
          case "充值转化率":
            return `${(4 + r * 28).toFixed(1)}%`;
          case "投注转化率":
            return `${(6 + r * 34).toFixed(1)}%`;
          default:
            return "-";
        }
      }

      function getChurnMetricScore(pageName, metric, filterKey = getAppChurnFilterKey()) {
        const seed = hashPageSeed(`${pageName}-${metric}-${filterKey}`);
        const r = (seed % 1000) / 1000;
        switch (metric) {
          case "流失率":
            return Math.round(18 + r * 52);
          case "平均停留时长":
            return Math.round(35 + r * 520);
          case "充值转化率":
            return Math.round(4 + r * 28);
          case "投注转化率":
            return Math.round(6 + r * 34);
          default:
            return 0;
        }
      }

      function getChurnPagesAtPath(path) {
        const key = path.length ? path[path.length - 1] : "";
        return CHURN_PAGE_TREE[key] || [];
      }

      function hasChurnChildren(pageName) {
        if (appChurnDrillPath.length >= CHURN_MAX_DRILL_DEPTH) return false;
        return (CHURN_PAGE_TREE[pageName] || []).length > 0;

            const sep = i ? '<span class="sep">/</span>' : "";
            if (isLast) {
              return `${sep}<span class="crumb is-current">${crumb.label}</span>`;

            return `${sep}<span class="crumb" data-path="${crumb.path.join(">")}">${crumb.label}</span>`;

      function buildChurnHeatmapData(pages, filterKey = getAppChurnFilterKey()) {
        const data = [];
        let maxScore = 1;
        pages.forEach((page, x) => {
          CHURN_METRICS.forEach((metric, y) => {
            const score = getChurnMetricScore(page, metric, filterKey);
            maxScore = Math.max(maxScore, score);
            data.push({
              value: [x, y, score],
              page,
              metric,
              raw: getChurnMetricRaw(page, metric, filterKey),
            });
          });
        });
        return { data, maxScore };
      }

      let pathExploreState = {
        direction: "backward",

      function getPathEventMeta(eventId) {
        return (
          PATH_KEY_EVENTS.find((e) => e.id === eventId) || PATH_KEY_EVENTS[0]
        );
      }

      function getPathExploreVariantKey(eventId, direction) {
        const sd = pathExploreState.startDate || "";
        const ed = pathExploreState.endDate || "";
        const channel = pathExploreState.channel || "全部";
        const userType = pathExploreState.userType || "全部用户";
        return `${eventId}|${direction}|${channel}|${userType}|${sd}|${ed}`;
      }

      function getPathTargetUsers(eventId, direction) {
        const variantKey = getPathExploreVariantKey(eventId, direction);
        const seed = hashCoreFlowSeed(variantKey);
        return 48000 + (seed % 52000);
      }

      function scalePathSteps(steps, depth) {
        if (steps.length === depth) return steps;
        if (steps.length > depth) return steps.slice(-depth);
        const padStep = [
          { name: "首页", share: 58 },
          { name: "侧边栏", share: 22 },
          { name: "Other", share: 20 },
        ];
        const padded = [...steps];
        while (padded.length < depth) padded.unshift(padStep);
        return padded;
      }

      function normalizePathNodes(rawNodes, columnUsers, variantKey) {
        const weighted = rawNodes.map((n) => {
          const nodeSeed = hashCoreFlowSeed(`${variantKey}::${n.name}`);
          // 让不同国家/平台下节点权重有明显差异
          const factor = 0.78 + ((nodeSeed % 1000) / 1000) * 0.44; // 0.78 ~ 1.22
          return { ...n, weight: n.share * factor };
        });

        const sum = weighted.reduce((s, n) => s + n.weight, 0) || 1;
        return weighted.map((n) => ({
          name: n.name,
          users: Math.round((columnUsers * n.weight) / sum),
          pct: `${((n.weight / sum) * 100).toFixed(1)}%`,
          expandable: !!PATH_EXPAND_CHILDREN[n.name],
        }));
      }

      function getChildPathNodes(parentName, parentUsers, variantKey) {
        const children = PATH_EXPAND_CHILDREN[parentName] || [];
        if (!children.length) return [];

        const baseWeights = children.map((name, i) => {
          const nodeSeed = hashCoreFlowSeed(
            `${variantKey}::child::${parentName}::${name}`,
          );
          const factor = 0.78 + ((nodeSeed % 1000) / 1000) * 0.44; // 0.78 ~ 1.22
          return (children.length - i) * factor;
        });
        const sum = baseWeights.reduce((a, b) => a + b, 0) || 1;

        return children.map((name, i) => ({
          name,
          users: Math.round((parentUsers * baseWeights[i]) / sum),
          pct: `${((baseWeights[i] / sum) * 100).toFixed(1)}%`,
          expandable: false,
        }));
      }

      function buildPathExploreColumns(eventId, direction, depth) {
        const meta = getPathEventMeta(eventId);
        const mock =
          PATH_EVENT_MOCK[eventId]?.[direction] ||
          PATH_EVENT_MOCK.first_recharge_success[direction];
        const steps = scalePathSteps(mock.steps, depth);
        const variantKey = getPathExploreVariantKey(eventId, direction);
        const targetUsers = getPathTargetUsers(eventId, direction);
        const labels =
          direction === "backward"
            ? [
                ...Array.from({ length: depth }, (_, i) => ({
                  label: `STEP -${depth - i}`,
                  isTarget: false,
                })),
                { label: "ENDING POINT", isTarget: true },
              ]
            : [
                { label: "STARTING POINT", isTarget: true },
                ...Array.from({ length: depth }, (_, i) => ({
                  label: `STEP +${i + 1}`,
                  isTarget: false,
                })),
              ];

        const columns = [];
        if (direction === "backward") {
          const columnUsers = [];
          let users = targetUsers;
          for (let i = steps.length - 1; i >= 0; i -= 1) {
            users = Math.round(users * (1.22 + (steps.length - 1 - i) * 0.05));
            columnUsers[i] = users;
          }
          steps.forEach((raw, i) => {
            columns.push({
              ...labels[i],
              nodes: normalizePathNodes(raw, columnUsers[i], variantKey),
            });
          });
          columns.push({
            ...labels[labels.length - 1],
            nodes: [
              {
                name: meta.label,
                users: targetUsers,
                pct: "100.0%",
                expandable: false,
                isTarget: true,
              },
            ],
          });
        } else {
          columns.push({
            ...labels[0],
            nodes: [
              {
                name: meta.label,
                users: targetUsers,
                pct: "100.0%",
                expandable: false,
                isTarget: true,
              },
            ],
          });
          let users = targetUsers;
          steps.forEach((raw, i) => {
            users = Math.round(users * (0.72 - i * 0.04));
            columns.push({
              ...labels[i + 1],
              nodes: normalizePathNodes(raw, users, variantKey),
            });
          });
        }
        return columns;
      }

      function buildPathTopRank(eventId, direction, depth) {
        const meta = getPathEventMeta(eventId);
        const mock =
          PATH_EVENT_MOCK[eventId]?.[direction] ||
          PATH_EVENT_MOCK.first_recharge_success[direction];
        const rows = mock.topPaths || [];
        const variantKey = getPathExploreVariantKey(eventId, direction);
        const enriched = rows.map((parts) => {
          const path =
            direction === "backward"
              ? [...parts.slice(0, depth), meta.label]
              : [meta.label, ...parts.slice(0, depth)];
          const rawPct = Number(parts[parts.length - 1]) || 0;
          const seed = hashCoreFlowSeed(
            `${variantKey}::top::${path.join("->")}`,
          );
          const factor = 0.86 + ((seed % 1000) / 1000) * 0.28; // 0.86 ~ 1.14
          const pctNum = Math.max(1, rawPct * factor);
          return { path, pctNum };
        });

        enriched.sort((a, b) => b.pctNum - a.pctNum);
        return enriched.map((row, i) => ({
          rank: i + 1,
          path: row.path,
          pct: row.pctNum.toFixed(0),
        }));
      }

      function renderPathExploreNode(node, maxUsers, nodeKey) {
        const width = Math.max(14, Math.round((node.users / maxUsers) * 100));
        const expanded = pathExploreState.expanded[nodeKey];
        const children =
          expanded && node.expandable
            ? getChildPathNodes(
                node.name,
                node.users,
                getPathExploreVariantKey(
                  pathExploreState.eventId,
                  pathExploreState.direction,
                ),
              )
            : [];
        const childMax = Math.max(...children.map((c) => c.users), 1);
        return `
          <div class="path-explore-node ${expanded ? "is-expanded" : ""} ${node.isTarget ? "is-target" : ""}" data-node-key="${nodeKey}">
            <div class="path-explore-node-card">
              <div class="path-explore-node-bar" style="width:${width}%"></div>
              <div class="path-explore-node-body">
                <div class="path-explore-node-name">
                  <span>${node.name}</span>
                  ${node.expandable ? `<span class="expand-icon">${expanded ? "▼" : "▶"}</span>` : ""}
                </div>
                <div class="path-explore-node-stats">
                  <span><strong>${node.users.toLocaleString("zh-CN")}</strong> 用户</span>
                  <span>${node.pct}</span>
                </div>
              </div>
            </div>
            ${
              children.length
                ? `<div class="path-explore-children">${children
                    .map((child) => {
                      const cw = Math.max(
                        14,
                        Math.round((child.users / childMax) * 100),
                      );
                      return `
                      <div class="path-explore-node">
                        <div class="path-explore-node-card">
                          <div class="path-explore-node-bar" style="width:${cw}%"></div>
                          <div class="path-explore-node-body">
