              color: "#2F54EB",
              x: cx,
              y: ly,
              text: `${surplusRates[i]}%`,
            },
          ]);
        });

        return `
        ${renderComboChartWithTip(
          `${grid}${bars}<polyline fill="none" stroke="#2F54EB" stroke-width="1.5" points="${linePts}"></polyline>${yLeft}${yRight}${xLabels}`,
          {
            labels,
            points: tipPoints,
            layout: { W, H, padL, padR, padT, padB, xMode: "spread" },
          },

        <div class="line-legend">
          <span><i style="background:#165DFF"></i>平台游戏输赢</span>
          <span><i style="background:#2F54EB"></i>盈余率</span>
        </div>`;

      function renderPlatformFundFlowTrendChart(dayCount, endDate) {

            x: xPos(i),
            y: yRight(bonus[i]),
            text: fmtMoney(bonus[i]),
          },

        return `
        ${renderComboChartWithTip(
          `${axisTitles}${grid}${drawLine(recharge, "#165DFF", yLeft)}${drawLine(withdrawal, "#14C9C9", yLeft)}${drawLine(bonus, "#722ED1", yRight)}${leftAxis}${rightAxis}${xLabels}`,

        <div class="line-legend">

      function renderFunnelChart(steps) {
        steps = steps || [
          { name: "安装用户", value: 100000 },
          { name: "新增设备", value: 80000 },
          { name: "注册用户", value: 50000 },
          { name: "绑定用户", value: 45000 },
        ];
        const W = 760,
          H = 356;
        const plotTop = 66,
          plotBottom = 270;
        const plotH = plotBottom - plotTop;
        const axisLeft = 46,
          plotRight = W - 14;
        const plotLeft = axisLeft;
        const plotW = plotRight - plotLeft;
        const n = steps.length;
        const colW = plotW / n;
        const darkW = colW * 0.58;
        const maxVal = Math.max(...steps.map((s) => s.value), 1);
        const yVal = (v) => plotBottom - plotH * (v / maxVal);
        const fmt = (v) => {
          if (v === 0) return "0";
          if (v >= 10000)
            return (
              (v % 10000 === 0 ? v / 10000 : (v / 10000).toFixed(1)) + "万"
            );
          return v.toLocaleString("zh-CN");
        };
        const nameFont = n > 5 ? 11 : 13;

        let grid = "",
          yLabels = "";
        [0, 0.5, 1].forEach((t) => {
          const y = plotBottom - plotH * t;
          grid += `<line class="grid-line dashed" x1="${plotLeft}" y1="${y}" x2="${plotRight}" y2="${y}"></line>`;
          yLabels += `<text class="funnel-axis" x="${plotLeft - 8}" y="${y + 4}" text-anchor="end">${fmt(maxVal * t)}</text>`;
        });

        let seps = "",
          bars = "",
          headers = "",
          abandons = "";
        seps += `<line class="grid-line" x1="${plotLeft}" y1="16" x2="${plotLeft}" y2="${plotBottom}"></line>`;
        steps.forEach((s, i) => {
          const colX = plotLeft + colW * i;
          const sepX = colX + colW;
          const topY = yVal(s.value);
          bars += `<rect x="${colX}" y="${topY}" width="${darkW}" height="${plotBottom - topY}" fill="#4080FF"></rect>`;
          if (i < n - 1) {
            const nextTopY = yVal(steps[i + 1].value);
            const lx = colX + darkW,
              rx = colX + colW;
            bars += `<polygon points="${lx},${topY} ${rx},${nextTopY} ${rx},${plotBottom} ${lx},${plotBottom}" fill="#C9DCFF"></polygon>`;
          }
          seps += `<line class="grid-line dashed" x1="${sepX}" y1="16" x2="${sepX}" y2="${plotBottom}"></line>`;

          const comp = i === 0 ? 100 : (s.value / steps[i - 1].value) * 100;
          headers += `<text class="funnel-step-idx" x="${colX + 4}" y="30">Step ${i + 1}</text>`;
          headers += `<text class="funnel-step-name" x="${colX + 4}" y="52" style="font-size:${nameFont}px">${s.name}</text>`;
          headers += `<text class="funnel-comp" x="${sepX - 6}" y="52" text-anchor="end" style="font-size:${nameFont}px">${comp.toFixed(1)}%</text>`;

          if (i < n - 1) {
            const lost = s.value - steps[i + 1].value;
            const rate = (lost / s.value) * 100;
            const ay = plotBottom + 30;
            headers += `<text class="funnel-abandon-title" x="${colX + 4}" y="${ay - 16}">流失率</text>`;
            abandons += `<rect x="${colX + 4}" y="${ay - 9}" width="9" height="9" rx="2" fill="#4080FF"></rect>`;
            abandons += `<text class="funnel-abandon" x="${colX + 18}" y="${ay}">${fmt(Math.max(lost, 0))} · ${rate.toFixed(1)}%</text>`;
          }
        });

        return `
        <div class="ga-funnel">
          <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
            ${grid}
            ${bars}
            ${seps}
            ${headers}
            ${yLabels}
            ${abandons}
          </svg>
        </div>`;
      }

      function renderChannelRank(opts = {}) {
        const { source = "全部", channelName = "" } = opts;
        // 与「来源渠道」筛选字段（SOURCE_CHANNEL_OPTIONS）对应
        const data = {
          投放: { install: 14000, reg: 72 },
          官网: { install: 7600, reg: 75 },
          裂变: { install: 9800, reg: 68 },
          特殊流量: { install: 4200, reg: 55 },
        };
        let rows = SOURCE_CHANNEL_OPTIONS.map((name) => ({
          name,
          ...(data[name] || { install: 0, reg: 0 }),
        }));
        if (!isAllSourceChannel(source)) {
          rows = rows.filter((r) => r.name === source);
          // 选了具体渠道名时，用样例微调展示该账号规模
          if (channelName) {
            rows = rows.map((r) => ({
              ...r,
              install: Math.round(r.install * 0.28),
              reg: Math.max(40, Math.round(r.reg - 2)),
            }));
          }
        }
        rows = rows.sort((a, b) => b.install - a.install);

        const W = 620;
        const H = 200;
        const padL = 72;
        const padR = 48;
        const padT = 28;
        const padB = 36;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;
        const installMax = Math.max(...rows.map((r) => r.install), 1) * 1.05;
        const rateMax = 100;
        const groupH = plotH / Math.max(rows.length, 1);
        const barH = Math.min(10, groupH * 0.28);
        const barGap = 3;

        let grid = "";
        let xTicks = "";
        for (let i = 0; i <= 4; i++) {
          const x = padL + (plotW / 4) * i;
          const tickVal = Math.round((installMax / 4) * i);
          grid += `<line class="grid-line" x1="${x}" y1="${padT}" x2="${x}" y2="${H - padB}"></line>`;
          xTicks += `<text class="axis-label" x="${x}" y="${H - padB + 16}" text-anchor="middle">${tickVal.toLocaleString("zh-CN")}</text>`;
        }

        const axisTitles = `
          <text class="axis-title" x="${padL}" y="${padT - 10}" text-anchor="start">新增访问人数</text>
          <text class="axis-title" x="${W - padR}" y="${padT - 10}" text-anchor="end">注册转化率</text>`;

        let bars = "";
        const tipPoints = [];
        const labels = [];
        rows.forEach((r, i) => {
          const cy = padT + groupH * i + groupH / 2;
          const y1 = cy - barH - barGap / 2;
          const y2 = cy + barGap / 2;
          const installW = Math.max(2, (r.install / installMax) * plotW);
          const rateW = Math.max(2, (r.reg / rateMax) * plotW);
          bars += `<text class="axis-label" x="${padL - 8}" y="${cy + 3}" text-anchor="end">${r.name}</text>`;
          bars += `<rect x="${padL}" y="${y1}" width="${installW}" height="${barH}" rx="2" fill="#165DFF"></rect>`;
          bars += `<rect x="${padL}" y="${y2}" width="${rateW}" height="${barH}" rx="2" fill="#14C9C9"></rect>`;
          labels.push(r.name);
          tipPoints.push([
            {
              name: "新增访问人数",
              color: "#165DFF",
              x: padL + installW,
              y: y1 + barH / 2,
              text: r.install.toLocaleString("zh-CN"),
            },
            {
              name: "注册转化率",
              color: "#14C9C9",
              x: padL + rateW,
              y: y2 + barH / 2,
              text: `${r.reg}%`,
            },
          ]);
        });

        return `
        <div class="rank-list">
          ${renderComboChartWithTip(
            `${axisTitles}${grid}${bars}${xTicks}`,
            {
              labels,
              points: tipPoints,
              layout: {
                W,
                H,
                padL,
                padR,
                padT,
                padB,
                orient: "horizontal",
                yMode: "band",
              },
            },
          )}
          <div class="line-legend">
            <span><i style="background:#165DFF"></i>新增访问人数</span>
            <span><i style="background:#14C9C9"></i>注册转化率</span>
          </div>
        </div>`;
      }

      function buildHalfHourAxisLabels(slotCount = 48) {
        const n = Math.max(1, slotCount);
        const labels = [];
        for (let i = 0; i < n; i++) {
          const totalMin = i * 30;
          const h = String(Math.floor(totalMin / 60) % 24).padStart(2, "0");
          const m = String(totalMin % 60).padStart(2, "0");
          labels.push(`${h}:${m}`);
        }
        return labels;
      }

      function genTrendSeries(dayCount, start, end, wave, decimals) {
        const data = [];
        const n = Math.max(1, dayCount);
        for (let i = 0; i < n; i++) {
          const t = n === 1 ? 1 : i / (n - 1);
          const v = start + t * (end - start) + Math.sin(i * 0.42) * wave;
          data.push(decimals ? +v.toFixed(decimals) : Math.round(v));
        }
        return data;
      }

      function scaleUserLtvSeries(series, dayOffset, channelIndex) {
        const factor =
          1 -
          dayOffset * 0.012 -
          ((channelIndex * 2 + dayOffset) % 5) * 0.008;
        return (series || []).map((v) => {
          if (v == null || !Number.isFinite(Number(v))) return v;
          return +(Number(v) * factor).toFixed(1);
        });
      }

      function buildUserLtvSampleCohorts(start, end) {
        const dates = eachDateInclusive(start, end);
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const rows = [];
        dates.forEach((dateStr, dayOffsetFromStart) => {
          const dayOffset = dates.length - 1 - dayOffsetFromStart;
          const cohortDate = parseYMD(dateStr);
          const daysSince = Math.floor(
            (today.getTime() - cohortDate.getTime()) / 86400000,
          );
          // 已满 7 日的完整周期：每天 2 个渠道批次，方便对比多条完整曲线
          // 未满周期：每天 1 条，保留未到期「-」效果
          const tplCount = daysSince >= 7 ? 2 : dates.length <= 3 ? 2 : 1;
          for (let t = 0; t < tplCount; t++) {
            const channelIndex =
              (dayOffsetFromStart * 3 + t * 2) %
              USER_LTV_CHANNEL_TEMPLATES.length;
            const tpl = USER_LTV_CHANNEL_TEMPLATES[channelIndex];
            const countFactor = Math.max(
              0.72,
              1 - dayOffset * 0.015 - t * 0.04,
            );
            rows.push({
              date: dateStr,
              source: tpl.source,
              name: tpl.name,
              account: tpl.account,
              platform: tpl.platform,
              registerCount: Math.max(
                100,
                Math.round(tpl.registerCount * countFactor),
              ),
              ftdCount: Math.max(20, Math.round(tpl.ftdCount * countFactor)),
              gross: maskUserLtvIncompleteDays(
                scaleUserLtvSeries(tpl.gross, dayOffset, channelIndex),
                cohortDate,
                today,
              ),
              ftd: maskUserLtvIncompleteDays(
                scaleUserLtvSeries(tpl.ftd, dayOffset, channelIndex),
                cohortDate,
                today,
              ),
              net: maskUserLtvIncompleteDays(
                scaleUserLtvSeries(tpl.net, dayOffset, channelIndex),
                cohortDate,
                today,
              ),
              ggr: maskUserLtvIncompleteDays(
                scaleUserLtvSeries(tpl.ggr, dayOffset, channelIndex),
                cohortDate,
                today,
              ),
            });
          }
        });
        return rows;
      }

      function maskUserLtvIncompleteDays(series, cohortDate, todayDate) {
        const daysSince = Math.floor(
          (todayDate.getTime() - cohortDate.getTime()) / 86400000,
        );
        return (series || []).map((v, i) => {
          const dayN = i + 1;
          // 注册当日为 Day0：距今 >= N 天才有完整 Day N；今日及更近批次按未到期截断
          if (daysSince < dayN) return null;
          return v == null ? null : v;
        });
      }

      function aggregateUserLtvRows(rows, fullCols, visibleCols, tabKey) {
        const dimNames = [
          "注册日期",
          "首充日期",
          "来源渠道",
          "渠道名",
          "渠道账号",
          "所属平台",
        ];
        const dimCols = dimNames.filter((c) => visibleCols.includes(c));
        const countCol = tabKey === "ftd" ? "首充人数" : "批次注册人数";
        const countIdx = fullCols.indexOf(countCol);
        const dayIdxs = USER_LTV_DAY_LABELS.map((d) => fullCols.indexOf(d));
        const dimIdxs = dimCols.map((c) => fullCols.indexOf(c));
        const map = new Map();

        rows.forEach((row) => {
          const key = dimIdxs.map((i) => row[i]).join("||");
          if (!map.has(key)) {
            map.set(key, {
              dims: dimIdxs.map((i) => row[i]),
              count: 0,
              dayWeighted: dayIdxs.map(() => 0),
              dayWeight: dayIdxs.map(() => 0),
            });
          }
          const item = map.get(key);
          const weight = Number(row[countIdx]) || 0;
          item.count += weight;
          dayIdxs.forEach((di, j) => {
            const val = row[di];
            if (val == null || val === "-" || !Number.isFinite(Number(val))) return;
            item.dayWeighted[j] += Number(val) * weight;
            item.dayWeight[j] += weight;
          });
        });

        return [...map.values()].map((item) => {
          const full = fullCols.map(() => "-");
          dimIdxs.forEach((di, i) => {
            full[di] = item.dims[i];
          });
          if (countIdx >= 0) full[countIdx] = item.count;
          dayIdxs.forEach((di, j) => {
            if (!item.dayWeight[j]) {
              full[di] = "-";
              return;
            }
            full[di] = item.dayWeighted[j] / item.dayWeight[j];
          });
          return visibleCols.map((col) => full[fullCols.indexOf(col)]);
        });
      }

      /** 图表专用：仅开始日期对应注册批次，在当前渠道范围内聚合 */
      function getUserLtvChartCohorts() {
        const { source, name, account } = getPageChannelFilterState();
        const registerDate = getUserLtvChartRegisterDate();
        return buildUserLtvSampleCohorts(registerDate, registerDate)
          .filter((row) => {
            const sources = normalizeFilterValues(source);
            const names = normalizeFilterValues(name);
            const accounts = normalizeFilterValues(account);
            if (sources.length && !sources.includes(row.source)) return false;
            if (names.length && !names.includes(row.name)) return false;
            if (accounts.length && !accounts.includes(row.account))
              return false;
            return true;
          });
      }

      /** 将同日多渠道批次加权聚合为一条 Gross / Net 曲线 */
      function aggregateUserLtvSingleDayTrend(cohorts) {
        const dayCount = USER_LTV_DAY_LABELS.length;
        const isPresent = (v) =>
          v != null && v !== "" && v !== "-" && Number.isFinite(Number(v));
        const grossSum = Array(dayCount).fill(0);
        const grossWeight = Array(dayCount).fill(0);
        const netSum = Array(dayCount).fill(0);
        const netWeight = Array(dayCount).fill(0);
        let registerDate = "";

        cohorts.forEach((c) => {
          registerDate = registerDate || c.date;
          const weight = Number(c.registerCount) || 0;
          const gross = c.gross || [];
          const net = c.net || [];
          for (let i = 0; i < dayCount; i++) {
            if (isPresent(gross[i]) && weight > 0) {
              grossSum[i] += Number(gross[i]) * weight;
              grossWeight[i] += weight;
            }
            if (isPresent(net[i]) && weight > 0) {
              netSum[i] += Number(net[i]) * weight;
              netWeight[i] += weight;
            }
          }
        });

        return {
          date: registerDate || getUserLtvChartRegisterDate(),
          gross: grossWeight.map((w, i) => (w ? grossSum[i] / w : null)),
          net: netWeight.map((w, i) => (w ? netSum[i] / w : null)),
        };
      }

      function renderUserLtvTrendChart(opts = {}) {
        const dayLabels = USER_LTV_DAY_LABELS;
        const filterState = getPageChannelFilterState();
        const channelScope = getUserLtvChannelScopeLabel(filterState);
        const cohorts = getUserLtvChartCohorts();
        const trend = aggregateUserLtvSingleDayTrend(cohorts);
        const registerDate = trend.date;
        const isPresent = (v) =>
          v != null && v !== "" && v !== "-" && Number.isFinite(Number(v));

        const series = [
          {
            metricLabel: "Gross LTV",
            color: "#165DFF",
            data: trend.gross,
          },
          {
            metricLabel: "Net LTV",
            color: "#14C9C9",
            data: trend.net,
          },
        ];

        const hasData = series.some((s) => s.data.some(isPresent));
        const allVals = series.flatMap((s) =>
          s.data.filter(isPresent).map(Number),
        );
        const yAbsMax = Math.max(...allVals.map(Math.abs), 1);
        const yMin = allVals.length ? Math.min(...allVals, 0) : 0;
        const yMax = allVals.length ? Math.max(...allVals, 0) : yAbsMax;
        const padY = (yMax - yMin) * 0.12 || yAbsMax * 0.12;
        const axisMin = yMin < 0 ? yMin - padY : 0;
        const axisMax = yMax + padY;

        const W = 780,
          H = STANDARD_CHART_HEIGHT,
          padL = 58,
          padR = 24,
          padT = 28,
          padB = 36;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;
        const n = dayLabels.length;
        const xPos = (i) =>
          padL + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW);
        const yPos = (v) =>
          padT + plotH * (1 - (Number(v) - axisMin) / (axisMax - axisMin || 1));

        let grid = "",
          yLabels = "",
          xLabelsHtml = "";
        for (let i = 0; i <= 4; i++) {
          const val = axisMax - ((axisMax - axisMin) / 4) * i;
          const y = padT + (plotH / 4) * i;
          grid += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"></line>`;
          if (axisMin < 0 && Math.abs(val) < (axisMax - axisMin) * 0.02) {
            grid += `<line class="grid-line" x1="${padL}" y1="${yPos(0)}" x2="${W - padR}" y2="${yPos(0)}" stroke-dasharray="4 3"></line>`;
          }
          yLabels += `<text class="axis-label" x="${padL - 8}" y="${y + 4}" text-anchor="end">${formatUserLtvAxisValue(val)}</text>`;
        }
        dayLabels.forEach((lab, i) => {
          xLabelsHtml += `<text class="axis-label" x="${xPos(i)}" y="${H - 12}" text-anchor="middle">${lab.replace(" ", "")}</text>`;
        });

        const drawLine = (data, color) => {
          let html = "";
          let segment = [];
          const flush = () => {
            if (segment.length >= 2) {
              html += `<polyline fill="none" stroke="${color}" stroke-width="1.5" points="${segment.join(" ")}"></polyline>`;
            }
            segment = [];
          };
          data.forEach((v, i) => {
            if (!isPresent(v)) {
              flush();
              return;
            }
            segment.push(`${xPos(i)},${yPos(Number(v))}`);
          });
          flush();
          return html;
        };

        const linesHtml = series.map((s) => drawLine(s.data, s.color)).join("");
        const tipLabels = dayLabels.map(
          (d) =>
            `注册日期：${registerDate}<br/>渠道维度：${channelScope}<br/>生命周期：${d.replace(" ", "")}`,
        );
        const tipPoints = dayLabels.map((_, i) =>
          series
            .filter((s) => isPresent(s.data[i]))
            .map((s) => ({
              name: s.metricLabel,
              color: s.color,
              x: xPos(i),
              y: yPos(Number(s.data[i])),
              text: formatUserLtvTipValue(s.data[i]),
            })),
        );

        const legend = series
          .map(
            (s) =>
              `<span><i style="background:${s.color}"></i>${registerDate} · ${channelScope} · ${s.metricLabel}</span>`,
          )
          .join("");

        return renderStandardChartCard({
          key: opts.chartKey || "user-ltv-gross-net-trend",
          title: "Gross LTV与净入金LTV趋势分析",
          metrics: ["Gross LTV", "Net LTV"],
          titleTip:
            "以当前筛选日期范围的开始日期作为注册日期，展示该日期注册用户批次在当前渠道筛选条件下的 Gross LTV 与 Net LTV 生命周期累计变化趋势，X轴为用户生命周期（Day1-Day7），Y轴为平均用户价值。",
          expandable: false,
          body: `
            ${
              hasData
                ? `${renderComboChartWithTip(
                    `${grid}${linesHtml}${yLabels}${xLabelsHtml}`,
                    {
                      labels: tipLabels,
                      points: tipPoints,
                      layout: { W, H, padL, padR, padT, padB, xMode: "spread" },
                    },
                  )}
                <div class="line-legend">${legend}</div>`
                : `<div class="user-ltv-empty" style="border:none;padding:32px 12px">暂无图表数据</div>`
            }`,
        });
      }

      function renderUserLtvPageContent() {
        const tab = getUserLtvActiveTab();
        return `
          <div class="user-ltv-page" id="userLtvPage">
            ${renderUserLtvTabs(tab)}
            <div id="userLtvTableWrap">${renderUserLtvTable(tab)}</div>
            <section class="user-ltv-charts" aria-label="Gross LTV与净入金LTV趋势分析">
              ${renderUserLtvTrendChart({
                chartKey: "user-ltv-gross-net-trend",
              })}
            </section>
          </div>`;
      }

      function refreshUserLtvPage() {
        const root = document.getElementById("userLtvPage");
        if (!root) return;
        const parent = root.parentElement;
        if (!parent) return;
        parent.innerHTML = renderUserLtvPageContent();

      function initUserLtvPage() {
        const root = document.getElementById("userLtvPage");
        if (!root) return;
        root.querySelectorAll("[data-ltv-tab]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const tab = btn.dataset.ltvTab;

            if (tableWrap) tableWrap.innerHTML = renderUserLtvTable(tab);
            root.querySelectorAll("[data-ltv-tab]").forEach((el) => {

              el.classList.toggle("active", on);
              el.setAttribute("aria-selected", on ? "true" : "false");

        decorateChartZoomHints(root);
      }

      const LTV_COHORT_COLORS = [
        "#165DFF",
        "#14C9C9",
        "#F7BA1E",
        "#722ED1",
        "#00B42A",
        "#F5319D",
        "#FF7D00",
        "#3491FA",
      ];
      const LTV_DX_LABELS = ["D1", "D2", "D3", "D4", "D5", "D6", "D7"];

      function buildLtvCohortSeries(page) {
        const allCols = page.cols
          ? page.cols
          : page.groups
            ? page.groups.flatMap((g) => g.cols)
            : [];
        const d1Idx = allCols.indexOf("1日LTV");
        const ltvStart = d1Idx >= 0 ? d1Idx : 3;
        const years = new Set(
          page.sampleData.map((row) => String(row[0]).slice(0, 4)),
        );
        const crossYear = years.size > 1;
        return page.sampleData.map((row, idx) => {
          const ymd = String(row[0]);
          const dateLabel = crossYear ? ymd : ymd.slice(5);
          return {
            name: `${dateLabel} ${row[1]}`,
            data: row.slice(ltvStart, ltvStart + 7).map((v) => Number(v)),
            color: LTV_COHORT_COLORS[idx % LTV_COHORT_COLORS.length],
          };
        });
      }

      function formatChartTipNumber(v) {
        if (typeof v !== "number" || Number.isNaN(v)) return String(v);
        return Number.isInteger(v)
          ? v.toLocaleString("zh-CN")
          : v.toLocaleString("zh-CN", { maximumFractionDigits: 2 });
      }

      function renderComboChartWithTip(svgBody, tipPayload) {
        const { W, H, padL, padR, padT, padB, orient = "vertical" } =
          tipPayload.layout;
        const crosshair =
          orient === "horizontal"
            ? `<line class="chart-tip-crosshair" x1="${padL}" y1="0" x2="${W - padR}" y2="0" visibility="hidden"></line>`
            : `<line class="chart-tip-crosshair" x1="0" y1="${padT}" x2="0" y2="${H - padB}" visibility="hidden"></line>`;
        return `
        <div class="combo-chart has-chart-tip" data-chart-tip="${encodeURIComponent(JSON.stringify(tipPayload))}">
          <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
            ${svgBody}
            ${crosshair}
            <g class="chart-tip-marks"></g>
          </svg>
          <div class="rt-tooltip chart-svg-tooltip"></div>
        </div>`;
      }

      function bindSvgChartTooltips(root = document) {
        root.querySelectorAll(".has-chart-tip").forEach((wrap) => {
          if (wrap.dataset.tipBound === "1") return;
          wrap.dataset.tipBound = "1";
          const tipEl = wrap.querySelector(".chart-svg-tooltip");
          const svg = wrap.querySelector("svg");
          const crosshair = svg?.querySelector(".chart-tip-crosshair");
          const marks = svg?.querySelector(".chart-tip-marks");
          if (!tipEl || !svg || !crosshair || !marks) return;

          let payload;
          try {
            payload = JSON.parse(
              decodeURIComponent(wrap.dataset.chartTip || ""),
            );
          } catch {
            return;
          }
          const { labels = [], points = [], layout } = payload;
          if (!layout || !labels.length) return;
          const {
            W,
            H,
            padL,
            padR,
            padT,
            padB,
            xMode = "spread",
            yMode = "band",
            orient = "vertical",
          } = layout;
          const plotW = W - padL - padR;
          const plotH = H - padT - padB;
          const n = labels.length;
          const isHorizontal = orient === "horizontal";

          const xPos = (i) => {
            if (n === 1) return padL + plotW / 2;
            if (xMode === "band") {
              const step = plotW / n;
              return padL + step * i + step / 2;
            }
            return padL + (i / (n - 1)) * plotW;
          };

          const yPos = (i) => {
            if (n === 1) return padT + plotH / 2;
            if (yMode === "band") {
              const step = plotH / n;
              return padT + step * i + step / 2;
            }
            return padT + (i / (n - 1)) * plotH;
          };

          const idxFromX = (svgX) => {
            if (n <= 1) return 0;
            if (xMode === "band") {
              const step = plotW / n;
              return Math.max(
                0,
                Math.min(n - 1, Math.floor((svgX - padL) / step)),
              );
            }
            const t = (svgX - padL) / plotW;
            return Math.max(0, Math.min(n - 1, Math.round(t * (n - 1))));
          };

          const idxFromY = (svgY) => {
            if (n <= 1) return 0;
            if (yMode === "band") {
              const step = plotH / n;
              return Math.max(
                0,
                Math.min(n - 1, Math.floor((svgY - padT) / step)),
              );
            }
            const t = (svgY - padT) / plotH;
            return Math.max(0, Math.min(n - 1, Math.round(t * (n - 1))));
          };

          const toSvgPoint = (clientX, clientY) => {
            const pt = svg.createSVGPoint();
            pt.x = clientX;
            pt.y = clientY;
            const ctm = svg.getScreenCTM();
            if (!ctm) return null;
            return pt.matrixTransform(ctm.inverse());
          };

          const hideTip = () => {
            tipEl.style.display = "none";
            crosshair.setAttribute("visibility", "hidden");
            marks.innerHTML = "";
          };

          wrap.addEventListener("mousemove", (e) => {
            const p = toSvgPoint(e.clientX, e.clientY);
            if (!p) return;
            if (p.x < padL || p.x > W - padR || p.y < padT || p.y > H - padB) {
              hideTip();
              return;
            }
            const i = isHorizontal ? idxFromY(p.y) : idxFromX(p.x);
            const cx = isHorizontal ? padL + plotW / 2 : xPos(i);
            const cy = isHorizontal ? yPos(i) : padT + plotH / 2;
            const dayPoints = points[i] || [];
            if (isHorizontal) {
              crosshair.setAttribute("y1", cy);
              crosshair.setAttribute("y2", cy);
            } else {
              crosshair.setAttribute("x1", cx);
              crosshair.setAttribute("x2", cx);
            }
            crosshair.setAttribute("visibility", "visible");
            marks.innerHTML = dayPoints
              .map(
                (d) =>
                  `<circle cx="${d.x}" cy="${d.y}" r="2.5" fill="#fff" stroke="${d.color}" stroke-width="1.5"></circle>`,
              )
              .join("");
            tipEl.innerHTML = `<div class="rt-tip-time">${labels[i]}</div>${
              dayPoints.length
                ? dayPoints
                    .map(
                      (d) =>
                        `<div class="rt-tip-row"><span class="rt-tip-dot" style="background:${d.color}"></span>${d.name}：${d.text}</div>`,
                    )
                    .join("")
                : `<div class="rt-tip-row">暂无数据</div>`
            }`;
            tipEl.style.display = "block";
            tipEl.style.transform = "none";
            const wrapRect = wrap.getBoundingClientRect();
            const svgRect = svg.getBoundingClientRect();
            const tipW = tipEl.offsetWidth || 180;
            const tipH = tipEl.offsetHeight || 140;
            const anchorX = isHorizontal
              ? svgRect.left -
                wrapRect.left +
                ((dayPoints[0]?.x || cx) / W) * svgRect.width
              : svgRect.left - wrapRect.left + (cx / W) * svgRect.width;
            const anchorY = isHorizontal
              ? svgRect.top - wrapRect.top + (cy / H) * svgRect.height
              : svgRect.top - wrapRect.top + (padT / H) * svgRect.height + 8;

            // 优先锚点右侧；不够则左侧；垂直尽量完整可见（容器允许 overflow）
            let tipX = anchorX + 14;
            if (tipX + tipW > wrapRect.width - 8) {
              tipX = anchorX - tipW - 14;
            }
            if (tipX < 8) tipX = 8;
            if (tipX + tipW > wrapRect.width - 8) {
              tipX = Math.max(8, wrapRect.width - tipW - 8);
            }

            let tipY = anchorY;
            if (tipY + tipH > wrapRect.height - 8) {
              tipY = Math.max(8, wrapRect.height - tipH - 8);
            }
            if (tipY < 8) tipY = 8;
            // 内容高于容器时仍从顶部完整展开（依赖 overflow:visible）
            if (tipH > wrapRect.height - 16) tipY = 8;

            tipEl.style.left = `${tipX}px`;
            tipEl.style.top = `${tipY}px`;
          });

          wrap.addEventListener("mouseleave", hideTip);
        });
      }

      function renderMultiLineTrendChart({
        labels,
        series,
        maxVal,
        minVal = 0,
        yStep,
        xLabelStep = 1,
        showDots = false,
        height = 260,
        formatY,
      }) {
        const W = 620,
          H = height,
          padL = formatY ? 64 : 52,
          padR = 16,
          padT = 20,
          padB = 32;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;
        const n = labels.length;
        const axisMin = Number(minVal) || 0;
        const axisMax = Math.max(axisMin + 1, Number(maxVal) || 100);
        const axisSpan = axisMax - axisMin;
        const step = yStep || axisSpan / 4;
        const xPos = (i) =>
          padL + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW);
        const yPos = (v) => padT + plotH * (1 - (v - axisMin) / axisSpan);
        const fmtAxis = (v) =>
          typeof formatY === "function"
            ? formatY(v)
            : Number.isInteger(v)
              ? v.toLocaleString("zh-CN")
              : v.toFixed(1);

        let grid = "",
          yLabels = "",
          xLabels = "";
        for (let v = axisMin; v <= axisMax + 1e-9; v += step) {
          const y = yPos(v);
          grid += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"></line>`;
          yLabels += `<text class="funnel-axis" x="${padL - 8}" y="${y + 4}" text-anchor="end">${fmtAxis(v)}</text>`;
        }
        labels.forEach((lab, i) => {
          if (i % xLabelStep !== 0 && i !== n - 1) return;
          xLabels += `<text class="funnel-axis" x="${xPos(i)}" y="${H - 8}" text-anchor="middle">${lab}</text>`;
        });

        let polylines = "";
        series.forEach((s) => {
          const pts = s.data.map((v, i) => `${xPos(i)},${yPos(v)}`).join(" ");
          polylines += `<polyline fill="none" stroke="${s.color}" stroke-width="1.5" points="${pts}"></polyline>`;
        });

        const tipPoints = labels.map((_, i) =>
          series.map((s) => ({
            name: s.name,
            color: s.color,
            x: xPos(i),
            y: yPos(s.data[i]),
            text:
              (typeof s.formatTip === "function"
                ? s.formatTip(s.data[i])
                : formatChartTipNumber(s.data[i])) +
              (s.suffix != null ? s.suffix : ""),
          })),
        );

        const legend = series
          .map(
            (s) =>
              `<span><i style="background:${s.color}"></i>${s.name}</span>`,
          )
          .join("");

        return `
        ${renderComboChartWithTip(
          `${grid}${polylines}${yLabels}${xLabels}`,
          {
            labels,
            points: tipPoints,
            layout: { W, H, padL, padR, padT, padB, xMode: "spread" },
          },
        )}
        <div class="line-legend">${legend}</div>`;
      }

      function getLtvHeatmapSourceRows(page) {
        const { start, end } = getOverviewFilterRange();
        const { source, name, account } = getPageChannelFilterState();
        const templates = page.sampleData || [];
        const channelFiltered = filterRowsByChannel(
          templates,
          source,
          name,
          1,
          2,
          account,
          3,
        );
        const matched = channelFiltered.filter((row) => {
          const d = String(row[0] || "");
          return d >= start && d <= end;
        });
        if (matched.length) {
          return matched
            .slice()
            .sort((a, b) => String(b[0]).localeCompare(String(a[0])));
        }
        const dates = eachDateInclusive(start, end).reverse();
        if (!templates.length) return [];
        const pool = channelFiltered.length
          ? channelFiltered
          : !isAllSourceChannel(source)
            ? templates.filter((row) => row[1] === source)
            : templates;
        if (!pool.length) return [];
        const channelFactor = channelFilterScale({ source, name });
        const channelNames = !isAllSourceChannel(source)
          ? CHANNEL_NAME_MAP[source] || []
          : [];
        return dates.map((ymd, i) => {
          const tpl = pool[i % pool.length];
          const next = tpl.slice();
          next[0] = ymd;
          if (!isAllSourceChannel(source)) {
            next[1] = source;
            if (name) {
              next[2] = name;
            } else if (channelNames.length) {
              next[2] = channelNames[i % channelNames.length];
            }
          }
          const dateFactor = 0.92 + ((i * 7) % 17) / 100;
          const factor = channelFiltered.length ? dateFactor : dateFactor * channelFactor;
          for (let c = 4; c < next.length; c++) {
            const n = Number(next[c]);
            if (Number.isFinite(n)) {
              next[c] =
                c === 4 ? Math.round(n * factor) : +(n * factor).toFixed(1);
            }
          }
          return next;
        });
      }

      function getLtvHeatmapSubtitleText(start, end) {
        const { source, name, account } = getPageChannelFilterState();
        const timePart =
          start === end
            ? `注册日期 ${start}`
            : `注册日期 ${start} 至 ${end}`;
        let channelPart = "";
        const dim = getChannelAnalysisDimension({ source, name, account });
        if (dim === "account") {
          channelPart = account
            ? `，渠道账号「${source} / ${name} / ${account}」`
            : `，渠道账号「${source} / ${name}」`;
        } else if (dim === "name") {
          channelPart = `，渠道名「${source} / ${name}」`;
        } else if (!isAllSourceChannel(source)) {
          channelPart = `，来源渠道「${source}」`;
        }
        return `${timePart}${channelPart} 的 D1 ~ D7 LTV 分布，颜色越深表示 LTV 越高`;
      }

      function buildLtvHeatmapPayload(page) {
        const allCols = page.cols
          ? page.cols
          : page.groups
            ? page.groups.flatMap((g) => g.cols)
            : [];
        const d1Idx = allCols.indexOf("1日LTV");
        const ltvStart = d1Idx >= 0 ? d1Idx : 5;
        const userIdx = allCols.indexOf("用户数");
        const xLabels = LTV_DX_LABELS;
        const rows = getLtvHeatmapSourceRows(page);
        const years = new Set(rows.map((row) => String(row[0]).slice(0, 4)));
        const crossYear = years.size > 1;
        const yLabels = [];
        const data = [];
        let maxVal = 0;
        rows.forEach((row, yi) => {
          const ymd = String(row[0]);
          const dateLabel = crossYear ? ymd : ymd.slice(5);
          const source = row[1] || "";
          const channelName = row[2] || "";
          const yTag = channelName || source;
          const userCount = userIdx >= 0 ? Number(row[userIdx]) : Number(row[4]);

      function parsePercentValue(raw) {
        if (typeof raw === "number") return raw;
        const n = Number(String(raw || "").replace("%", "").trim());
        return Number.isFinite(n) ? n : 0;

      function getRetentionUserHeatmapSourceRows(page) {
        const { start, end } = getOverviewFilterRange();
        const templates = page.sampleData || [];
        const matched = templates.filter((row) => {
          const d = String(row[0] || "");
          return d >= start && d <= end;
        });
        if (matched.length) {
          return matched.slice().sort((a, b) => String(b[0]).localeCompare(String(a[0])));
        }
        const dates = eachDateInclusive(start, end).reverse();
        if (!templates.length) return [];
        return dates.map((ymd, i) => {
          const tpl = templates[i % templates.length];
          const factor = 0.96 + ((i * 5) % 9) / 100;
          const next = tpl.slice();
          next[0] = ymd;
          for (let c = 3; c < next.length; c++) {
            const n = parsePercentValue(next[c]);
            next[c] = `${(n * factor).toFixed(1)}%`;
          }
          return next;
        });
      }

      function renderDualAxisTrendChart({
        labels,
        leftSeries,
        rightSeries,
        leftMin = 0,
        leftMax,
        rightMax,
        leftStep,
        formatLeft,
        formatRight,
      }) {
        const W = 620,
          H = 200,
          padL = 52,
          padR = 56,
          padT = 20,
          padB = 32;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;
        const leftRange = leftMax - leftMin;
        const n = labels.length;
        const xPos = (i) =>
          padL + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW);
        const yLeft = (v) => padT + plotH * (1 - (v - leftMin) / leftRange);
        const yRight = (v) => padT + plotH * (1 - v / rightMax);
        const fmtLeft =
          formatLeft ||
          ((v) =>
            Number.isInteger(v) ? v.toLocaleString("zh-CN") : v.toFixed(1));
        const fmtRight = formatRight || fmtLeft;

        let grid = "",
          leftAxis = "",
          rightAxis = "";
        if (leftStep) {
          for (let v = leftMin; v <= leftMax; v += leftStep) {
            const y = yLeft(v);
            grid += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"></line>`;
            leftAxis += `<text class="axis-label" x="${padL - 8}" y="${y + 3}" text-anchor="end">${fmtLeft(v)}</text>`;
            const rightVal = rightMax * ((v - leftMin) / leftRange);
            rightAxis += `<text class="axis-label" x="${W - padR + 8}" y="${y + 3}" text-anchor="start">${fmtRight(rightVal)}</text>`;
          }
        } else {
          for (let i = 0; i <= 4; i++) {
            const y = padT + (plotH / 4) * i;
            const leftVal = leftMax - (leftRange / 4) * i;
            grid += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"></line>`;
            leftAxis += `<text class="axis-label" x="${padL - 8}" y="${y + 3}" text-anchor="end">${fmtLeft(leftVal)}</text>`;
            rightAxis += `<text class="axis-label" x="${W - padR + 8}" y="${y + 3}" text-anchor="start">${fmtRight(rightMax - (rightMax / 4) * i)}</text>`;
          }
        }

        const drawLine = (series, yFn) => {
          const pts = series.data
            .map((v, i) => `${xPos(i)},${yFn(v)}`)
            .join(" ");
          return `<polyline fill="none" stroke="${series.color}" stroke-width="1.5" points="${pts}"></polyline>`;
        };

        let xLabels = "";
        labels.forEach((lab, i) => {
          if (i % 5 === 0 || i === n - 1) {
            xLabels += `<text class="axis-label" x="${xPos(i)}" y="${H - 8}" text-anchor="middle">${lab}</text>`;
          }
        });

        const legend = [leftSeries, rightSeries]
          .map(
            (s) =>
              `<span><i style="background:${s.color}"></i>${s.name}</span>`,
          )
          .join("");

        const tipPoints = labels.map((_, i) => [
          {
            name: leftSeries.name,
            color: leftSeries.color,
            x: xPos(i),
            y: yLeft(leftSeries.data[i]),
            text: fmtLeft(leftSeries.data[i]),
          },
          {
            name: rightSeries.name,
            color: rightSeries.color,
            x: xPos(i),
            y: yRight(rightSeries.data[i]),
            text: fmtRight(rightSeries.data[i]),
          },
        ]);

        return `
        ${renderComboChartWithTip(
          `${grid}${drawLine(leftSeries, yLeft)}${drawLine(rightSeries, yRight)}${leftAxis}${rightAxis}${xLabels}`,
          {
            labels,
            points: tipPoints,
            layout: { W, H, padL, padR, padT, padB, xMode: "spread" },
          },
        )}
        <div class="line-legend">${legend}</div>`;
      }

      function hashSeed(str) {
        let h = 2166136261;
        for (let i = 0; i < str.length; i++) {
          h ^= str.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return h >>> 0;
      }

      function buildCumRechargeDayTierMetrics(dateStr, tier) {
        const seed = hashSeed(`${dateStr}|${tier}`);
        const wave = ((seed % 1000) / 1000 - 0.5) * 0.12;
        const dayFactor =
          0.92 + ((hashSeed(dateStr) % 1000) / 1000) * 0.16;
        const totalUsers = Math.round(12600 * dayFactor);
        const weight = Math.max(
          0.02,
          (CUM_RECHARGE_TIER_WEIGHT[tier] || 0.1) * (1 + wave),
        );
        const users = Math.max(1, Math.round(totalUsers * weight));
        const userShare = (users / totalUsers) * 100;
        const avgAmt = CUM_RECHARGE_TIER_AVG_AMT[tier] || 1000;
        const amount = Math.round(users * avgAmt * (0.96 + (seed % 80) / 1000));
        const totalAmount = Math.round(totalUsers * 3850 * dayFactor);
        const amountShare = totalAmount > 0 ? (amount / totalAmount) * 100 : 0;
        return {
          users,
          userShare,
          amount,
          amountShare,
        };
      }

      function getUserRetentionSegmentScale(segment) {
        const map = {
          提现用户: 0.94,
          首提用户: 0.9,
          首充用户: 1,
          活跃用户: 1.06,
          老用户: 0.97,
          新用户: 0.86,
        };
        return map[segment] || 1;
      }

      function applyRetentionSegmentToRows(rows, segment, dimColCount = 5) {
        const scale = getUserRetentionSegmentScale(segment);
        if (scale === 1) return rows.map((row) => row.slice());
        return rows.map((row) =>
          row.map((cell, i) => {
            if (i < dimColCount) return cell;
            if (typeof cell === "string" && cell.includes("%")) {
              const n = parseFloat(cell);
              if (!Number.isFinite(n)) return cell;
              return `${(n * scale).toFixed(1)}%`;
            }
            return cell;
          }),
        );
      }

        return buildChannelHierarchyTableView(

            hierarchySampleData: scaled,
          },
          filterState,
        );

      function renderRechargePyramidChart(items) {
        const source = items || CONVERSION_MULTI_RECHARGE_SAMPLE;
        // 正三角形：顶部 10次以上（窄），底部 1次（宽）
        const list = [...source].reverse();
        const n = Math.max(list.length, 1);
        const maxUsers = Math.max(
          ...list.map((row) => Number(row[1]) || 0),
          1,
        );
        // 金字塔配色（倒置）：1次最深 → 次数越高越浅
        const accents = [
          "#caf0f8",
          "#ade8f4",
          "#90e0ef",
          "#48cae4",
          "#00b4d8",
          "#0096c7",
          "#0077b6",
          "#023e8a",
          "#03045e",
        ];
        const levelColorIdx = (levelIdx) =>
          Math.min(Math.max(levelIdx, 0), accents.length - 1);
        return `
          <div class="recharge-funnel" aria-label="多次复充金字塔分布">
            ${list
              .map((row, i) => {
                const usersRaw = row[1];
                const users = Number(usersRaw);
                const isEmpty =
                  usersRaw == null ||
                  usersRaw === "" ||
                  !Number.isFinite(users) ||
                  users <= 0;
                const pct = isEmpty ? "-" : formatPercent(row[2]);
                const avgAmount = isEmpty ? "-" : formatNumber(row[3]);
                const totalAmount = isEmpty ? "-" : formatNumber(row[4]);
                const usersText = isEmpty ? "暂无数据" : users.toLocaleString("zh-CN");
                // levelIdx：0=1次，越大次数越高；配色倒置后顶部浅、底部深
                const levelIdx = n - 1 - i;
                const colorIdx = levelColorIdx(
                  accents.length - 1 - Math.min(levelIdx, accents.length - 1),
                );
                const upperColorIdx = levelColorIdx(
                  accents.length -
                    1 -
                    Math.min(levelIdx + 1, accents.length - 1),
                );
                const accent = accents[colorIdx];
                const gradient = `linear-gradient(180deg, ${accents[upperColorIdx]} 0%, ${accent} 100%)`;
                // 正三角形阶梯：自上而下递增宽度；用户数微调；空状态保持层级宽度
                const userScale = isEmpty ? 0.35 : Math.sqrt(users / maxUsers);
                const topBase = 16 + (i / n) * 84;
                const botBase = 16 + ((i + 1) / n) * 84;
                const topW = Math.max(12, topBase * (0.72 + 0.28 * userScale));
                const botW = Math.max(14, botBase * (0.72 + 0.28 * userScale));
                const leftTop = ((100 - topW) / 2).toFixed(2);
                const rightTop = ((100 + topW) / 2).toFixed(2);
                const leftBot = ((100 - botW) / 2).toFixed(2);
                const rightBot = ((100 + botW) / 2).toFixed(2);
                // 浅色层用更深描边/引导，保证可读性
                const guideColor = isEmpty
                  ? "#c9cdd4"
                  : colorIdx <= 2
                    ? "#0077b6"
                    : accent;
                const tipPayload = encodeURIComponent(
                  JSON.stringify({
                    title: `${row[0]}复充用户群`,
                    times: row[0],
                    users: isEmpty ? "-" : users.toLocaleString("zh-CN"),
                    ratio: pct,
                    avg: avgAmount,
                    total: totalAmount,
                    empty: isEmpty,
                  }),
                );
                return `
                  <div class="recharge-funnel-row${isEmpty ? " is-empty" : ""}" data-funnel-tip="${tipPayload}">
                    <div class="recharge-funnel-left">
                      <div class="recharge-funnel-left-text">
                        <strong>${row[0]}</strong>
                        <span>${isEmpty ? "暂无数据" : `人均充值金额 ${avgAmount}`}</span>
                      </div>
                      <div class="recharge-funnel-leader">
                        <span class="line" style="background:${guideColor}"></span>
                        <span class="dot" style="background:${guideColor}"></span>
                      </div>
                    </div>
                    <div class="recharge-funnel-band-wrap">
                      <div
                        class="recharge-funnel-band"
                        style="${isEmpty ? "" : `background:${gradient};`}clip-path:polygon(${leftTop}% 0, ${rightTop}% 0, ${rightBot}% 100%, ${leftBot}% 100%)"
                      ></div>
                    </div>
                    <div class="recharge-funnel-right">
                      <div class="recharge-funnel-box" style="border-color:${guideColor}">
                        <strong>${usersText}</strong>
                        <div class="meta">
                          <span>用户数</span>
                          <span>${pct}</span>
                        </div>
                      </div>
                    </div>
                  </div>`;
              })
              .join("")}
            <div class="recharge-funnel-tip" role="tooltip"></div>
          </div>`;
      }

      function bindRechargePyramidTooltip(root = document) {
        root.querySelectorAll(".recharge-funnel").forEach((funnel) => {
          if (funnel.dataset.tipBound === "1") return;
          funnel.dataset.tipBound = "1";
          const tipEl = funnel.querySelector(".recharge-funnel-tip");
          if (!tipEl) return;
          const rows = () =>
            [...funnel.querySelectorAll(".recharge-funnel-row[data-funnel-tip]")];

          const hideTip = () => {
            funnel.classList.remove("is-hovering");
            rows().forEach((row) => row.classList.remove("is-active"));
            tipEl.style.display = "none";
          };

          const showTip = (row, clientX, clientY) => {
            let payload = null;
            try {
              payload = JSON.parse(
                decodeURIComponent(row.dataset.funnelTip || ""),
              );
            } catch (e) {
              payload = null;
            }
            if (!payload) {
              hideTip();
              return;
            }
            funnel.classList.add("is-hovering");
            rows().forEach((r) =>
              r.classList.toggle("is-active", r === row),
            );
            tipEl.classList.toggle("is-empty", !!payload.empty);
            tipEl.innerHTML = payload.empty
              ? `
              <div class="tip-title">${payload.title || `${payload.times}复充用户群`}</div>
              <div class="tip-empty">暂无该层级复充用户数据</div>`
              : `
              <div class="tip-title">${payload.title || `${payload.times}复充用户群`}</div>
              <div class="tip-row"><span>充值次数</span><span>${payload.times}</span></div>
              <div class="tip-row"><span>用户数</span><span>${payload.users}</span></div>
              <div class="tip-row"><span>用户占比</span><span>${payload.ratio}</span></div>
              <div class="tip-row"><span>人均充值金额</span><span>${payload.avg}</span></div>
              <div class="tip-row"><span>总充值金额</span><span>${payload.total}</span></div>`;
            tipEl.style.display = "block";
            const funnelRect = funnel.getBoundingClientRect();
            const tipW = tipEl.offsetWidth || 180;
            const tipH = tipEl.offsetHeight || 140;
            let left = clientX - funnelRect.left + 14;
            let top = clientY - funnelRect.top - tipH - 10;
            if (left + tipW > funnelRect.width - 8) {
              left = Math.max(8, clientX - funnelRect.left - tipW - 14);
            }
            if (top < 8) {
              top = clientY - funnelRect.top + 16;
            }
            tipEl.style.left = `${left}px`;
            tipEl.style.top = `${top}px`;
          };

          funnel.addEventListener("mousemove", (e) => {
            const row = e.target.closest(".recharge-funnel-row[data-funnel-tip]");
            if (!row || !funnel.contains(row)) {
              hideTip();
              return;
            }
            showTip(row, e.clientX, e.clientY);
          });
          funnel.addEventListener("mouseleave", hideTip);
        });
      }

      function renderConversionOverviewTrendChart(dayCount = 7, endDate) {
        // 选择当天（起止同一天）：X 轴按每 30 分钟展示；多日仍按天
        const isIntraday = dayCount <= 1;
        const pointCount = isIntraday ? 48 : Math.max(1, dayCount);
        const labels = isIntraday
          ? buildHalfHourAxisLabels(pointCount)
          : buildTrendLabelsBeforeEnd(dayCount, endDate);
        const factor = channelFilterScale(getPageChannelFilterState());
        // 单日假数据按半小时粒度缩放，保证折线连续完整
        const rechargeAmount = genTrendSeries(
          pointCount,
          isIntraday ? 12000 : 780000,
          isIntraday ? 28500 : 985600,
          isIntraday ? 3200 : 22000,
        ).map((v) => Math.round(v * factor));
        const withdrawAmount = genTrendSeries(
          pointCount,
          isIntraday ? 6800 : 420000,
          isIntraday ? 16200 : 512300,
          isIntraday ? 2100 : 16000,
        ).map((v) => Math.round(v * factor));
        const rechargeUsers = genTrendSeries(
          pointCount,
          isIntraday ? 42 : 2680,
          isIntraday ? 96 : 3280,
          isIntraday ? 8 : 80,
        ).map((v) => Math.round(v * factor));
        const withdrawUsers = genTrendSeries(
          pointCount,
          isIntraday ? 18 : 1420,
          isIntraday ? 52 : 1860,
          isIntraday ? 5 : 55,
        ).map((v) => Math.round(v * factor));

        // 假数据补齐完整序列，保证折线连续（业务空值规则仍按 0 连续；null 断线仅留给真实接口异常）
        const isPresent = (v) =>
          v != null && v !== "" && Number.isFinite(Number(v));
        const finiteVals = (...arrays) =>
          arrays.flat().filter(isPresent).map(Number);
        const leftVals = finiteVals(rechargeAmount, withdrawAmount);
        const rightVals = finiteVals(rechargeUsers, withdrawUsers);
        const leftMax = (Math.max(...leftVals, 1) || 1) * 1.08;
        const rightMax = (Math.max(...rightVals, 1) || 1) * 1.15;
        const fmtMoney = (v) =>
          v >= 10000
            ? `${(v / 10000).toFixed(v >= 100000 ? 0 : 1)}万`
            : Math.round(v).toLocaleString("zh-CN");

        const W = 780,
          H = STANDARD_CHART_HEIGHT,
          padL = 64,
          padR = 56,
          padT = 28,
          padB = 36;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;
        const n = labels.length;
        const xPos = (i) =>
          padL + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW);
        const yLeft = (v) => padT + plotH * (1 - v / leftMax);
        const yRight = (v) => padT + plotH * (1 - v / rightMax);
        // 半小时轴：刻度每 2 小时显示一次，避免挤在一起
        const xLabelStep = isIntraday
          ? 4
          : dayCount <= 7
            ? 1
            : dayCount <= 30
              ? 5
              : 10;

        let grid = "",
          leftAxis = "",
          rightAxis = "",
          xLabels = "";
        for (let i = 0; i <= 4; i++) {
          const y = padT + (plotH / 4) * i;
          grid += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"></line>`;
          leftAxis += `<text class="axis-label" x="${padL - 8}" y="${y + 4}" text-anchor="end">${fmtMoney(leftMax - (leftMax / 4) * i)}</text>`;
          rightAxis += `<text class="axis-label" x="${W - padR + 8}" y="${y + 4}" text-anchor="start">${Math.round(rightMax - (rightMax / 4) * i).toLocaleString("zh-CN")}</text>`;
        }
        labels.forEach((lab, i) => {
          if (i % xLabelStep !== 0 && i !== n - 1) return;
          xLabels += `<text class="axis-label" x="${xPos(i)}" y="${H - 12}" text-anchor="middle">${lab}</text>`;
        });

        // 有效点（含 0）连续连接；未返回值断开；默认不画点，悬浮时展示标记
        const drawLineSegments = (data, color, yFn) => {
          let html = "";
          let segment = [];
          const flush = () => {
            if (segment.length >= 2) {
              html += `<polyline fill="none" stroke="${color}" stroke-width="1.5" points="${segment.join(" ")}"></polyline>`;
            }
            segment = [];
          };
          data.forEach((v, i) => {
            if (!isPresent(v)) {
              flush();
              return;
            }
            segment.push(`${xPos(i)},${yFn(Number(v))}`);
          });
          flush();
          return html;
        };

        const seriesMeta = [
          {
            name: "充值金额",
            color: "#165DFF",
            data: rechargeAmount,
            yFn: yLeft,
            formatTip: fmtMoney,
          },
          {
            name: "提现金额",
            color: "#14C9C9",
            data: withdrawAmount,
            yFn: yLeft,
            formatTip: fmtMoney,
          },
          {
            name: "充值人数",
            color: "#F7BA1E",
            data: rechargeUsers,
            yFn: yRight,
            formatTip: (v) => Math.round(v).toLocaleString("zh-CN"),
          },
          {
            name: "提现人数",
            color: "#722ED1",
            data: withdrawUsers,
            yFn: yRight,
            formatTip: (v) => Math.round(v).toLocaleString("zh-CN"),
          },
        ];

        const tipPoints = labels.map((_, i) =>
          seriesMeta
            .filter((s) => isPresent(s.data[i]))
            .map((s) => ({
              name: s.name,
              color: s.color,
              x: xPos(i),
              y: s.yFn(Number(s.data[i])),
              text: s.formatTip(Number(s.data[i])),
            })),
        );

        const linesHtml = seriesMeta
          .map((s) => drawLineSegments(s.data, s.color, s.yFn))
          .join("");
        const legend = seriesMeta
          .map(
            (s) =>
              `<span><i style="background:${s.color}"></i>${s.name}</span>`,
          )
          .join("");

        return `
        ${renderComboChartWithTip(
          `${grid}${linesHtml}${leftAxis}${rightAxis}${xLabels}`,
          {
            labels,
            points: tipPoints,
            layout: { W, H, padL, padR, padT, padB, xMode: "spread" },
          },
        )}
        <div class="line-legend">${legend}</div>`;
      }

      function formatNewOldCompareValue(val, format = "number") {
        const n = Number(val) || 0;
        if (format === "money") {
          if (n >= 10000) {
            const wan = n / 10000;
            return `${wan.toLocaleString("zh-CN", {
              maximumFractionDigits: wan >= 100 ? 0 : 1,
            })}万`;
          }
          return Math.round(n).toLocaleString("zh-CN");
        }
        if (format === "decimal") {
          return n.toLocaleString("zh-CN", {
            minimumFractionDigits: 1,
            maximumFractionDigits: 1,
          });
        }
        return Math.round(n).toLocaleString("zh-CN");
      }

      function renderWithdrawRechargeRetentionTrendChart(
        dayCount = 7,
        endDate,
      ) {
        const isIntraday = dayCount <= 1;
        const pointCount = isIntraday ? 48 : Math.max(1, dayCount);
        const labels = isIntraday
          ? buildHalfHourAxisLabels(pointCount)
          : buildTrendLabelsBeforeEnd(dayCount, endDate);

        const allSeries = WITHDRAW_RETENTION_CHART_SERIES_DEFS.map((def) => ({
          ...def,
          data: genTrendSeries(
            pointCount,
            def.start,
            def.end,
            def.wave,
            2,
          ),
        }));
        const selectedKeys = getWithdrawRetentionChartSelectedKeys();
        const selectedSet = new Set(selectedKeys);
        const seriesMeta = allSeries.filter((s) => selectedSet.has(s.key));
        const withdrawUsers = genTrendSeries(
          pointCount,
          isIntraday ? 18 : 680,
          isIntraday ? 42 : 860,
          isIntraday ? 4 : 40,
        );

        const isPresent = (v) =>
          v != null && v !== "" && Number.isFinite(Number(v));
        const finiteVals = (...arrays) =>
          arrays.flat().filter(isPresent).map(Number);
        const yMax =
          Math.max(
            ...finiteVals(...seriesMeta.map((s) => s.data)),
            1,
          ) * 1.15;

        const W = 780,
          H = STANDARD_CHART_HEIGHT,
          padL = 48,
          padR = 24,
          padT = 28,
          padB = 36;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;
        const n = labels.length;
        const seriesCount = Math.max(seriesMeta.length, 1);
        const slotW = n <= 0 ? plotW : plotW / n;
        const innerGap = 2;
        const barW = Math.max(
          3,
          Math.min(
            16,
            (slotW - 10 - innerGap * (seriesCount - 1)) / seriesCount,
          ),
        );
        const groupInnerW =
          seriesCount * barW + Math.max(0, seriesCount - 1) * innerGap;
        const groupCenter = (i) =>
          padL + (n === 1 ? plotW / 2 : slotW * i + slotW / 2);
        const barX = (i, sIdx) =>
          groupCenter(i) - groupInnerW / 2 + sIdx * (barW + innerGap);
        const yPos = (v) => padT + plotH * (1 - Number(v) / (yMax || 1));
        const barHeight = (v) => (plotH * Number(v)) / (yMax || 1);
        const xLabelStep = isIntraday
          ? 4
          : dayCount <= 7
            ? 1
            : dayCount <= 30
              ? 5
              : 10;

        let grid = "",
          yLabels = "",
          xLabelsHtml = "";
        for (let i = 0; i <= 4; i++) {
          const y = padT + (plotH / 4) * i;
          const val = yMax - (yMax / 4) * i;
          grid += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"></line>`;
          yLabels += `<text class="axis-label" x="${padL - 8}" y="${y + 4}" text-anchor="end">${val.toFixed(1)}%</text>`;
        }
        labels.forEach((lab, i) => {
          if (i % xLabelStep !== 0 && i !== n - 1) return;
          xLabelsHtml += `<text class="axis-label" x="${groupCenter(i)}" y="${H - 12}" text-anchor="middle">${lab}</text>`;
        });

        let barsHtml = "";
        labels.forEach((_, i) => {
          seriesMeta.forEach((s, sIdx) => {
            if (!isPresent(s.data[i])) return;
            const h = barHeight(s.data[i]);
            const y = padT + plotH - h;
            const x = barX(i, sIdx);
            barsHtml += `<rect class="wr-series-bar" data-series-key="${s.key}" x="${x}" y="${y}" width="${barW}" height="${Math.max(h, 0)}" rx="2" fill="${s.color}"></rect>`;
          });
        });

        const channelScope = getPageChannelScopeLabel();

        // tip：各留存率柱顶；提现日期 / 渠道维度 / 提现人数写入标题行
        const tipPoints = labels.map((_, i) =>
          seriesMeta
            .filter((s) => isPresent(s.data[i]))
            .map((s, sIdx) => ({
              name: s.name,
              color: s.color,
              x: barX(i, sIdx) + barW / 2,
              y: yPos(Number(s.data[i])),
              text: formatPercent(s.data[i]),
            })),
        );

        const tipLabels = (() => {
          const fullDates = isIntraday
            ? labels.map((t) => {
                const end = endDate instanceof Date ? endDate : new Date();
                const y = end.getFullYear();
                const m = String(end.getMonth() + 1).padStart(2, "0");
                const d = String(end.getDate()).padStart(2, "0");
                return `${y}-${m}-${d} ${t}`;
              })
            : (() => {
                const dates = [];
                for (let i = dayCount - 1; i >= 0; i--) {
                  const d = new Date(endDate);
                  d.setDate(d.getDate() - i);
                  dates.push(d);
                }
                return dates.map(
                  (d) =>
                    `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`,
                );
              })();
          return fullDates.map((d, i) => {
            const u = withdrawUsers[i];
            const userText =
              isPresent(u) && Number(u) > 0
                ? Math.round(Number(u)).toLocaleString("zh-CN")
                : "-";
            return `提现日期：${d}<br/>渠道维度：${channelScope}<br/>提现人数：${userText}`;
          });
        })();

        const legend = seriesMeta
          .map(
            (s) =>
              `<span data-series-key="${s.key}"><i style="background:${s.color}"></i>${s.name}</span>`,
          )
          .join("");

        const selectedKeysForPicker = getWithdrawRetentionChartSelectedKeys();

        return `
        <div class="wr-retention-chart" data-wr-retention-chart="1">
          <div class="wr-series-picker" data-wr-series-picker="1">
            <div class="wr-series-picker-label">展示指标</div>
            <div class="ms-wrap" data-wr-series-ms="1">
              <div class="ms-trigger" data-wr-series-trigger tabindex="0">
                ${renderWithdrawRetentionSeriesTriggerHtml(selectedKeysForPicker)}
              </div>
              <div class="ms-dropdown" data-wr-series-dropdown>
                ${renderWithdrawRetentionSeriesDropdownHtml(selectedKeysForPicker)}
              </div>
            </div>
            <div class="wr-series-picker-actions">
              <button type="button" class="btn" data-wr-series-reset="1">重置</button>
            </div>
            <p class="wr-series-picker-hint">最多同时展示 4 个指标数据</p>
          </div>
          <div data-wr-chart-body="1">
            ${
              seriesMeta.length
                ? `${renderComboChartWithTip(
                    `${grid}${barsHtml}${yLabels}${xLabelsHtml}`,
                    {
                      labels: tipLabels,
                      points: tipPoints,
                      layout: {
                        W,
                        H,
                        padL,
                        padR,
                        padT,
                        padB,
                        xMode: "band",
                      },
                    },
                  )}
                  <div class="line-legend">${legend}</div>`
                : `<div class="user-ltv-empty" style="border:none;padding:28px 12px">请选择至少 1 个充值留存指标</div>`
            }
          </div>
        </div>`;
      }

      function bindWithdrawRetentionSeriesPicker(root = document) {
        root.querySelectorAll("[data-wr-retention-chart]").forEach((wrap) => {
          if (wrap.dataset.pickerBound === "1") return;
          wrap.dataset.pickerBound = "1";
          const picker = wrap.querySelector("[data-wr-series-picker]");
          if (!picker) return;
          const trigger = picker.querySelector("[data-wr-series-trigger]");
          const dropdown = picker.querySelector("[data-wr-series-dropdown]");
          const msWrap = picker.querySelector("[data-wr-series-ms]");

          const closeDropdown = () => {
            dropdown?.classList.remove("open");
            trigger?.classList.remove("open");
          };

          const applyKeys = (keys) => {
            setWithdrawRetentionChartSelectedKeys(keys);
            refreshWithdrawRetentionChartBody(wrap);
          };

          trigger?.addEventListener("click", (e) => {
            if (e.target.closest(".ms-tag button")) return;
            e.stopPropagation();
            const open = dropdown.classList.toggle("open");
            trigger.classList.toggle("open", open);
          });

          trigger?.addEventListener("click", (e) => {
            const btn = e.target.closest(".ms-tag button");
            if (!btn) return;
            e.stopPropagation();
            const tag = btn.closest(".ms-tag");
            const key = tag?.dataset.value;
            if (!key) return;
            applyKeys(
              getWithdrawRetentionChartSelectedKeys().filter((k) => k !== key),
            );
          });

          dropdown?.addEventListener("click", (e) => e.stopPropagation());
          dropdown?.addEventListener("change", (e) => {
            const input = e.target.closest("input[data-wr-series-key]");
            if (!input || !dropdown.contains(input)) return;
            const key = input.dataset.wrSeriesKey;
            let keys = getWithdrawRetentionChartSelectedKeys();
            if (input.checked) {
              if (keys.includes(key)) return;
              if (keys.length >= WITHDRAW_RETENTION_CHART_MAX) {
                input.checked = false;
                return;
              }
              keys = [...keys, key];
            } else {
              keys = keys.filter((k) => k !== key);
            }
            applyKeys(keys);
          });

          picker
            .querySelector("[data-wr-series-reset]")
            ?.addEventListener("click", () => {
              resetWithdrawRetentionChartSelectedKeys();
              closeDropdown();
              remountWithdrawRetentionTrendChart();
            });
        });

        if (!window._wrSeriesPickerDocBound) {
          window._wrSeriesPickerDocBound = "1";
          document.addEventListener(
            "click",
            (e) => {
              document
                .querySelectorAll("[data-wr-series-ms]")
                .forEach((msWrap) => {
                  if (msWrap.contains(e.target)) return;
                  const picker = msWrap.closest("[data-wr-series-picker]");
                  picker
                    ?.querySelector("[data-wr-series-dropdown]")
                    ?.classList.remove("open");
                  picker
                    ?.querySelector("[data-wr-series-trigger]")
                    ?.classList.remove("open");
                });
            },
            true,
          );
        }
      }

      function buildStackedAreaPath(topVals, bottomVals, xPos, yPos) {
        const n = topVals.length;
        let d = `M ${xPos(0)},${yPos(topVals[0])}`;
        for (let i = 1; i < n; i++) d += ` L ${xPos(i)},${yPos(topVals[i])}`;
        for (let i = n - 1; i >= 0; i--)
          d += ` L ${xPos(i)},${yPos(bottomVals[i])}`;
        return `${d} Z`;
      }

      function renderDauStackedAreaChart() {

        const dau = [14200, 14500, 14800, 15050, 14900, 15200, 15680];
        const oldDau = [10200, 10400, 10550, 10700, 10650, 10850, 11200];
        const newDau = dau.map((v, i) => v - oldDau[i]);
        const W = 620,

      function pad2(n) {

      function formatTimeHMS(d = new Date()) {
        return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
      }

      function formatDateTimeHM(d = new Date()) {
        return `${formatDateYMD(d)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
      }

      function formatDateYMD(d) {
        return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
      }

      function parseYMD(str) {
        const [y, m, d] = str.split("-").map(Number);
        return new Date(y, m - 1, d);
      }

      function eachDateInclusive(startStr, endStr) {
        const dates = [];
        const cur = parseYMD(startStr);
        const end = parseYMD(endStr);
        while (cur <= end) {
          dates.push(formatDateYMD(cur));
          cur.setDate(cur.getDate() + 1);
        }
        return dates;
      }

      function isToday(dateStr) {
        return dateStr === formatDateYMD(new Date());
      }

      /** 5 分钟粒度的数据点（分钟数 0~1400，即 00:00~23:20） */
      function generateRtSeries(metric, dateStr, dayIndex = 0) {
        const points = [];
        const isTd = isToday(dateStr);
        const now = new Date();
        const nowMin = now.getHours() * 60 + now.getMinutes();
        const dayEnd = 23 * 60 + 55;
        const endMin = isTd
          ? Math.min(Math.floor(nowMin / 5) * 5, dayEnd)
          : dayEnd;
        const seed = [...(metric + dateStr)].reduce(
          (a, c) => a + c.charCodeAt(0),
          0,
        );
        const metricSeed = [...metric].reduce((a, c) => a + c.charCodeAt(0), 0);
        const dateObj = parseYMD(dateStr);
        const dayOfWeek = dateObj.getDay();
        const baseLevel = 720 + (metricSeed % 620) + (seed % 380);
        const dayLevelShift =
          dayIndex * 95 + dayOfWeek * 48 + ((seed >> 3) % 220) - 110;
        const ampScale = 0.68 + ((seed + metricSeed) % 55) / 100;
        const phase = seed * 1.6 + dayIndex * 41 + metricSeed * 0.45;
        const wavePeriod1 = 78 + (dayOfWeek % 4) * 11 + (metricSeed % 17);
        const wavePeriod2 = 118 + (dayIndex % 5) * 9 + (seed % 23);
        let val = baseLevel + dayLevelShift;
        for (let m = 0; m <= endMin; m += 5) {
          const hour = Math.floor(m / 60);
          const nightFactor =
            hour >= 2 && hour < 6 ? 0.35 : hour >= 6 && hour < 9 ? 0.7 : 1;
          const lunchDip =
            hour >= 12 && hour < 14 ? 0.82 + (dayIndex % 3) * 0.06 : 1;
          const wave =
            Math.sin((m + phase) / wavePeriod1) * (170 * ampScale) +
            Math.cos((m + phase * 1.35) / wavePeriod2) * (95 * ampScale) +
            Math.sin((m + dayIndex * 17) / 210) * (40 + dayIndex * 8);
          val = Math.max(
            40,
            Math.min(
              2480,
              val * 0.84 +
                (baseLevel + dayLevelShift + wave) *
                  nightFactor *
                  lunchDip *
                  0.16,
            ),
          );
          points.push({ minute: m, value: Math.round(val) });
        }
        return points;
      }

      /** 取最靠近当前分钟的 step 分钟刻度 */
      function nearestStepMinute(nowMin, step) {
        return Math.round(nowMin / step) * step;
      }

      function getXTicks(dates) {
        const hasToday = dates.some(isToday);
        if (hasToday && dates.length === 1) {
          // 当天：默认 20 分钟一刻度；刻度过多（超过 X 轴可容纳数量）则改为 50 分钟
          const now = new Date();
          const nowMin = now.getHours() * 60 + now.getMinutes();
          const MAX_TICKS = 24; // X 轴可容纳的大致刻度上限

          let step = 20;
          let endTick = nearestStepMinute(nowMin, step);
          endTick = Math.max(0, Math.min(endTick, 23 * 60 + 40));
          let tickCount = Math.floor(endTick / step) + 1;
          if (tickCount > MAX_TICKS) {
            step = 50;
            endTick = nearestStepMinute(nowMin, step);
            endTick = Math.max(0, Math.min(endTick, 23 * 60 + 20));
          }

          const ticks = [];
          for (let m = 0; m <= endTick; m += step) ticks.push(m);
          if (!ticks.length) ticks.push(0);
          const maxMin = Math.max(endTick, step);
          return { ticks, maxMin, stepLabel: step };
        }
        // 非当天或跨天：00:00 起，50 分钟一刻度，到 23:20
        const ticks = [];
        for (let m = 0; m <= 23 * 60 + 20; m += 50) ticks.push(m);
        return { ticks, maxMin: 23 * 60 + 20, stepLabel: 50 };
      }

      function minuteToLabel(m) {

      function buildRtSeriesList(metrics, dates) {
        const series = [];
        let colorIdx = 0;
        metrics.forEach((metric) => {
          dates.forEach((date, dayIndex) => {
            series.push({
              metric,
              date,
              label: `${date} ${metric}`,
              color: RT_COLORS[colorIdx % RT_COLORS.length],
