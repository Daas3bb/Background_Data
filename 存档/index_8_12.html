      const LTV_COHORT_COLORS = [
        "#165DFF",
        "#14C9C9",
        "#F7BA1E",
        "#722ED1",
        "#00B42A",
        "#F5319D",
        "#FF7D00",
        "#3491FA",
      ];
      const LTV_DX_LABELS = ["D1", "D2", "D3", "D4", "D5", "D6", "D7"];

      function buildLtvCohortSeries(page) {
        const allCols = page.cols
          ? page.cols
          : page.groups
            ? page.groups.flatMap((g) => g.cols)
            : [];
        const d1Idx = allCols.indexOf("1日LTV");
        const ltvStart = d1Idx >= 0 ? d1Idx : 3;
        const years = new Set(
          page.sampleData.map((row) => String(row[0]).slice(0, 4)),
        );
        const crossYear = years.size > 1;
        return page.sampleData.map((row, idx) => {
          const ymd = String(row[0]);
          const dateLabel = crossYear ? ymd : ymd.slice(5);
          return {
            name: `${dateLabel} ${row[1]}`,
            data: row.slice(ltvStart, ltvStart + 7).map((v) => Number(v)),
            color: LTV_COHORT_COLORS[idx % LTV_COHORT_COLORS.length],
          };
        });
      }

      function formatChartTipNumber(v) {
        if (typeof v !== "number" || Number.isNaN(v)) return String(v);
        return Number.isInteger(v)
          ? v.toLocaleString("zh-CN")
          : v.toLocaleString("zh-CN", { maximumFractionDigits: 2 });
      }

      function renderComboChartWithTip(svgBody, tipPayload) {
        const { W, H, padL, padR, padT, padB, orient = "vertical" } =
          tipPayload.layout;
        const crosshair =
          orient === "horizontal"
            ? `<line class="chart-tip-crosshair" x1="${padL}" y1="0" x2="${W - padR}" y2="0" visibility="hidden"></line>`
            : `<line class="chart-tip-crosshair" x1="0" y1="${padT}" x2="0" y2="${H - padB}" visibility="hidden"></line>`;
        return `
        <div class="combo-chart has-chart-tip" data-chart-tip="${encodeURIComponent(JSON.stringify(tipPayload))}">
          <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
            ${svgBody}
            ${crosshair}
            <g class="chart-tip-marks"></g>
          </svg>
          <div class="rt-tooltip chart-svg-tooltip"></div>
        </div>`;
      }

      function bindSvgChartTooltips(root = document) {
        root.querySelectorAll(".has-chart-tip").forEach((wrap) => {
          if (wrap.dataset.tipBound === "1") return;
          wrap.dataset.tipBound = "1";
          const tipEl = wrap.querySelector(".chart-svg-tooltip");
          const svg = wrap.querySelector("svg");
          const crosshair = svg?.querySelector(".chart-tip-crosshair");
          const marks = svg?.querySelector(".chart-tip-marks");
          if (!tipEl || !svg || !crosshair || !marks) return;

          let payload;
          try {
            payload = JSON.parse(
              decodeURIComponent(wrap.dataset.chartTip || ""),
            );
          } catch {
            return;
          }
          const { labels = [], points = [], layout } = payload;
          if (!layout || !labels.length) return;
          const {
            W,
            H,
            padL,
            padR,
            padT,
            padB,
            xMode = "spread",
            yMode = "band",
            orient = "vertical",
          } = layout;
          const plotW = W - padL - padR;
          const plotH = H - padT - padB;
          const n = labels.length;
          const isHorizontal = orient === "horizontal";

          const xPos = (i) => {
            if (n === 1) return padL + plotW / 2;
            if (xMode === "band") {
              const step = plotW / n;
              return padL + step * i + step / 2;
            }
            return padL + (i / (n - 1)) * plotW;
          };

          const yPos = (i) => {
            if (n === 1) return padT + plotH / 2;
            if (yMode === "band") {
              const step = plotH / n;
              return padT + step * i + step / 2;
            }
            return padT + (i / (n - 1)) * plotH;
          };

          const idxFromX = (svgX) => {
            if (n <= 1) return 0;
            if (xMode === "band") {
              const step = plotW / n;
              return Math.max(
                0,
                Math.min(n - 1, Math.floor((svgX - padL) / step)),
              );
            }
            const t = (svgX - padL) / plotW;
            return Math.max(0, Math.min(n - 1, Math.round(t * (n - 1))));
          };

          const idxFromY = (svgY) => {
            if (n <= 1) return 0;
            if (yMode === "band") {
              const step = plotH / n;
              return Math.max(
                0,
                Math.min(n - 1, Math.floor((svgY - padT) / step)),
              );
            }
            const t = (svgY - padT) / plotH;
            return Math.max(0, Math.min(n - 1, Math.round(t * (n - 1))));
          };

          const toSvgPoint = (clientX, clientY) => {
            const pt = svg.createSVGPoint();
            pt.x = clientX;
            pt.y = clientY;
            const ctm = svg.getScreenCTM();
            if (!ctm) return null;
            return pt.matrixTransform(ctm.inverse());
          };

          const hideTip = () => {
            tipEl.style.display = "none";
            crosshair.setAttribute("visibility", "hidden");
            marks.innerHTML = "";
          };

          wrap.addEventListener("mousemove", (e) => {
            const p = toSvgPoint(e.clientX, e.clientY);
            if (!p) return;
            if (p.x < padL || p.x > W - padR || p.y < padT || p.y > H - padB) {
              hideTip();
              return;
            }
            const i = isHorizontal ? idxFromY(p.y) : idxFromX(p.x);
            const cx = isHorizontal ? padL + plotW / 2 : xPos(i);
            const cy = isHorizontal ? yPos(i) : padT + plotH / 2;
            const dayPoints = points[i] || [];
            if (isHorizontal) {
              crosshair.setAttribute("y1", cy);
              crosshair.setAttribute("y2", cy);
            } else {
              crosshair.setAttribute("x1", cx);
              crosshair.setAttribute("x2", cx);
            }
            crosshair.setAttribute("visibility", "visible");
            marks.innerHTML = dayPoints
              .map(
                (d) =>
                  `<circle cx="${d.x}" cy="${d.y}" r="4.5" fill="#fff" stroke="${d.color}" stroke-width="2"></circle>`,
              )
              .join("");
            tipEl.innerHTML = `<div class="rt-tip-time">${labels[i]}</div>${
              dayPoints.length
                ? dayPoints
                    .map(
                      (d) =>
                        `<div class="rt-tip-row"><span class="rt-tip-dot" style="background:${d.color}"></span>${d.name}：${d.text}</div>`,
                    )
                    .join("")
                : `<div class="rt-tip-row">暂无数据</div>`
            }`;
            tipEl.style.display = "block";
            tipEl.style.transform = "none";
            const wrapRect = wrap.getBoundingClientRect();
            const svgRect = svg.getBoundingClientRect();
            const tipW = tipEl.offsetWidth || 180;
            const tipH = tipEl.offsetHeight || 140;
            const anchorX = isHorizontal
              ? svgRect.left -
                wrapRect.left +
                ((dayPoints[0]?.x || cx) / W) * svgRect.width
              : svgRect.left - wrapRect.left + (cx / W) * svgRect.width;
            const anchorY = isHorizontal
              ? svgRect.top - wrapRect.top + (cy / H) * svgRect.height
              : svgRect.top - wrapRect.top + (padT / H) * svgRect.height + 8;

            // 优先锚点右侧；不够则左侧；垂直尽量完整可见（容器允许 overflow）
            let tipX = anchorX + 14;
            if (tipX + tipW > wrapRect.width - 8) {
              tipX = anchorX - tipW - 14;
            }
            if (tipX < 8) tipX = 8;
            if (tipX + tipW > wrapRect.width - 8) {
              tipX = Math.max(8, wrapRect.width - tipW - 8);
            }

            let tipY = anchorY;
            if (tipY + tipH > wrapRect.height - 8) {
              tipY = Math.max(8, wrapRect.height - tipH - 8);
            }
            if (tipY < 8) tipY = 8;
            // 内容高于容器时仍从顶部完整展开（依赖 overflow:visible）
            if (tipH > wrapRect.height - 16) tipY = 8;

            tipEl.style.left = `${tipX}px`;
            tipEl.style.top = `${tipY}px`;
          });

          wrap.addEventListener("mouseleave", hideTip);
        });
      }

      function renderMultiLineTrendChart({
        labels,
        series,
        maxVal,
        yStep,
        xLabelStep = 1,
        showDots = true,
        height = 260,
        formatY,
      }) {
        const W = 620,
          H = height,
          padL = formatY ? 64 : 52,
          padR = 16,
          padT = 20,
          padB = 32;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;
        const n = labels.length;
        const step = yStep || maxVal / 4;
        const xPos = (i) =>
          padL + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW);
        const yPos = (v) => padT + plotH * (1 - v / maxVal);
        const fmtAxis = (v) =>
          typeof formatY === "function"
            ? formatY(v)
            : Number.isInteger(v)
              ? v.toLocaleString("zh-CN")
              : v.toFixed(1);

        let grid = "",
          yLabels = "",
          xLabels = "";
        for (let v = 0; v <= maxVal; v += step) {
          const y = yPos(v);
          grid += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"></line>`;
          yLabels += `<text class="funnel-axis" x="${padL - 8}" y="${y + 4}" text-anchor="end">${fmtAxis(v)}</text>`;
        }
        labels.forEach((lab, i) => {
          if (i % xLabelStep !== 0 && i !== n - 1) return;
          xLabels += `<text class="funnel-axis" x="${xPos(i)}" y="${H - 8}" text-anchor="middle">${lab}</text>`;
        });

        let polylines = "",
          dots = "";
        series.forEach((s) => {
          const pts = s.data.map((v, i) => `${xPos(i)},${yPos(v)}`).join(" ");
          polylines += `<polyline fill="none" stroke="${s.color}" stroke-width="2.5" points="${pts}"></polyline>`;
          if (showDots) {
            s.data.forEach((v, i) => {
              dots += `<circle cx="${xPos(i)}" cy="${yPos(v)}" r="3.5" fill="#fff" stroke="${s.color}" stroke-width="2"></circle>`;
            });
          }
        });

        const tipPoints = labels.map((_, i) =>
          series.map((s) => ({
            name: s.name,
            color: s.color,
            x: xPos(i),
            y: yPos(s.data[i]),
            text:
              (typeof s.formatTip === "function"
                ? s.formatTip(s.data[i])
                : formatChartTipNumber(s.data[i])) +
              (s.suffix != null ? s.suffix : ""),
          })),
        );

        const legend = series
          .map(
            (s) =>
              `<span><i style="background:${s.color}"></i>${s.name}</span>`,
          )
          .join("");

        return `
        ${renderComboChartWithTip(
          `${grid}${polylines}${dots}${yLabels}${xLabels}`,
          {
            labels,
            points: tipPoints,
            layout: { W, H, padL, padR, padT, padB, xMode: "spread" },
          },
        )}
        <div class="line-legend">${legend}</div>`;
      }

      function getLtvHeatmapSourceRows(page) {
        const { start, end } = getOverviewFilterRange();
        const { source, name, account } = getPageChannelFilterState();
        const templates = page.sampleData || [];
        const channelFiltered = filterRowsByChannel(
          templates,
          source,
          name,
          1,
          2,
          account,
          3,
        );
        const matched = channelFiltered.filter((row) => {
          const d = String(row[0] || "");
          return d >= start && d <= end;
        });
        if (matched.length) {
          return matched
            .slice()
            .sort((a, b) => String(b[0]).localeCompare(String(a[0])));
        }
        const dates = eachDateInclusive(start, end).reverse();
        if (!templates.length) return [];
        const pool = channelFiltered.length
          ? channelFiltered
          : !isAllSourceChannel(source)
            ? templates.filter((row) => row[1] === source)
            : templates;
        if (!pool.length) return [];
        const channelFactor = channelFilterScale({ source, name });
        const channelNames = !isAllSourceChannel(source)
          ? CHANNEL_NAME_MAP[source] || []
          : [];
        return dates.map((ymd, i) => {
          const tpl = pool[i % pool.length];
          const next = tpl.slice();
          next[0] = ymd;
          if (!isAllSourceChannel(source)) {
            next[1] = source;
            if (name) {
              next[2] = name;
            } else if (channelNames.length) {
              next[2] = channelNames[i % channelNames.length];
            }
          }
          const dateFactor = 0.92 + ((i * 7) % 17) / 100;
          const factor = channelFiltered.length ? dateFactor : dateFactor * channelFactor;
          for (let c = 4; c < next.length; c++) {
            const n = Number(next[c]);
            if (Number.isFinite(n)) {
              next[c] =
                c === 4 ? Math.round(n * factor) : +(n * factor).toFixed(1);
            }
          }
          return next;
        });
      }

          channelPart = account
            ? `，渠道账号「${source} / ${name} / ${account}」`
            : `，渠道账号「${source} / ${name}」`;

      function renderDualAxisTrendChart({
        labels,
        leftSeries,
        rightSeries,
        leftMin = 0,
        leftMax,
        rightMax,
        leftStep,
        formatLeft,
        formatRight,
      }) {
        const W = 620,
          H = 200,
          padL = 52,
          padR = 56,
          padT = 20,
          padB = 32;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;
        const leftRange = leftMax - leftMin;
        const n = labels.length;
        const dotR = 2;
        const xPos = (i) =>
          padL + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW);
        const yLeft = (v) => padT + plotH * (1 - (v - leftMin) / leftRange);
        const yRight = (v) => padT + plotH * (1 - v / rightMax);
        const fmtLeft =
          formatLeft ||
          ((v) =>
            Number.isInteger(v) ? v.toLocaleString("zh-CN") : v.toFixed(1));
        const fmtRight = formatRight || fmtLeft;

        let grid = "",
          leftAxis = "",
          rightAxis = "";
        if (leftStep) {
          for (let v = leftMin; v <= leftMax; v += leftStep) {
            const y = yLeft(v);
            grid += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"></line>`;
            leftAxis += `<text class="axis-label" x="${padL - 8}" y="${y + 3}" text-anchor="end">${fmtLeft(v)}</text>`;
            const rightVal = rightMax * ((v - leftMin) / leftRange);
            rightAxis += `<text class="axis-label" x="${W - padR + 8}" y="${y + 3}" text-anchor="start">${fmtRight(rightVal)}</text>`;
          }
        } else {
          for (let i = 0; i <= 4; i++) {
            const y = padT + (plotH / 4) * i;
            const leftVal = leftMax - (leftRange / 4) * i;
            grid += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"></line>`;
            leftAxis += `<text class="axis-label" x="${padL - 8}" y="${y + 3}" text-anchor="end">${fmtLeft(leftVal)}</text>`;
            rightAxis += `<text class="axis-label" x="${W - padR + 8}" y="${y + 3}" text-anchor="start">${fmtRight(rightMax - (rightMax / 4) * i)}</text>`;
          }
        }

        const drawLine = (series, yFn) => {
          let polylines = "",
            dots = "";
          const pts = series.data
            .map((v, i) => `${xPos(i)},${yFn(v)}`)
            .join(" ");
          polylines += `<polyline fill="none" stroke="${series.color}" stroke-width="2" points="${pts}"></polyline>`;
          series.data.forEach((v, i) => {
            dots += `<circle cx="${xPos(i)}" cy="${yFn(v)}" r="${dotR}" fill="#fff" stroke="${series.color}" stroke-width="1.5"></circle>`;
          });
          return polylines + dots;
        };

        let xLabels = "";
        labels.forEach((lab, i) => {
          if (i % 5 === 0 || i === n - 1) {
            xLabels += `<text class="axis-label" x="${xPos(i)}" y="${H - 8}" text-anchor="middle">${lab}</text>`;
          }
        });

        const legend = [leftSeries, rightSeries]
          .map(
            (s) =>
              `<span><i style="background:${s.color}"></i>${s.name}</span>`,
          )
          .join("");

        const tipPoints = labels.map((_, i) => [
          {
            name: leftSeries.name,
            color: leftSeries.color,
            x: xPos(i),
            y: yLeft(leftSeries.data[i]),
            text: fmtLeft(leftSeries.data[i]),
          },
          {
            name: rightSeries.name,
            color: rightSeries.color,
            x: xPos(i),
            y: yRight(rightSeries.data[i]),
            text: fmtRight(rightSeries.data[i]),
          },
        ]);

        return `
        ${renderComboChartWithTip(
          `${grid}${drawLine(leftSeries, yLeft)}${drawLine(rightSeries, yRight)}${leftAxis}${rightAxis}${xLabels}`,
          {
            labels,
            points: tipPoints,
            layout: { W, H, padL, padR, padT, padB, xMode: "spread" },
          },
        )}
        <div class="line-legend">${legend}</div>`;
      }

          padT = 20,

        const plotW = W - padL - padR;
        const plotH = H - padT - padB;
        const n = labels.length;
        const step = plotW / n;
        const barW = Math.min(10, step * 0.55);
        const leftMax = 2800;
        const rightMax = 900000;
        const yCount = (v) => padT + plotH * (1 - v / leftMax);
        const yAmount = (v) => padT + plotH * (1 - v / rightMax);
        const fmtRight = (v) =>
          v >= 10000
            ? (v / 10000).toFixed(0) + "万"
            : v.toLocaleString("zh-CN");

        let grid = "",
          leftAxis = "",
          rightAxis = "";
        for (let i = 0; i <= 4; i++) {
          const y = padT + (plotH / 4) * i;
          grid += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"></line>`;
          leftAxis += `<text class="axis-label" x="${padL - 8}" y="${y + 3}" text-anchor="end">${Math.round(leftMax - (leftMax / 4) * i).toLocaleString("zh-CN")}</text>`;
          rightAxis += `<text class="axis-label" x="${W - padR + 8}" y="${y + 3}" text-anchor="start">${fmtRight(rightMax - (rightMax / 4) * i)}</text>`;
        }

        let bars = "",
          xLabels = "",
          linePts = "",
          dots = "";
        labels.forEach((lab, i) => {
          const cx = padL + step * i + step / 2;
          const barTop = yCount(countData[i]);
          bars += `<rect x="${cx - barW / 2}" y="${barTop}" width="${barW}" height="${padT + plotH - barTop}" rx="2" fill="#165DFF"></rect>`;
          const ly = yAmount(amountData[i]);
          linePts += `${i ? " " : ""}${cx},${ly}`;
          dots += `<circle cx="${cx}" cy="${ly}" r="2.5" fill="#fff" stroke="#F7BA1E" stroke-width="1.5"></circle>`;
          if (i % 5 === 0 || i === n - 1) {
            xLabels += `<text class="axis-label" x="${cx}" y="${H - 8}" text-anchor="middle">${lab}</text>`;
          }
        });

        return `
        <div class="combo-chart">
          <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
            <text class="axis-title" x="${padL - 8}" y="${padT - 4}" text-anchor="end">充值人数</text>
            <text class="axis-title" x="${W - padR + 8}" y="${padT - 4}" text-anchor="start">充值金额</text>
            ${grid}
            ${bars}
            <polyline fill="none" stroke="#F7BA1E" stroke-width="2.5" points="${linePts}"></polyline>
            ${dots}
            ${leftAxis}
            ${rightAxis}
            ${xLabels}
          </svg>
        </div>
        <div class="line-legend">
          <span><i style="background:#165DFF"></i>老用户充值人数</span>
          <span><i style="background:#F7BA1E"></i>老用户充值金额</span>
        </div>`;
      }

      function renderOldUserFundTrend() {
        const dayCount = 30;
        const labels = buildRecentTrendLabels(dayCount);
        const diffData = [];
        const marginData = [];
        for (let i = 0; i < dayCount; i++) {
          const t = i / (dayCount - 1);
          diffData.push(
            Math.round(
              400000 +
                Math.pow(t, 1.4) * 100000 +
                Math.sin(i * 0.85) * 38000 +
                Math.sin(i * 1.55) * 22000,
            ),
          );
          marginData.push(
            +(
              47.5 -
              t * 2.8 +
              Math.sin(i * 0.55) * 1.5 +
              Math.max(0, t - 0.65) * 5
            ).toFixed(1),
          );
        }
        diffData[dayCount - 1] = 512300;
        marginData[dayCount - 1] = 48.1;

        const W = 620,
          H = 200,
          padL = 52,
          padR = 56,
          padT = 20,
          padB = 32;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;
        const leftMin = 300000;
        const leftMax = 530000;
        const leftRange = leftMax - leftMin;
        const leftStep = 20000;
        const rightMax = 52;
        const n = labels.length;
        const step = plotW / n;
        const barW = Math.min(10, step * 0.55);
        const yDiff = (v) => padT + plotH * (1 - (v - leftMin) / leftRange);
        const yMargin = (v) => padT + plotH * (1 - v / rightMax);
        const fmtLeft = (v) =>
          v >= 10000
            ? (v / 10000).toFixed(0) + "万"
            : v.toLocaleString("zh-CN");
        const fmtRight = (v) => v.toFixed(1) + "%";

        let grid = "",
          leftAxis = "",
          rightAxis = "";
        for (let v = leftMin; v <= leftMax; v += leftStep) {
          const y = yDiff(v);
          grid += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"></line>`;
          leftAxis += `<text class="axis-label" x="${padL - 8}" y="${y + 3}" text-anchor="end">${fmtLeft(v)}</text>`;
          const rightVal = rightMax * ((v - leftMin) / leftRange);
          rightAxis += `<text class="axis-label" x="${W - padR + 8}" y="${y + 3}" text-anchor="start">${fmtRight(rightVal)}</text>`;
        }

        let bars = "",
          xLabels = "",
          linePts = "",
          dots = "";
        labels.forEach((lab, i) => {
          const cx = padL + step * i + step / 2;
          const barTop = yDiff(diffData[i]);
          bars += `<rect x="${cx - barW / 2}" y="${barTop}" width="${barW}" height="${padT + plotH - barTop}" rx="2" fill="#165DFF"></rect>`;
          const ly = yMargin(marginData[i]);
          linePts += `${i ? " " : ""}${cx},${ly}`;
          dots += `<circle cx="${cx}" cy="${ly}" r="2.5" fill="#fff" stroke="#FF7D00" stroke-width="1.5"></circle>`;
          if (i % 5 === 0 || i === n - 1) {
            xLabels += `<text class="axis-label" x="${cx}" y="${H - 8}" text-anchor="middle">${lab}</text>`;
          }
        });

        return `
        <div class="combo-chart">
          <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
            <text class="axis-title" x="${padL - 8}" y="${padT - 4}" text-anchor="end">充提差</text>
            <text class="axis-title" x="${W - padR + 8}" y="${padT - 4}" text-anchor="start">盈余率</text>
            ${grid}
            ${bars}
            <polyline fill="none" stroke="#FF7D00" stroke-width="2.5" points="${linePts}"></polyline>
            ${dots}
            ${leftAxis}
            ${rightAxis}
            ${xLabels}
          </svg>
        </div>
        <div class="line-legend">
          <span><i style="background:#165DFF"></i>老用户充提差</span>
          <span><i style="background:#FF7D00"></i>老用户盈余率</span>
        </div>`;
      }

      function renderRechargePyramidChart(items) {
        const source = items || CONVERSION_MULTI_RECHARGE_SAMPLE;
        // 正三角形：顶部 10次以上（窄），底部 1次（宽）
        const list = [...source].reverse();
        const n = Math.max(list.length, 1);
        const maxUsers = Math.max(
          ...list.map((row) => Number(row[1]) || 0),
          1,
        );
        // 金字塔配色（倒置）：1次最深 → 次数越高越浅
        const accents = [
          "#caf0f8",
          "#ade8f4",
          "#90e0ef",
          "#48cae4",
          "#00b4d8",
          "#0096c7",
          "#0077b6",
          "#023e8a",
          "#03045e",
        ];
        const levelColorIdx = (levelIdx) =>
          Math.min(Math.max(levelIdx, 0), accents.length - 1);
        return `
          <div class="recharge-funnel" aria-label="多次复充金字塔分布">
            ${list
              .map((row, i) => {
                const usersRaw = row[1];
                const users = Number(usersRaw);
                const isEmpty =
                  usersRaw == null ||
                  usersRaw === "" ||
                  !Number.isFinite(users) ||
                  users <= 0;
                const pct = isEmpty ? "-" : formatPercent(row[2]);
                const avgAmount = isEmpty ? "-" : formatNumber(row[3]);
                const totalAmount = isEmpty ? "-" : formatNumber(row[4]);
                const usersText = isEmpty ? "暂无数据" : users.toLocaleString("zh-CN");
                // levelIdx：0=1次，越大次数越高；配色倒置后顶部浅、底部深
                const levelIdx = n - 1 - i;
                const colorIdx = levelColorIdx(
                  accents.length - 1 - Math.min(levelIdx, accents.length - 1),
                );
                const upperColorIdx = levelColorIdx(
                  accents.length -
                    1 -
                    Math.min(levelIdx + 1, accents.length - 1),
                );
                const accent = accents[colorIdx];
                const gradient = `linear-gradient(180deg, ${accents[upperColorIdx]} 0%, ${accent} 100%)`;
                // 正三角形阶梯：自上而下递增宽度；用户数微调；空状态保持层级宽度
                const userScale = isEmpty ? 0.35 : Math.sqrt(users / maxUsers);
                const topBase = 16 + (i / n) * 84;
                const botBase = 16 + ((i + 1) / n) * 84;
                const topW = Math.max(12, topBase * (0.72 + 0.28 * userScale));
                const botW = Math.max(14, botBase * (0.72 + 0.28 * userScale));
                const leftTop = ((100 - topW) / 2).toFixed(2);
                const rightTop = ((100 + topW) / 2).toFixed(2);
                const leftBot = ((100 - botW) / 2).toFixed(2);
                const rightBot = ((100 + botW) / 2).toFixed(2);
                // 浅色层用更深描边/引导，保证可读性
                const guideColor = isEmpty
                  ? "#c9cdd4"
                  : colorIdx <= 2
                    ? "#0077b6"
                    : accent;
                const tipPayload = encodeURIComponent(
                  JSON.stringify({
                    title: `${row[0]}复充用户群`,
                    times: row[0],
                    users: isEmpty ? "-" : users.toLocaleString("zh-CN"),
                    ratio: pct,
                    avg: avgAmount,
                    total: totalAmount,
                    empty: isEmpty,
                  }),
                );
                return `
                  <div class="recharge-funnel-row${isEmpty ? " is-empty" : ""}" data-funnel-tip="${tipPayload}">
                    <div class="recharge-funnel-left">
                      <div class="recharge-funnel-left-text">
                        <strong>${row[0]}</strong>
                        <span>${isEmpty ? "暂无数据" : `人均充值金额 ${avgAmount}`}</span>
                      </div>
                      <div class="recharge-funnel-leader">
                        <span class="line" style="background:${guideColor}"></span>
                        <span class="dot" style="background:${guideColor}"></span>
                      </div>
                    </div>
                    <div class="recharge-funnel-band-wrap">
                      <div
                        class="recharge-funnel-band"
                        style="${isEmpty ? "" : `background:${gradient};`}clip-path:polygon(${leftTop}% 0, ${rightTop}% 0, ${rightBot}% 100%, ${leftBot}% 100%)"
                      ></div>
                    </div>
                    <div class="recharge-funnel-right">
                      <div class="recharge-funnel-box" style="border-color:${guideColor}">
                        <strong>${usersText}</strong>
                        <div class="meta">
                          <span>用户数</span>
                          <span>${pct}</span>
                        </div>
                      </div>
                    </div>
                  </div>`;
              })
              .join("")}
            <div class="recharge-funnel-tip" role="tooltip"></div>
          </div>`;
      }

      function bindRechargePyramidTooltip(root = document) {
        root.querySelectorAll(".recharge-funnel").forEach((funnel) => {
          if (funnel.dataset.tipBound === "1") return;
          funnel.dataset.tipBound = "1";
          const tipEl = funnel.querySelector(".recharge-funnel-tip");
          if (!tipEl) return;
          const rows = () =>
            [...funnel.querySelectorAll(".recharge-funnel-row[data-funnel-tip]")];

          const hideTip = () => {
            funnel.classList.remove("is-hovering");
            rows().forEach((row) => row.classList.remove("is-active"));
            tipEl.style.display = "none";
          };

          const showTip = (row, clientX, clientY) => {
            let payload = null;
            try {
              payload = JSON.parse(
                decodeURIComponent(row.dataset.funnelTip || ""),
              );
            } catch (e) {
              payload = null;
            }
            if (!payload) {
              hideTip();
              return;
            }
            funnel.classList.add("is-hovering");
            rows().forEach((r) =>
              r.classList.toggle("is-active", r === row),
            );
            tipEl.classList.toggle("is-empty", !!payload.empty);
            tipEl.innerHTML = payload.empty
              ? `
              <div class="tip-title">${payload.title || `${payload.times}复充用户群`}</div>
              <div class="tip-empty">暂无该层级复充用户数据</div>`
              : `
              <div class="tip-title">${payload.title || `${payload.times}复充用户群`}</div>
              <div class="tip-row"><span>充值次数</span><span>${payload.times}</span></div>
              <div class="tip-row"><span>用户数</span><span>${payload.users}</span></div>
              <div class="tip-row"><span>用户占比</span><span>${payload.ratio}</span></div>
              <div class="tip-row"><span>人均充值金额</span><span>${payload.avg}</span></div>
              <div class="tip-row"><span>总充值金额</span><span>${payload.total}</span></div>`;
            tipEl.style.display = "block";
            const funnelRect = funnel.getBoundingClientRect();
            const tipW = tipEl.offsetWidth || 180;
            const tipH = tipEl.offsetHeight || 140;
            let left = clientX - funnelRect.left + 14;
            let top = clientY - funnelRect.top - tipH - 10;
            if (left + tipW > funnelRect.width - 8) {
              left = Math.max(8, clientX - funnelRect.left - tipW - 14);
            }
            if (top < 8) {
              top = clientY - funnelRect.top + 16;
            }
            tipEl.style.left = `${left}px`;
            tipEl.style.top = `${top}px`;
          };

          funnel.addEventListener("mousemove", (e) => {
            const row = e.target.closest(".recharge-funnel-row[data-funnel-tip]");
            if (!row || !funnel.contains(row)) {
              hideTip();
              return;
            }
            showTip(row, e.clientX, e.clientY);
          });
          funnel.addEventListener("mouseleave", hideTip);
        });
      }

      function renderConversionOverviewTrendChart(dayCount = 7, endDate) {

          ? buildHalfHourAxisLabels(pointCount)
          : buildTrendLabelsBeforeEnd(dayCount, endDate);
        const factor = channelFilterScale(getPageChannelFilterState());
        // 单日假数据按半小时粒度缩放，保证折线连续完整
        const rechargeAmount = genTrendSeries(
          pointCount,
          isIntraday ? 12000 : 780000,
          isIntraday ? 28500 : 985600,

        ).map((v) => Math.round(v * factor));
        const withdrawAmount = genTrendSeries(
          pointCount,
          isIntraday ? 6800 : 420000,
          isIntraday ? 16200 : 512300,
          isIntraday ? 2100 : 16000,
        ).map((v) => Math.round(v * factor));
        const rechargeUsers = genTrendSeries(
          pointCount,
          isIntraday ? 42 : 2680,
          isIntraday ? 96 : 3280,
          isIntraday ? 8 : 80,
        ).map((v) => Math.round(v * factor));
        const withdrawUsers = genTrendSeries(
          pointCount,
          isIntraday ? 18 : 1420,

        ).map((v) => Math.round(v * factor));

        // 假数据补齐完整序列，保证折线连续（业务空值规则仍按 0 连续；null 断线仅留给真实接口异常）
        const isPresent = (v) =>
          v != null && v !== "" && Number.isFinite(Number(v));
        const finiteVals = (...arrays) =>
          arrays.flat().filter(isPresent).map(Number);
        const leftVals = finiteVals(rechargeAmount, withdrawAmount);
        const rightVals = finiteVals(rechargeUsers, withdrawUsers);
        const leftMax = (Math.max(...leftVals, 1) || 1) * 1.08;
        const rightMax = (Math.max(...rightVals, 1) || 1) * 1.15;
        const fmtMoney = (v) =>
          v >= 10000
            ? `${(v / 10000).toFixed(v >= 100000 ? 0 : 1)}万`
            : Math.round(v).toLocaleString("zh-CN");

        const W = 780,
          H = STANDARD_CHART_HEIGHT,
          padL = 64,
          padR = 56,
          padT = 28,
          padB = 36;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;
        const n = labels.length;
        const xPos = (i) =>
          padL + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW);
        const yLeft = (v) => padT + plotH * (1 - v / leftMax);
        const yRight = (v) => padT + plotH * (1 - v / rightMax);
        // 半小时轴：刻度每 2 小时显示一次，避免挤在一起
        const xLabelStep = isIntraday
          ? 4
          : dayCount <= 7
            ? 1
            : dayCount <= 30
              ? 5
              : 10;

        let grid = "",
          leftAxis = "",
          rightAxis = "",
          xLabels = "";
        for (let i = 0; i <= 4; i++) {
          const y = padT + (plotH / 4) * i;
          grid += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"></line>`;
          leftAxis += `<text class="axis-label" x="${padL - 8}" y="${y + 4}" text-anchor="end">${fmtMoney(leftMax - (leftMax / 4) * i)}</text>`;
          rightAxis += `<text class="axis-label" x="${W - padR + 8}" y="${y + 4}" text-anchor="start">${Math.round(rightMax - (rightMax / 4) * i).toLocaleString("zh-CN")}</text>`;
        }
        labels.forEach((lab, i) => {
          if (i % xLabelStep !== 0 && i !== n - 1) return;
          xLabels += `<text class="axis-label" x="${xPos(i)}" y="${H - 12}" text-anchor="middle">${lab}</text>`;
        });

        // 有效点（含 0）连续连接；未返回值断开；默认不画点，悬浮时展示标记
        const drawLineSegments = (data, color, yFn) => {
          let html = "";
          let segment = [];
          const flush = () => {
            if (segment.length >= 2) {
              html += `<polyline fill="none" stroke="${color}" stroke-width="2.5" points="${segment.join(" ")}"></polyline>`;
            }
            segment = [];
          };
          data.forEach((v, i) => {
            if (!isPresent(v)) {
              flush();
              return;
            }
            segment.push(`${xPos(i)},${yFn(Number(v))}`);
          });
          flush();
          return html;
        };

        const seriesMeta = [
          {
            name: "充值金额",
            color: "#165DFF",
            data: rechargeAmount,
            yFn: yLeft,
            formatTip: fmtMoney,
          },
          {
            name: "提现金额",
            color: "#14C9C9",
            data: withdrawAmount,
            yFn: yLeft,
            formatTip: fmtMoney,
          },
          {
            name: "充值人数",
            color: "#F7BA1E",
            data: rechargeUsers,
            yFn: yRight,
            formatTip: (v) => Math.round(v).toLocaleString("zh-CN"),
          },
          {
            name: "提现人数",
            color: "#722ED1",
            data: withdrawUsers,
            yFn: yRight,
            formatTip: (v) => Math.round(v).toLocaleString("zh-CN"),
          },
        ];

        const tipPoints = labels.map((_, i) =>
          seriesMeta
            .filter((s) => isPresent(s.data[i]))
            .map((s) => ({
              name: s.name,
              color: s.color,
              x: xPos(i),
              y: s.yFn(Number(s.data[i])),
              text: s.formatTip(Number(s.data[i])),
            })),
        );

        const linesHtml = seriesMeta
          .map((s) => drawLineSegments(s.data, s.color, s.yFn))
          .join("");
        const legend = seriesMeta
          .map(
            (s) =>
              `<span><i style="background:${s.color}"></i>${s.name}</span>`,
          )
          .join("");

        return `
        ${renderComboChartWithTip(
          `${grid}${linesHtml}${leftAxis}${rightAxis}${xLabels}`,
          {
            labels,
            points: tipPoints,
            layout: { W, H, padL, padR, padT, padB, xMode: "spread" },
          },
        )}
        <div class="line-legend">${legend}</div>`;
      }

      function formatNewOldCompareValue(val, format = "number") {
        const n = Number(val) || 0;
        if (format === "money") {
          if (n >= 10000) {
            const wan = n / 10000;
            return `${wan.toLocaleString("zh-CN", {
              maximumFractionDigits: wan >= 100 ? 0 : 1,
            })}万`;
          }
          return Math.round(n).toLocaleString("zh-CN");
        }
        if (format === "decimal") {
          return n.toLocaleString("zh-CN", {
            minimumFractionDigits: 1,
            maximumFractionDigits: 1,
          });
        }
        return Math.round(n).toLocaleString("zh-CN");
      }

      function renderNewOldUserCompareRow(item) {
        const newVal = Math.max(0, Number(item.newValue) || 0);
        const oldVal = Math.max(0, Number(item.oldValue) || 0);
        const total = newVal + oldVal;
        const newPct = total > 0 ? (newVal / total) * 100 : 50;
        const oldPct = total > 0 ? (oldVal / total) * 100 : 50;
        const overlap = 1.2;
        const newWidth = Math.min(100, Math.max(0, newPct) + overlap);
        const oldWidth = Math.min(100, Math.max(0, oldPct) + overlap);
        const format = item.format || "money";
        return `
            <div class="nu-compare-head">
              <div class="nu-compare-side is-left">
                <span class="role">新用户</span>
                <span class="metric">${item.metric}</span>

                <div class="nu-compare-bar-new" style="width:${newWidth}%"></div>

      function renderWithdrawRechargeRetentionTrendChart(
        dayCount = 7,
        endDate,
      ) {
        const isIntraday = dayCount <= 1;
        const pointCount = isIntraday ? 48 : Math.max(1, dayCount);
        const labels = isIntraday
          ? buildHalfHourAxisLabels(pointCount)
          : buildTrendLabelsBeforeEnd(dayCount, endDate);

        const allSeries = WITHDRAW_RETENTION_CHART_SERIES_DEFS.map((def) => ({
          ...def,
          data: genTrendSeries(
            pointCount,
            def.start,
            def.end,
            def.wave,
            2,
          ),
        }));
        const selectedKeys = getWithdrawRetentionChartSelectedKeys();
        const selectedSet = new Set(selectedKeys);
        const seriesMeta = allSeries.filter((s) => selectedSet.has(s.key));
        const withdrawUsers = genTrendSeries(
          pointCount,
          isIntraday ? 18 : 680,
          isIntraday ? 42 : 860,
          isIntraday ? 4 : 40,
        );

        const isPresent = (v) =>
          v != null && v !== "" && Number.isFinite(Number(v));
        const finiteVals = (...arrays) =>
          arrays.flat().filter(isPresent).map(Number);
        const yMax =
          Math.max(
            ...finiteVals(...seriesMeta.map((s) => s.data)),
            1,
          ) * 1.15;

        const W = 780,
          H = STANDARD_CHART_HEIGHT,
          padL = 48,
          padR = 24,
          padT = 28,
          padB = 36;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;
        const n = labels.length;
        const seriesCount = Math.max(seriesMeta.length, 1);
        const slotW = n <= 0 ? plotW : plotW / n;
        const innerGap = 2;
        const barW = Math.max(
          3,
          Math.min(
            16,
            (slotW - 10 - innerGap * (seriesCount - 1)) / seriesCount,
          ),
        );
        const groupInnerW =
          seriesCount * barW + Math.max(0, seriesCount - 1) * innerGap;
        const groupCenter = (i) =>
          padL + (n === 1 ? plotW / 2 : slotW * i + slotW / 2);
        const barX = (i, sIdx) =>
          groupCenter(i) - groupInnerW / 2 + sIdx * (barW + innerGap);
        const yPos = (v) => padT + plotH * (1 - Number(v) / (yMax || 1));
        const barHeight = (v) => (plotH * Number(v)) / (yMax || 1);
        const xLabelStep = isIntraday
          ? 4
          : dayCount <= 7
            ? 1
            : dayCount <= 30
              ? 5
              : 10;

        let grid = "",
          yLabels = "",
          xLabelsHtml = "";
        for (let i = 0; i <= 4; i++) {
          const y = padT + (plotH / 4) * i;
          const val = yMax - (yMax / 4) * i;
          grid += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"></line>`;
          yLabels += `<text class="axis-label" x="${padL - 8}" y="${y + 4}" text-anchor="end">${val.toFixed(1)}%</text>`;
        }
        labels.forEach((lab, i) => {
          if (i % xLabelStep !== 0 && i !== n - 1) return;
          xLabelsHtml += `<text class="axis-label" x="${groupCenter(i)}" y="${H - 12}" text-anchor="middle">${lab}</text>`;
        });

        let barsHtml = "";
        labels.forEach((_, i) => {
          seriesMeta.forEach((s, sIdx) => {
            if (!isPresent(s.data[i])) return;
            const h = barHeight(s.data[i]);
            const y = padT + plotH - h;
            const x = barX(i, sIdx);
            barsHtml += `<rect class="wr-series-bar" data-series-key="${s.key}" x="${x}" y="${y}" width="${barW}" height="${Math.max(h, 0)}" rx="2" fill="${s.color}"></rect>`;
          });
        });

        const channelScope = getPageChannelScopeLabel();

        // tip：各留存率柱顶；提现日期 / 渠道维度 / 提现人数写入标题行
        const tipPoints = labels.map((_, i) =>
          seriesMeta
            .filter((s) => isPresent(s.data[i]))
            .map((s, sIdx) => ({
              name: s.name,
              color: s.color,
              x: barX(i, sIdx) + barW / 2,
              y: yPos(Number(s.data[i])),
              text: formatPercent(s.data[i]),
            })),
        );

        const tipLabels = (() => {
          const fullDates = isIntraday
            ? labels.map((t) => {
                const end = endDate instanceof Date ? endDate : new Date();
                const y = end.getFullYear();
                const m = String(end.getMonth() + 1).padStart(2, "0");
                const d = String(end.getDate()).padStart(2, "0");
                return `${y}-${m}-${d} ${t}`;
              })
            : (() => {
                const dates = [];
                for (let i = dayCount - 1; i >= 0; i--) {
                  const d = new Date(endDate);
                  d.setDate(d.getDate() - i);
                  dates.push(d);
                }
                return dates.map(
                  (d) =>
                    `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`,
                );
              })();
          return fullDates.map((d, i) => {
            const u = withdrawUsers[i];
            const userText =
              isPresent(u) && Number(u) > 0
                ? Math.round(Number(u)).toLocaleString("zh-CN")
                : "-";
            return `提现日期：${d}<br/>渠道维度：${channelScope}<br/>提现人数：${userText}`;
          });
        })();

        const legend = seriesMeta
          .map(
            (s) =>
              `<span data-series-key="${s.key}"><i style="background:${s.color}"></i>${s.name}</span>`,
          )
          .join("");

        const selectedKeysForPicker = getWithdrawRetentionChartSelectedKeys();

        return `
        <div class="wr-retention-chart" data-wr-retention-chart="1">
          <div class="wr-series-picker" data-wr-series-picker="1">
            <div class="wr-series-picker-label">展示指标</div>
            <div class="ms-wrap" data-wr-series-ms="1">
              <div class="ms-trigger" data-wr-series-trigger tabindex="0">
                ${renderWithdrawRetentionSeriesTriggerHtml(selectedKeysForPicker)}
              </div>
              <div class="ms-dropdown" data-wr-series-dropdown>
                ${renderWithdrawRetentionSeriesDropdownHtml(selectedKeysForPicker)}
              </div>
            </div>
            <div class="wr-series-picker-actions">
              <button type="button" class="btn" data-wr-series-reset="1">重置</button>
            </div>
            <p class="wr-series-picker-hint">最多同时展示 4 个指标数据</p>
          </div>
          <div data-wr-chart-body="1">
            ${
              seriesMeta.length
                ? `${renderComboChartWithTip(
                    `${grid}${barsHtml}${yLabels}${xLabelsHtml}`,
                    {
                      labels: tipLabels,
                      points: tipPoints,
                      layout: {
                        W,
                        H,
                        padL,
                        padR,
                        padT,
                        padB,
                        xMode: "band",
                      },
                    },
                  )}
                  <div class="line-legend">${legend}</div>`
                : `<div class="user-ltv-empty" style="border:none;padding:28px 12px">请选择至少 1 个充值留存指标</div>`
            }
          </div>
        </div>`;
      }

      function bindWithdrawRetentionSeriesPicker(root = document) {
        root.querySelectorAll("[data-wr-retention-chart]").forEach((wrap) => {
          if (wrap.dataset.pickerBound === "1") return;
          wrap.dataset.pickerBound = "1";
          const picker = wrap.querySelector("[data-wr-series-picker]");
          if (!picker) return;
          const trigger = picker.querySelector("[data-wr-series-trigger]");
          const dropdown = picker.querySelector("[data-wr-series-dropdown]");
          const msWrap = picker.querySelector("[data-wr-series-ms]");

          const closeDropdown = () => {
            dropdown?.classList.remove("open");
            trigger?.classList.remove("open");
          };

          const applyKeys = (keys) => {
            setWithdrawRetentionChartSelectedKeys(keys);
            refreshWithdrawRetentionChartBody(wrap);
          };

          trigger?.addEventListener("click", (e) => {
            if (e.target.closest(".ms-tag button")) return;
            e.stopPropagation();
            const open = dropdown.classList.toggle("open");
            trigger.classList.toggle("open", open);
          });

          trigger?.addEventListener("click", (e) => {
            const btn = e.target.closest(".ms-tag button");
            if (!btn) return;
            e.stopPropagation();
            const tag = btn.closest(".ms-tag");
            const key = tag?.dataset.value;
            if (!key) return;
            applyKeys(
              getWithdrawRetentionChartSelectedKeys().filter((k) => k !== key),
            );
          });

          dropdown?.addEventListener("click", (e) => e.stopPropagation());
          dropdown?.addEventListener("change", (e) => {
            const input = e.target.closest("input[data-wr-series-key]");

      function buildStackedAreaPath(topVals, bottomVals, xPos, yPos) {
        const n = topVals.length;
        let d = `M ${xPos(0)},${yPos(topVals[0])}`;
        for (let i = 1; i < n; i++) d += ` L ${xPos(i)},${yPos(topVals[i])}`;
        for (let i = n - 1; i >= 0; i--)
          d += ` L ${xPos(i)},${yPos(bottomVals[i])}`;
        return `${d} Z`;
      }

      function renderDauStackedAreaChart() {
        const labels = [
          "07-11",

          "07-13",
          "07-14",
          "07-15",
          "07-16",
          "07-17",
        ];
        const dau = [14200, 14500, 14800, 15050, 14900, 15200, 15680];
        const oldDau = [10200, 10400, 10550, 10700, 10650, 10850, 11200];
        const newDau = dau.map((v, i) => v - oldDau[i]);
        const W = 620,
          H = 200,
          padL = 52,
          padR = 16,
          padT = 20,
          padB = 32;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;
        const maxVal = 18000;
        const n = labels.length;
        const xPos = (i) =>
          padL + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW);
        const yPos = (v) => padT + plotH * (1 - v / maxVal);
        const zeroLine = new Array(n).fill(0);

        let grid = "",
          yLabels = "",
          xLabels = "";
        [0, 0.25, 0.5, 0.75, 1].forEach((t) => {
          const y = padT + plotH * (1 - t);
          grid += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"></line>`;
          yLabels += `<text class="funnel-axis" x="${padL - 8}" y="${y + 4}" text-anchor="end">${Math.round(maxVal * t).toLocaleString("zh-CN")}</text>`;
        });
        labels.forEach((lab, i) => {
          xLabels += `<text class="funnel-axis" x="${xPos(i)}" y="${H - 8}" text-anchor="middle">${lab}</text>`;
        });

        const oldArea = buildStackedAreaPath(oldDau, zeroLine, xPos, yPos);

            name: "DAU",
            color: "#165DFF",
            x: xPos(i),
            y: yPos(dau[i]),
            text: formatChartTipNumber(dau[i]),
          },
        ]);

        return `
        ${renderComboChartWithTip(
          `${grid}<path d="${oldArea}" fill="#165DFF" fill-opacity="0.55"></path><path d="${newArea}" fill="#14C9C9" fill-opacity="0.55"></path><polyline fill="none" stroke="#165DFF" stroke-width="2" points="${dauLine}"></polyline>${yLabels}${xLabels}`,

      function pad2(n) {
        return String(n).padStart(2, "0");
      }

      function formatTimeHMS(d = new Date()) {
        return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
      }

      function formatDateTimeHM(d = new Date()) {
        return `${formatDateYMD(d)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
      }

      function formatDateYMD(d) {
        return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
      }

      function parseYMD(str) {
        const [y, m, d] = str.split("-").map(Number);
        return new Date(y, m - 1, d);
      }

      function eachDateInclusive(startStr, endStr) {
        const dates = [];
        const cur = parseYMD(startStr);
        const end = parseYMD(endStr);
        while (cur <= end) {
          dates.push(formatDateYMD(cur));
          cur.setDate(cur.getDate() + 1);
        }
        return dates;
      }

      function isToday(dateStr) {
        return dateStr === formatDateYMD(new Date());
      }

      /** 5 分钟粒度的数据点（分钟数 0~1400，即 00:00~23:20） */
      function generateRtSeries(metric, dateStr, dayIndex = 0) {
        const points = [];
        const isTd = isToday(dateStr);
        const now = new Date();
        const nowMin = now.getHours() * 60 + now.getMinutes();
        const dayEnd = 23 * 60 + 55;
        const endMin = isTd
          ? Math.min(Math.floor(nowMin / 5) * 5, dayEnd)
          : dayEnd;
        const seed = [...(metric + dateStr)].reduce(
          (a, c) => a + c.charCodeAt(0),
          0,
        );
        const metricSeed = [...metric].reduce((a, c) => a + c.charCodeAt(0), 0);
        const dateObj = parseYMD(dateStr);
        const dayOfWeek = dateObj.getDay();
        const baseLevel = 720 + (metricSeed % 620) + (seed % 380);
        const dayLevelShift =
          dayIndex * 95 + dayOfWeek * 48 + ((seed >> 3) % 220) - 110;
        const ampScale = 0.68 + ((seed + metricSeed) % 55) / 100;
        const phase = seed * 1.6 + dayIndex * 41 + metricSeed * 0.45;
        const wavePeriod1 = 78 + (dayOfWeek % 4) * 11 + (metricSeed % 17);
        const wavePeriod2 = 118 + (dayIndex % 5) * 9 + (seed % 23);
        let val = baseLevel + dayLevelShift;
        for (let m = 0; m <= endMin; m += 5) {
          const hour = Math.floor(m / 60);
          const nightFactor =
            hour >= 2 && hour < 6 ? 0.35 : hour >= 6 && hour < 9 ? 0.7 : 1;
          const lunchDip =
            hour >= 12 && hour < 14 ? 0.82 + (dayIndex % 3) * 0.06 : 1;
          const wave =
            Math.sin((m + phase) / wavePeriod1) * (170 * ampScale) +
            Math.cos((m + phase * 1.35) / wavePeriod2) * (95 * ampScale) +
            Math.sin((m + dayIndex * 17) / 210) * (40 + dayIndex * 8);
          val = Math.max(
            40,
            Math.min(
              2480,
              val * 0.84 +
                (baseLevel + dayLevelShift + wave) *
                  nightFactor *
                  lunchDip *
                  0.16,
            ),
          );
          points.push({ minute: m, value: Math.round(val) });
        }
        return points;
      }

      /** 取最靠近当前分钟的 step 分钟刻度 */
      function nearestStepMinute(nowMin, step) {
        return Math.round(nowMin / step) * step;
      }

      function getXTicks(dates) {
        const hasToday = dates.some(isToday);
        if (hasToday && dates.length === 1) {
          // 当天：默认 20 分钟一刻度；刻度过多（超过 X 轴可容纳数量）则改为 50 分钟
          const now = new Date();
          const nowMin = now.getHours() * 60 + now.getMinutes();
          const MAX_TICKS = 24; // X 轴可容纳的大致刻度上限

          let step = 20;
          let endTick = nearestStepMinute(nowMin, step);
          endTick = Math.max(0, Math.min(endTick, 23 * 60 + 40));
          let tickCount = Math.floor(endTick / step) + 1;
          if (tickCount > MAX_TICKS) {
            step = 50;
            endTick = nearestStepMinute(nowMin, step);
            endTick = Math.max(0, Math.min(endTick, 23 * 60 + 20));
          }

          const ticks = [];
          for (let m = 0; m <= endTick; m += step) ticks.push(m);
          if (!ticks.length) ticks.push(0);
          const maxMin = Math.max(endTick, step);
          return { ticks, maxMin, stepLabel: step };
        }
        // 非当天或跨天：00:00 起，50 分钟一刻度，到 23:20
        const ticks = [];
        for (let m = 0; m <= 23 * 60 + 20; m += 50) ticks.push(m);
        return { ticks, maxMin: 23 * 60 + 20, stepLabel: 50 };
      }

      function minuteToLabel(m) {
        return `${pad2(Math.floor(m / 60))}:${pad2(m % 60)}`;
      }

      function stopRealtimeFlowAnimations(svg) {
        if (!svg) return;
        if (svg._rtFlowRaf) {
          cancelAnimationFrame(svg._rtFlowRaf);
          svg._rtFlowRaf = null;
        }
        svg.querySelectorAll(".rt-flow-dot").forEach((el) => el.remove());
        svg.querySelectorAll(".rt-series-line").forEach((line) => {
          line.classList.remove("rt-line-flow");
          line.style.strokeDasharray = "";
          line.style.strokeDashoffset = "";
          line.style.transition = "";
        });
      }

      function playRealtimeFlowAnimation(svg, wrap, legend) {
        if (!svg) return;
        stopRealtimeFlowAnimations(svg);

        wrap?.classList.remove("rt-animating");
        legend?.classList.remove("rt-animating");
        void wrap?.offsetWidth;
        wrap?.classList.add("rt-animating");
        legend?.classList.add("rt-animating");

        const lines = [...svg.querySelectorAll("polyline.rt-series-line")];
        if (!lines.length) return;

        const drawDuration = 1100;
        const stagger = 120;
        let pending = lines.length;
        let flowStarted = false;

        const startFlowPhase = () => {
          if (flowStarted) return;
          flowStarted = true;
          lines.forEach((line) => {
            line.style.transition = "";
            line.style.strokeDasharray = "7 11";
            line.classList.add("rt-line-flow");
          });

          const dots = lines.map((line) => {
            const dot = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "circle",
            );
            dot.setAttribute("r", "3.5");
            dot.setAttribute("fill", line.getAttribute("stroke") || "#165DFF");
            dot.classList.add("rt-flow-dot", "is-running");
            svg.appendChild(dot);
            let length = 0;
            try {
              length = line.getTotalLength();
            } catch (e) {
              length = 0;
            }
            return { line, dot, length };
          });

          const start = performance.now();
          const duration = 1600;
          const tick = (now) => {
            const t = Math.min(1, (now - start) / duration);
            const ease = 1 - Math.pow(1 - t, 3);
            dots.forEach(({ line, dot, length }) => {
              if (!length) return;
              const pt = line.getPointAtLength(length * ease);
              dot.setAttribute("cx", pt.x);
              dot.setAttribute("cy", pt.y);
            });
            if (t < 1) {
              svg._rtFlowRaf = requestAnimationFrame(tick);
            } else {
              dots.forEach(({ dot }) => dot.remove());
              setTimeout(() => {
                lines.forEach((l) => {
                  l.classList.remove("rt-line-flow");
                  l.style.strokeDasharray = "";
                  l.style.strokeDashoffset = "";
                });
                wrap?.classList.remove("rt-animating");
                legend?.classList.remove("rt-animating");
              }, 1600);
            }
          };
          svg._rtFlowRaf = requestAnimationFrame(tick);
        };

        lines.forEach((line, idx) => {
          let length = 0;
          try {
            length = line.getTotalLength();
          } catch (e) {
            length = 0;
          }
          if (!length) {
            pending -= 1;
            if (pending <= 0) startFlowPhase();
            return;
          }

          line.style.strokeDasharray = `${length}`;
          line.style.strokeDashoffset = `${length}`;
          void line.getBoundingClientRect();
          line.style.transition = `stroke-dashoffset ${drawDuration}ms cubic-bezier(0.22, 1, 0.36, 1) ${idx * stagger}ms`;
          line.style.strokeDashoffset = "0";

          const onDone = (e) => {
            if (e.propertyName && e.propertyName !== "stroke-dashoffset")
              return;
            line.removeEventListener("transitionend", onDone);
            pending -= 1;
            if (pending <= 0) startFlowPhase();
          };
          line.addEventListener("transitionend", onDone);
        });

        // 兜底：避免个别浏览器不触发 transitionend
        const totalWait = drawDuration + (lines.length - 1) * stagger + 80;
        setTimeout(() => {
          if (pending > 0) {
            pending = 0;
            startFlowPhase();
          }
        }, totalWait);
      }

      function drawRealtimeChart({ refreshTable = true } = {}) {
        const svg = document.getElementById("rtChartSvg");
        const legend = document.getElementById("rtLegend");
        const wrap = document.getElementById("rtChartWrap");
        if (!svg || !legend || !wrap) return;

        const dates = getRtChartDates();
        const tableDate = document.getElementById("rtTableDate")?.value;
        const metrics = getSelectedRtMetrics();
        const signature = `${dates.join("~")}|${metrics.join(",")}`;
        const shouldAnimate =
          !!dates.length &&
          !!metrics.length &&
          signature !== (wrap._rtSignature || "");

        if (!dates.length || !metrics.length) {
          stopRealtimeFlowAnimations(svg);
          svg.innerHTML = "";
          legend.innerHTML =
            '<span style="color:var(--arco-text-3)">请选择数据源与日期范围后查询</span>';
          if (refreshTable) drawRealtimeTable(metrics, tableDate);
          wrap._rtSignature = signature;
          return;
        }

        const seriesList = buildRtSeriesList(metrics, dates);
        const { ticks, maxMin } = getXTicks(dates);

        const W = 960,
          H = 300;
        const padL = 52,
          padR = 16,
          padT = 16,
          padB = 36;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;
        const yMax = 2500;
        const yTicks = [0, 500, 1000, 1500, 2000, 2500];
        const xPos = (m) => padL + (m / maxMin) * plotW;
        const yPos = (v) => padT + plotH * (1 - v / yMax);

        stopRealtimeFlowAnimations(svg);

        let html = "";
        yTicks.forEach((v) => {
          const y = yPos(v);
          html += `<line class="rt-grid" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"></line>`;
          html += `<text class="rt-axis" x="${padL - 8}" y="${y + 4}" text-anchor="end">${v.toLocaleString("zh-CN")}</text>`;
        });
        ticks.forEach((m) => {
          html += `<text class="rt-axis" x="${xPos(m)}" y="${H - 10}" text-anchor="middle">${minuteToLabel(m)}</text>`;
        });

        seriesList.forEach((s) => {
          const pts = s.points
            .map((p) => `${xPos(Math.min(p.minute, maxMin))},${yPos(p.value)}`)
            .join(" ");
          html += `<polyline class="rt-series-line" fill="none" stroke="${s.color}" stroke-width="2.5" points="${pts}"></polyline>`;
        });

        html += `<line class="rt-crosshair" id="rtCrosshair" x1="0" y1="${padT}" x2="0" y2="${padT + plotH}" visibility="hidden"></line>`;
        html += `<g id="rtHoverDots"></g>`;
        svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
        svg.innerHTML = html;

        legend.innerHTML = seriesList
          .map((s) => {
            const text = dates.length > 1 ? `${s.date} ${s.metric}` : s.metric;
            return `<span title="${s.label}"><i style="background:${s.color}"></i>${text}</span>`;
          })
          .join("");

        // 缓存供 hover 使用
        wrap._rtState = {
          seriesList,
          maxMin,
          padL,
          padR,
          padT,
          plotW,
          plotH,
          yMax,
          W,
          H,
          isMultiDay: dates.length > 1,
        };

        if (refreshTable) drawRealtimeTable(metrics, tableDate);
        wrap._rtSignature = signature;

        if (shouldAnimate) {
          requestAnimationFrame(() =>
            playRealtimeFlowAnimation(svg, wrap, legend),
          );
        }
      }

      function initRealtimeChart() {
        const panel = document.getElementById("realtimePanel");
        if (!panel) return;

        if (window._rtAbort) window._rtAbort.abort();
        if (window._rtAutoRefreshTimer) {
          clearInterval(window._rtAutoRefreshTimer);
          window._rtAutoRefreshTimer = null;
        }
        window._rtAbort = new AbortController();
        const { signal } = window._rtAbort;

        const trigger = document.getElementById("rtMetricTrigger");
        const dropdown = document.getElementById("rtMetricDropdown");
        const wrap = document.getElementById("rtChartWrap");
        const tooltip = document.getElementById("rtTooltip");
        const svg = document.getElementById("rtChartSvg");
        const autoRefreshSelect = document.getElementById("rtAutoRefresh");

        const msWrap = document.getElementById("rtMetricSelect");

        const startRtAutoRefresh = () => {
          if (window._rtAutoRefreshTimer) {
            clearInterval(window._rtAutoRefreshTimer);
            window._rtAutoRefreshTimer = null;
          }
          const seconds = Number(autoRefreshSelect?.value);
          if (!seconds) return;
          window._rtAutoRefreshTimer = setInterval(
            () => drawRealtimeChart({ refreshTable: false }),
            seconds * 1000,
          );
        };

        signal.addEventListener("abort", () => {
          if (window._rtAutoRefreshTimer) {
            clearInterval(window._rtAutoRefreshTimer);
            window._rtAutoRefreshTimer = null;
          }
        });

        const closeMetricDropdown = (shouldRefresh = true) => {
          dropdown?.classList.remove("open");
          trigger?.classList.remove("open");
          if (shouldRefresh) drawRealtimeChart();
        };

        const clearRealtimeSelection = () => {
          dropdown?.querySelectorAll('input[type="checkbox"]').forEach((el) => {
            el.checked = false;
          });
          closeMetricDropdown();
          updateRtMetricTags();
          drawRealtimeChart();
        };

        updateRtMetricTags();
        drawRealtimeChart();
        startRtAutoRefresh();

        autoRefreshSelect?.addEventListener(
          "change",
          () => startRtAutoRefresh(),
          { signal },
        );

        trigger?.addEventListener(
          "click",
          (e) => {
            if (e.target.closest(".ms-tag button")) return;
            e.stopPropagation();
            const open = dropdown.classList.toggle("open");
            trigger.classList.toggle("open", open);
            if (!open) drawRealtimeChart();
          },
          { signal },
        );

        trigger?.addEventListener(
          "click",
          (e) => {
            const btn = e.target.closest(".ms-tag button");
            if (!btn) return;
            e.stopPropagation();
            const tag = btn.closest(".ms-tag");
            const val = tag?.dataset.value;
            const input = dropdown.querySelector(`input[value="${val}"]`);
            if (input) input.checked = false;
            updateRtMetricTags();
            drawRealtimeChart();
          },
          { signal },
        );

        dropdown?.addEventListener("click", (e) => e.stopPropagation(), {
          signal,
        });
        dropdown?.addEventListener(
          "change",
          () => {
            updateRtMetricTags();
            drawRealtimeChart();
          },
          { signal },
        );

        // 点击多选框以外的空白区域收起下拉
        document.addEventListener(
          "click",
          (e) => {
            if (!msWrap?.contains(e.target)) closeMetricDropdown();
          },
          { signal },
        );

        document
          .getElementById("rtQueryBtn")
          ?.addEventListener("click", drawRealtimeChart, { signal });
        document.getElementById("rtTableDate")?.addEventListener(
          "change",
          () => {
            drawRealtimeTable(
              getSelectedRtMetrics(),
              document.getElementById("rtTableDate")?.value,
            );
          },
          { signal },
        );
        document.getElementById("rtRefreshBtn")?.addEventListener(
          "click",
          (e) => {
            e.stopPropagation();
            clearRealtimeSelection();
          },
          { signal },
        );

        wrap?.addEventListener(
          "mousemove",
          (e) => {
            const state = wrap._rtState;
            if (!state || !state.seriesList.length) return;
            const rect = svg.getBoundingClientRect();
            const scaleX = state.W / rect.width;
            const mx = (e.clientX - rect.left) * scaleX;
            if (mx < state.padL || mx > state.W - state.padR) {
              tooltip.style.display = "none";
              document
                .getElementById("rtCrosshair")
                ?.setAttribute("visibility", "hidden");
              document.getElementById("rtHoverDots").innerHTML = "";
              return;
            }
            const minuteRaw = ((mx - state.padL) / state.plotW) * state.maxMin;
            const minute = Math.round(minuteRaw / 5) * 5;
            const clamped = Math.max(0, Math.min(state.maxMin, minute));
            const x = state.padL + (clamped / state.maxMin) * state.plotW;

            const cross = document.getElementById("rtCrosshair");
            if (cross) {
              cross.setAttribute("x1", x);
              cross.setAttribute("x2", x);
              cross.setAttribute("visibility", "visible");
            }

            const yPos = (v) => state.padT + state.plotH * (1 - v / state.yMax);
            let dots = "";
            const rows = state.seriesList
              .map((s) => {
                if (!s.points.length) return null;
                const pt =
                  s.points.find((p) => p.minute === clamped) ||
                  s.points.reduce(
                    (best, p) =>
                      Math.abs(p.minute - clamped) <
                      Math.abs(best.minute - clamped)
                        ? p
                        : best,
                    s.points[0],
                  );
                if (!pt || Math.abs(pt.minute - clamped) > 5) return null;
                dots += `<circle cx="${x}" cy="${yPos(pt.value)}" r="4" fill="#fff" stroke="${s.color}" stroke-width="2"></circle>`;
                return `<div class="rt-tip-row"><span class="rt-tip-dot" style="background:${s.color}"></span>${state.isMultiDay ? `${s.date} ${s.metric}` : s.metric}: ${pt.value.toLocaleString("zh-CN")}</div>`;
              })
              .filter(Boolean);

            document.getElementById("rtHoverDots").innerHTML = dots;
            if (!rows.length) {
              tooltip.style.display = "none";
              return;
            }
            tooltip.innerHTML = `<div class="rt-tip-time">${minuteToLabel(clamped)}</div>${rows.join("")}`;
            tooltip.style.display = "block";
            tooltip.style.transform = "none";
            const tipW = tooltip.offsetWidth || 160;
            const tipH = tooltip.offsetHeight || 80;
            const anchorX = (x / state.W) * rect.width;
            let tipX = anchorX + 14;
            if (tipX + tipW > rect.width - 8) tipX = anchorX - tipW - 14;
            if (tipX < 8) tipX = 8;
            if (tipX + tipW > rect.width - 8) {
              tipX = Math.max(8, rect.width - tipW - 8);
            }
            let tipY = (state.padT / state.H) * rect.height + 8;
            if (tipY + tipH > rect.height - 8) {
              tipY = Math.max(8, rect.height - tipH - 8);
            }
            tooltip.style.left = `${tipX}px`;
            tooltip.style.top = `${tipY}px`;
          },
          { signal },
        );

        wrap?.addEventListener(
          "mouseleave",
          () => {
            tooltip.style.display = "none";
            document
              .getElementById("rtCrosshair")
              ?.setAttribute("visibility", "hidden");
            const dots = document.getElementById("rtHoverDots");
            if (dots) dots.innerHTML = "";
          },
          { signal },
        );
      }

      function fuzzyMatchGameName(query, name) {
        const q = String(query || "")
          .trim()
          .toLowerCase();
        const n = String(name || "").toLowerCase();
        if (!q) return true;
        if (n.includes(q)) return true;
        let qi = 0;
        for (let i = 0; i < n.length && qi < q.length; i++) {
          if (n[i] === q[qi]) qi++;
        }
        return qi === q.length;
      }

      function highlightGameNameMatch(name, query) {
        const q = String(query || "").trim();
        if (!q) return name;
        const lowerName = name.toLowerCase();
        const lowerQ = q.toLowerCase();
        const idx = lowerName.indexOf(lowerQ);
        if (idx >= 0) {
          return (
            name.slice(0, idx) +
            "<mark>" +
            name.slice(idx, idx + q.length) +
            "</mark>" +
            name.slice(idx + q.length)
          );
        }
        return name;
      }

      function renderGameNameDropdownOptions(query, selected) {
        const q = String(query || "").trim();
        const items = [];
        if (!q || fuzzyMatchGameName(q, "全部")) {
          items.push({
            value: "",
            label: "全部",
            html: "全部",
          });
        }
        GAME_NAME_OPTIONS.filter((name) => fuzzyMatchGameName(q, name)).forEach(
          (name) => {
            items.push({
              value: name,
              label: name,
              html: highlightGameNameMatch(name, q),
            });
          },
        );
        if (!items.length) {
          return `<div class="game-name-option is-empty">无匹配游戏</div>`;
        }
        return items
          .map((item) => {
            const active = (selected || "") === item.value ? " is-active" : "";
            return `<div class="game-name-option${active}" data-value="${item.value}" role="option">${item.html}</div>`;
          })
          .join("");
      }

      function bindGameNameSearchSelect(wrap) {
        if (!wrap || wrap.dataset.bound === "1") return;
        wrap.dataset.bound = "1";
        const input = wrap.querySelector(".game-name-filter");
        const dropdown = wrap.querySelector(".game-name-dropdown");
        if (!input || !dropdown) return;

        const syncSelected = (value) => {
          wrap.dataset.selected = value || "";
          input.value = value || "";
        };

        const openDropdown = () => {
          dropdown.innerHTML = renderGameNameDropdownOptions(
            input.value,
            wrap.dataset.selected || "",
          );
          dropdown.classList.add("open");
        };

        const closeDropdown = () => {
          dropdown.classList.remove("open");
        };

        const commitExactOrFuzzy = () => {
          const raw = input.value.trim();
          if (!raw || raw === "全部") {
            syncSelected("");
            return;
          }
          const exact = GAME_NAME_OPTIONS.find(
            (name) => name.toLowerCase() === raw.toLowerCase(),
          );
          if (exact) {
            syncSelected(exact);
            return;
          }
          const fuzzyHits = GAME_NAME_OPTIONS.filter((name) =>
            fuzzyMatchGameName(raw, name),
          );
          if (fuzzyHits.length === 1) {
            syncSelected(fuzzyHits[0]);
            return;
          }
          // 保留当前输入，允许用户继续搜索后点查询
        };

        input.addEventListener("focus", () => {
          const isExact =
            !input.value.trim() ||
            GAME_NAME_OPTIONS.some(
              (name) => name.toLowerCase() === input.value.trim().toLowerCase(),
            );
          dropdown.innerHTML = renderGameNameDropdownOptions(
            isExact ? "" : input.value,
            wrap.dataset.selected || "",
          );
          dropdown.classList.add("open");
          input.select();
        });
        input.addEventListener("click", () => {
          if (!dropdown.classList.contains("open")) {
            dropdown.innerHTML = renderGameNameDropdownOptions(
              "",
              wrap.dataset.selected || "",
            );
            dropdown.classList.add("open");
          }
        });
        input.addEventListener("input", () => {
          wrap.dataset.selected = input.value.trim();
          openDropdown();
        });
        input.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            closeDropdown();
            input.blur();
            return;
          }
          if (e.key === "Enter") {
            e.preventDefault();
            const first = dropdown.querySelector(
              ".game-name-option:not(.is-empty)",
            );
            if (first) {
              syncSelected(first.getAttribute("data-value") || "");
            } else {
              commitExactOrFuzzy();
            }
            closeDropdown();
          }
        });
        input.addEventListener("blur", () => {
          setTimeout(() => {
            commitExactOrFuzzy();
            closeDropdown();
          }, 120);
        });
        dropdown.addEventListener("mousedown", (e) => {
          const option = e.target.closest(".game-name-option");
          if (!option || option.classList.contains("is-empty")) return;
          e.preventDefault();
          syncSelected(option.getAttribute("data-value") || "");
          closeDropdown();
        });
      }

      function buildGameStayDailySeries(seedBase, last7) {
        // 用近7日样本向前扩展到30日
        const out = [];
        for (let i = 0; i < 30; i++) {
          const sample = last7[i % last7.length];
          const wave = Math.sin((i + seedBase) * 0.55) * 0.08;
          const drift = ((i % 9) - 4) * 0.015;
          out.push(Math.max(60, Math.round(sample * (1 + wave + drift))));
        }
        // 保证末尾 7 日贴近原样本
        for (let i = 0; i < 7; i++) {
          out[23 + i] = last7[i];
        }
        return out;
      }

        const m = Math.floor(s / 60);

        return rs ? `${m}分${String(rs).padStart(2, "0")}秒` : `${m}分`;
