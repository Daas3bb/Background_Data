      .chart-focus-group.is-focus-mode .chart-card.is-focused .app-path-sankey,
      .chart-focus-group.is-focus-mode
        .chart-card.is-focused
        .app-churn-heatmap,
      .chart-focus-group.is-focus-mode .chart-card.is-focused .app-exp-heatmap {
        min-height: 420px;
        height: 420px;
      }
      .chart-focus-group.is-focus-mode .chart-card:not(.is-focused) {
        grid-column: 2;
        padding: 12px;
        min-height: 0;
        transition:
          border-color 0.15s ease,

      .chart-focus-group.is-focus-mode .chart-expandable:not(.is-focused) {
        cursor: pointer;

      .chart-focus-group.is-focus-mode
        .chart-expandable:not(.is-focused):hover {

        box-shadow: 0 0 0 1px var(--arco-primary-light);
      }
      .chart-focus-group.is-focus-mode
        .chart-card:not(.is-focused)
        .chart-title {
        font-size: 12px;
        font-weight: 600;
        line-height: 18px;
      }
      .chart-focus-group.is-focus-mode
        .chart-card:not(.is-focused)
        .chart-subtitle,
      .chart-focus-group.is-focus-mode
        .chart-card:not(.is-focused)
        .chart-expand-hint,
      .chart-focus-group.is-focus-mode
        .chart-card:not(.is-focused)
        .line-legend,
      .chart-focus-group.is-focus-mode
        .chart-card:not(.is-focused)
        .filter-bar-local,
      .chart-focus-group.is-focus-mode
        .chart-card:not(.is-focused)
        .chart-range-toggle,
      .chart-focus-group.is-focus-mode
        .chart-card:not(.is-focused)
        .status-tag {
        display: none;
      }
      .chart-focus-group.is-focus-mode
        .chart-card:not(.is-focused)
        .combo-chart {
        margin-top: 6px;
      }
      .chart-focus-group.is-focus-mode.chart-focus-solo .realtime-chart-wrap {
        min-height: 420px;
      }
      .chart-focus-group.is-focus-mode.chart-focus-solo
        .realtime-chart-wrap

      }

          grid-row: auto;

      .retain-matrix-wrap {
        margin-top: 12px;
        overflow: auto;
        max-height: 280px;
        border: 1px solid var(--border);
        border-radius: var(--arco-radius);

        border-collapse: collapse;
        font-size: 12px;

        border-bottom: 1px solid var(--border);

      .retain-matrix th {
        background: var(--arco-bg-2);

        z-index: 1;

        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;

      function parseVipLevel(val) {
        if (typeof val === "number") return val;
        const m = String(val || "").match(/(\d+)/);
        return m ? Number(m[1]) : 0;
      }

      function buildVipAnalysisSampleData() {
        const channels = [
          ["投放", "投放01", "投放账号01"],
          ["投放", "投放01", "投放账号02"],
          ["投放", "投放02", "投放账号03"],
          ["裂变", "裂变01", "裂变账号01"],
          ["裂变", "裂变02", "裂变账号03"],
          ["官网", "官网01", "官网账号01"],
          ["官网", "官网02", "官网账号03"],
          ["特殊流量", "特殊流量01", "特殊流量账号01"],
        ];
        const levelUsersMap = {
          12: 32, 11: 58, 10: 96, 9: 150, 8: 230, 7: 340,
          6: 480, 5: 680, 4: 920, 3: 1280, 2: 1760, 1: 2480,
        };
        const arppuMap = {
          12: 4860, 11: 3120, 10: 2180, 9: 1560, 8: 1120, 7: 820,
          6: 610, 5: 460, 4: 350, 3: 260, 2: 190, 1: 128,
        };
        const rows = [];
        channels.forEach(([source, name, account], ci) => {
          const channelScale = 0.78 + ((ci * 13) % 36) / 100;
          for (let vip = 12; vip >= 1; vip--) {
            const tier = vip / 12;
            const levelUsers = Math.max(6, Math.round(levelUsersMap[vip] * channelScale));
            const dau = Math.max(3, Math.round(levelUsers * (0.3 + tier * 0.4)));
            const rechargeUsers = Math.max(1, Math.round(dau * (0.14 + tier * 0.5)));
            const arppu = Math.round(arppuMap[vip] * (0.92 + ((ci + vip) % 9) / 50) * 10) / 10;
            const rechargeAmt = Math.round(rechargeUsers * arppu);
            const withdrawUsers = Math.max(0, Math.round(rechargeUsers * (0.2 + tier * 0.28)));
            const withdrawAmt = Math.round(rechargeAmt * (0.24 + tier * 0.2));
            const diff = rechargeAmt - withdrawAmt;
            const surplus =
              rechargeAmt > 0 ? `${((diff / rechargeAmt) * 100).toFixed(1)}%` : "0.0%";
            rows.push([
              source,
              name,
              account,
              `VIP${vip}`,
              levelUsers,
              dau,
              rechargeUsers,
              rechargeAmt,
              arppu,
              withdrawUsers,
              withdrawAmt,
              diff,
              surplus,
            ]);
          }
        });
        rows.sort((a, b) => {
          const vipDiff = parseVipLevel(b[3]) - parseVipLevel(a[3]);
          if (vipDiff) return vipDiff;
          return (
            String(a[0]).localeCompare(String(b[0]), "zh") ||
            String(a[1]).localeCompare(String(b[1]), "zh") ||
            String(a[2]).localeCompare(String(b[2]), "zh")
          );
        });
        return rows;
      }

      function formatPercent(val) {
        if (val == null || val === "") return "";
        const raw =
          typeof val === "string" ? val.replace(/%/g, "").trim() : val;
        const n = Number(raw);
        if (!Number.isFinite(n)) return String(val);
        return `${n.toFixed(2)}%`;
      }

      function formatNumber(val) {
        if (typeof val === "string" && val.includes("%")) return formatPercent(val);
        if (typeof val === "number") {
          if (Number.isInteger(val)) return val.toLocaleString("zh-CN");
          return val.toLocaleString("zh-CN", {
            minimumFractionDigits: 1,
            maximumFractionDigits: 2,
          });

        if (

          return true;
        if (colName === "所属平台") return false;
        if (colName === "VIP等级") return true;
        if (STICKY_CHANNEL_COL_NAMES.has(colName)) return !channelFilterActive;
        return false;
      }

      function buildStickyClassList(
        allCols,
        channelFilterActive,
        legacyStickyCount = 0,
      ) {
        const usesBaseStickyRules = allCols.some(
          (c) =>
            c === "日期" ||
            c === "注册日期" ||
            c === "首充日期" ||
            c === "所属平台" ||
            STICKY_CHANNEL_COL_NAMES.has(c),
        );
        if (!usesBaseStickyRules) {
          return allCols.map((_, i) =>
            i < legacyStickyCount ? `sticky-col-${i + 1}` : "",
          );
        }
        let slot = 0;
        return allCols.map((col) => {
          if (!shouldStickyDataColumn(col, channelFilterActive)) return "";
          slot += 1;
          return `sticky-col-${slot}`;
        });
      }

      const STICKY_COL_WIDTHS = [112, 96, 96, 100];

      function getStickyLeadingWidth(slotCount) {
        if (!slotCount) return 0;
        return STICKY_COL_WIDTHS.slice(0, slotCount).reduce(
          (sum, width) => sum + width,
          0,
        );
      }

      function getLeadingStickyCount(groupStart, colCount, stickyClasses) {
        let count = 0;
        for (let i = 0; i < colCount; i++) {
          if (!stickyClasses[groupStart + i]) break;
          count++;
        }
        return count;
      }

      function buildGroupRowHtml(groups, stickyClasses) {
        if (!groups?.length) return "";
        let html = "";
        let colOffset = 0;
        groups.forEach((g) => {
          const groupStart = colOffset;
          const leadingSticky = getLeadingStickyCount(
            groupStart,
            g.cols.length,
            stickyClasses,
          );
          const restCols = g.cols.length - leadingSticky;
          if (leadingSticky > 0 && restCols > 0) {
            html += `<th class="${g.cls} sticky-group-head" colspan="${leadingSticky}" style="min-width:${getStickyLeadingWidth(leadingSticky)}px">${g.name}</th>`;
            html += `<th class="${g.cls}" colspan="${restCols}"></th>`;
          } else if (leadingSticky === g.cols.length && leadingSticky > 0) {
            html += `<th class="${g.cls} sticky-group-head" colspan="${g.cols.length}" style="min-width:${getStickyLeadingWidth(leadingSticky)}px">${g.name}</th>`;
          } else {
            html += `<th class="${g.cls}" colspan="${g.cols.length}">${g.name}</th>`;
          }
          colOffset += g.cols.length;
        });
        return html;
      }

      function scaleOverviewMetric(val, dayOffset, channelIndex) {
        if (typeof val === "string") return val;
        const factor =

          dayOffset * 0.018 -
          ((channelIndex * 3 + dayOffset) % 5) * 0.006;
        return Math.max(0, Math.round(val * factor));
      }

        const endDate = parseYMD(end);

        const rechargeWithdrawWrap = document.getElementById(
          "rechargeWithdrawChartWrap",
        );
        if (rechargeWithdrawWrap) {
          rechargeWithdrawWrap.innerHTML = renderOverviewRechargeWithdrawChart(
            dayCount,
            endDate,
          );
          const values = getPageChannelFilterState();
          const factor = channelFilterScale(values);
          if (factor !== 1) {
            rechargeWithdrawWrap
              .querySelectorAll("polyline, circle")
              .forEach((el) => {
                el.setAttribute(
                  "stroke-opacity",
                  String(0.75 + factor * 0.25),
                );
              });
          }
        }
        bindSvgChartTooltips(
          document.querySelector(".overview-charts") ||
            document.getElementById("pageContainer"),
        );
      }

      function refreshOverviewTableOnly() {
        if (!PAGES.overview) return;
        const { start, end } = getOverviewFilterRange();
        syncOverviewPageTableSample(start, end);
        const channelScope = document.querySelector(
          "[data-local-filter='page-filter']",
        );
        if (channelScope) refreshTableByChannelFilter(channelScope);
        else {
          const panel = document.getElementById("panel-overview");
          const tbody = panel?.querySelector(".data-table tbody");
          if (!tbody) return;
          tbody.innerHTML = PAGES.overview.sampleData
            .map((row) => {
              let html = "<tr>";
              row.forEach((cell) => {
                html += `<td>${formatNumber(cell)}</td>`;
              });
              html += "</tr>";
              return html;
            })
            .join("");
        }
      }

      function refreshOverviewByGlobalFilter() {
        refreshOverviewChartOnly();
        if (document.getElementById("panel-overview")) {
          refreshOverviewTableOnly();
        }

        if (document.getElementById("userLtvPage")) {
          refreshUserLtvPage();
        }

        if (
          document.getElementById("retentionUserHeatmap") &&
          PAGES["life-retention-user"]
        ) {
          initRetentionUserHeatmap(PAGES["life-retention-user"]);
        }

        if (document.getElementById("appChannelQualityPanel")) {
          refreshAppChannelQualityPage();
        }
        if (document.getElementById("appChurnPanel")) {
          refreshAppChurnKpis();
          updateAppChurnHeatmap();
        }
        if (document.getElementById("conversionTabPanel")) {
          refreshConversionTabCharts();
          const channelScope = document.querySelector(
            "[data-local-filter='page-filter']",
          );
          if (channelScope) refreshTableByChannelFilter(channelScope);
        }

        bindSvgChartTooltips(document.getElementById("pageContainer"));
      }

      function getAppAnalysisFilterKey() {
        const { start, end } = getOverviewFilterRange();
        const { source, name } = getPageChannelFilterState();
        return `${start}|${end}|${source}|${name}`;
      }

      function scopeHintEm(text) {
        return `<span class="app-scope-hint-em">${text}</span>`;
      }

      function getAppAnalysisScopeHintHtml(context = "数据") {
        const { start, end } = getOverviewFilterRange();
        const filterState = getPageChannelFilterState();
        const { source, name, account } = filterState;
        const dim = getChannelAnalysisDimension(filterState);
        const channelHtml =
          dim === "account"
            ? `来源渠道「${scopeHintEm(source)}」、渠道名「${scopeHintEm(name)}」、渠道账号「${scopeHintEm(account || "全部")}」`
            : dim === "name"
              ? `来源渠道「${scopeHintEm(source)}」、渠道名「${scopeHintEm(name || "全部")}」`
              : source && source !== "全部"
                ? `来源渠道「${scopeHintEm(source)}」`
                : scopeHintEm("全渠道");
        const timePart =
          start === end ? `${start} 当日` : `${start} 至 ${end}`;
        const activeTab = document.querySelector(
          "#overviewDateBar .range-tab.active",
        );
        const range = activeTab?.dataset.range;
        const timeLabel =
          range === "today"
            ? "今日"
            : range === "yesterday"
              ? "昨日"
              : range === "7d"
                ? "近7天"
                : timePart;
        const timeRangeHtml =
          timeLabel === timePart
            ? scopeHintEm(timePart)
            : `${scopeHintEm(timeLabel)}（${scopeHintEm(timePart)}）`;
        return `以下为 ${timeRangeHtml} 期间，${channelHtml} 获取用户的${scopeHintEm(context)}；当前图表与表格数据均受此时间与渠道筛选约束。`;
      }

      function updateAppAnalysisScopeHint(elementId, context) {
        const el = document.getElementById(elementId);
        if (el) el.innerHTML = getAppAnalysisScopeHintHtml(context);
      }

      function renderChannelFilterItems(
        id,
        { hideChannelName = false, showChannelAccount = true } = {},
      ) {
        const showAccount = showChannelAccount && !hideChannelName;
        return `
          <div class="filter-item">
            <label>来源渠道</label>
            <select class="local-source-channel" data-filter-id="${id}">
              ${renderSourceChannelFilter()}
            </select>
          </div>
          ${
            hideChannelName
              ? ""
              : `
          <div class="filter-item filter-item-channel-name local-channel-name-wrap" data-filter-id="${id}">
            <label>渠道名</label>
            <select class="local-channel-name" data-filter-id="${id}" disabled>
              <option value="">全部</option>
            </select>
          </div>`
          }
          ${
            showAccount
              ? `
          <div class="filter-item filter-item-channel-account local-channel-account-wrap" data-filter-id="${id}">
            <label>渠道账号</label>
            <select class="local-channel-account" data-filter-id="${id}" disabled>
              <option value="">全部</option>
            </select>
          </div>`
              : ""
          }`;
      }

      function renderLocalChannelFilter(id, opts = {}) {
        return `
        <div class="filter-bar filter-bar-local" data-local-filter="${id}">
          ${renderChannelFilterItems(id, opts)}
        </div>`;
      }

      /** 渠道排行榜：来源渠道横向 Tab 筛选 */
      function renderHorizontalChannelFilter(id) {
        const opts = ["全部", ...SOURCE_CHANNEL_OPTIONS];
        return `
        <div class="filter-bar filter-bar-local filter-bar-channel-tabs" data-local-filter="${id}">
          <div class="filter-item">
            <label>来源渠道</label>
            <div class="overview-range-tabs channel-source-tabs" role="tablist" aria-label="来源渠道">
              ${opts
                .map(
                  (name, i) =>
                    `<button type="button" class="range-tab${i === 0 ? " active" : ""}" data-source="${name}" role="tab" aria-selected="${i === 0 ? "true" : "false"}">${name}</button>`,
                )
                .join("")}
            </div>
            <select class="local-source-channel" data-filter-id="${id}" hidden aria-hidden="true">
              ${opts.map((name) => `<option value="${name}">${name}</option>`).join("")}
            </select>
          </div>
        </div>`;
      }

      function isAllSourceChannel(source) {
        return !source || source === "全部";
      }

      function getLocalChannelFilterState(scope) {
        const sourceSelect = scope.querySelector(".local-source-channel");
        const nameEl = scope.querySelector(".local-channel-name");
        const accountEl = scope.querySelector(".local-channel-account");
        const source = sourceSelect?.value || "全部";
        const name = isAllSourceChannel(source) ? "" : nameEl?.value || "";
        const account =
          isAllSourceChannel(source) || !accountEl ? "" : accountEl.value || "";
        return { source, name, account };
      }

      function getChannelAccountOptions(source, channelName = "") {
        if (isAllSourceChannel(source) || !channelName) return [];
        return CHANNEL_ACCOUNT_MAP[channelName] || [];
      }

      function filterRowsByChannel(
        rows,
        source,
        name,
        colSource = 1,
        colName = 2,
        account = "",
        colAccount = -1,
      ) {
        return (rows || []).filter((row) => {
          if (!isAllSourceChannel(source) && row[colSource] !== source) {
            return false;
          }
          if (name && row[colName] !== name) return false;
          if (account && colAccount >= 0 && row[colAccount] !== account) {
            return false;
          }
          return true;
        });
      }

      function getChannelHierarchyVisibleCols(fullCols, filterState = {}) {
        const dim = getChannelAnalysisDimension(filterState);
        return (fullCols || []).filter((col) => {
          if (col === "渠道名") return dim === "name" || dim === "account";
          if (col === "渠道账号") return dim === "account";
          return true;
        });
      }

      function getChannelHierarchyDateCol(fullCols) {
        if ((fullCols || []).includes("首充日期")) return "首充日期";
        if ((fullCols || []).includes("注册日期")) return "注册日期";
        if ((fullCols || []).includes("提现日期")) return "提现日期";
        return "日期";
      }

      function aggregateChannelHierarchyRows(rows, fullCols, groupCols) {
        const groupIdx = groupCols
          .map((c) => fullCols.indexOf(c))
          .filter((i) => i >= 0);
        const groupSet = new Set(groupIdx);
        const map = new Map();

        rows.forEach((row) => {
          const key = groupIdx.map((i) => row[i]).join("||");
          if (!map.has(key)) {
            map.set(key, {
              base: row.slice(),
              sums: {},
              pctSums: {},
              pctCounts: {},
              daySums: {},
              dayCounts: {},
            });
          }
          const item = map.get(key);
          fullCols.forEach((col, i) => {
            if (groupSet.has(i)) return;
            const val = row[i];
            if (typeof val === "number") {
              item.sums[i] = (item.sums[i] || 0) + val;
              return;
            }
            if (typeof val === "string" && val.includes("%")) {
              const num = parseFloat(val);
              if (!Number.isNaN(num)) {
                item.pctSums[i] = (item.pctSums[i] || 0) + num;
                item.pctCounts[i] = (item.pctCounts[i] || 0) + 1;
              }
              return;
            }
            if (typeof val === "string" && val.endsWith("天")) {
              const num = parseFloat(val);
              if (!Number.isNaN(num)) {
                item.daySums[i] = (item.daySums[i] || 0) + num;
                item.dayCounts[i] = (item.dayCounts[i] || 0) + 1;
              }
            }
          });
        });

        const installIdx = fullCols.indexOf("安装人数");
        const registerIdx = fullCols.indexOf("新增注册人数");
        const rateIdx = fullCols.indexOf("注册转化率");

        return [...map.values()].map((item) => {
          const next = item.base.slice();
          Object.keys(item.sums).forEach((i) => {
            next[i] = item.sums[i];
          });
          Object.keys(item.pctSums).forEach((i) => {
            const count = item.pctCounts[i] || 1;
            next[i] = `${(item.pctSums[i] / count).toFixed(1)}%`;
          });
          Object.keys(item.daySums).forEach((i) => {
            const count = item.dayCounts[i] || 1;
            next[i] = `${(item.daySums[i] / count).toFixed(1)}天`;
          });
          if (installIdx >= 0 && registerIdx >= 0 && rateIdx >= 0) {
            const install = Number(next[installIdx]) || 0;
            const register = Number(next[registerIdx]) || 0;
            next[rateIdx] =
              install > 0
                ? `${((register / install) * 100).toFixed(1)}%`
                : "0.0%";
          }
          recalculateDerivedChannelMetrics(next, fullCols);
          return next;
        });
      }

      function colNum(row, fullCols, col) {
        const i = fullCols.indexOf(col);
        return i >= 0 ? Number(row[i]) || 0 : 0;
      }

      function setColValue(row, fullCols, col, val) {
        const i = fullCols.indexOf(col);
        if (i >= 0) row[i] = val;
      }

      function recalculateDerivedChannelMetrics(row, fullCols) {
        const rechargeAmt = colNum(row, fullCols, "充值金额");
        const withdrawAmt = colNum(row, fullCols, "提现金额");
        if (fullCols.includes("充提差") && fullCols.includes("充值金额")) {
          setColValue(row, fullCols, "充提差", rechargeAmt - withdrawAmt);
        }
        const arppuPairs = [
          ["ARPPU", "充值金额", "充值人数"],
          ["总ARPPU", "充值金额", "充值人数"],
          ["新增ARPPU", "新增充值金额", "新增充值人数"],
          ["老用户ARPPU", "老用户充值金额", "老用户充值人数"],
        ];
        arppuPairs.forEach(([col, amtCol, userCol]) => {
          if (!fullCols.includes(col) || !fullCols.includes(amtCol) || !fullCols.includes(userCol)) {
            return;
          }
          const users = colNum(row, fullCols, userCol);
          const amt = colNum(row, fullCols, amtCol);
          setColValue(
            row,
            fullCols,
            col,
            users > 0 ? Math.round((amt / users) * 10) / 10 : 0,
          );
        });
        const surplusPairs = [
          ["盈余率", "充提差", "充值金额"],
          ["新用户盈余率", "新用户充提差", "新增充值金额"],
          ["老用户盈余率", "老用户充提差", "老用户充值金额"],
          ["首充盈余率", "首充盈余率", "首充金额"],
        ];
        surplusPairs.forEach(([col, diffCol, amtCol]) => {
          if (!fullCols.includes(col) || !fullCols.includes(amtCol)) return;
          if (col === "首充盈余率") return;
          const amt = colNum(row, fullCols, amtCol);
          const diff = fullCols.includes(diffCol)
            ? colNum(row, fullCols, diffCol)
            : amt - colNum(row, fullCols, "提现金额");
          setColValue(
            row,
            fullCols,
            col,
            amt > 0 ? `${((diff / amt) * 100).toFixed(1)}%` : "0.0%",
          );
        });
      }

      const CHANNEL_HIERARCHY_KEEP_COLS = new Set(["VIP等级"]);

      function getChannelHierarchyExtraGroupCols(page, fullCols) {
        const extra = page?.hierarchyExtraGroupCols || [];
        const auto = (fullCols || []).filter((c) => CHANNEL_HIERARCHY_KEEP_COLS.has(c));
        return [...new Set([...extra, ...auto])];
      }

      function specHasChannelDimension(spec) {
        if (!spec || spec.channelHierarchyTable === false) return false;
        const cols = spec.hierarchyCols || spec._channelFullCols || spec.cols || [];
        const groupCols = spec.groups ? spec.groups.flatMap((g) => g.cols) : [];
        return [...cols, ...groupCols].includes("来源渠道");
      }

      function rememberChannelHierarchySource(spec) {
        if (!spec || spec.hierarchyCols || spec._channelFullCols) return;
        const cols = spec.cols || (spec.groups ? spec.groups.flatMap((g) => g.cols) : []);
        if (!cols.includes("来源渠道")) return;
        spec._channelFullCols = cols.slice();
        spec._channelFullRows = (spec.sampleData || []).map((row) => row.slice());
      }

      function getChannelHierarchySource(spec) {
        return {
          cols: spec.hierarchyCols || spec._channelFullCols || spec.cols || [],
          rows: spec.hierarchySampleData || spec._channelFullRows || spec.sampleData || [],
        };
      }

      function buildChannelHierarchyTableView(page, filterState) {
        rememberChannelHierarchySource(page);
        const { cols: fullCols, rows: fullRows } = getChannelHierarchySource(page);
        const { source = "全部", name = "", account = "" } = filterState || {};
        const dim = getChannelAnalysisDimension(filterState);
        const dateCol = getChannelHierarchyDateCol(fullCols);
        const extraGroupCols = getChannelHierarchyExtraGroupCols(page, fullCols);
        const colSourceIdx = fullCols.indexOf("来源渠道");
        const colNameIdx = fullCols.indexOf("渠道名");
        const colAccountIdx = fullCols.indexOf("渠道账号");
        let rows = filterRowsByChannel(
          fullRows,
          source,
          name,
          colSourceIdx >= 0 ? colSourceIdx : 1,
          colNameIdx >= 0 ? colNameIdx : 2,
          account,
          colAccountIdx,
        );
        if (dim === "source") {
          rows = aggregateChannelHierarchyRows(rows, fullCols, [
            dateCol,
            "来源渠道",
            "所属平台",
            ...extraGroupCols,
          ]);
        } else if (dim === "name") {
          rows = aggregateChannelHierarchyRows(rows, fullCols, [
            dateCol,
            "来源渠道",
            "渠道名",
            "所属平台",
            ...extraGroupCols,
          ]);
        }
        const vipIdx = fullCols.indexOf("VIP等级");
        if (vipIdx >= 0) {
          rows = rows.slice().sort((a, b) => {
            const vipDiff = parseVipLevel(b[vipIdx]) - parseVipLevel(a[vipIdx]);
            if (vipDiff) return vipDiff;
            return String(a[colSourceIdx] || "").localeCompare(
              String(b[colSourceIdx] || ""),
              "zh",
            );
          });
        }
        const visibleCols = getChannelHierarchyVisibleCols(fullCols, filterState);
        const visibleIdx = visibleCols.map((c) => fullCols.indexOf(c));
        const projected = rows.map((row) => visibleIdx.map((i) => row[i]));
        return { cols: visibleCols, rows: projected };
      }

      function syncChannelHierarchyPageTable(page) {
        if (!specHasChannelDimension(page)) return null;
        const view = buildChannelHierarchyTableView(
          page,
          getPageChannelFilterState(),
        );
        page.cols = view.cols;
        page.sampleData = view.rows;
        return view;
      }

      function rebuildChannelHierarchyTableDom(table, page) {
        if (!table || !page) return;
        const view = syncChannelHierarchyPageTable(page);
        if (!view) return;
        const channelFilterActive = hasChannelFilterCondition(
          getPageChannelFilterState(),
        );
        const stickyClasses = buildStickyClassList(
          view.cols,
          channelFilterActive,
          page.stickyCols || 0,
        );
        const headRow = table.querySelector("thead tr.col-row");
        if (headRow) {
          headRow.innerHTML = view.cols
            .map((col, i) => {
              const stickyCls = stickyClasses[i] || "";
              return renderTableHeaderCell(col, stickyCls, page.metricDefs);
            })
            .join("");
        }
        const tbody = table.querySelector("tbody");
        if (tbody) {
          tbody.innerHTML = view.rows
            .map((row) => {
              let html = "<tr>";
              row.forEach((cell, i) => {
                html += `<td class="${stickyClasses[i] || ""}">${formatNumber(cell)}</td>`;
              });
              html += "</tr>";
              return html;
            })
            .join("");
        }
        const info = table
          .closest(".page-table-block")
          ?.querySelector(".pagination-info");
        if (info) info.textContent = `共 ${view.rows.length} 条`;
        updateDataTableStickyHeaders(table, page, channelFilterActive);
      }

      function channelFilterScale({ source, name, account }) {
        let factor = 1;
        if (!isAllSourceChannel(source)) {
          factor *= 0.52 + ((source.length * 17) % 40) / 100;
        }
        if (name) {
          factor *= 0.38 + ((name.length * 13) % 35) / 100;
        }
        if (account) {
          factor *= 0.42 + ((account.length * 11) % 30) / 100;
        }
        return factor;
      }

      function syncLocalChannelAccountOptions(sourceSelect, nameEl, accountEl) {
        if (!accountEl) return { cleared: false };
        const source = sourceSelect.value;
        const channelName = isAllSourceChannel(source)
          ? ""
          : nameEl?.value || "";
        const prev = accountEl.value || "";
        let cleared = false;
        const accounts = getChannelAccountOptions(source, channelName);
        accountEl.innerHTML =
          `<option value="">全部</option>` +
          accounts.map((n) => `<option value="${n}">${n}</option>`).join("");
        if (isAllSourceChannel(source) || !channelName) {
          if (prev) cleared = true;
          accountEl.value = "";
          accountEl.disabled = true;
        } else {
          accountEl.disabled = false;
          if (prev && accounts.includes(prev)) {
            accountEl.value = prev;
          } else {
            if (prev) cleared = true;
            accountEl.value = "";
          }
        }
        return { cleared };
      }

      function syncLocalChannelNameOptions(sourceSelect, nameEl, nameList) {
        if (!nameEl) return { cleared: false };
        const source = sourceSelect.value;
        const isAll = isAllSourceChannel(source);
        const prev = nameEl.value || "";
        let cleared = false;

        if (nameEl.tagName === "SELECT") {
          const names = isAll ? [] : CHANNEL_NAME_MAP[source] || [];
          nameEl.innerHTML =
            `<option value="">全部</option>` +
            names.map((n) => `<option value="${n}">${n}</option>`).join("");
          if (isAll) {
            if (prev) cleared = true;
            nameEl.value = "";
            nameEl.disabled = true;
          } else {
            nameEl.disabled = false;
            if (prev && names.includes(prev)) {
              nameEl.value = prev;
            } else {
              if (prev) cleared = true;
              nameEl.value = "";
            }
          }
          return { cleared };
        }

        // input + datalist（游戏分析 / 应用分析等）
        if (isAll) {
          if (prev) cleared = true;
          nameEl.value = "";
          nameEl.disabled = true;
          nameEl.placeholder = "请先选择来源渠道";
          if (nameList) nameList.innerHTML = "";
        } else {
          nameEl.disabled = false;
          nameEl.placeholder = `搜索渠道名，如 ${source}01`;
          const names = CHANNEL_NAME_MAP[source] || [];
          if (nameList) {
            nameList.innerHTML = names
              .map((n) => `<option value="${n}"></option>`)
              .join("");
          }
          if (prev && !names.includes(prev)) {
            nameEl.value = "";
            cleared = true;
          }
        }
        return { cleared };
      }

      function refreshTableByChannelFilter(scope) {
        let panel = scope.closest(".page-panel");
        // 页面级筛选在日期栏内，不在 panel 里
        if (!panel) {
          panel =
            document.querySelector(".page-panel.active") ||
            document.querySelector("[id^='panel-']");
        }
        if (!panel) return;
        const pageId = (panel.id || "").replace(/^panel-/, "");
        const page = PAGES[pageId];
        if (!page) return;

        const tableSpecs = [
          page,
          ...(page.extraTables || []).filter(
            (t) => t.sampleData || t.hierarchySampleData,
          ),
        ];
        const tables = panel.querySelectorAll(".page-table-block .data-table");
        const { source, name, account } = getLocalChannelFilterState(scope);
        const channelFilterActive = hasChannelFilterCondition({
          source,
          name,
          account,
        });

        tableSpecs.forEach((spec, index) => {
          const table = tables[index];
          const tbody = table?.querySelector("tbody");
          if (!tbody || (!spec.sampleData && !spec.hierarchySampleData)) return;

          if (specHasChannelDimension(spec)) {
            rebuildChannelHierarchyTableDom(table, spec);
            return;
          }

          const allCols = spec.groups
            ? spec.groups.flatMap((g) => g.cols)
            : spec.cols || [];
          if (!allCols.includes("来源渠道")) return;
          const stickyClasses = buildStickyClassList(
            allCols,
            channelFilterActive,
            spec.stickyCols || 0,
          );
          const colSourceIdx = allCols.indexOf("来源渠道");
          const colNameIdx = allCols.indexOf("渠道名");
          const colAccount = allCols.indexOf("渠道账号");
          const rows = filterRowsByChannel(
            spec.sampleData,
            source,
            name,
            colSourceIdx >= 0 ? colSourceIdx : 1,
            colNameIdx >= 0 ? colNameIdx : 2,
            account,
            colAccount,
          );
          tbody.innerHTML = rows
            .map((row) => {
              let html = "<tr>";
              row.forEach((cell, i) => {
                html += `<td class="${stickyClasses[i] || ""}">${formatNumber(cell)}</td>`;
              });
              html += "</tr>";
              return html;
            })
            .join("");
          updateDataTableStickyHeaders(table, spec, channelFilterActive);
        });

        if (pageId === "life-ltv" && document.getElementById("userLtvPage")) {
          refreshUserLtvPage();
        }
      }

      function refreshChartCardByChannelFilter(card) {
        if (!card) return;
        const scope = card.querySelector("[data-local-filter]") || card;
        const values = getLocalChannelFilterState(scope);
        const factor = channelFilterScale(values);

        const surplusWrap = card.querySelector("#surplusRateChartWrap");
        if (surplusWrap) {
          const { start, end } = getOverviewFilterRange();
          const dayCount = eachDateInclusive(start, end).length;
          surplusWrap.innerHTML = renderSurplusRateTrend(
            dayCount,
            parseYMD(end),
          );
          const subtitle = card.querySelector("#surplusRateSubtitle");
          if (subtitle) {
            const baseText = getOverviewSurplusSubtitle(start, end);
            const suffix = !isAllSourceChannel(values.source)
              ? values.name
                ? ` · ${values.source}/${values.name}`
                : ` · ${values.source}`
              : "";
            subtitle.textContent = baseText + suffix;
          }
          if (factor !== 1) {
            surplusWrap.querySelectorAll("polyline").forEach((p) => {
              p.setAttribute("stroke-opacity", String(0.75 + factor * 0.25));
            });
          }
          return;
        }

        const titleText = card.querySelector(".chart-title")?.textContent || "";
        if (titleText.includes("漏斗")) {
          const steps = [
            { name: "安装人数", value: Math.round(10230 * factor) },
            { name: "绑定人数", value: Math.round(8960 * factor) },
            { name: "DAU", value: Math.round(15680 * factor) },
            { name: "充值人数", value: Math.round(3280 * factor) },
            { name: "投注人数", value: Math.round(8950 * factor) },
          ];
          const html = renderFunnelChart(steps);
          const oldFunnel = card.querySelector(".ga-funnel");
          if (oldFunnel) {
            oldFunnel.outerHTML = html;
          } else {
            const filterBar = card.querySelector(".filter-bar-local");
            if (filterBar) filterBar.insertAdjacentHTML("afterend", html);
          }
          return;
        }

        if (
          titleText.includes("充提金额趋势") ||
          titleText.includes("充值与提现趋势") ||
          titleText.includes("充值金额趋势") ||
          titleText.includes("提现金额趋势") ||
          titleText.includes("资金流转趋势")
        ) {
          const wrap =
            card.querySelector("#rechargeWithdrawChartWrap") ||
            card.querySelector("#rechargeTrendChartWrap") ||
            card.querySelector("#withdrawTrendChartWrap") ||
            card.querySelector("#fundFlowTrendChartWrap");
          if (wrap) {
            const { start, end } = getOverviewFilterRange();
            const dayCount = eachDateInclusive(start, end).length;
            wrap.innerHTML = renderOverviewRechargeWithdrawChart(
              dayCount,
              parseYMD(end),
            );
          }
          if (factor !== 1) {
            wrap?.querySelectorAll("polyline, circle").forEach((el) => {
              el.setAttribute("stroke-opacity", String(0.75 + factor * 0.25));
            });
          }
          return;
        }

        if (titleText.includes("渠道排行")) {
          const rankHost = card.querySelector(".rank-list");
          if (rankHost) {
            rankHost.outerHTML = renderChannelRank({
              source: values.source,
              channelName: values.name,
            });
          }
          return;
        }
      }

        if (!scope) return;
        const card = scope.closest(".chart-card");
        if (card) {
          refreshChartCardByChannelFilter(card);
          bindSvgChartTooltips(card);
          return;
        }
        if (
          scope.dataset.localFilter === "page-filter" &&
          document.getElementById("panel-overview")
        ) {
          refreshOverviewChartOnly();
          refreshOverviewTableOnly();
          return;
        }
        refreshTableByChannelFilter(scope);
        // 转化/提现后留存等页：渠道级联变化时同步刷新趋势图（含 Tooltip 渠道维度）
        if (document.getElementById("conversionTabPanel")) {
          refreshConversionTabCharts();

      function bindLocalChannelFilter(scope) {
        const sourceSelect = scope.querySelector(".local-source-channel");
        if (!sourceSelect) return;
        if (sourceSelect.dataset.channelFilterBound === "1") return;
        sourceSelect.dataset.channelFilterBound = "1";

        const filterId = sourceSelect.dataset.filterId;
        const nameWrap = scope.querySelector(
          `.local-channel-name-wrap[data-filter-id="${filterId}"]`,
        );
        const nameEl = scope.querySelector(
          `.local-channel-name[data-filter-id="${filterId}"]`,
        );
        const nameList = scope.querySelector(`#channelNameList-${filterId}`);
        const accountWrap = scope.querySelector(
          `.local-channel-account-wrap[data-filter-id="${filterId}"]`,
        );
        const accountEl = scope.querySelector(
          `.local-channel-account[data-filter-id="${filterId}"]`,
        );

        if (nameWrap) nameWrap.classList.add("is-visible");
        if (accountWrap) accountWrap.classList.add("is-visible");

        const applySourceChange = () => {
          syncLocalChannelNameOptions(sourceSelect, nameEl, nameList);
          syncLocalChannelAccountOptions(sourceSelect, nameEl, accountEl);
          refreshModuleByChannelFilter(scope);
        };

        const applyNameChange = () => {
          syncLocalChannelAccountOptions(sourceSelect, nameEl, accountEl);
          refreshModuleByChannelFilter(scope);
        };

        const applyAccountChange = () => {
          refreshModuleByChannelFilter(scope);
        };

        // 初始化：全部时置灰渠道名 / 渠道账号
        syncLocalChannelNameOptions(sourceSelect, nameEl, nameList);
        syncLocalChannelAccountOptions(sourceSelect, nameEl, accountEl);

        sourceSelect.addEventListener("change", applySourceChange);
        nameEl?.addEventListener("change", applyNameChange);
        accountEl?.addEventListener("change", applyAccountChange);
        // 文本输入场景：失焦或回车也刷新
        if (nameEl && nameEl.tagName === "INPUT") {
          nameEl.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              applyNameChange();
            }
          });
          nameEl.addEventListener("blur", applyNameChange);
        }

        // 横向 Tab 筛选（渠道排行榜）
        const tabs = scope.querySelectorAll(".channel-source-tabs .range-tab");
        if (tabs.length) {
          tabs.forEach((tab) => {
            tab.addEventListener("click", () => {
              const source = tab.dataset.source || "全部";
              tabs.forEach((t) => {
                const active = t === tab;
                t.classList.toggle("active", active);
                t.setAttribute("aria-selected", active ? "true" : "false");
              });
              sourceSelect.value = source;
              applySourceChange();
            });
          });
        }
      }

      function renderTable(tableSpec, options = {}) {

          cols = null,

          hideChannelNameFilter = false,
          dateBarHtml = "",

        const allCols = groups ? groups.flatMap((g) => g.cols) : cols || [];
        const channelFilterActive = hasChannelFilterCondition(
          getPageChannelFilterState(),
        );
        const stickyClasses = buildStickyClassList(
          allCols,
          channelFilterActive,
          stickyCols,
        );
        let groupRow = "";
        if (groups) {
          groupRow = buildGroupRowHtml(groups, stickyClasses);
        }

        let colRow = "";
        allCols.forEach((col, i) => {
          const stickyCls = stickyClasses[i] || "";
          colRow += renderTableHeaderCell(col, stickyCls, metricDefs);
        });

        let bodyRows = "";
        sampleData.forEach((row) => {
          bodyRows += "<tr>";
          row.forEach((cell, i) => {

          tableKey === "main" ? "tableView" : `tableView-${tableKey}`;

              <button type="button" class="vt-btn" data-view="chart">图表</button>

                ${groups ? `<tr class="group-row">${groupRow}</tr>` : ""}

      function renderOverviewPageTables(page) {
        const { start, end } = getOverviewFilterRange();
        syncOverviewPageTableSample(start, end);
        rememberChannelHierarchySource(page);
        const view = specHasChannelDimension(page)
          ? buildChannelHierarchyTableView(page, getPageChannelFilterState())
          : { cols: page.cols, rows: page.sampleData };
        page.cols = view.cols;
        page.sampleData = view.rows;
        return renderTable(
          {
            title: page.title,
            cols: view.cols,
            sampleData: view.rows,
            stickyCols: page.stickyCols,
          },
          { tableKey: "main" },
        );
      }

      function renderPageTables(page) {
        if (specHasChannelDimension(page)) {
          syncChannelHierarchyPageTable(page);
        }
        (page.extraTables || []).forEach((spec) => {
          if (specHasChannelDimension(spec)) syncChannelHierarchyPageTable(spec);
        });
        const mainTable = renderTable(
          {
            title: page.title,
            groups: page.groups,
            cols: page.cols,
            sampleData: page.sampleData,
            stickyCols: page.stickyCols,
            chartView: page.chartView,
            hideChannelNameFilter: page.hideChannelNameFilter,
            metricDefs: page.metricDefs,
          },
          { tableKey: "main" },
        );
        const extraTables = (page.extraTables || [])
          .map((tableSpec, index) =>
            renderTable(tableSpec, { tableKey: `extra-${index + 1}` }),
          )
          .join("");
        return mainTable + extraTables;

      function renderComboChart() {
        const labels = [
          "07-11",
          "07-12",
          "07-13",
          "07-14",
          "07-15",
          "07-16",
          "07-17",
        ];
        const install = [8450, 9200, 9680, 10230, 11100, 11890, 12580];
        const newUsers = [6320, 6800, 7250, 7680, 8300, 8650, 9120];
        const convRate = [75.1, 74.2, 73.5, 72.8, 72.4, 71.7, 71.2];

        const W = 760,
          H = 200,
          padL = 52,
          padR = 52,
          padT = 36,
          padB = 40;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;
        const n = labels.length;
        const step = plotW / n;
        const leftMax = 14000;
        const rightMax = 100;
        const barW = 15,
          gap = 4;
        const yCount = (v) => padT + plotH * (1 - v / leftMax);
        const yPct = (v) => padT + plotH * (1 - v / rightMax);

        let grid = "",
          leftAxis = "",
          rightAxis = "";
        for (let i = 0; i <= 4; i++) {
          const y = padT + (plotH / 4) * i;
          grid += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"></line>`;
          leftAxis += `<text class="axis-label" x="${padL - 8}" y="${y + 3}" text-anchor="end">${(leftMax - (leftMax / 4) * i).toLocaleString("zh-CN")}</text>`;
          rightAxis += `<text class="axis-label" x="${W - padR + 8}" y="${y + 3}" text-anchor="start">${rightMax - (rightMax / 4) * i}%</text>`;
        }

        const axisTitles = `
          <text class="axis-title" x="${padL}" y="${padT - 10}" text-anchor="start">安装人数/新增注册人数</text>
          <text class="axis-title" x="${W - padR}" y="${padT - 10}" text-anchor="end">注册转化率</text>`;

        let bars = "",
          xLabels = "",
          linePts = [],
          dots = "";
        const tipPoints = [];
        labels.forEach((lab, i) => {
          const cx = padL + step * i + step / 2;
          const x1 = cx - barW - gap / 2;
          const x2 = cx + gap / 2;
          bars += `<rect x="${x1}" y="${yCount(install[i])}" width="${barW}" height="${(plotH * install[i]) / leftMax}" rx="3" fill="#165DFF"></rect>`;
          bars += `<rect x="${x2}" y="${yCount(newUsers[i])}" width="${barW}" height="${(plotH * newUsers[i]) / leftMax}" rx="3" fill="#14C9C9"></rect>`;
          const ly = yPct(convRate[i]);
          linePts.push(`${cx},${ly}`);
          dots += `<circle cx="${cx}" cy="${ly}" r="3.5" fill="#fff" stroke="#F7BA1E" stroke-width="2"></circle>`;
          xLabels += `<text class="axis-label" x="${cx}" y="${H - padB + 18}" text-anchor="middle">${lab}</text>`;
          tipPoints.push([
            {
              name: "安装人数",
              color: "#165DFF",
              x: x1 + barW / 2,
              y: yCount(install[i]),
              text: install[i].toLocaleString("zh-CN"),
            },
            {
              name: "新增注册人数",
              color: "#14C9C9",
              x: x2 + barW / 2,
              y: yCount(newUsers[i]),
              text: newUsers[i].toLocaleString("zh-CN"),
            },
            {
              name: "注册转化率",
              color: "#F7BA1E",
              x: cx,
              y: ly,
              text: `${convRate[i]}%`,
            },
          ]);
        });

        return `
        ${renderComboChartWithTip(
          `${axisTitles}${grid}${bars}<polyline fill="none" stroke="#F7BA1E" stroke-width="2.5" points="${linePts.join(" ")}"></polyline>${dots}${leftAxis}${rightAxis}${xLabels}`,

            points: tipPoints,
            layout: { W, H, padL, padR, padT, padB, xMode: "band" },

          <span><i style="background:#165DFF"></i>安装人数</span>
          <span><i style="background:#14C9C9"></i>新增注册人数</span>

      function renderPlatformFundFlowTrendChart(dayCount, endDate) {
        const labels = buildTrendLabelsBeforeEnd(dayCount, endDate);
        const recharge = genTrendSeries(dayCount, 640000, 780000, 18000);
        const withdrawal = genTrendSeries(dayCount, 420000, 520000, 15000);

          H = 320,
          padL = 108,

          padT = 36,
          padB = 42;

        const plotH = H - padT - padB;
        const n = labels.length;
        const xPos = (i) =>
          padL + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW);

        const leftMax = Math.max(...recharge, ...withdrawal) * 1.08;
        const rightMax = Math.max(...bonus) * 1.15;
        const yLeft = (v) => padT + plotH * (1 - v / leftMax);
        const yRight = (v) => padT + plotH * (1 - v / rightMax);
        const fmtMoney = (v) =>
          v >= 10000
            ? `${(v / 10000).toFixed(v >= 100000 ? 0 : 1)}万`
            : Math.round(v).toLocaleString("zh-CN");
        const xLabelStep = dayCount <= 7 ? 1 : dayCount <= 30 ? 5 : 10;
        const showDots = dayCount <= 14;

        const axisTitles = `
          <text class="axis-title" x="${padL}" y="${padT - 10}" text-anchor="start">充值金额/提现金额</text>
          <text class="axis-title" x="${W - padR}" y="${padT - 10}" text-anchor="end">活动奖金</text>`;

        let grid = "",
          leftAxis = "",
          rightAxis = "",
          xLabels = "";
        for (let i = 0; i <= 4; i++) {
          const y = padT + (plotH / 4) * i;
          grid += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"></line>`;
          leftAxis += `<text class="axis-label" x="${padL - 8}" y="${y + 4}" text-anchor="end">${fmtMoney(leftMax - (leftMax / 4) * i)}</text>`;
          rightAxis += `<text class="axis-label" x="${W - padR + 8}" y="${y + 4}" text-anchor="start">${fmtMoney(rightMax - (rightMax / 4) * i)}</text>`;
        }
        labels.forEach((lab, i) => {
          if (i % xLabelStep !== 0 && i !== n - 1) return;
          xLabels += `<text class="axis-label" x="${xPos(i)}" y="${H - 14}" text-anchor="middle">${lab}</text>`;

        const drawLine = (data, color, yFn) => {
          const pts = data.map((v, i) => `${xPos(i)},${yFn(v)}`).join(" ");

            y: yRight(bonus[i]),
            text: fmtMoney(bonus[i]),

          <span><i style="background:#722ED1"></i>活动奖金（右轴）</span>

      function renderFunnelChart(steps) {
        steps = steps || [
          { name: "安装用户", value: 100000 },
          { name: "新增设备", value: 80000 },
          { name: "注册用户", value: 50000 },
          { name: "绑定用户", value: 45000 },
        ];
        const W = 760,
          H = 356;
        const plotTop = 66,
          plotBottom = 270;
        const plotH = plotBottom - plotTop;
        const axisLeft = 46,
          plotRight = W - 14;
        const plotLeft = axisLeft;
        const plotW = plotRight - plotLeft;
        const n = steps.length;
        const colW = plotW / n;
        const darkW = colW * 0.58;
        const maxVal = Math.max(...steps.map((s) => s.value), 1);
        const yVal = (v) => plotBottom - plotH * (v / maxVal);
        const fmt = (v) => {
          if (v === 0) return "0";
          if (v >= 10000)
            return (
              (v % 10000 === 0 ? v / 10000 : (v / 10000).toFixed(1)) + "万"
            );
          return v.toLocaleString("zh-CN");
        };
        const nameFont = n > 5 ? 11 : 13;

        let grid = "",
          yLabels = "";
        [0, 0.5, 1].forEach((t) => {
          const y = plotBottom - plotH * t;
          grid += `<line class="grid-line dashed" x1="${plotLeft}" y1="${y}" x2="${plotRight}" y2="${y}"></line>`;
          yLabels += `<text class="funnel-axis" x="${plotLeft - 8}" y="${y + 4}" text-anchor="end">${fmt(maxVal * t)}</text>`;
        });

        let seps = "",
          bars = "",
          headers = "",
          abandons = "";
        seps += `<line class="grid-line" x1="${plotLeft}" y1="16" x2="${plotLeft}" y2="${plotBottom}"></line>`;
        steps.forEach((s, i) => {
          const colX = plotLeft + colW * i;
          const sepX = colX + colW;
          const topY = yVal(s.value);
          bars += `<rect x="${colX}" y="${topY}" width="${darkW}" height="${plotBottom - topY}" fill="#4080FF"></rect>`;
          if (i < n - 1) {
            const nextTopY = yVal(steps[i + 1].value);
            const lx = colX + darkW,
              rx = colX + colW;
            bars += `<polygon points="${lx},${topY} ${rx},${nextTopY} ${rx},${plotBottom} ${lx},${plotBottom}" fill="#C9DCFF"></polygon>`;
          }
          seps += `<line class="grid-line dashed" x1="${sepX}" y1="16" x2="${sepX}" y2="${plotBottom}"></line>`;

          const comp = i === 0 ? 100 : (s.value / steps[i - 1].value) * 100;
          headers += `<text class="funnel-step-idx" x="${colX + 4}" y="30">Step ${i + 1}</text>`;
          headers += `<text class="funnel-step-name" x="${colX + 4}" y="52" style="font-size:${nameFont}px">${s.name}</text>`;
          headers += `<text class="funnel-comp" x="${sepX - 6}" y="52" text-anchor="end" style="font-size:${nameFont}px">${comp.toFixed(1)}%</text>`;

          if (i < n - 1) {
            const lost = s.value - steps[i + 1].value;
            const rate = (lost / s.value) * 100;
            const ay = plotBottom + 30;
            headers += `<text class="funnel-abandon-title" x="${colX + 4}" y="${ay - 16}">流失率</text>`;
            abandons += `<rect x="${colX + 4}" y="${ay - 9}" width="9" height="9" rx="2" fill="#4080FF"></rect>`;
            abandons += `<text class="funnel-abandon" x="${colX + 18}" y="${ay}">${fmt(Math.max(lost, 0))} · ${rate.toFixed(1)}%</text>`;
          }
        });

        return `
        <div class="ga-funnel">
          <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
            ${grid}
            ${bars}
            ${seps}
            ${headers}
            ${yLabels}
            ${abandons}
          </svg>
        </div>`;
      }

      function renderChannelRank(opts = {}) {
        const { source = "全部", channelName = "" } = opts;
        // 与「来源渠道」筛选字段（SOURCE_CHANNEL_OPTIONS）对应
        const data = {
          投放: { install: 14000, reg: 72 },
          官网: { install: 7600, reg: 75 },
          裂变: { install: 9800, reg: 68 },
          特殊流量: { install: 4200, reg: 55 },
        };
        let rows = SOURCE_CHANNEL_OPTIONS.map((name) => ({
          name,
          ...(data[name] || { install: 0, reg: 0 }),
        }));
        if (!isAllSourceChannel(source)) {
          rows = rows.filter((r) => r.name === source);
          // 选了具体渠道名时，用样例微调展示该账号规模
          if (channelName) {
            rows = rows.map((r) => ({
              ...r,
              install: Math.round(r.install * 0.28),
              reg: Math.max(40, Math.round(r.reg - 2)),
            }));
          }
        }
        rows = rows.sort((a, b) => b.install - a.install);

        const W = 620;
        const H = 200;
        const padL = 72;
        const padR = 48;
        const padT = 28;
        const padB = 36;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;
        const installMax = Math.max(...rows.map((r) => r.install), 1) * 1.05;
        const rateMax = 100;
        const groupH = plotH / Math.max(rows.length, 1);
        const barH = Math.min(10, groupH * 0.28);
        const barGap = 3;

        let grid = "";
        let xTicks = "";
        for (let i = 0; i <= 4; i++) {
          const x = padL + (plotW / 4) * i;
          const tickVal = Math.round((installMax / 4) * i);
          grid += `<line class="grid-line" x1="${x}" y1="${padT}" x2="${x}" y2="${H - padB}"></line>`;
          xTicks += `<text class="axis-label" x="${x}" y="${H - padB + 16}" text-anchor="middle">${tickVal.toLocaleString("zh-CN")}</text>`;
        }

        const axisTitles = `
          <text class="axis-title" x="${padL}" y="${padT - 10}" text-anchor="start">安装人数</text>
          <text class="axis-title" x="${W - padR}" y="${padT - 10}" text-anchor="end">注册转化率</text>`;

        let bars = "";
        const tipPoints = [];
        const labels = [];
        rows.forEach((r, i) => {
          const cy = padT + groupH * i + groupH / 2;
          const y1 = cy - barH - barGap / 2;
          const y2 = cy + barGap / 2;
          const installW = Math.max(2, (r.install / installMax) * plotW);
          const rateW = Math.max(2, (r.reg / rateMax) * plotW);
          bars += `<text class="axis-label" x="${padL - 8}" y="${cy + 3}" text-anchor="end">${r.name}</text>`;
          bars += `<rect x="${padL}" y="${y1}" width="${installW}" height="${barH}" rx="2" fill="#165DFF"></rect>`;
          bars += `<rect x="${padL}" y="${y2}" width="${rateW}" height="${barH}" rx="2" fill="#14C9C9"></rect>`;
          labels.push(r.name);
          tipPoints.push([
            {
              name: "安装人数",
              color: "#165DFF",
              x: padL + installW,
              y: y1 + barH / 2,
              text: r.install.toLocaleString("zh-CN"),
            },
            {
              name: "注册转化率",
              color: "#14C9C9",
              x: padL + rateW,
              y: y2 + barH / 2,
              text: `${r.reg}%`,
            },
          ]);
        });

        return `
        <div class="rank-list">
          ${renderComboChartWithTip(
            `${axisTitles}${grid}${bars}${xTicks}`,
            {
              labels,
              points: tipPoints,
              layout: {
                W,
                H,
                padL,
                padR,
                padT,
                padB,
                orient: "horizontal",
                yMode: "band",
              },
            },
          )}
          <div class="line-legend">
            <span><i style="background:#165DFF"></i>安装人数</span>
            <span><i style="background:#14C9C9"></i>注册转化率</span>
          </div>
        </div>`;
      }

          leftAxis = "",
          rightAxis = "";
        for (let i = 0; i <= 4; i++) {
          const y = padT + (plotH / 4) * i;
          grid += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"></line>`;
          leftAxis += `<text class="axis-label" x="${padL - 8}" y="${y + 3}" text-anchor="end">${Math.round(leftMax - (leftMax / 4) * i).toLocaleString("zh-CN")}</text>`;
          rightAxis += `<text class="axis-label" x="${W - padR + 8}" y="${y + 3}" text-anchor="start">${(rightMax - (rightMax / 4) * i).toFixed(1)}%</text>`;
        }

        let bars = "",
          xLabels = "",
          linePts = [],
          dots = "";
        labels.forEach((lab, i) => {
          const cx = padL + step * i + step / 2;
          bars += `<rect x="${cx - barW / 2}" y="${yCount(firstCount[i])}" width="${barW}" height="${(plotH * firstCount[i]) / leftMax}" rx="3" fill="#165DFF"></rect>`;
          const ly = yPct(firstRate[i]);
          linePts.push(`${cx},${ly}`);
          dots += `<circle cx="${cx}" cy="${ly}" r="3.5" fill="#fff" stroke="#722ED1" stroke-width="2"></circle>`;
          xLabels += `<text class="axis-label" x="${cx}" y="${H - 10}" text-anchor="middle">${lab}</text>`;
        });

        return `
        <div class="combo-chart">
          <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
            ${grid}
            ${bars}
            <polyline fill="none" stroke="#722ED1" stroke-width="2.5" points="${linePts.join(" ")}"></polyline>
            ${dots}
            ${leftAxis}
            ${rightAxis}
            ${xLabels}
          </svg>
        </div>
        <div class="line-legend">
          <span><i style="background:#165DFF"></i>首充人数</span>
          <span><i style="background:#722ED1"></i>首充率</span>
        </div>`;
      }

      function renderSingleAxisDualLine({ labels, seriesA, seriesB, maxVal }) {
        const W = 620,
          H = 200,
          padL = 48,
          padR = 16,
          padT = 24,
          padB = 36;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;
        const n = labels.length;
        const xPos = (i) =>
          padL + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW);
        const yPos = (v) => padT + plotH * (1 - v / maxVal);
        const fmtAxis = (v) =>
          Number.isInteger(v) ? v.toLocaleString("zh-CN") : v.toFixed(1);

        let grid = "",

          yLabels += `<text class="funnel-axis" x="${padL - 8}" y="${y + 4}" text-anchor="end">${fmtAxis(maxVal * t)}</text>`;

      function buildHalfHourAxisLabels(slotCount = 48) {
        const n = Math.max(1, slotCount);
        const labels = [];
        for (let i = 0; i < n; i++) {
          const totalMin = i * 30;
          const h = String(Math.floor(totalMin / 60) % 24).padStart(2, "0");
          const m = String(totalMin % 60).padStart(2, "0");
          labels.push(`${h}:${m}`);
        }
        return labels;
      }

      function genTrendSeries(dayCount, start, end, wave, decimals) {
        const data = [];
        const n = Math.max(1, dayCount);
        for (let i = 0; i < n; i++) {
          const t = n === 1 ? 1 : i / (n - 1);
          const v = start + t * (end - start) + Math.sin(i * 0.42) * wave;
          data.push(decimals ? +v.toFixed(decimals) : Math.round(v));
        }
        return data;
      }

      function scaleUserLtvSeries(series, dayOffset, channelIndex) {
        const factor =
          1 -
          dayOffset * 0.012 -
          ((channelIndex * 2 + dayOffset) % 5) * 0.008;
        return (series || []).map((v) => {
          if (v == null || !Number.isFinite(Number(v))) return v;
          return +(Number(v) * factor).toFixed(1);
        });
      }

      function buildUserLtvSampleCohorts(start, end) {
        const dates = eachDateInclusive(start, end);
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const rows = [];
        dates.forEach((dateStr, dayOffsetFromStart) => {
          const dayOffset = dates.length - 1 - dayOffsetFromStart;
          const cohortDate = parseYMD(dateStr);
          const daysSince = Math.floor(
            (today.getTime() - cohortDate.getTime()) / 86400000,
          );
          // 已满 7 日的完整周期：每天 2 个渠道批次，方便对比多条完整曲线
          // 未满周期：每天 1 条，保留未到期「-」效果
          const tplCount = daysSince >= 7 ? 2 : dates.length <= 3 ? 2 : 1;
          for (let t = 0; t < tplCount; t++) {
            const channelIndex =
              (dayOffsetFromStart * 3 + t * 2) %
              USER_LTV_CHANNEL_TEMPLATES.length;
            const tpl = USER_LTV_CHANNEL_TEMPLATES[channelIndex];
            const countFactor = Math.max(
              0.72,
              1 - dayOffset * 0.015 - t * 0.04,
            );
            rows.push({
              date: dateStr,
              source: tpl.source,
              name: tpl.name,
              account: tpl.account,
              platform: tpl.platform,
              registerCount: Math.max(
                100,
                Math.round(tpl.registerCount * countFactor),
              ),
              ftdCount: Math.max(20, Math.round(tpl.ftdCount * countFactor)),
              gross: maskUserLtvIncompleteDays(
                scaleUserLtvSeries(tpl.gross, dayOffset, channelIndex),
                cohortDate,
                today,
              ),
              ftd: maskUserLtvIncompleteDays(
                scaleUserLtvSeries(tpl.ftd, dayOffset, channelIndex),
                cohortDate,
                today,
              ),
              net: maskUserLtvIncompleteDays(
                scaleUserLtvSeries(tpl.net, dayOffset, channelIndex),
                cohortDate,
                today,
              ),
              ggr: maskUserLtvIncompleteDays(
                scaleUserLtvSeries(tpl.ggr, dayOffset, channelIndex),
                cohortDate,
                today,
              ),
            });
          }
        });
        return rows;
      }

      function maskUserLtvIncompleteDays(series, cohortDate, todayDate) {
        const daysSince = Math.floor(
          (todayDate.getTime() - cohortDate.getTime()) / 86400000,
        );
        return (series || []).map((v, i) => {
          const dayN = i + 1;
          // 注册当日为 Day0：距今 >= N 天才有完整 Day N；今日及更近批次按未到期截断
          if (daysSince < dayN) return null;
          return v == null ? null : v;
        });

        const dayIdxs = USER_LTV_DAY_LABELS.map((d) => fullCols.indexOf(d));
        const dimIdxs = dimCols.map((c) => fullCols.indexOf(c));
        const map = new Map();

        rows.forEach((row) => {
          const key = dimIdxs.map((i) => row[i]).join("||");
          if (!map.has(key)) {
            map.set(key, {
              dims: dimIdxs.map((i) => row[i]),
              count: 0,
              dayWeighted: dayIdxs.map(() => 0),
              dayWeight: dayIdxs.map(() => 0),
            });
          }
          const item = map.get(key);
          const weight = Number(row[countIdx]) || 0;
          item.count += weight;
          dayIdxs.forEach((di, j) => {
            const val = row[di];
            if (val == null || val === "-" || !Number.isFinite(Number(val))) return;
            item.dayWeighted[j] += Number(val) * weight;
            item.dayWeight[j] += weight;
          });
        });

        return [...map.values()].map((item) => {
          const full = fullCols.map(() => "-");
          dimIdxs.forEach((di, i) => {
            full[di] = item.dims[i];
          });
          if (countIdx >= 0) full[countIdx] = item.count;
          dayIdxs.forEach((di, j) => {
            if (!item.dayWeight[j]) {
              full[di] = "-";
              return;
            }
            full[di] = item.dayWeighted[j] / item.dayWeight[j];
          });
          return visibleCols.map((col) => full[fullCols.indexOf(col)]);
        });
      }

      function buildUserLtvTableView(tabKey) {
        const filterState = getPageChannelFilterState();
        const cohorts = getFilteredUserLtvCohorts();
        const fullCols = getUserLtvFullCols(tabKey);
        const visibleCols = getChannelHierarchyVisibleCols(fullCols, filterState);
        const rawRows = buildUserLtvRawRows(tabKey, cohorts);
        const rows = aggregateUserLtvRows(
          rawRows,
          fullCols,
          visibleCols,
          tabKey,
        );
        return { cols: visibleCols, rows };
      }

      function formatUserLtvAxisValue(v) {
        const n = Number(v);
        if (!Number.isFinite(n)) return "-";
        const abs = Math.abs(n);
        if (abs >= 10000) {
          const wan = n / 10000;
          const text =
            Math.abs(wan) >= 100 || Number.isInteger(wan)
              ? String(Math.round(wan))
              : wan.toFixed(1);
          return `${text}万`;
        }
        return n.toLocaleString("zh-CN", {
          maximumFractionDigits: 1,
          minimumFractionDigits: 0,
        });
      }

      function formatUserLtvTipValue(v) {
        const n = Number(v);
        if (!Number.isFinite(n)) return "-";
        return `${n.toLocaleString("zh-CN", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        })}元/人`;
      }

      /** 图例/Tooltip 用的当前渠道分析对象文案 */
      function getPageChannelScopeLabel(filterState = getPageChannelFilterState()) {
        const { source, name, account } = filterState || {};
        const dim = getChannelAnalysisDimension(filterState);
        if (dim === "source") return isAllSourceChannel(source) ? "全部来源渠道" : source;
        if (dim === "name") return `${source} / ${name || "全部渠道名"}`;
        if (account) return `${source} / ${name} / ${account}`;
        return `${source} / ${name} / 全部渠道账号`;
      }

      function getUserLtvChannelScopeLabel(filterState) {
        return getPageChannelScopeLabel(filterState);

      /** 图表注册日期：只取筛选「开始日期」 */
      function getUserLtvChartRegisterDate() {
        const startEl = document.getElementById("globalStartDate")?.value;
        const endEl = document.getElementById("globalEndDate")?.value;
        if (startEl && endEl) return getOverviewFilterRange().start;
        return getOverviewRangeDates("complete7d").start;
      }

      /** 图表专用：仅开始日期对应注册批次，在当前渠道范围内聚合 */
      function getUserLtvChartCohorts() {
        const { source, name, account } = getPageChannelFilterState();
        const registerDate = getUserLtvChartRegisterDate();
        return buildUserLtvSampleCohorts(registerDate, registerDate)
          .filter((row) => {
            if (!isAllSourceChannel(source) && row.source !== source)
              return false;
            if (name && row.name !== name) return false;
            if (account && row.account !== account) return false;
            return true;
          });
      }

      /** 将同日多渠道批次加权聚合为一条 Gross / Net 曲线 */
      function aggregateUserLtvSingleDayTrend(cohorts) {
        const dayCount = USER_LTV_DAY_LABELS.length;
        const isPresent = (v) =>
          v != null && v !== "" && v !== "-" && Number.isFinite(Number(v));
        const grossSum = Array(dayCount).fill(0);
        const grossWeight = Array(dayCount).fill(0);
        const netSum = Array(dayCount).fill(0);
        const netWeight = Array(dayCount).fill(0);
        let registerDate = "";

        cohorts.forEach((c) => {
          registerDate = registerDate || c.date;
          const weight = Number(c.registerCount) || 0;
          const gross = c.gross || [];
          const net = c.net || [];
          for (let i = 0; i < dayCount; i++) {
            if (isPresent(gross[i]) && weight > 0) {
              grossSum[i] += Number(gross[i]) * weight;
              grossWeight[i] += weight;
            }
            if (isPresent(net[i]) && weight > 0) {
              netSum[i] += Number(net[i]) * weight;
              netWeight[i] += weight;
            }
          }
        });

        return {
          date: registerDate || getUserLtvChartRegisterDate(),
          gross: grossWeight.map((w, i) => (w ? grossSum[i] / w : null)),
          net: netWeight.map((w, i) => (w ? netSum[i] / w : null)),
        };
      }

      function renderUserLtvTrendChart(opts = {}) {
        const dayLabels = USER_LTV_DAY_LABELS;
        const filterState = getPageChannelFilterState();
        const channelScope = getUserLtvChannelScopeLabel(filterState);
        const cohorts = getUserLtvChartCohorts();
        const trend = aggregateUserLtvSingleDayTrend(cohorts);
        const registerDate = trend.date;
        const isPresent = (v) =>
          v != null && v !== "" && v !== "-" && Number.isFinite(Number(v));

        const series = [
          {
            metricLabel: "Gross LTV",
            color: "#165DFF",
            data: trend.gross,
          },
          {
            metricLabel: "Net LTV",
            color: "#14C9C9",
            data: trend.net,
          },
        ];

        const hasData = series.some((s) => s.data.some(isPresent));
        const allVals = series.flatMap((s) =>
          s.data.filter(isPresent).map(Number),
        );
        const yAbsMax = Math.max(...allVals.map(Math.abs), 1);
        const yMin = allVals.length ? Math.min(...allVals, 0) : 0;
        const yMax = allVals.length ? Math.max(...allVals, 0) : yAbsMax;
        const padY = (yMax - yMin) * 0.12 || yAbsMax * 0.12;
        const axisMin = yMin < 0 ? yMin - padY : 0;
        const axisMax = yMax + padY;

        const W = 780,
          H = STANDARD_CHART_HEIGHT,
          padL = 58,
          padR = 24,
          padT = 28,
          padB = 36;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;
        const n = dayLabels.length;
        const xPos = (i) =>
          padL + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW);
        const yPos = (v) =>
          padT + plotH * (1 - (Number(v) - axisMin) / (axisMax - axisMin || 1));

        let grid = "",
          yLabels = "",
          xLabelsHtml = "";
        for (let i = 0; i <= 4; i++) {
          const val = axisMax - ((axisMax - axisMin) / 4) * i;
          const y = padT + (plotH / 4) * i;
          grid += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"></line>`;
          if (axisMin < 0 && Math.abs(val) < (axisMax - axisMin) * 0.02) {
            grid += `<line class="grid-line" x1="${padL}" y1="${yPos(0)}" x2="${W - padR}" y2="${yPos(0)}" stroke-dasharray="4 3"></line>`;
          }
          yLabels += `<text class="axis-label" x="${padL - 8}" y="${y + 4}" text-anchor="end">${formatUserLtvAxisValue(val)}</text>`;
        }
        dayLabels.forEach((lab, i) => {
          xLabelsHtml += `<text class="axis-label" x="${xPos(i)}" y="${H - 12}" text-anchor="middle">${lab.replace(" ", "")}</text>`;
        });

        const drawLine = (data, color) => {
          let html = "";
          let segment = [];
          const flush = () => {
            if (segment.length >= 2) {
              html += `<polyline fill="none" stroke="${color}" stroke-width="2.5" points="${segment.join(" ")}"></polyline>`;
            }
            segment = [];
          };
          data.forEach((v, i) => {
            if (!isPresent(v)) {
              flush();
              return;
            }
            segment.push(`${xPos(i)},${yPos(Number(v))}`);
          });
          flush();
          return html;
        };

        const linesHtml = series.map((s) => drawLine(s.data, s.color)).join("");
        const tipLabels = dayLabels.map(
          (d) =>
            `注册日期：${registerDate}<br/>渠道维度：${channelScope}<br/>生命周期：${d.replace(" ", "")}`,
        );
        const tipPoints = dayLabels.map((_, i) =>
          series
            .filter((s) => isPresent(s.data[i]))
            .map((s) => ({
              name: s.metricLabel,
              color: s.color,
              x: xPos(i),
              y: yPos(Number(s.data[i])),
              text: formatUserLtvTipValue(s.data[i]),
            })),
        );

        const legend = series
          .map(
            (s) =>
              `<span><i style="background:${s.color}"></i>${registerDate} · ${channelScope} · ${s.metricLabel}</span>`,
          )
          .join("");

        return renderStandardChartCard({
          key: opts.chartKey || "user-ltv-gross-net-trend",
          title: "Gross LTV与净入金LTV趋势分析",
          metrics: ["Gross LTV", "Net LTV"],
          titleTip:
            "以当前筛选日期范围的开始日期作为注册日期，展示该日期注册用户批次在当前渠道筛选条件下的 Gross LTV 与 Net LTV 生命周期累计变化趋势，X轴为用户生命周期（Day1-Day7），Y轴为平均用户价值（元/人）。",
          expandable: false,
          body: `
            ${
              hasData
                ? `${renderComboChartWithTip(
                    `${grid}${linesHtml}${yLabels}${xLabelsHtml}`,
                    {
                      labels: tipLabels,
                      points: tipPoints,
                      layout: { W, H, padL, padR, padT, padB, xMode: "spread" },
                    },
                  )}
                <div class="line-legend">${legend}</div>`
                : `<div class="user-ltv-empty" style="border:none;padding:32px 12px">暂无图表数据</div>`
            }`,
        });
      }

      function renderUserLtvPageContent() {

      function initUserLtvPage() {
