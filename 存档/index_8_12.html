      function renderGameMetricTable(config) {
        const stickyCount = 3;
        const baseCols = ["游戏平台", "游戏厂商", "游戏名称"];
        const cols = config.groups
          ? config.groups.flatMap((g) => g.cols)
          : [...baseCols, ...config.metricCols];
        const groups = config.groups || null;

        let groupRow = "";
        if (groups) {
          let colOffset = 0;
          groups.forEach((g) => {
            const groupStart = colOffset;
            const groupEnd = colOffset + g.cols.length;
            const stickyColsInGroup = Math.max(
              0,
              Math.min(groupEnd, stickyCount) - groupStart,
            );
            const stickyCls =
              stickyColsInGroup === g.cols.length && stickyColsInGroup > 0
                ? " sticky-group-head"
                : "";
            groupRow += `<th class="${g.cls || ""}${stickyCls}" colspan="${g.cols.length}">${g.name}</th>`;
            colOffset = groupEnd;
          });
        }

        const head = cols
          .map((c, i) => {
            const stickyCls = i < stickyCount ? `sticky-col-${i + 1}` : "";
            return renderTableHeaderCell(c, stickyCls);
          })
          .join("");
        const body = config.rows
          .map((row, ri) => {
            const isTotal = ri === config.rows.length - 1;
            const cells = row
              .map((cell, i) => {
                const stickyCls = i < stickyCount ? `sticky-col-${i + 1}` : "";
                const val =
                  typeof cell === "number"
                    ? cell.toLocaleString("zh-CN")
                    : cell;
                return `<td class="${stickyCls}${isTotal ? " is-total" : ""}">${val}</td>`;
              })
              .join("");
            return `<tr class="${isTotal ? "total-row" : ""}">${cells}</tr>`;
          })
          .join("");
        return `
          <div class="table-wrap">
            <table class="data-table${groups ? " has-group-header" : ""}">
              <thead>
                ${groups ? `<tr class="group-row">${groupRow}</tr>` : ""}
                <tr class="col-row">${head}</tr>
              </thead>
              <tbody>${body}</tbody>
            </table>
          </div>
          <div class="pagination">
            <button disabled>‹</button>
            <button class="active">1</button>
            <button>2</button>
            <button>3</button>
            <button>›</button>
            <span class="pagination-info">共 ${config.rows.length - 1} 条</span>
          </div>`;
      }

      function renderGameActivityStructureArea() {
        const dayCount = 30;
        const labels = buildRecentTrendLabels(dayCount);
        const newPlayers = genTrendSeries(dayCount, 2680, 3260, 180);
        const oldPlayers = genTrendSeries(dayCount, 8520, 9320, 260);
        newPlayers[dayCount - 1] = 3260;
        oldPlayers[dayCount - 1] = 9320;
        const total = newPlayers.map((v, i) => v + oldPlayers[i]);

        const W = 620,
          H = 260,
          padL = 52,
          padR = 16,
          padT = 20,
          padB = 32;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;
        const maxVal = 15000;
        const n = labels.length;
        const xPos = (i) =>
          padL + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW);
        const yPos = (v) => padT + plotH * (1 - v / maxVal);
        const zeroLine = new Array(n).fill(0);

        let grid = "",
          yLabels = "",
          xLabels = "";
        for (let i = 0; i <= 5; i++) {
          const val = (maxVal / 5) * i;
          const y = yPos(val);
          grid += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"></line>`;
          yLabels += `<text class="axis-label" x="${padL - 8}" y="${y + 3}" text-anchor="end">${Math.round(val).toLocaleString("zh-CN")}</text>`;
        }
        labels.forEach((lab, i) => {
          if (i % 5 === 0 || i === n - 1) {
            xLabels += `<text class="axis-label" x="${xPos(i)}" y="${H - 8}" text-anchor="middle">${lab}</text>`;
          }
        });

        const oldArea = buildStackedAreaPath(oldPlayers, zeroLine, xPos, yPos);
        const newArea = buildStackedAreaPath(total, oldPlayers, xPos, yPos);
        const tipPoints = labels.map((_, i) => [
          {
            name: "新增投注玩家",
            color: "#14C9C9",
            x: xPos(i),
            y: yPos(total[i]),
            text: formatChartTipNumber(newPlayers[i]),
          },
          {
            name: "老投注玩家",
            color: "#165DFF",
            x: xPos(i),

      function renderGameActivityTop10Chart(
        data,
        valueLabel,
        suffix = "",
        options = {},
      ) {
        const W = 620;
        const H = options.height || 300;
        const padL = 150;
        const padR = suffix === "sec" ? 96 : 72;
        const padT = 16;
        const padB = 14;
        const plotW = W - padL - padR;
        const rowH = (H - padT - padB) / data.length;
        const maxVal = Math.max(...data.map((item) => item.value));
        const rows = data
          .map((item, index) => {
            const y = padT + index * rowH;
            const width = (item.value / maxVal) * plotW;
            let display;
            if (suffix === "%") {
              display = `${item.value.toFixed(1)}%`;
            } else if (suffix === "¥") {
              const num = Number(item.value);
              display =
                "¥" +
                (Number.isInteger(num)
                  ? num.toLocaleString("zh-CN")
                  : num.toLocaleString("zh-CN", {
                      minimumFractionDigits: 1,
                      maximumFractionDigits: 1,
                    }));
            } else if (suffix === "sec") {
              display = formatStaySec(item.value);
            } else {
              display = item.value.toLocaleString("zh-CN");
            }
            const barH = Math.max(10, rowH - 8);
            const barY = y + (rowH - barH) / 2;
            return `<text class="axis-label" x="${padL - 10}" y="${y + rowH / 2 + 4}" text-anchor="end">${index + 1}. ${item.name}</text><rect x="${padL}" y="${barY}" width="${plotW}" height="${barH}" rx="3" fill="#f2f3f5"></rect><rect x="${padL}" y="${barY}" width="${width}" height="${barH}" rx="3" fill="${index < 3 ? "#165DFF" : "#14C9C9"}"></rect><text class="axis-label" x="${padL + width + 8}" y="${y + rowH / 2 + 4}">${display}</text>`;
          })
          .join("");
        return `<div class="combo-chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${valueLabel} Top10 横向柱状排行榜">${rows}</svg></div>`;
      }

      function renderGameActivityScaleTrend() {
        const dayCount = 30;
        const labels = buildRecentTrendLabels(dayCount);
        const dau = genTrendSeries(dayCount, 3800, 4280, 120);
        const totalBet = genTrendSeries(dayCount, 1600000, 1934960, 80000);
        dau[dayCount - 1] = 4280;
        totalBet[dayCount - 1] = 1934960;

        const W = 620,
          H = 240,
          padL = 58,
          padR = 58,
          padT = 20,
          padB = 32;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;
        const n = labels.length;
        const step = plotW / n;
        const barW = Math.min(10, step * 0.55);
        const leftMax = 2400000;
        const rightMax = 5000;
        const yTotal = (v) => padT + plotH * (1 - v / leftMax);
        const yDau = (v) => padT + plotH * (1 - v / rightMax);
        const fmtMoneyAxis = (v) =>
          v >= 10000 ? (v / 10000).toFixed(0) + "万" : String(v);

        let grid = "",
          leftAxis = "",
          rightAxis = "";
        for (let i = 0; i <= 4; i++) {
          const y = padT + (plotH / 4) * i;
          grid += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"></line>`;
          leftAxis += `<text class="axis-label" x="${padL - 8}" y="${y + 3}" text-anchor="end">${fmtMoneyAxis(leftMax - (leftMax / 4) * i)}</text>`;
          rightAxis += `<text class="axis-label" x="${W - padR + 8}" y="${y + 3}" text-anchor="start">${Math.round(rightMax - (rightMax / 4) * i).toLocaleString("zh-CN")}</text>`;
        }

        let bars = "",
          xLabels = "",
          dauPts = "",
          dauDots = "";
        const tipPoints = [];
        labels.forEach((lab, i) => {
          const cx = padL + step * i + step / 2;
          const barTop = yTotal(totalBet[i]);
          bars += `<rect x="${cx - barW / 2}" y="${barTop}" width="${barW}" height="${padT + plotH - barTop}" rx="2" fill="#165DFF"></rect>`;
          const dy = yDau(dau[i]);
          dauPts += `${i ? " " : ""}${cx},${dy}`;
          dauDots += `<circle cx="${cx}" cy="${dy}" r="2.5" fill="#fff" stroke="#14C9C9" stroke-width="1.5"></circle>`;
          tipPoints.push([
            {
              name: "总投注金额",
              color: "#165DFF",
              x: cx,
              y: barTop,
              text: formatGameMoney(totalBet[i]),
            },
            {
              name: "投注用户DAU",
              color: "#14C9C9",
              x: cx,
              y: dy,
              text: dau[i].toLocaleString("zh-CN"),
            },
          ]);
          if (i % 5 === 0 || i === n - 1) {
            xLabels += `<text class="axis-label" x="${cx}" y="${H - 8}" text-anchor="middle">${lab}</text>`;
          }
        });

        return `
        ${renderComboChartWithTip(
          `<text class="axis-title" x="${padL - 8}" y="${padT - 4}" text-anchor="end">总投注金额</text>
            <text class="axis-title" x="${W - padR + 8}" y="${padT - 4}" text-anchor="start">投注用户DAU</text>
            ${grid}${bars}
            <polyline fill="none" stroke="#14C9C9" stroke-width="2.5" points="${dauPts}"></polyline>
            ${dauDots}${leftAxis}${rightAxis}${xLabels}`,
          {
            labels,
            points: tipPoints,
            layout: { W, H, padL, padR, padT, padB, xMode: "band" },
          },
        )}
        <div class="line-legend">
          <span><i style="background:#165DFF"></i>总投注金额</span>
          <span><i style="background:#14C9C9"></i>投注用户DAU</span>
        </div>`;
      }

      function renderGameValueProfitTrend() {
        const dayCount = 30;
        const labels = buildRecentTrendLabels(dayCount);
        const ggr = genTrendSeries(dayCount, 520000, 628500, 18000);
        const winlose = genTrendSeries(dayCount, 470000, 573300, 16000);
        ggr[dayCount - 1] = 628500;
        winlose[dayCount - 1] = 573300;

        const W = 620,
          H = 240,
          padL = 58,
          padR = 58,
          padT = 20,
          padB = 32;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;
        const n = labels.length;
        const step = plotW / n;
        const barW = Math.min(10, step * 0.55);
        const leftMax = 700000;
        const rightMax = 700000;
        const yGgr = (v) => padT + plotH * (1 - v / leftMax);
        const yWin = (v) => padT + plotH * (1 - v / rightMax);
        const fmtAxis = (v) =>
          v >= 10000 ? (v / 10000).toFixed(0) + "万" : String(v);

        let grid = "",
          leftAxis = "",
          rightAxis = "";
        for (let i = 0; i <= 4; i++) {
          const y = padT + (plotH / 4) * i;
          grid += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"></line>`;
          leftAxis += `<text class="axis-label" x="${padL - 8}" y="${y + 3}" text-anchor="end">${fmtAxis(leftMax - (leftMax / 4) * i)}</text>`;
          rightAxis += `<text class="axis-label" x="${W - padR + 8}" y="${y + 3}" text-anchor="start">${fmtAxis(rightMax - (rightMax / 4) * i)}</text>`;
        }

        let bars = "",
          xLabels = "",
          linePts = "",
          dots = "";
        const tipPoints = [];
        labels.forEach((lab, i) => {
          const cx = padL + step * i + step / 2;
          const barTop = yGgr(ggr[i]);
          bars += `<rect x="${cx - barW / 2}" y="${barTop}" width="${barW}" height="${padT + plotH - barTop}" rx="2" fill="#165DFF"></rect>`;
          const ly = yWin(winlose[i]);
          linePts += `${i ? " " : ""}${cx},${ly}`;
          dots += `<circle cx="${cx}" cy="${ly}" r="2.5" fill="#fff" stroke="#FF7D00" stroke-width="1.5"></circle>`;
          tipPoints.push([
            {
              name: "GGR",
              color: "#165DFF",
              x: cx,
              y: barTop,
              text: formatGameMoney(ggr[i]),
            },
            {
              name: "平台游戏输赢",
              color: "#FF7D00",
              x: cx,
              y: ly,
              text: formatGameMoney(winlose[i]),
            },
          ]);
          if (i % 5 === 0 || i === n - 1) {
            xLabels += `<text class="axis-label" x="${cx}" y="${H - 8}" text-anchor="middle">${lab}</text>`;
          }
        });

        return `
        ${renderComboChartWithTip(
          `<text class="axis-title" x="${padL - 8}" y="${padT - 4}" text-anchor="end">GGR</text>
            <text class="axis-title" x="${W - padR + 8}" y="${padT - 4}" text-anchor="start">平台游戏输赢</text>
            ${grid}${bars}
            <polyline fill="none" stroke="#FF7D00" stroke-width="2.5" points="${linePts}"></polyline>
            ${dots}${leftAxis}${rightAxis}${xLabels}`,
          {
            labels,
            points: tipPoints,
            layout: { W, H, padL, padR, padT, padB, xMode: "band" },
          },
        )}
        <div class="line-legend">
          <span><i style="background:#165DFF"></i>GGR</span>
          <span><i style="background:#FF7D00"></i>平台游戏输赢</span>
        </div>`;
      }

      function bindGameMetricChartFocus(root = document, wrapId) {
        const wrap = root.querySelector(wrapId);
        if (!wrap || wrap.dataset.focusBound === "1") return;
        wrap.dataset.focusBound = "1";

        const expandableCards = [
          ...wrap.querySelectorAll(".ga-chart-expandable"),
        ];
        // 单图表展示：移除放大提示文案
        if (expandableCards.length <= 1) {
          wrap
            .querySelectorAll(".ga-chart-expand-hint, .chart-expand-hint")
            .forEach((el) => el.remove());
        }

        const setFocus = (key) => {
          if (!key) {
            wrap.classList.remove("is-focus-mode");
            wrap
              .querySelectorAll(".ga-chart-card")
              .forEach((card) => card.classList.remove("is-focused"));
            requestAnimationFrame(() => resizeChartHosts(wrap));
            return;
          }
          wrap.classList.add("is-focus-mode");
          wrap.querySelectorAll(".ga-chart-card").forEach((card) => {
            card.classList.toggle("is-focused", card.dataset.chartKey === key);
          });
          requestAnimationFrame(() => resizeChartHosts(wrap));
        };

        wrap.addEventListener("click", (e) => {
          if (e.target.closest(".ga-metric-help")) {
            e.preventDefault();
            e.stopPropagation();
            return;
          }
          if (e.target.closest(CHART_FOCUS_IGNORE_SEL)) return;
          const card = e.target.closest(
            ".ga-chart-expandable, .ga-chart-static",
          );
          if (!card?.dataset.chartKey) return;
          const key = card.dataset.chartKey;
          if (
            wrap.classList.contains("is-focus-mode") &&
            card.classList.contains("is-focused")
          ) {
            setFocus(null);
          } else {
            setFocus(key);
          }
        });
      }

      const CHART_EXPAND_HINT_HTML =
        '<span class="chart-expand-hint" aria-hidden="true"><span class="ga-expand-tip">点击图表可放大展示</span><span class="ga-collapse-tip">再次点击可缩小</span></span>';
      const CHART_FOCUS_IGNORE_SEL =
        "button, a, input, select, textarea, label, option, .ms-wrap, .ms-dropdown, .ms-trigger, .ms-option, .ms-tag, .filter-bar, .filter-item, .filter-bar-local, .chart-range-toggle, .range-tab, .range-btn, .ga-metric-help, .vt-btn, .view-toggle, .realtime-filters, .realtime-refresh, .realtime-date-range, .overview-date-bar, .overview-component-date-bar, .overview-range-tabs, .toolbar-actions, .btn";

      function resizeChartHosts(root) {
        if (!root || !window.echarts) return;
        root.querySelectorAll("div").forEach((el) => {
          const inst = window.echarts.getInstanceByDom(el);
          if (inst) inst.resize();
        });
      }

      function clearAllChartFocus(root = document) {
        root
          .querySelectorAll(".chart-focus-group.is-focus-mode")
          .forEach((wrap) => {
            wrap.classList.remove("is-focus-mode");
            wrap
              .querySelectorAll(".is-focused")
              .forEach((card) => card.classList.remove("is-focused"));
          });
        root
          .querySelectorAll(".game-metric-charts.is-focus-mode")
          .forEach((wrap) => {
            wrap.classList.remove("is-focus-mode");
            wrap
              .querySelectorAll(".is-focused")
              .forEach((card) => card.classList.remove("is-focused"));
          });
      }

      function ensureChartExpandHint(card) {
        if (card.classList.contains("ga-chart-card")) return;
        if (card.classList.contains("no-chart-zoom")) return;
        // 分时数据对比：不展示放大提示文案
        if (card.classList.contains("realtime-panel") || card.id === "realtimePanel") {
          return;
        }
        // 单图表展示：不展示放大提示文案
        const focusGroup = card.closest(".chart-focus-group, .overview-charts");
        if (
          focusGroup?.classList.contains("chart-focus-solo") ||
          (focusGroup &&
            [...focusGroup.children].filter((el) =>
              el.classList?.contains("chart-expandable"),
            ).length <= 1)
        ) {
          card
            .querySelectorAll(".chart-expand-hint, .ga-chart-expand-hint")
            .forEach((el) => el.remove());
          return;
        }
        if (card.querySelector(".chart-expand-hint, .ga-chart-expand-hint")) {
          return;
        }
        const title =
          card.querySelector(":scope > .chart-title") ||
          card.querySelector(":scope > .realtime-panel-head .chart-title") ||
          card.querySelector(":scope > .realtime-panel-head");
        if (title) {
          title.insertAdjacentHTML("beforeend", CHART_EXPAND_HINT_HTML);
        } else {
          card.insertAdjacentHTML("afterbegin", CHART_EXPAND_HINT_HTML);
        }
      }

      function bindChartFocusGroup(wrap) {
        if (!wrap || wrap.dataset.focusBound === "1") return;
        wrap.dataset.focusBound = "1";

        const cards = () =>
          [...wrap.children].filter(
            (el) =>
              el.classList?.contains("chart-expandable") && el.dataset.chartKey,
          );

        const setFocus = (key) => {
          if (!key) {
            wrap.classList.remove("is-focus-mode");
            cards().forEach((card) => card.classList.remove("is-focused"));
            requestAnimationFrame(() => resizeChartHosts(wrap));
            return;
          }
          wrap.classList.add("is-focus-mode");
          cards().forEach((card) => {
            card.classList.toggle("is-focused", card.dataset.chartKey === key);
          });
          requestAnimationFrame(() => resizeChartHosts(wrap));
        };

        wrap.addEventListener("click", (e) => {
          if (e.target.closest(CHART_FOCUS_IGNORE_SEL)) return;
          const card = e.target.closest(".chart-expandable");
          if (!card || !cards().includes(card)) return;
          const key = card.dataset.chartKey;
          if (
            wrap.classList.contains("is-focus-mode") &&
            card.classList.contains("is-focused")
          ) {
            setFocus(null);
          } else {
            setFocus(key);
          }
        });
      }

      function setupChartFocusGroup(wrap) {
        if (!wrap) return;
        wrap.classList.add("chart-focus-group");

        const cards = [...wrap.children].filter(
          (el) =>
            el.classList?.contains("chart-card") ||
            el.classList?.contains("realtime-panel"),
        );

        cards.forEach((card, index) => {
          if (card.classList.contains("ga-chart-card")) return;
          if (card.classList.contains("no-chart-zoom")) return;
          card.classList.add("chart-expandable");
          if (!card.dataset.chartKey) {
            card.dataset.chartKey = `focus-${index + 1}`;
          }
        });

        const expandableCount = cards.filter((c) =>
          c.classList.contains("chart-expandable"),
        ).length;
        wrap.classList.toggle("chart-focus-solo", expandableCount <= 1);

        // 单图表不展示放大提示；多图才追加提示文案
        cards.forEach((card) => {
          if (card.classList.contains("ga-chart-card")) return;
          if (card.classList.contains("no-chart-zoom")) return;
          if (expandableCount <= 1) {
            card
              .querySelectorAll(".chart-expand-hint, .ga-chart-expand-hint")
              .forEach((el) => el.remove());
            return;
          }
          ensureChartExpandHint(card);
        });

        bindChartFocusGroup(wrap);
      }

      function initChartFocusGroups(root = document) {
        // 经营总览：三图共用一个聚焦组，放大时其余图进入右侧缩略列表
        root.querySelectorAll(".overview-charts").forEach((wrap) => {
          setupChartFocusGroup(wrap);
        });

        root.querySelectorAll(".chart-grid").forEach((grid) => {
          if (grid.closest(".game-metric-charts, .overview-charts")) return;
          setupChartFocusGroup(grid);
        });

        [...root.querySelectorAll(".chart-card")].forEach((card) => {
          if (card.classList.contains("ga-chart-card")) return;
          if (card.classList.contains("no-chart-zoom")) return;
          if (
            card.closest(
              ".chart-grid, .game-metric-charts, .chart-focus-group, .overview-charts",
            )
          ) {
            return;
          }
          const wrap = document.createElement("div");
          wrap.className = "chart-focus-group chart-focus-solo";
          card.parentNode.insertBefore(wrap, card);
          wrap.appendChild(card);
          setupChartFocusGroup(wrap);
        });

        root.querySelectorAll(".realtime-panel").forEach((panel) => {
          if (panel.closest(".chart-focus-group")) return;

      function hashPathFlow(parent, child) {
        let hash = 0;
        const key = `${parent}->${child}`;
        for (let i = 0; i < key.length; i += 1) {
          hash = (hash << 5) - hash + key.charCodeAt(i);
          hash |= 0;
        }
        return 12000 + (Math.abs(hash) % 88000);
      }

      function getAppPathSankeyData() {
        const nodeMap = new Map();
        const displayMap = {};
        const links = [];

        const ensureNode = (level, display) => {
          const name = `L${level}-${display}`;
          if (!nodeMap.has(name)) {
            nodeMap.set(name, { name, display });
            displayMap[name] = display;
          }
          return name;
        };

        (PATH_PAGE_TREE[""] || []).forEach((l1) => {
          const l1Id = ensureNode(1, l1);
          (PATH_PAGE_TREE[l1] || []).forEach((l2) => {
            const l2Id = ensureNode(2, l2);
            links.push({
              source: l1Id,
              target: l2Id,
              value: hashPathFlow(l1, l2),
            });
            (PATH_PAGE_TREE[l2] || []).forEach((l3) => {
              const l3Id = ensureNode(3, l3);
              links.push({
                source: l2Id,
                target: l3Id,
                value: hashPathFlow(l2, l3),
              });
            });
          });
        });

        const nodes = [...nodeMap.values()].map((n) => ({ name: n.name }));
        return { nodes, links, displayMap };

      function hexToRgba(hex, alpha) {
        const h = String(hex || "#165dff").replace("#", "");
        const full =
          h.length === 3
            ? h
                .split("")
                .map((c) => c + c)
                .join("")
            : h;
        const n = parseInt(full, 16);
        const r = (n >> 16) & 255;
        const g = (n >> 8) & 255;
        const b = n & 255;
        return `rgba(${r},${g},${b},${alpha})`;
      }

      /** 同色系按名次降低透明度，区分层次 */
      function getAppExpRankOpacity(index, total) {
        if (total <= 1) return 1;
        const maxA = 1;
        const minA = 0.36;
        return maxA - (index / (total - 1)) * (maxA - minA);
      }

      function formatDurationSec(sec) {
        const s = Math.max(0, Math.round(sec));
        if (s < 60) return `${s}秒`;
        const m = Math.floor(s / 60);
        const rs = s % 60;
        if (m < 60) return rs ? `${m}分${rs}秒` : `${m}分`;
        const h = Math.floor(m / 60);
        const rm = m % 60;
        return rm ? `${h}时${rm}分` : `${h}时`;
      }

      function getAppExpMetricValue(row, metric) {
        switch (metric) {
          case "页面访问次数":

          case "页面平均加载时长":
            return row.avgLoadSec;
          case "页面停留时长":
            return row.stayTotalSec;
          case "页面平均停留时长":
            return row.avgStaySec.all;
          case "页面平均访问深度":
            return row.depth;
          case "页面跳出率":
            return row.bounce;
          default:
            return 0;
        }
      }

      function formatAppExpMetricDisplay(value, metric) {
        if (metric === "页面访问次数") return value.toLocaleString("zh-CN");
        if (

          metric === "页面停留时长" ||
          metric === "页面平均停留时长"
        ) {
          return formatDurationSec(value);
        }
        return `${Number(value).toFixed(2)}%`;
      }

      function getAppChurnFilterKey() {

      function getAllChurnPagesFlat() {
        const pages = [];
        const seen = new Set();
        function walk(path) {
          getChurnPagesAtPath(path).forEach((name) => {
            if (seen.has(name)) return;
            seen.add(name);
            pages.push(name);
            walk([...path, name]);
          });
        }
        walk([]);
        return pages;
      }

      function getChurnPageLevel(pageName) {
        function dfs(path, depth) {
          const children = getChurnPagesAtPath(path);
          for (const child of children) {
            if (child === pageName) return depth;
            const found = dfs([...path, child], depth + 1);
            if (found >= 0) return found;
          }
          return -1;
        }
        return dfs([], 0);
      }

      function getChurnPageLevelLabel(pageName) {
        const level = getChurnPageLevel(pageName);
        return ["一级页面", "二级页面", "三级页面"][level] || "页面";
      }

      function parseChurnStaySeconds(raw) {
        const text = String(raw || "");
        const minMatch = text.match(/(\d+)分/);
        const secMatch = text.match(/(\d+)秒/);
        return (
          (minMatch ? Number(minMatch[1]) * 60 : 0) +
          (secMatch ? Number(secMatch[1]) : 0)
        );
      }

      function parseChurnPercent(raw) {
        return parseFloat(String(raw).replace("%", "")) || 0;
      }

      function getChurnMetricNumeric(pageName, metric, filterKey) {
        const raw = getChurnMetricRaw(pageName, metric, filterKey);
        if (metric === "平均停留时长") return parseChurnStaySeconds(raw);
        return parseChurnPercent(raw);
      }

      function pickChurnExtremePage(metric, mode, filterKey) {
        const pages = getAllChurnPagesFlat();
        if (!pages.length) {
          return { page: "-", value: "-", levelLabel: "-" };
        }
        const higherIsBetter =
          metric === "平均停留时长" ||
          metric === "充值转化率" ||
          metric === "投注转化率";
        const wantMax =
          mode === "best"
            ? metric === "流失率" || higherIsBetter
            : metric === "流失率";
        let bestPage = pages[0];
        let bestVal = getChurnMetricNumeric(bestPage, metric, filterKey);
        pages.forEach((pageName) => {
          const val = getChurnMetricNumeric(pageName, metric, filterKey);
          if (wantMax ? val > bestVal : val < bestVal) {
            bestPage = pageName;
            bestVal = val;
          }
        });
        return {
          page: bestPage,
          value: getChurnMetricRaw(bestPage, metric, filterKey),
          levelLabel: getChurnPageLevelLabel(bestPage),
        };
      }

      function hashPageSeed(name) {
        let hash = 0;
        for (let i = 0; i < name.length; i += 1) {
          hash = (hash << 5) - hash + name.charCodeAt(i);
          hash |= 0;
        }
        return Math.abs(hash);
      }

      function getChurnMetricRaw(pageName, metric, filterKey = getAppChurnFilterKey()) {
        const seed = hashPageSeed(`${pageName}-${metric}-${filterKey}`);
        const r = (seed % 1000) / 1000;
        switch (metric) {
          case "流失率":
            return `${(18 + r * 52).toFixed(1)}%`;
          case "平均停留时长": {
            const sec = Math.round(35 + r * 520);
            if (sec >= 60) {
              const m = Math.floor(sec / 60);
              const s = sec % 60;
              return `${m}分${s}秒`;
            }
            return `${sec}秒`;
          }
          case "充值转化率":
            return `${(4 + r * 28).toFixed(1)}%`;
          case "投注转化率":
            return `${(6 + r * 34).toFixed(1)}%`;
          default:
            return "-";
        }
      }

      function getChurnMetricScore(pageName, metric, filterKey = getAppChurnFilterKey()) {
        const seed = hashPageSeed(`${pageName}-${metric}-${filterKey}`);
        const r = (seed % 1000) / 1000;
        switch (metric) {
          case "流失率":
            return Math.round(18 + r * 52);
          case "平均停留时长":
            return Math.round(35 + r * 520);
          case "充值转化率":
            return Math.round(4 + r * 28);
          case "投注转化率":
            return Math.round(6 + r * 34);
          default:
            return 0;
        }
      }

      function getChurnPagesAtPath(path) {
        const key = path.length ? path[path.length - 1] : "";
        return CHURN_PAGE_TREE[key] || [];
      }

      function hasChurnChildren(pageName) {
        if (appChurnDrillPath.length >= CHURN_MAX_DRILL_DEPTH) return false;

      function buildChurnHeatmapData(pages, filterKey = getAppChurnFilterKey()) {
        const data = [];
        let maxScore = 1;
        pages.forEach((page, x) => {
          CHURN_METRICS.forEach((metric, y) => {
            const score = getChurnMetricScore(page, metric, filterKey);
            maxScore = Math.max(maxScore, score);
            data.push({
              value: [x, y, score],
              page,
              metric,
              raw: getChurnMetricRaw(page, metric, filterKey),
            });
          });
        });
        return { data, maxScore };
      }

          },

        appChurnHeatmapChart.resize();

      function getPathEventMeta(eventId) {
        return (
          PATH_KEY_EVENTS.find((e) => e.id === eventId) || PATH_KEY_EVENTS[0]
        );
      }

      function getPathExploreVariantKey(eventId, direction) {
        const sd = pathExploreState.startDate || "";
        const ed = pathExploreState.endDate || "";
        const channel = pathExploreState.channel || "全部";
        const userType = pathExploreState.userType || "全部用户";
        return `${eventId}|${direction}|${channel}|${userType}|${sd}|${ed}`;
      }

      function getPathTargetUsers(eventId, direction) {
        const variantKey = getPathExploreVariantKey(eventId, direction);
        const seed = hashCoreFlowSeed(variantKey);
        return 48000 + (seed % 52000);
      }

      function scalePathSteps(steps, depth) {
        if (steps.length === depth) return steps;
        if (steps.length > depth) return steps.slice(-depth);
        const padStep = [
          { name: "首页", share: 58 },
          { name: "侧边栏", share: 22 },
          { name: "Other", share: 20 },
        ];
        const padded = [...steps];
        while (padded.length < depth) padded.unshift(padStep);
        return padded;
      }

      function normalizePathNodes(rawNodes, columnUsers, variantKey) {
        const weighted = rawNodes.map((n) => {
          const nodeSeed = hashCoreFlowSeed(`${variantKey}::${n.name}`);
          // 让不同国家/平台下节点权重有明显差异
          const factor = 0.78 + ((nodeSeed % 1000) / 1000) * 0.44; // 0.78 ~ 1.22
          return { ...n, weight: n.share * factor };
        });

        const sum = weighted.reduce((s, n) => s + n.weight, 0) || 1;
        return weighted.map((n) => ({
          name: n.name,
          users: Math.round((columnUsers * n.weight) / sum),
          pct: `${((n.weight / sum) * 100).toFixed(1)}%`,
          expandable: !!PATH_EXPAND_CHILDREN[n.name],
        }));
      }

      function getChildPathNodes(parentName, parentUsers, variantKey) {
        const children = PATH_EXPAND_CHILDREN[parentName] || [];
        if (!children.length) return [];

        const baseWeights = children.map((name, i) => {
          const nodeSeed = hashCoreFlowSeed(
            `${variantKey}::child::${parentName}::${name}`,
          );
          const factor = 0.78 + ((nodeSeed % 1000) / 1000) * 0.44; // 0.78 ~ 1.22
          return (children.length - i) * factor;
        });
        const sum = baseWeights.reduce((a, b) => a + b, 0) || 1;

        return children.map((name, i) => ({
          name,
          users: Math.round((parentUsers * baseWeights[i]) / sum),
          pct: `${((baseWeights[i] / sum) * 100).toFixed(1)}%`,
          expandable: false,
        }));
      }

      function buildPathExploreColumns(eventId, direction, depth) {
        const meta = getPathEventMeta(eventId);
        const mock =
          PATH_EVENT_MOCK[eventId]?.[direction] ||
          PATH_EVENT_MOCK.first_recharge_success[direction];
        const steps = scalePathSteps(mock.steps, depth);
        const variantKey = getPathExploreVariantKey(eventId, direction);
        const targetUsers = getPathTargetUsers(eventId, direction);
        const labels =
          direction === "backward"
            ? [
                ...Array.from({ length: depth }, (_, i) => ({
                  label: `STEP -${depth - i}`,
                  isTarget: false,
                })),
                { label: "ENDING POINT", isTarget: true },
              ]
            : [
                { label: "STARTING POINT", isTarget: true },
                ...Array.from({ length: depth }, (_, i) => ({
                  label: `STEP +${i + 1}`,
                  isTarget: false,
                })),
              ];

        const columns = [];
        if (direction === "backward") {
          const columnUsers = [];
          let users = targetUsers;
          for (let i = steps.length - 1; i >= 0; i -= 1) {
            users = Math.round(users * (1.22 + (steps.length - 1 - i) * 0.05));
            columnUsers[i] = users;
          }
          steps.forEach((raw, i) => {
            columns.push({
              ...labels[i],
              nodes: normalizePathNodes(raw, columnUsers[i], variantKey),
            });
          });
          columns.push({
            ...labels[labels.length - 1],
            nodes: [
              {
                name: meta.label,
                users: targetUsers,
                pct: "100.0%",
                expandable: false,
                isTarget: true,
              },
            ],
          });
        } else {
          columns.push({
            ...labels[0],
            nodes: [
              {
                name: meta.label,
                users: targetUsers,
                pct: "100.0%",
                expandable: false,
                isTarget: true,
              },
            ],
          });
          let users = targetUsers;
          steps.forEach((raw, i) => {
            users = Math.round(users * (0.72 - i * 0.04));
            columns.push({
              ...labels[i + 1],
              nodes: normalizePathNodes(raw, users, variantKey),
            });
          });
        }
        return columns;
      }

      function buildPathTopRank(eventId, direction, depth) {
        const meta = getPathEventMeta(eventId);
        const mock =
          PATH_EVENT_MOCK[eventId]?.[direction] ||
          PATH_EVENT_MOCK.first_recharge_success[direction];
        const rows = mock.topPaths || [];
        const variantKey = getPathExploreVariantKey(eventId, direction);
        const enriched = rows.map((parts) => {
          const path =
            direction === "backward"
              ? [...parts.slice(0, depth), meta.label]
              : [meta.label, ...parts.slice(0, depth)];
          const rawPct = Number(parts[parts.length - 1]) || 0;
          const seed = hashCoreFlowSeed(
            `${variantKey}::top::${path.join("->")}`,
          );
          const factor = 0.86 + ((seed % 1000) / 1000) * 0.28; // 0.86 ~ 1.14
          const pctNum = Math.max(1, rawPct * factor);
          return { path, pctNum };
        });

        enriched.sort((a, b) => b.pctNum - a.pctNum);
        return enriched.map((row, i) => ({
          rank: i + 1,
          path: row.path,
          pct: row.pctNum.toFixed(0),
        }));
      }

      function renderPathExploreNode(node, maxUsers, nodeKey) {
        const width = Math.max(14, Math.round((node.users / maxUsers) * 100));
        const expanded = pathExploreState.expanded[nodeKey];
        const children =
          expanded && node.expandable
            ? getChildPathNodes(
                node.name,
                node.users,
                getPathExploreVariantKey(
                  pathExploreState.eventId,
                  pathExploreState.direction,
                ),
              )
            : [];
        const childMax = Math.max(...children.map((c) => c.users), 1);
        return `
          <div class="path-explore-node ${expanded ? "is-expanded" : ""} ${node.isTarget ? "is-target" : ""}" data-node-key="${nodeKey}">
            <div class="path-explore-node-card">
              <div class="path-explore-node-bar" style="width:${width}%"></div>
              <div class="path-explore-node-body">
                <div class="path-explore-node-name">

                  ${node.expandable ? `<span class="expand-icon">${expanded ? "▼" : "▶"}</span>` : ""}

                <div class="path-explore-node-stats">
                  <span><strong>${node.users.toLocaleString("zh-CN")}</strong> 用户</span>
                  <span>${node.pct}</span>
                </div>

            </div>
            ${
              children.length
                ? `<div class="path-explore-children">${children
                    .map((child) => {
                      const cw = Math.max(
                        14,
                        Math.round((child.users / childMax) * 100),

                      return `
                      <div class="path-explore-node">

                            </div>
                          </div>
                        </div>
                      </div>`;
                    })
                    .join("")}</div>`
                : ""
            }
          </div>`;
      }

      function renderPathExploreBoard() {
        const columns = buildPathExploreColumns(
          pathExploreState.eventId,
          pathExploreState.direction,

        const colsHtml = columns

            const nodesHtml = col.nodes

              <div class="path-explore-col-head">${col.label}</div>
              <div class="path-explore-nodes">${nodesHtml}</div>

          .join("");
        return `<div class="path-explore-canvas" id="pathExploreCanvas">${colsHtml}</div>`;
      }

      function drawPathExploreLinks() {
        const board = document.getElementById("pathExploreBoard");
        const svg = document.getElementById("pathExploreLinks");
        const canvas = document.getElementById("pathExploreCanvas");
        if (!board || !svg || !canvas) return;
        const boardRect = board.getBoundingClientRect();
        svg.setAttribute("width", boardRect.width);
        svg.setAttribute("height", boardRect.height);
        const cols = [...canvas.querySelectorAll(".path-explore-col")];
        let paths = "";
        for (let i = 0; i < cols.length - 1; i += 1) {
          const leftNodes = [
            ...cols[i].querySelectorAll(
              ":scope > .path-explore-nodes > .path-explore-node",
            ),
          ];
          const rightNodes = [
            ...cols[i + 1].querySelectorAll(
              ":scope > .path-explore-nodes > .path-explore-node",
            ),
          ];
          const pairs = Math.min(leftNodes.length, rightNodes.length);
          for (let p = 0; p < pairs; p += 1) {
            const l = leftNodes[p].getBoundingClientRect();
            const r = rightNodes[p].getBoundingClientRect();
            const x1 = l.right - boardRect.left;
            const y1 = l.top + l.height / 2 - boardRect.top;
            const x2 = r.left - boardRect.left;
            const y2 = r.top + r.height / 2 - boardRect.top;
            const mx = (x1 + x2) / 2;
            const flow = Math.max(1.5, 4 - p * 0.5);
            paths += `<path d="M${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}" stroke-width="${flow}"></path>`;
          }
        }
        svg.innerHTML = paths;
      }

      function initPathExploration() {
        const board = document.getElementById("pathExploreBoard");
        if (!board) return;

        pathExploreState.expanded = {};
        refreshPathExploration();

        document
          .getElementById("pathExploreQuery")
          ?.addEventListener("click", () => {
            readPathExploreFilters();
            pathExploreState.expanded = {};
            refreshPathExploration();
          });

        document
          .querySelectorAll("#pathExploreMode [data-direction]")
          .forEach((btn) => {
            btn.addEventListener("click", () => {
              pathExploreState.direction = btn.dataset.direction;
              pathExploreState.expanded = {};
              document
                .querySelectorAll("#pathExploreMode [data-direction]")
                .forEach((b) => b.classList.remove("active"));
              btn.classList.add("active");
              refreshPathExploration();
            });
          });

        document
          .querySelectorAll("#pathExploreMode .depth-btn")
          .forEach((btn) => {
            btn.addEventListener("click", () => {
              pathExploreState.depth = Number(btn.dataset.depth);
              pathExploreState.expanded = {};
              document
                .querySelectorAll("#pathExploreMode .depth-btn")
                .forEach((b) => b.classList.remove("active"));
              btn.classList.add("active");
              refreshPathExploration();
            });
          });

        board.addEventListener("click", (e) => {
          const node = e.target.closest(".path-explore-node[data-node-key]");
          if (!node || e.target.closest(".path-explore-children")) return;
          const key = node.dataset.nodeKey;
          const inner = node.querySelector(
            ":scope > .path-explore-node-card .path-explore-node-name .expand-icon",
          );
          if (!inner) return;
          if (pathExploreState.expanded[key])
            delete pathExploreState.expanded[key];
          else pathExploreState.expanded[key] = true;
          refreshPathExploration();
        });

        window.addEventListener("resize", drawPathExploreLinks);
      }

      function disposePathExploration() {
        window.removeEventListener("resize", drawPathExploreLinks);
        pathExploreState.expanded = {};
      }

      function renderAppAnalysisPage(page) {
        switch (page.appPageType) {
          case "page-path":
            return renderAppPagePathContent(page);
          case "channel-quality":
            return renderAppChannelQualityContent(page);
          case "feature-engagement":
            return renderAppFeatureEngagementContent(page);
          case "page-experience":
            return renderAppPageExperienceContent(page);
          case "usage-duration":
            return renderAppUsageDurationContent(page);
          case "usage-frequency":
            return renderAppUsageFrequencyContent(page);
          case "churn-page":
            return renderAppChurnPageContent(page);
          case "user-path-explore":
            return renderAppUserPathExploreContent(page);
          default:
            return renderPlaceholderPage(page);
        }
      }

      function initAppAnalysisPage() {
        initLocalChannelFilters();
        if (document.getElementById("overviewDateBar")) {
          initGlobalFilterBar();
        }
        initAppPathSankey();
        initAppChurnPage();
        initPathExploration();
        initAppPageExperience();
        initAppChannelQuality();
        document.querySelectorAll(".app-metric-tabs").forEach((tabs) => {
          // 应用页面体验的指标切换由 refreshAppExperienceView 自行绑定
          if (
            tabs.closest("#appExperiencePanel") ||
            tabs.id === "appExpMetricTabs" ||
            tabs.parentElement?.id === "appExpMetricTabs"
          ) {
            return;
          }
          if (
            tabs.closest("#appChurnPanel") ||
            tabs.id === "appChurnKpiModeTabs" ||
            tabs.parentElement?.id === "appChurnKpiModeTabs"
          ) {
            return;
          }
          tabs.querySelectorAll(".tab-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
              tabs
                .querySelectorAll(".tab-btn")
                .forEach((b) => b.classList.remove("active"));
              btn.classList.add("active");
            });
          });
        });
      }

      function renderPage(pageId) {
        const page = PAGES[pageId];
        if (!page) return;

        collapseChartZoom();
        disposeAppPathSankey();
        disposeAppChurnHeatmap();
        disposeLtvHeatmap();
        disposeRetentionUserHeatmap();
        disposePathExploration();

        const container = document.getElementById("pageContainer");
        document.getElementById("breadcrumbTitle").textContent =
          page.breadcrumb;

        if (page.realtimePage) {
          container.innerHTML = renderRealtimePage();
          initRealtimeChart();
          decorateChartZoomHints(container);
          return;
        }

        if (page.appPageType) {
          container.innerHTML = renderAppAnalysisPage(page);
          initAppAnalysisPage();
          decorateChartZoomHints(container);
          return;
        }

        if (page.betReportPage) {
          container.innerHTML = renderBetReportContent(page);
          initLocalChannelFilters();
          decorateChartZoomHints(container);
          return;
        }

        if (page.gameMetricPage) {
          container.innerHTML = renderGameMetricContent(page);
          initLocalChannelFilters();
          if (page.gameMetricPage === "stay") initGameStayPage();
          if (page.gameMetricPage === "activity") {
            bindSvgChartTooltips(container);
            bindGameMetricChartFocus(container, "#gameActivityCharts");
            initGameActivityFilter(container);
          }
          if (page.gameMetricPage === "participation") {
            bindSvgChartTooltips(container);
            bindGameMetricChartFocus(container, "#gameParticipationCharts");
            initGameParticipationFilter(container);
          }
          if (page.gameMetricPage === "value") {
            bindSvgChartTooltips(container);
            bindGameMetricChartFocus(container, "#gameValueCharts");
            initGameValueFilter(container);
          }
          decorateChartZoomHints(container);
          return;
        }

        if (page.placeholder) {
          const filterOpts = {
            hideChannelName: !!page.hideChannelNameFilter,
            showChannelAccount: page.hideChannelNameFilter
              ? false
              : page.showChannelAccountFilter !== false,
            channelFilterSeparateRow: !!page.channelFilterSeparateRow,
            dateLabel: page.dateFilterLabel || "时间",
          };
          container.innerHTML = `
            ${renderGlobalFilterBar("7d", filterOpts)}
            ${renderPlaceholderPage(page)}
          `;
          initGlobalFilterBar();
          initLocalChannelFilters();
          decorateChartZoomHints(container);
          return;
        }

        if (page.ltvPage) {
          const filterOpts = {
            hideChannelName: !!page.hideChannelNameFilter,
            showChannelAccount: page.hideChannelNameFilter
              ? false
              : page.showChannelAccountFilter !== false,
            channelFilterSeparateRow: !!page.channelFilterSeparateRow,
            dateLabel: page.dateFilterLabel || "时间",
          };
          setUserLtvActiveTab("gross");
          // 默认展示「今日之前已跑满 Day7」的近 7 个完整注册日，便于观察完整 LTV 曲线
          container.innerHTML = `
            ${renderGlobalFilterBar("complete7d", filterOpts)}
            <div class="page-panel active" id="panel-${pageId}">
              ${renderUserLtvPageContent()}
            </div>
          `;
          initGlobalFilterBar();
          initLocalChannelFilters();
          initUserLtvPage();
          decorateChartZoomHints(container);
          return;
        }

        if (page.conversionTabPage) {
          const isNewOldUserPage = page.conversionTab === "recharge";
          const filterOpts = {
            hideChannelName: !!page.hideChannelNameFilter,
            showChannelAccount: page.hideChannelNameFilter
              ? false
              : page.showChannelAccountFilter !== false,
            channelFilterSeparateRow: !!page.channelFilterSeparateRow,
            dateLabel: page.dateFilterLabel || "时间",
          };
          container.innerHTML = `
            ${renderGlobalFilterBar("7d", filterOpts)}
            ${isNewOldUserPage ? renderNewOldUserCompareCards() : ""}
            ${renderConversionTabPage(pageId)}
          `;
          initGlobalFilterBar();
          initLocalChannelFilters();
          initConversionTabPage();
          initViewToggle();
          bindSvgChartTooltips(container);
          decorateChartZoomHints(container);
          return;
        }

        const hasKpi = pageHasKpiCards(page, pageId);
        const hideChannelName = !!page.hideChannelNameFilter;
        const isOverview = pageId === "overview";
        const filterOpts = {
          hideChannelName,
          showChannelAccount: hideChannelName
            ? false
            : page.showChannelAccountFilter !== false,
          channelFilterSeparateRow: !!page.channelFilterSeparateRow,
          dateLabel: page.dateFilterLabel || "时间",
        };
        container.innerHTML = `
          ${hasKpi ? (isOverview ? renderOverviewInsights() : renderAnalysisPanel(page)) : ""}
          ${isOverview ? renderOverviewChannelBar(filterOpts) : renderGlobalFilterBar("7d", filterOpts)}
          ${renderPageCharts(page, pageId)}
          <div class="page-panel active" id="panel-${pageId}">
            ${isOverview ? renderOverviewPageTables(page) : renderPageTables(page)}
          </div>
        `;

        if (isOverview) initOverviewDateBar();
        else initGlobalFilterBar();
        initLocalChannelFilters();
        initViewToggle();
        if (isOverview) {
          initSurplusRateChart();
        }
        if (page.ltvCharts) {
          initLtvHeatmap(page);
        }
        if (page.retentionUserCharts) {
          initRetentionUserHeatmap(page);
        }
        bindSvgChartTooltips(container);
        decorateChartZoomHints(container);
      }

      function initViewToggle() {
        document.querySelectorAll(".view-toggle").forEach((toggle) => {
          const block = toggle.closest(".page-table-block");
          const tableView = block?.querySelector(".table-view");
          const chartView = block?.querySelector(".chart-view");
          toggle.querySelectorAll(".vt-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
              toggle
                .querySelectorAll(".vt-btn")
                .forEach((b) => b.classList.remove("active"));
              btn.classList.add("active");
              const isChart = btn.dataset.view === "chart";
              if (chartView) chartView.hidden = !isChart;
              if (tableView) tableView.hidden = isChart;
            });
          });
        });
      }

      function clearMenuActive() {
        document
          .querySelectorAll(".menu-top, .menu-child, .menu-grandchild")
          .forEach((el) => el.classList.remove("active"));
      }

      function setActivePage(pageId, options = {}) {
        const { topEl, childEl, grandchildEl, group, subGroup } = options;
        clearMenuActive();
        if (grandchildEl) {
          grandchildEl.classList.add("active");
          subGroup
            ?.querySelector(".menu-child.has-child")
            ?.classList.add("active");
          group?.querySelector(".menu-top")?.classList.add("active");
        } else if (childEl) {
          childEl.classList.add("active");
          group?.querySelector(".menu-top")?.classList.add("active");
        } else if (topEl) {
          topEl.classList.add("active");
        }
        renderPage(pageId);
      }

      const SIDEBAR_MENU_ORDER_KEY = "sidebar-menu-order";
      const SIDEBAR_SUBMENU_ORDER_KEY = "sidebar-submenu-order";
      const MENU_DRAG_HANDLE_HTML =
        '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="3.5" cy="3" r="1.15"/><circle cx="8.5" cy="3" r="1.15"/><circle cx="3.5" cy="6" r="1.15"/><circle cx="8.5" cy="6" r="1.15"/><circle cx="3.5" cy="9" r="1.15"/><circle cx="8.5" cy="9" r="1.15"/></svg>';
      const SUBMENU_ITEM_SELECTOR = ":scope > .menu-child, :scope > .menu-sub-group";

      function getSidebarMenuEl() {
        return document.getElementById("sidebarMenu");
      }

      function getSidebarMenuGroups(menu = getSidebarMenuEl()) {
        return menu ? [...menu.querySelectorAll(":scope > .menu-group")] : [];
      }

      function getMenuGroupId(group) {
        return group?.dataset.menuId || "";
      }

      function ensureMenuGroupId(group, index = 0) {
        if (group.dataset.menuId) return group.dataset.menuId;
        const id =
          group.dataset.group ||
          group.querySelector(":scope > .menu-top[data-page]")?.dataset.page ||
          `menu-${index}`;
        group.dataset.menuId = id;
        return id;
      }

      function getSubmenuItems(submenu) {
        return submenu ? [...submenu.querySelectorAll(SUBMENU_ITEM_SELECTOR)] : [];
      }

      function getSubmenuItemId(item) {
        if (!item) return "";
        if (item.dataset.menuId) return item.dataset.menuId;
        if (item.classList.contains("menu-sub-group")) {
          return (
            item.querySelector(":scope > .menu-child[data-page]")?.dataset.page ||
            item.querySelector(":scope > .menu-child")?.textContent.trim() ||
            ""
          );
        }
        return item.dataset.page || item.textContent.trim() || "";
      }

      function ensureSubmenuItemId(item, index = 0) {
        if (item.dataset.menuId) return item.dataset.menuId;
        const id = getSubmenuItemId(item) || `submenu-${index}`;
        item.dataset.menuId = id;
        return id;
      }

      function applySavedMenuOrder(menu) {
        let order = [];
        try {
          order = JSON.parse(localStorage.getItem(SIDEBAR_MENU_ORDER_KEY) || "[]");
        } catch (_) {
          order = [];
        }
        if (!Array.isArray(order) || !order.length) return;
        const map = new Map(
          getSidebarMenuGroups(menu).map((group) => [getMenuGroupId(group), group]),
        );
        order.forEach((id) => {
          const group = map.get(id);
          if (group) menu.appendChild(group);
        });
        map.forEach((group, id) => {
          if (!order.includes(id)) menu.appendChild(group);
        });
      }

      function saveMenuOrder(menu) {
        const order = getSidebarMenuGroups(menu)
          .map((group) => getMenuGroupId(group))
          .filter(Boolean);
        localStorage.setItem(SIDEBAR_MENU_ORDER_KEY, JSON.stringify(order));
      }

      function applySavedSubmenuOrders(menu) {
        let orders = {};
        try {
          orders = JSON.parse(localStorage.getItem(SIDEBAR_SUBMENU_ORDER_KEY) || "{}");
        } catch (_) {
          orders = {};
        }
        if (!orders || typeof orders !== "object") return;
        getSidebarMenuGroups(menu).forEach((group) => {
          const groupId = getMenuGroupId(group);
          const submenu = group.querySelector(":scope > .submenu");
          const order = orders[groupId];
          if (!submenu || !Array.isArray(order) || !order.length) return;
          const map = new Map(
            getSubmenuItems(submenu).map((item) => [getSubmenuItemId(item), item]),
          );
          order.forEach((id) => {
            const item = map.get(id);
            if (item) submenu.appendChild(item);
          });
          map.forEach((item, id) => {
            if (!order.includes(id)) submenu.appendChild(item);
          });
        });
      }

      function saveSubmenuOrders(menu) {
        const orders = {};
        getSidebarMenuGroups(menu).forEach((group) => {
          const groupId = getMenuGroupId(group);
          const submenu = group.querySelector(":scope > .submenu");
          if (!groupId || !submenu) return;
          const ids = getSubmenuItems(submenu).map(getSubmenuItemId).filter(Boolean);
          if (ids.length) orders[groupId] = ids;
        });
        localStorage.setItem(SIDEBAR_SUBMENU_ORDER_KEY, JSON.stringify(orders));
      }

      function createMenuDragHandle() {
        const handle = document.createElement("span");
        handle.className = "menu-drag-handle";
        handle.title = "拖拽调整顺序";
        handle.setAttribute("aria-label", "拖拽调整顺序");
        handle.innerHTML = MENU_DRAG_HANDLE_HTML;
        handle.draggable = true;
        handle.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
        });
        return handle;
      }

      function attachMenuDragHandle(el) {
        if (!el || el.querySelector(":scope > .menu-drag-handle")) return;
        el.insertBefore(createMenuDragHandle(), el.firstChild);
      }

      function initMenuReorder() {
        const menu = getSidebarMenuEl();
        if (!menu || menu.dataset.reorderBound === "1") return;
        menu.dataset.reorderBound = "1";

        getSidebarMenuGroups(menu).forEach((group, index) => {
          ensureMenuGroupId(group, index);
          attachMenuDragHandle(group.querySelector(":scope > .menu-top"));
          const submenu = group.querySelector(":scope > .submenu");
          getSubmenuItems(submenu).forEach((item, childIndex) => {
            ensureSubmenuItemId(item, childIndex);
            if (item.classList.contains("menu-sub-group")) {
              attachMenuDragHandle(item.querySelector(":scope > .menu-child"));
            } else {
              attachMenuDragHandle(item);
            }
          });
        });

        applySavedMenuOrder(menu);
        applySavedSubmenuOrders(menu);

        let drag = null;
        let suppressClick = false;

        const getDragOverItem = (target) => {
          if (!drag?.item) return null;
          if (drag.level === "top") {
            const over = target.closest("#sidebarMenu > .menu-group");
            return over && menu.contains(over) ? over : null;
          }
          const over = target.closest(
            ".submenu > .menu-child, .submenu > .menu-sub-group",
          );
          if (!over || over.parentElement !== drag.container) return null;
          return over;
        };

        menu.addEventListener("dragstart", (e) => {
          const handle = e.target.closest(".menu-drag-handle");
          if (!handle || !menu.contains(handle)) {
            e.preventDefault();
            return;
          }
          const subItem = handle.closest(
            ".submenu > .menu-child, .submenu > .menu-sub-group > .menu-child",
          );
          const top = handle.closest("#sidebarMenu > .menu-group > .menu-top");
          if (subItem) {
            const item = subItem.parentElement?.classList.contains("menu-sub-group")
              ? subItem.parentElement
              : subItem;
            const container = item.parentElement;
            if (!container?.classList.contains("submenu")) {
              e.preventDefault();
              return;
            }
            drag = {
              item,
              container,
              level: "sub",
              collapsedIds: [],
              lastAnchorKey: "",
            };
            item.classList.add("is-dragging");
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", getSubmenuItemId(item) || "submenu");
            try {
              e.dataTransfer.setDragImage(subItem, 24, 14);
            } catch (_) {}
            return;
          }
          if (!top) {
            e.preventDefault();
            return;
          }
          const group = top.parentElement;
          const collapsedIds = [];
          getSidebarMenuGroups(menu).forEach((item) => {
            if (item.classList.contains("expanded")) {
              collapsedIds.push(getMenuGroupId(item));
              item.classList.remove("expanded");
            }
          });
          drag = {
            item: group,
            container: menu,
            level: "top",
            collapsedIds,
            lastAnchorKey: "",
          };
          group.classList.add("is-dragging");
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", getMenuGroupId(group) || "menu");
          try {
            e.dataTransfer.setDragImage(top, 24, 16);
          } catch (_) {}
        });

        menu.addEventListener("dragover", (e) => {
          if (!drag?.item) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          const overItem = getDragOverItem(e.target);
          if (!overItem || overItem === drag.item) return;
          const row =
            drag.level === "top"
              ? overItem.querySelector(":scope > .menu-top") || overItem
              : overItem.classList.contains("menu-sub-group")
                ? overItem.querySelector(":scope > .menu-child") || overItem
                : overItem;
          const rect = row.getBoundingClientRect();
          const after = e.clientY > rect.top + rect.height / 2;
          const key = `${getSubmenuItemId(overItem) || getMenuGroupId(overItem)}:${after ? "after" : "before"}`;
          if (key === drag.lastAnchorKey) return;
          drag.lastAnchorKey = key;
          if (after) overItem.after(drag.item);
          else overItem.before(drag.item);
        });

        menu.addEventListener("drop", (e) => {
          if (!drag?.item) return;
          e.preventDefault();
          if (drag.level === "top") saveMenuOrder(menu);
          else saveSubmenuOrders(menu);
        });

        menu.addEventListener("dragend", () => {
          if (!drag?.item) return;
          drag.item.classList.remove("is-dragging");
          if (drag.level === "top") {
            drag.collapsedIds.forEach((id) => {
              menu
                .querySelector(`.menu-group[data-menu-id="${id}"]`)
                ?.classList.add("expanded");
            });
            saveMenuOrder(menu);
          } else {
            saveSubmenuOrders(menu);
          }
          drag = null;
          suppressClick = true;
          setTimeout(() => {
            suppressClick = false;
          }, 50);
        });

        menu.addEventListener(
          "click",
          (e) => {
            if (!suppressClick) return;
            if (
              !e.target.closest(
                "#sidebarMenu > .menu-group > .menu-top, .submenu > .menu-child, .submenu > .menu-sub-group > .menu-child",
              )
            )
              return;
            e.preventDefault();
            e.stopImmediatePropagation();
          },
          true,
        );
      }

      function initMenu() {
        // 一级菜单（无子项）：数据总览、分时数据对比、裂变报表、游戏投注统计、会员奖励报表、系统管理
        document.querySelectorAll(".menu-top[data-page]").forEach((top) => {
          top.addEventListener("click", () => {
            setActivePage(top.dataset.page, { topEl: top });
          });
        });

        // 一级菜单（有子项）：点击展开/收起
        document.querySelectorAll(".menu-group").forEach((group) => {
          const top = group.querySelector(".menu-top.has-child");
          if (!top) return;

          top.addEventListener("click", () => {
            const isExpanded = group.classList.contains("expanded");
            if (isExpanded) {
              group.classList.remove("expanded");
              return;
            }
            group.classList.add("expanded");
            // 优先打开第一个可展开二级菜单的首个子页
            const firstSub = group.querySelector(".menu-sub-group");
            if (firstSub) {
              firstSub.classList.add("expanded");
              const firstGrandchild =
                firstSub.querySelector(".menu-grandchild");
              if (firstGrandchild) {
                setActivePage(firstGrandchild.dataset.page, {
                  grandchildEl: firstGrandchild,
                  subGroup: firstSub,
                  group,
                });
                return;
              }
            }
            const firstChild = group.querySelector(".menu-child[data-page]");
            if (firstChild) {
              setActivePage(firstChild.dataset.page, {
                childEl: firstChild,
                group,
              });
            }
          });
        });

        // 二级菜单（可展开：用户分析）
        document.querySelectorAll(".menu-sub-group").forEach((subGroup) => {
          const child = subGroup.querySelector(".menu-child.has-child");
          if (!child) return;

          child.addEventListener("click", (e) => {
            e.stopPropagation();
            const group = subGroup.closest(".menu-group");
            group.classList.add("expanded");

            const isExpanded = subGroup.classList.contains("expanded");
            if (isExpanded) {
              subGroup.classList.remove("expanded");
              return;
            }
            subGroup.classList.add("expanded");
            const firstGrandchild = subGroup.querySelector(".menu-grandchild");
            if (firstGrandchild) {
              setActivePage(firstGrandchild.dataset.page, {
                grandchildEl: firstGrandchild,
                subGroup,
                group,
              });
            }
          });
        });

        // 三级菜单
        document.querySelectorAll(".menu-grandchild").forEach((grandchild) => {
          grandchild.addEventListener("click", (e) => {
            e.stopPropagation();
            const subGroup = grandchild.closest(".menu-sub-group");
            const group = grandchild.closest(".menu-group");
            group.classList.add("expanded");
            subGroup.classList.add("expanded");
            setActivePage(grandchild.dataset.page, {
              grandchildEl: grandchild,
              subGroup,
              group,
            });
          });
        });

        // 二级菜单（直接跳转）
        document.querySelectorAll(".menu-child[data-page]").forEach((child) => {
          child.addEventListener("click", (e) => {
            e.stopPropagation();
            const group = child.closest(".menu-group");
            group.classList.add("expanded");
            setActivePage(child.dataset.page, { childEl: child, group });
          });
        });

        initMenuReorder();
      }

      // 初始化
      initMenu();
      initChartZoom();
      renderPage("overview");
    </script>
  </body>
</html>
